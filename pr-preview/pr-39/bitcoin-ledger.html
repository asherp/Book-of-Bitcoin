// One resolution per address, shared across leaf turns: a reader flipping
// away and back re-joins the sync already running rather than starting a
// rival walk over the same checkpoints. The progress tick is re-pointed at
// whichever leaf currently shows the address.
const inflight = new Map();   // address -> resolveLine promise
const progress = new Map();   // address -> the current leaf's tick
const lineOnce = (addr) => {
  if (!inflight.has(addr)) {
    inflight.set(addr, resolveLine(addr, (gathered, total) => progress.get(addr)?.(gathered, total))
      .finally(() => inflight.delete(addr)));
  }
  return inflight.get(addr);
};

// ── The record: an endless scroll, reference-organized ───────────────────
// The address leaf's resolution: the stored line first -- instantly,
// offline included -- then the head refreshed against the chain (new
// arrivals only; no backfill) while the held snapshot arrives beside it.
// Below the title, the record itself: the banked entries newest-first
// under Volume and Book headers alone (reading by time lives on the
// entries leaf), drawn a chunk at a time. A sentinel at the foot watches
// the scroll from well above the bottom: nearing it draws the next chunk
// from the bank, and when the bank runs low the next page fetches ahead
// -- so the past keeps arriving with nothing to wait for. `alive` guards
// every landing: a result belonging to a leaf already turned away from
// paints nothing.
const PAGE = 25;
// The totals bar rules the record off at every moment: Σ debit, Σ credit
// (the unsynced remainder posted into its column, so the books add up
// mid-scroll, not just at completion), the transaction count, and the
// balance the columns net to. Hidden wherever there is no record to rule.
const showTotals = (line) => {
  if (!line || !line.entries.length) { totalsBar.classList.add('hidden'); return; }
  let debit = 0, credit = 0;
  for (const c of line.entries) { if (c.sats < 0) debit -= c.sats; else credit += c.sats; }
  if (!line.complete) {
    const net = (line.balance ?? 0) - ledgerSum(line);
    if (net >= 0) credit += net; else debit += -net;
  }
  document.getElementById('t-balance').textContent = formatBalanceBtc(line.balance ?? credit - debit);
  document.getElementById('t-debit').textContent = debit ? formatBalanceBtc(debit) : '';
  document.getElementById('t-credit').textContent = formatBalanceBtc(credit);
  document.getElementById('t-count').textContent = `${line.txCount.toLocaleString('en-US')} §`;
  totalsBar.classList.remove('hidden');
};
const stateText = (d) => !d.complete
  ? `the latest ${d.walked.toLocaleString('en-US')} of ${d.txCount.toLocaleString('en-US')} transactions gathered`
  : reconciled(d) ? 'the whole record gathered · reconciled with the chain'
  : 'unreconciled — this map disagrees with the chain balance';
const runResolve = async (addr, alive) => {
  const heldP = heldFresh(addr);
  const cached = await cachedLine(addr);
  if (!alive()) return;
  let byTxid = null;     // held marks, once the snapshot agrees
  let rowsEl, foot, note, unsyn, rendered, io;
  let busy = false;      // one draw at a time; the re-arm retriggers
  // The unsynced entry: an unreferenced line heading the record for the
  // transactions not yet gathered -- their count standing where the
  // citations will -- retiring once the record is whole. Their net is
  // arithmetic, not a guess: the chain's balance less the banked sum is
  // exactly what the remainder moved -- the opening balance the visible
  // record stands on, which is also why it posts as a credit (a balance
  // is never negative; a debit here would mean inconsistent data, shown
  // honestly as such).
  const setUnsynced = (l) => {
    if (!unsyn) return;
    const left = l.txCount - l.walked;
    if (l.complete || left <= 0) { unsyn.remove(); return; }
    const net = (l.balance ?? 0) - ledgerSum(l);
    unsyn.children[0].textContent = `${left.toLocaleString('en-US')} §`;
    unsyn.children[1].textContent = net < 0 ? formatBalanceBtc(-net) : '';
    unsyn.children[2].textContent = net >= 0 ? formatBalanceBtc(net) : '';
    unsyn.title = 'the net of the transactions not yet gathered — the balance the record below stands on';
  };
  // The landing: a dive returned from the entry leaves wants the record
  // scrolled to the entry left off at. Draw until its row exists, then
  // center it -- a dive can only reach banked entries, so the row is
  // always eventually drawn, no fetch required. The landing survives the
  // resolve's repaint (which momentarily empties the list, clamping the
  // scroll to the top) by re-arming for a short window after it settles.
  let landed = null, landTime = 0;
  const tryLand = () => {
    if (!landAt) return false;
    const row = rowsEl?.querySelector(`[data-txid="${landAt.txid}"][data-sats="${landAt.sats}"]`);
    if (!row) return true;   // keep drawing
    landed = landAt; landTime = performance.now();
    landAt = null;
    requestAnimationFrame(() => row.scrollIntoView({ block: 'center', behavior: 'instant' }));
    return false;
  };
  const scroll = async () => {
    if (busy || !alive()) return;
    busy = true;
    let line = await cachedLine(addr);
    if (!alive() || !line) { busy = false; return; }
    if (line.entries.length <= rendered && !line.complete) line = await extendLine(addr) ?? line;
    if (!alive()) { busy = false; return; }
    const len = line.entries.length;
    const take = Math.min(len - rendered, PAGE);
    if (take > 0) {
      renderRows(rowsEl, line.entries.slice(len - rendered - take, len - rendered), byTxid);
      rendered += take;
    }
    note.textContent = stateText(line);   // the reach grows as the reader reads
    setUnsynced(line);
    showTotals(line);
    foot.textContent = line.complete && rendered >= len ? '— the beginning of the record' : '…';
    // The fetch ahead: keep a page banked beyond what's drawn.
    if (!line.complete && len - rendered < PAGE) extendLine(addr);
    busy = false;
    // The landing keeps drawing until its row exists (banked, so bounded).
    if (tryLand() && rendered < len) { queueMicrotask(scroll); return; }
    // Re-arm: appending moved the sentinel; observe it afresh so a foot
    // still within reach fires again.
    if (io) { io.unobserve(foot); io.observe(foot); }
  };
  const paint = (data, held) => {
    showCount(data);
    showRange(data);
    if (!landAt && landed && performance.now() - landTime < 3000) landAt = landed;
    byTxid = held ? heldView(data, held) : byTxid;
    el.replaceChildren();
    io?.disconnect();
    note = document.createElement('span');
    note.className = 'idx-note sync-note';
    note.id = 'anth-contents';   // the hero's ▾ lands here
    note.textContent = stateText(data);
    rowsEl = document.createElement('div');
    foot = document.createElement('span');
    foot.className = 'idx-note sync-note';
    el.append(note);
    // The bookkeeping heads rule the columns once there are rows to rule.
    if (data.entries.length) {
      const heads = document.createElement('div');
      heads.className = 'acct-heads';
      const hRef = document.createElement('span'); hRef.className = 'h-ref';
      hRef.textContent = 'reference';
      heads.append(hRef);
      for (const [cls, label] of [['col-deb', 'debit'], ['col-cred', 'credit'], ['col-status', 'status']]) {
        const h = document.createElement('span'); h.className = cls; h.textContent = label;
        heads.append(h);
      }
      el.append(heads);
    }
    unsyn = document.createElement('div');
    unsyn.className = 'idx-row acct unsynced';
    const uRef = document.createElement('span'); uRef.className = 'idx-ref';
    const uDeb = document.createElement('span'); uDeb.className = 'idx-amt col-deb';
    const uCred = document.createElement('span'); uCred.className = 'idx-amt col-cred';
    const uSt = document.createElement('span'); uSt.className = 'idx-status col-status';
    uSt.textContent = 'unsynced';
    unsyn.append(uRef, uDeb, uCred, uSt);
    el.append(unsyn, rowsEl, foot);
    setUnsynced(data);
    rendered = 0;
    io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) scroll(); },
                                  { rootMargin: '1600px 0px' });
    io.observe(foot);
    scroll();
  };
  if (cached) paint(cached, null);
  else { el.replaceChildren(); lineNote(el, '…'); }
  const [data, held] = await Promise.all([lineOnce(addr), heldP]);
  if (!alive()) return;
  if (data) paint(data, held);
  else if (!cached) unreachable(alive, () => runResolve(addr, alive));
};

// ── The entries leaf: the ledger read whole ──────────────────────────────
// Past the last address lies the ledger's own entries page: every member's
// entries merged into one account, hierarchical in time -- years, then
// quarters, then the entries themselves, references on the left and
// amounts on the right, the running balance now running across the whole
// set. The merge is a sort: entries already carry their heights, and the
// same ordering the per-address maps keep (height, then txid, credits
// before debits) interleaves them exactly. Each merged entry is tagged
// with its home address, so a dive from this leaf lands in the right
// column of the ledger.
const mergeLines = (lines, addrs) => {
  const tagged = lines.map((l, i) => (l ? { line: l, addr: addrs[i] } : null)).filter(Boolean);
  if (!tagged.length) return null;
  const entries = tagged.flatMap(({ line, addr }) => line.entries.map((e) => ({ ...e, addr }))).sort((a, b) =>
    a.height - b.height || (a.txid < b.txid ? -1 : a.txid > b.txid ? 1 : b.sats - a.sats));
  const present = tagged.map((t) => t.line);
  return {
    txCount: present.reduce((s, l) => s + l.txCount, 0),
    balance: present.every((l) => l.balance != null) ? present.reduce((s, l) => s + l.balance, 0) : null,
    walked: present.reduce((s, l) => s + l.walked, 0),
    complete: present.length === addrs.length && present.every((l) => l.complete),
    entries,
  };
};
const mergeHeld = (helds) => {
  if (helds.some((h) => !h)) return null;
  const byTxid = new Map();
  let sum = 0, count2 = 0;
  for (const h of helds) {
    sum += h.sum; count2 += h.count;
    for (const [t, v] of h.byTxid) byTxid.set(t, (byTxid.get(t) ?? 0) + v);
  }
  return { sum, count: count2, byTxid };
};
const runEntries = async (alive) => {
  const addrs = cur().addresses;
  const heldP = Promise.all(addrs.map((a) => heldFresh(a)));
  const cachedAll = await Promise.all(addrs.map((a) => cachedLine(a)));
  if (!alive()) return;
  const cached = mergeLines(cachedAll, addrs);
  if (cached) view(cached, null);
  else { el.replaceChildren(); lineNote(el, '…'); }
  // Every member's sync ticks reach this leaf's one note, summed.
  const latest = new Map(addrs.map((a, i) => [a, { g: cachedAll[i]?.walked ?? 0, t: cachedAll[i]?.txCount ?? 0 }]));
  const tickNote = () => {
    if (!alive()) return;
    const gathered = [...latest.values()].reduce((n2, v) => n2 + v.g, 0);
    const total = [...latest.values()].reduce((n2, v) => n2 + v.t, 0);
    const note = el.querySelector('.idx-note');
    if (note) note.textContent = `still syncing — ${gathered.toLocaleString('en-US')} of ${total.toLocaleString('en-US')} transactions gathered`;
  };
  for (const a of addrs) progress.set(a, (gathered, total) => { latest.set(a, { g: gathered, t: total }); tickNote(); });
  const [lines, helds] = await Promise.all([Promise.all(addrs.map(lineOnce)), heldP]);
  if (!alive()) return;
  const data = mergeLines(lines.map((l, i) => l ?? cachedAll[i]), addrs);
  if (data) view(data, mergeHeld(helds));
  else unreachable(alive, () => runEntries(alive));
};

// ── The three leaves ───────────────────────────────────────────────────────
// Rendering is generation-guarded: turning any page bumps the generation,
// and every async continuation from the leaf left behind checks it before
// touching the DOM.
let gen = 0;

// What the current leaf's neighbours are, per axis -- the drag's damping and
// the commit's guard read this, so gesture and commit can never disagree.
// Entry-level vertical availability is refreshed whenever the leaf renders;
// readyNewer/readyOlder flip once the neighbour's section has been
// pregenerated (the reader's neighborReady), which is what actually opens
// the swipe.
let entryNav = { newer: false, older: false, readyNewer: false, readyOlder: false };

const clearHero = () => {
  totalsBar.classList.add('hidden');   // the record's paint re-seats it
  balanceEl.textContent = '';
  balanceEl.className = 'anth-balance';
  balanceEl.onclick = null;
  document.getElementById('anth-subtitle').textContent = '';
  document.getElementById('anth-commentary').replaceChildren();
  const prose = document.getElementById('anth-prose');
  prose.replaceChildren();
  prose.classList.remove('explainer', 'passage');   // each leaf sets the prose it wants, at its own size
  count.textContent = '';
  range.textContent = '';
  heldEl.replaceChildren();
  keepBtn.classList.remove('show');
  closeTitleForm();   // a half-typed name does not follow the reader to the next leaf
};

// The readings kept on the name this leaf is about: a ledger's title leaf shows
// every reading its member addresses carry, an address's leaf shows its own.
// The index is an enhancement here, never a gate -- a ledger's record is the
// page, and if the curated readings never arrive the leaf is simply a leaf.
//
// As in the reading page: the index says whether there is a reading and whose,
// which is all the toggle needs; the prose is fetched when the toggle is opened.
// A reading of a ledger is a reading of a NAME -- that these coins are that
// party's -- which is exactly the kind of claim this book keeps set apart from
// the record and signed. Hence the same sheet the reading page raises.
const showCommentary = (addresses, alive) => {
  const box = document.getElementById('anth-commentary');
  box.replaceChildren();
  notablesReady.then(() => {
    if (!alive()) return;
    const items = commentaryForAddresses(addresses);
    if (!items.length) return;
    const named = [...new Set(items.flatMap((it) => it.readings.filter((r) => r.by).map((r) => r.by)))];
    const details = document.createElement('details');
    details.className = 'leaf-commentary';
    const summary = document.createElement('summary');
    summary.textContent = named.length ? `Commentary by ${named.join(' · ')}` : 'Commentary';
    summary.title = 'a reading of this ledger — editorial, credited, and no more authoritative than its argument';
    const body = document.createElement('div');
    let filled = false;
    details.addEventListener('toggle', async () => {
      if (!details.open || filled) return;
      body.innerHTML = '<div class="commentary-measure"><p class="commentary-loading">reading…</p></div>';
      await resolveCommentary(items);
      if (!alive()) return;
      filled = true;
      // Authored Markdown, escaped at the source (btc-markdown.js).
      body.innerHTML = commentaryHtml(items);
    });
    details.append(summary, body);
    box.append(details);
  });
};

// Bookmarking an address (or a whole unkept ledger): the same ribbon the
// book's bookmarks fly on the contents page, writing the same registry the
// compendium's title leaves read -- so a bookmarked address joins the
// Ledger page the way a bookmarked passage joins the table of contents.
// Offered wherever an unkept ledger is open: its title leaf, and the
// address leaves a searched address lands on.
const RIBBON = '<svg viewBox="0 0 12 16"><path fill="currentColor" d="M0 0h12v16l-6-4-6 4z"/></svg>';
const showBookmark = () => {
  if (cur().curated) return;   // curated ledgers are already shelved
  keepBtn.classList.add('show');
  const one = cur().addresses.length === 1;
  const reflect = () => {
    const isKept = keptLedgers().some((k) => sameAddresses(k.addresses, cur().addresses));
    keepBtn.classList.toggle('kept', isKept);
    keepBtn.innerHTML = `<span class="keep-rib">${RIBBON}</span>` + (isKept
      ? 'bookmarked — remove'
      : one ? 'bookmark this address' : 'bookmark this ledger');
    // A bookmarked ledger's title leaf flies the ribbon, the way a
    // bookmarked passage does in the contents.
    if (level === 'ledger') {
      const titleEl = document.getElementById('anth-title');
      titleEl.querySelector('.toc-bm')?.remove();
      if (isKept) {
        const rib = document.createElement('span');
        rib.className = 'toc-bm';
        rib.setAttribute('aria-label', 'bookmarked');
        rib.innerHTML = RIBBON;
        titleEl.prepend(rib);
      }
    }
  };
  // Shelving asks for a name first. A ledger arrives here from a ?address=
  // query, which carries addresses and nothing else -- and a kept ledger is
  // a row in the reader's own table of contents, where a row is read by its
  // title. So an untitled ledger opens the naming form instead of saving,
  // and the save is what keeps it. Removing needs no name.
  const shelve = (title) => {
    saveKeptLedgers([...keptLedgers(), { title, addresses: cur().addresses }]);
    // The ledger now has the name it was kept under: this leaf, the pager's
    // count, and the shelf all read it from here.
    cur().title = title;
    cur().name = title;
    document.getElementById('anth-title').textContent = title;
    closeTitleForm();
    reflect();
  };
  keepBtn.onclick = () => {
    const all = keptLedgers();
    const has = all.some((k) => k.addresses && sameAddresses(k.addresses, cur().addresses));
    if (has) {
      saveKeptLedgers(all.filter((k) => !sameAddresses(k.addresses, cur().addresses)));
      closeTitleForm();
      reflect();
    } else if (cur().title.trim()) {
      shelve(cur().title.trim());
    } else {
      openTitleForm(shelve);
    }
  };
  reflect();
};

// A name to start from, in the miner's own tongue: the notation a block
// frontispiece wears for its version -- one HP spell and one BIP39 word,
// spell first. Sixteen random bits stand in for BIP320's version-rolling
// scratch entropy, which is what a miner puts there too; the 17th bit is
// their parity, and the pair is the 17-bit codeword split six bits (the 64
// spells) and eleven (the 2,048 BIP39 words). So a suggested name is a
// well-formed version -- btc-prose.js's parseBlockVersion reads it back to
// an nVersion -- and reads like one.
//
// The mapping is formatBlockVersion's, and that function remains its
// authority; it is repeated here rather than imported because it lives
// behind the prose renderers and their WASM glue, which naming a ledger has
// no business waking. The lists are the same module either way, and their
// indices are load-bearing and append-only, so the two cannot drift.
function suggestedName() {
  const rolling = Math.floor(Math.random() * 0x10000);
  let parity = 0;
  for (let b = 0; b < 16; b++) parity ^= (rolling >>> b) & 1;
  const codeword = (parity << 16) | rolling;
  return `${HP_SPELLS[codeword & 63]} ${BIP39[codeword >>> 6]}`;
}

// The naming form under the Keep button. It opens on a suggestion, selected
// so a first keystroke replaces it; Save goes out of reach if the field is
// emptied -- no ledger is shelved nameless -- and Enter saves, Escape gives
// up, as the field's shape suggests.
const keepTitleSave = document.getElementById('keep-title-save');
const keepTitleCancel = document.getElementById('keep-title-cancel');
function closeTitleForm() {
  keepTitle.classList.add('hidden');
  keepTitleInput.value = '';
  keepTitleSave.disabled = true;
}
function openTitleForm(onSave) {
  keepTitle.classList.remove('hidden');
  // Opened on a suggestion, selected: Keep takes it as it stands, a first
  // keystroke replaces it whole.
  keepTitleInput.value = suggestedName();
  keepTitleSave.disabled = false;
  keepTitleInput.focus();
  keepTitleInput.select();
  const commit = () => { const t = keepTitleInput.value.trim(); if (t) onSave(t); };
  keepTitleSave.onclick = commit;
  keepTitleInput.oninput = () => { keepTitleSave.disabled = !keepTitleInput.value.trim(); };
  keepTitleInput.onkeydown = (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); closeTitleForm(); }
    ev.stopPropagation();   // the leaf's own arrow keys must not turn the page mid-name
  };
}
keepTitleCancel.onclick = () => closeTitleForm();

const arrow = (glyph, label, off, act, word = false) => {
  const a = document.createElement('a');
  a.href = '#';
  a.textContent = glyph;
  if (word) a.classList.add('word');
  a.setAttribute('aria-label', label);
  a.classList.toggle('off', off);
  a.addEventListener('click', (ev) => { ev.preventDefault(); act(); });
  return a;
};

// The ledger's title leaf: the shelf row, grown into a full page -- the
// name, the balance (one chain-state request per member address; browsing
// the compendium starts nobody's sync), how many addresses it spans, and
// the Keep affordance for a ledger the reader brought. ▾ (or a push up)
// descends into the addresses.
// The appendix leaf: the compendium's title page. It names the appendix and
// says what it gathers, and lists nothing -- the contents lists the ledgers,
// and a reader arrives here from that list. Below it the shelf; above it the
// contents; behind it the appendix before this one, on its own page.
const openAppendixLeaf = () => {
  // Nothing above the title but the masthead: the leaf is titled by its
  // number and named beneath it, and the ways out of it are the ones the
  // book's leaves always have -- the pull down at the top, the swipe back,
  // and the masthead's own Contents.
  eyebrow.replaceChildren();
  document.getElementById('anth-title').textContent = PART_LABEL;
  document.getElementById('anth-subtitle').textContent = '';
  pager.replaceChildren();
  const prose = document.getElementById('anth-prose');
  prose.classList.add('explainer');
  prose.textContent = LEDGER_PART ? LEDGER_PART.note : '';
  downEl.setAttribute('href', '#');
  downEl.onclick = (ev) => { ev.preventDefault(); descend(); };
  downEl.setAttribute('aria-label', 'Down to the ledgers');
  el.replaceChildren();
  lineNote(el, `${n(LEDGERS.length, 'ledger', 'ledgers')} on the shelf — ▾ opens them`);
};

const openLedgerLeaf = (alive) => {
  // The eyebrow is the crumb up, as it is on a passage leaf -- and above a
  // ledger's title leaf is the appendix this shelf is.
  eyebrow.replaceChildren(arrowless(`▴ ${PART_LABEL}`, () => ascend()));
  document.getElementById('anth-title').textContent = cur().name;
  pager.replaceChildren(
    arrow('‹', 'Previous ledger', li <= 0, () => turnLedger(-1)),
    Object.assign(document.createElement('span'), { textContent: `${li + 1} of ${LEDGERS.length}` }),
    arrow('›', 'Next ledger', li >= LEDGERS.length - 1, () => turnLedger(1)),
  );
  downEl.setAttribute('href', '#');
  downEl.onclick = (ev) => { ev.preventDefault(); descend(); };
  downEl.setAttribute('aria-label', 'Down into the ledger’s passages');

  showBookmark();
  showCommentary(cur().addresses, alive);

  // Something below the fold for the recovery check, and for the reader: the
  // leaf's own contents line.
  el.replaceChildren();
  // A ledger is a set of scripts; each is a passage, and each passage's
  // appearances are the references beneath it.
  lineNote(el, `${n(cur().addresses.length, 'passage', 'passages')} — ▾ opens the record`);

  // The balance, four ways (the shelf's discipline, one ledger at a time):
  // an answer under ten minutes old serves from memory in full ink; past
  // that a live probe refreshes it; a probe that fails everywhere falls to
  // the last-known figure (the quiet pending style); with nothing ever
  // known, "unreachable" retrying in place when tapped. A sum shows only
  // when every member answered -- a partial sum would read as the whole.
  const stateOf = async (ask) => {
    const states = [];
    for (const a of cur().addresses) {
      const s = ask ? await addressState(a) : lastKnownState(a);
      if (!s) return null;
      states.push(s);
    }
    return { balance: states.reduce((s2, st) => s2 + st.balance, 0),
             stale: states.some((st) => st.stale) || undefined };
  };
  const probe = async () => {
    balanceEl.textContent = '…';
    balanceEl.className = 'anth-balance pending';
    balanceEl.onclick = null;
    const lines = await Promise.all(cur().addresses.map((a) => cachedLine(a)));
    if (!alive()) return;
    const banked = lines.every((c) => c?.balance != null)
      ? lines.reduce((s2, c) => s2 + c.balance, 0) : null;
    if (banked != null) balanceEl.textContent = formatBalanceBtc(banked);
    const state = await stateOf(true);
    if (!alive()) return;
    if (state && !state.stale) {
      balanceEl.textContent = formatBalanceBtc(state.balance);
      balanceEl.className = 'anth-balance';
    } else if (state) {
      balanceEl.textContent = formatBalanceBtc(state.balance);   // last known
    } else if (banked != null) {
      balanceEl.textContent = formatBalanceBtc(banked);          // as of its last sync
    } else {
      balanceEl.textContent = `${chainFailureText()} — retry`;
      balanceEl.classList.add('retry');
      balanceEl.onclick = () => { if (alive()) probe(); };
    }
  };
  probe();
};

// A passage leaf (or, past the last passage, the ledger's table of entries).
// A ledger has ONE title page, the leaf above; this one is titled by the
// passage it sets -- the script in the book's own prose -- with the ledger's
// name in the eyebrow, as the crumb back up to it.
const openAddressLeaf = (alive) => {
  const addrs = cur().addresses;
  eyebrow.replaceChildren(arrowless('▴ ' + cur().name, () => ascend()));
  pager.replaceChildren();
  if (addrs.length + 1 > 1) {
    const pos = document.createElement('span');
    pos.textContent = at < addrs.length
      ? (addrs.length > 1 ? `passage ${at + 1} of ${addrs.length}` : 'passage')
      : 'entries';
    pager.append(
      arrow('‹', 'Previous leaf', at <= 0, () => turnAddress(-1)),
      pos,
      arrow('›', 'Next leaf', at >= addrs.length, () => turnAddress(1)),
    );
  }
  downEl.setAttribute('href', '#anth-contents');
  downEl.onclick = null;
  downEl.setAttribute('aria-label', 'Down to the summary and entries');
  showBookmark();   // a searched address lands here; the ribbon is at hand

  if (at >= addrs.length) {
    showCommentary(addrs, alive);   // the merged entries leaf reads for the whole ledger
    runEntries(alive);
    return;
  }
  const addr = addrs[at];
  showCommentary([addr], alive);

  // The passage itself, and it is this leaf's title: the address's
  // scriptPubKey in the book's opcode notation -- glyphs for the opcodes, a
  // typed push mark, and Glossia prose for only the genuinely opaque bytes
  // (the hash or witness program), exactly as the same script reads in every
  // chapter that pays it. So a P2PKH passage opens ⧉ ⌖ h²⁰ ⟨prose⟩ ≡ ∇, and
  // the base58 or bech32 form is not printed beneath it: an address is the
  // machine's rendering of this same script, and the book's rendering is the
  // one the book prints. (The URL still carries it, and the ledger is still
  // found by it.) The renderer and engine are the book's own (renderScript
  // needs the WASM build; see README); only when they cannot be had does the
  // address stand in at the head, since a leaf with nothing there is no leaf.
  (async () => {
    const html = await txoProse(addr);
    if (!alive()) return;
    if (html) {
      const prose = document.getElementById('anth-prose');
      prose.classList.add('passage');
      prose.innerHTML = html;
    } else {
      document.getElementById('anth-title').textContent = shortAddr(addr);
    }
  })();

  runResolve(addr, alive);
};
const arrowless = (text, act) => {
  const a = document.createElement('a');
  a.href = '#';
  a.textContent = text;
  a.addEventListener('click', (ev) => { ev.preventDefault(); act(); });
  return a;
};

// The entry leaf: one transaction of the record, from the bank alone. The
// net amount headlines; the card beneath carries the citation (the one
// door into the book), the date, the coin's status once the held snapshot
// agrees, the running balance where the map is whole, and the entry's
// place in the record. Vertical neighbours prefetch: nearing the banked
// frontier quietly pulls the next page of history, so the gate almost
// never holds.
const openEntryLeaf = async (alive) => {
  const line = await cachedLine(entryAddr);
  if (!alive()) return;
  const ei = findEntry(line, entryKey);
  // A passage landed on by reference may sit below the banked frontier: it
  // renders from its own fetched entry (adhocEntry), banking nothing, with
  // the timeline walk waiting until the record's own reading reaches it.
  const adhoc = ei < 0 && adhocEntry && adhocEntry.txid === entryKey.txid && adhocEntry.sats === entryKey.sats
    ? adhocEntry : null;
  if (ei < 0 && !adhoc) { level = 'address'; openView(); return; }   // the bank moved underfoot; surface
  const e = adhoc ?? line.entries[ei];
  const len = line?.entries.length ?? 0;
  entryNav = adhoc
    ? { newer: false, older: false, readyNewer: false, readyOlder: false }
    : { newer: ei < len - 1, older: ei > 0, readyNewer: false, readyOlder: false };

  // Neighbour prefetch, the reader's own discipline (prefetchNeighbors in
  // the book): after this leaf renders, quietly pregenerate the section
  // either vertical swipe would land on -- sectionFor composes and encodes
  // into its memo and the citation's § proof banks alongside, so the
  // eventual turn is a lookup, landing on content ready to render. A swipe
  // commits only onto a warmed neighbour (turnEntry); until then the drag
  // rubber-bands. Deferred past the turn's entry animation, and warming
  // settles ready even when the chain can't be reached -- the leaf's
  // banked core still renders offline, so the timeline never strands.
  const warmEntry = async (t) => {
    try { await sectionFor(t.txid); await citePlace(t.txid); } catch (_) { /* the leaf's fallback still renders */ }
  };
  if (!adhoc) setTimeout(() => {
    if (!alive()) return;
    if (entryNav.newer) warmEntry(line.entries[ei + 1]).then(() => { if (alive()) entryNav.readyNewer = true; });
    if (entryNav.older) warmEntry(line.entries[ei - 1]).then(() => { if (alive()) entryNav.readyOlder = true; });
  }, 350);

  // The passage's citation, heading the leaf: βoβ (the βook of βitcoin's
  // own sigil) and the full reference -- Roman volume, β book, ■ chapter,
  // §section.output once the archive knows the section. This is the handle
  // a passage is quoted by -- the β sigils keep a search for it unambiguous
  // -- and the same reference rides the URL in Latin (v1b50c1807s85o4), so
  // the quoted form and the shared link name the passage identically. It
  // is also the door into the manuscript: a tap opens this passage in the
  // reader -- by its reference once the § is known, by txid until then.
  const place = volumeBookChapter(e.height);
  const citeEl = document.getElementById('entry-cite');
  let citeText = `βoβ ${toRoman(place.volume)} β${place.book} ■${place.chapter}`;
  citeEl.textContent = citeText;
  citeEl.href = citeHref(e.txid, e.out);   // exact by txid until the § is known
  citeEl.title = 'read this passage in the book';
  const stampUrl = (s) => {
    try {
      history.replaceState(null, '',
        `${location.pathname}?address=${cur().addresses.join(',')}&ref=${latinRef(e.height, s, e.out ?? null)}`);
    } catch (_) { /* unavailable */ }
  };
  stampUrl(null);
  // The section: from the archive, or one merkle proof (banked forever) --
  // so the citation and the URL always carry their §, ready to share.
  const secP = sectionOfFetched(e.txid);
  secP.then((pos) => {
    if (pos == null || !alive()) return;
    citeText += ` §${pos + 1}${e.out != null ? `.${e.out}` : ''}`;
    citeEl.textContent = citeText;
    // With the § known the reference alone names the place in the reader.
    citeEl.href = `./bitcoin-book.html?ref=${latinRef(e.height, pos + 1, e.out ?? null)}`;
    stampUrl(pos + 1);
  });
  // The passage itself: the WHOLE section, reproduced as the book prints
  // it -- the page titled by the transaction's own name (its txid as
  // Glossia prose), then every input and output, each script in the book's
  // opcode notation with its opaque bytes as prose -- so the referenced
  // txo (carrying the accent rule) reads in context. When the section
  // can't be had (engine or bytes unavailable), the lone txo stands in,
  // rendered offline from the address alone.
  const proseEl = document.getElementById('entry-prose');
  const titleEl = document.getElementById('entry-title');
  const secEl = document.getElementById('entry-section');
  proseEl.replaceChildren();
  titleEl.textContent = '';
  secEl.replaceChildren();
  (async () => {
    const s = await sectionFor(e.txid);
    if (!alive()) return;
    if (!s) {
      const html = await txoProse(entryAddr);
      if (html && alive()) proseEl.innerHTML = html;
      return;
    }
    titleEl.textContent = s.titleProse;
    // The section, built exactly as the reader builds it (renderSection in
    // bitcoin-book.html): the tx-flow grid's horizontal bands -- inputs a
    // [citation | scriptSig] subgrid, witness-only citations and the
    // version note stacked in the margin, outputs a [scriptPubKey | amount]
    // subgrid, the locktime a centred colophon -- with the drop cap on the
    // first body line, ASCII set as quote blocks, and witness stacks as
    // numbered footnotes. Only the margin citations resolve differently:
    // archive-first, then one banked merkle proof (citePlace), with the
    // spent amount joining when the citations archive carries the outputs.
    const wrap = document.createElement('div');
    wrap.className = 'tx-wrap' + (s.verified ? '' : ' unverified');
    const flow = document.createElement('div'); flow.className = 'tx-flow';
    const inputsEl = document.createElement('div'); inputsEl.className = 'tx-inputs';
    const marginEl = document.createElement('div'); marginEl.className = 'tx-margin-cites';
    const outputsEl = document.createElement('div'); outputsEl.className = 'tx-outputs';
    let leadUsed = false;
    // Composed HTML is the book's own contract: glyphs and marks are the
    // only markup, opaque bytes arrive as prose, quoted ASCII is escaped.
    const addLine = (container, html) => {
      if (!html) return;
      const p2 = document.createElement('p');
      const lead = !leadUsed && !html.startsWith('<span class="op op-push"');
      leadUsed = true;
      p2.className = 'tx-line' + (lead ? ' tx-body-lead' : '');
      p2.innerHTML = html;
      container.append(p2);
    };
    const addQuote = (container, html) => {
      if (!html) return;
      const q2 = document.createElement('blockquote');
      q2.className = 'tx-ascii';
      q2.innerHTML = html;
      container.append(q2);
    };
    const seqSpan = (inp) => {
      const sq = document.createElement('span');
      sq.className = `tx-seq tx-seq-${inp.sequenceKind}`;
      sq.title = inp.sequenceTitle;
      if (inp.sequenceRbf && inp.sequence) {
        const dagger = document.createElement('span');
        dagger.className = 'tx-seq-rbf';
        dagger.textContent = '†';
        sq.append(dagger, ` ${inp.sequence}`);
      } else {
        sq.textContent = inp.sequenceRbf ? '†' : inp.sequence;
      }
      return sq;
    };
    const witnessRef = (n2) => {
      const a = document.createElement('a');
      a.className = 'tx-witness-ref';
      a.href = `#fn-${n2}`;
      a.textContent = String(n2);
      a.title = 'witness — see footnote';
      a.addEventListener('click', (ev) => {
        ev.preventDefault();
        secEl.querySelector(`#fn-${n2}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      return a;
    };
    const footnotes = [];
    // The margin amounts' one fetch, shared by every input and made only
    // if some input needs it: this transaction's own JSON carries each
    // input's prevout value, so no referenced transaction is ever pulled
    // down just to price a margin line.
    let prevoutsP = null;
    const prevouts = () => (prevoutsP ??= prevoutValuesOf(e.txid));
    // Citations with no scriptSig body to sit beside. A witness-spend input's
    // citation follows its witness to the footnotes (the book's rule); what
    // stacks here -- above the next scriptSig input's citation, or beside the
    // outputs when none follows -- is the version note and the rare input
    // with neither scriptSig nor witness.
    const pendingMargin = [];
    if (s.fields.version !== '1') {
      const vc = document.createElement('div');
      vc.className = 'tx-in-cite tx-version';
      vc.textContent = `v${s.fields.version}`;
      pendingMargin.push(vc);
    }
    // Per non-coinbase input, the resolved spent value (satoshis; null where
    // unpriceable) -- summed for the closing balance line once all answer.
    const spentP = [];
    s.fields.inputs.forEach((v, i) => {
      const cite = document.createElement('div'); cite.className = 'tx-in-cite';
      const citeBody = document.createElement('span');
      citeBody.className = 'cite-body';
      const amtLine = document.createElement('div'); amtLine.className = 'cite-amount';
      if (v.isNullPrevout) citeBody.textContent = '∅';   // coinbase: no previous output
      else {
        citeBody.textContent = '⋯';   // placeholder until the reference resolves
        cite.classList.add('resolving');
        spentP.push((async () => {
          const pl = await citePlace(v.prevTxid);
          if (!alive()) return null;
          if (!pl) {
            citeBody.textContent = `${v.prevTxid.slice(0, 8)}… .${v.prevVout}`;
            cite.classList.remove('resolving');
            cite.classList.add('cite-unresolved');
            cite.title = `${v.prevTxid}:${v.prevVout} — reference could not be resolved`;
            return null;
          }
          const p2 = volumeBookChapter(pl.height);
          const a = document.createElement('a');
          a.className = 'cite-section-link';
          a.href = citeHref(v.prevTxid, v.prevVout);
          a.textContent = `${toRoman(p2.volume)} β${p2.book} ■${p2.chapter} §${pl.pos + 1}.${v.prevVout}`;
          a.title = `go to §${pl.pos + 1}.${v.prevVout}`;
          citeBody.replaceChildren(a);
          cite.classList.remove('resolving');
          cite.title = `${v.prevTxid}:${v.prevVout}`;
          // The amount this input spends, as the reader margins it: from
          // the citations archive when it carries the outputs, otherwise
          // from this transaction's own JSON (prevouts, one shared fetch)
          // -- never by downloading the referenced transaction itself.
          let spent = pl.outputs?.[v.prevVout]?.value;
          if (spent == null) {
            spent = (await prevouts())?.[i] ?? null;
            if (!alive()) return null;
          }
          if (spent != null) {
            const amt2 = document.createElement('span');
            amt2.textContent = ` (${formatBalanceBtc(spent)})`;
            amt2.title = `the amount this input spends: ${spent.toLocaleString('en-US')} satoshis`;
            amtLine.append(amt2);
          }
          return spent;
        })());
      }
      cite.append(citeBody);
      if (v.witnessHex) { footnotes.push({ n: footnotes.length + 1, html: s.witHtml[i], items: v.witnessItems }); cite.append(witnessRef(footnotes.length)); }
      amtLine.prepend(seqSpan(v));
      cite.append(amtLine);
      // An input that renders a scriptSig holds an aligned row, any pending
      // margin citations stacked above its own; a witness-only input (empty
      // scriptSig) sends its citation down to its footnote's left cell.
      if (v.scriptAscii || v.script) {
        const citeCell = document.createElement('div');
        citeCell.className = 'tx-in-cite-group';
        for (const pm of pendingMargin) citeCell.append(pm);
        pendingMargin.length = 0;
        citeCell.append(cite);
        const scriptCell = document.createElement('div');
        scriptCell.className = 'tx-in-script';
        if (v.scriptAscii) addQuote(scriptCell, v.scriptAscii);
        else addLine(scriptCell, v.script);
        inputsEl.append(citeCell, scriptCell);
      } else if (v.witnessHex) {
        footnotes[footnotes.length - 1].cite = cite;
      } else {
        pendingMargin.push(cite);
      }
    });
    for (const pm of pendingMargin) marginEl.append(pm);
    // Outputs: [scriptPubKey | amount] rows; the referenced txo carries the
    // accent rule. Each amount carries a forward-citation cell, filled with
    // the section that later spent it once the outspends answer.
    const fwdCells = [];
    s.fields.outputs.forEach((o, i) => {
      const hit = e.sats > 0 && e.out === i;
      const scriptCell = document.createElement('div');
      scriptCell.className = 'tx-out-script' + (hit ? ' hit' : '');
      if (o.scriptAscii) addQuote(scriptCell, o.scriptAscii); else addLine(scriptCell, o.script);
      const valueCell = document.createElement('div');
      valueCell.className = 'tx-note tx-out-value' + (hit ? ' hit' : '');
      valueCell.textContent = o.value; valueCell.title = o.valueTitle;
      const fwd = document.createElement('div');
      fwd.className = 'fwd-cite';
      valueCell.append(fwd);
      fwdCells.push(fwd);
      outputsEl.append(scriptCell, valueCell);
    });
    // The closing balance line, the book's rule: Σ inputs left, − fee
    // between, Σ outputs right. The outputs' sum is the transaction's own;
    // the inputs' and the fee fill once every input has priced, and stay ⋯
    // if any could not be. A coinbase closes without one.
    let totals = null;
    if (s.fields.inputs.length && !s.fields.inputs.some((v) => v.isNullPrevout)) {
      const sumOut = s.fields.outputs.reduce((a2, o) => a2 + o.sats, 0);
      totals = document.createElement('div');
      totals.className = 'tx-totals';
      const tIn = document.createElement('span');
      tIn.textContent = '⋯';
      tIn.title = 'the sum of the inputs — waiting on the margin citations';
      const tFee = document.createElement('span');
      tFee.className = 't-fee';
      tFee.textContent = '⋯';
      const tOut = document.createElement('span');
      tOut.className = 't-out';
      tOut.textContent = formatBalanceBtc(sumOut);
      tOut.title = `the outputs carry ${sumOut.toLocaleString('en-US')} satoshis`;
      totals.append(tIn, tFee, tOut);
      Promise.all(spentP).then((values) => {
        if (!alive()) return;
        if (values.length !== s.fields.inputs.length || values.some((sv) => sv == null)) return;
        const sumIn = values.reduce((a2, sv) => a2 + sv, 0);
        tIn.textContent = formatBalanceBtc(sumIn);
        tIn.title = `the inputs bring ${sumIn.toLocaleString('en-US')} satoshis`;
        const fee = sumIn - sumOut;
        tFee.textContent = `− ${formatBalanceBtc(fee)}`;
        tFee.title = `the fee: ${fee.toLocaleString('en-US')} satoshis — the difference, claimed by the block's miner`;
      });
    }
    // The closing colophon: the locktime, centred -- and the self-check's
    // verdict only when it failed (a verified section says nothing; the
    // version note stands in the margin, as the book sets it).
    const lock = document.createElement('div'); lock.className = 'tx-note tx-locktime';
    lock.textContent = s.fields.locktime
      + (s.verified ? '' : ' · unverified — the bytes did not hash to this txid');
    lock.title = s.fields.locktimeTitle;
    flow.append(inputsEl, marginEl, outputsEl, ...(totals ? [totals] : []), lock);
    wrap.append(flow);
    secEl.replaceChildren(wrap);
    // The witness footnotes, at the section's foot as the book sets them.
    // A modest stack's prose is already composed; a data-carrier-sized one
    // streams in when its footnote scrolls near -- the book's own lazy
    // treatment: the stack renders with a dim placeholder per data push,
    // and each push's prose is encoded one macrotask at a time, so a
    // kilobyte-scale inscription never blocks the leaf.
    if (footnotes.length) {
      const fnSec = document.createElement('div');
      fnSec.className = 'chapter-footnotes';
      const lazyFns = [];
      for (const fn of footnotes) {
        const p2 = document.createElement('p');
        p2.className = 'footnote-entry';
        p2.id = `fn-${fn.n}`;
        const mark = `<span class="footnote-mark">${fn.n}</span>`;
        if (fn.html === undefined) {
          p2.innerHTML = mark + '<span class="glossia-lazy">…</span>';
          lazyFns.push({ el: p2, mark, items: fn.items });
        } else {
          p2.innerHTML = mark + (fn.html ?? '∅');
        }
        if (fn.cite) fnSec.append(fn.cite);
        fnSec.append(p2);
      }
      secEl.append(fnSec);
      if (lazyFns.length) {
        const io2 = new IntersectionObserver((es2) => {
          for (const en of es2) {
            if (!en.isIntersecting) continue;
            io2.unobserve(en.target);
            const job = lazyFns.find((l) => l.el === en.target);
            if (job) (async () => {
              const [gl, p3] = await Promise.all([import('./glossia-msg.js'), import('./btc-prose.js')]);
              await gl.init();
              if (!alive()) return;
              const chunks = [];
              const placeholder = (hex) => { chunks.push(hex); return `<span class="glossia-lazy" data-wchunk="${chunks.length - 1}">…</span>`; };
              job.el.innerHTML = job.mark + p3.renderWitness(job.items, placeholder);
              for (const spanEl of [...job.el.querySelectorAll('[data-wchunk]')]) {
                await new Promise((r2) => setTimeout(r2, 0));
                if (!alive()) return;
                spanEl.outerHTML = gl.encodeSeedPhrase(chunks[+spanEl.dataset.wchunk], 'english', 5).prose;
              }
            })();
          }
        }, { rootMargin: '800px 0px' });
        for (const l of lazyFns) io2.observe(l.el);
      }
    }
    // Forward citations: the right margin's mirror of the left's provenance
    // -- where each output's value went next. One outspends call covers
    // every output; each confirmed spender resolves through citePlace (the
    // same banked resolution as the margin cites). An unspent output leaves
    // its cell empty, and any failure stays silent -- a missing forward
    // reference is absence, not an error.
    (async () => {
      const spends = await outspendsOf(e.txid);
      if (!spends || !alive()) return;
      fwdCells.forEach(async (cell, i) => {
        const sp = spends[i];
        if (!sp || !sp.spent || !sp.txid || !sp.status || !sp.status.confirmed) return;
        const pl = await citePlace(sp.txid);
        if (!pl || !alive()) return;
        const p2 = volumeBookChapter(pl.height);
        const a = document.createElement('a');
        a.className = 'cite-section-link';
        a.href = citeHref(sp.txid);
        a.textContent = `${toRoman(p2.volume)} β${p2.book} ■${p2.chapter} §${pl.pos + 1}`;
        a.title = `spent by input ${sp.vin + 1} of ${sp.txid}`;
        cell.append(a);
      });
    })();
  })();
  const amt = document.getElementById('entry-amt');
  amt.textContent = formatNetBtc(e.sats);
  amt.classList.toggle('credit', e.sats > 0);

  const card = document.getElementById('entry-card');
  card.replaceChildren();
  const row = (k, v) => {
    const r = document.createElement('div'); r.className = 'e-row';
    const kEl = document.createElement('span'); kEl.className = 'e-k'; kEl.textContent = k;
    const vEl = document.createElement('span'); vEl.className = 'e-v';
    if (v instanceof Node) vEl.append(v); else vEl.textContent = v;
    r.append(kEl, vEl);
    card.append(r);
    return vEl;
  };
  // The citation, whole: the door to the manuscript's own page for this
  // transaction. The § joins once the archive knows it (a paragraph the
  // reader has visited); the rest wait to be read.
  const cite = document.createElement('a');
  cite.href = citeHref(e.txid, e.out);   // exact by txid until the § is known
  cite.textContent = `${toRoman(place.volume)} β${place.book} ■${place.chapter}`;
  row('reference', cite);
  secP.then((pos) => {
    if (pos == null || !alive()) return;
    cite.textContent += ` §${pos + 1}${e.out != null ? `.${e.out}` : ''}`;
    // With the § known the reference alone names the place -- the door to
    // the book carries the citation, not a txid.
    cite.href = `./bitcoin-book.html?ref=${latinRef(e.height, pos + 1, e.out ?? null)}`;
  });
  if (cur().addresses.length > 1) row('address', shortAddr(entryAddr));
  // The running balance is the sum of everything up to this entry -- an
  // opening the record stands on. Over an incomplete map that opening is
  // unknown, so the figure waits rather than guesses.
  if (!adhoc && line.complete) {
    let bal = 0;
    for (let i = 0; i <= ei; i++) bal += line.entries[i].sats;
    row('balance after', formatBalanceBtc(bal));
  }
  const stEl = row('status', e.sats === 0 ? '—' : '…');
  if (e.sats !== 0) {
    heldFresh(entryAddr).then((held) => {
      if (!alive()) return;
      if (!held || line?.balance == null || held.sum !== line.balance) { stEl.textContent = '—'; return; }
      const resting = e.sats > 0 ? held.byTxid.get(e.txid) ?? 0 : 0;
      stEl.textContent = resting > 0 ? 'unspent' : 'spent';
      stEl.classList.toggle('unspent', resting > 0);
    });
  }

  const noteEl = document.getElementById('entry-note');
  noteEl.textContent = adhoc ? 'below the banked record — reading the address’s pages will reach it' : '';
  // The fetch ahead: nearing the banked frontier pulls the next page of
  // history, and the newly landed older neighbour warms like any other --
  // the older-swipe stays gated until the leaf it would open is ready.
  if (!adhoc && line && !line.complete && ei < 3) {
    if (ei === 0) noteEl.textContent = 'reaching deeper — the next page of history is fetching…';
    extendLine(entryAddr).then(async () => {
      if (!alive()) return;
      const fresh = await cachedLine(entryAddr);
      if (!alive() || !fresh) return;
      const at2 = findEntry(fresh, entryKey);
      entryNav = { newer: at2 < fresh.entries.length - 1, older: at2 > 0,
                   readyNewer: entryNav.readyNewer, readyOlder: entryNav.readyOlder };
      if (at2 > 0 && !entryNav.readyOlder) {
        warmEntry(fresh.entries[at2 - 1]).then(() => { if (alive()) entryNav.readyOlder = true; });
      }
      if (at2 >= 0) noteEl.textContent = ei === 0 && at2 > 0 ? 'older entries arrived — a push up continues' : '';
    });
  }
};

// ── Opening a view ─────────────────────────────────────────────────────────
const openView = () => {
  const g = ++gen;
  const alive = () => g === gen;
  clearHero();
  syncUrl();
  const onEntry = level === 'entry';
  // A passage is read bare, as the manuscript's pages are: the compendium's
  // masthead stands down while an entry leaf is open.
  document.querySelector('.masthead').classList.toggle('hidden', onEntry);
  hero.classList.toggle('hidden', onEntry);
  entryHero.classList.toggle('hidden', !onEntry);
  if (onEntry) { el.replaceChildren(); openEntryLeaf(alive); return; }
  if (level === 'appendix') { openAppendixLeaf(); return; }
  if (level === 'ledger') { openLedgerLeaf(alive); return; }
  openAddressLeaf(alive);
};

// ── Turning the leaves, as the book turns its pages ──────────────────────
// A committed turn snapshots the outgoing leaf as a fixed ghost that keeps
// sliding off in the travel direction WHILE the real slide -- hidden --
// re-renders the destination and glides in from the opposite edge. The
// two halves overlap, so the turn reads as one continuous strip. `axis`
// picks the direction of travel: 'x' for level siblings, 'y' for the
// vertical moves -- level changes, and time at entry level.
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
const slide = document.getElementById('ledger-slide');
let turning = false;
function turnTo(step, dir, axis = 'x') {
  if (turning) return;
  if (REDUCED_MOTION) {
    slide.style.transform = '';
    step();
    openView();
    window.scrollTo({ top: 0, behavior: 'instant' });
    return;
  }
  turning = true;
  const rect = slide.getBoundingClientRect();   // includes any drag offset
  const win = document.createElement('div');
  win.setAttribute('aria-hidden', 'true');
  Object.assign(win.style, {
    position: 'fixed', top: '0', left: '0', width: '100%', height: '100%',
    overflow: 'clip', pointerEvents: 'none', zIndex: '30',
  });
  const ghost = slide.cloneNode(true);
  ghost.removeAttribute('id');
  Object.assign(ghost.style, {
    position: 'absolute', top: rect.top + 'px', left: rect.left + 'px',
    width: rect.width + 'px', margin: '0', transition: 'none', transform: 'none',
  });
  win.appendChild(ghost);
  document.body.appendChild(win);
  slide.style.transition = 'none';
  slide.style.transform = '';
  slide.style.visibility = 'hidden';
  void ghost.offsetWidth;
  const span = axis === 'x' ? window.innerWidth : window.innerHeight;
  const move = (v) => (axis === 'x' ? `translateX(${v}px)` : `translateY(${v}px)`);
  // Linear, so the exit reads as the drag's momentum carrying on.
  ghost.style.transition = 'transform .2s linear';
  ghost.style.transform = move(dir > 0 ? -span : span);
  setTimeout(() => win.remove(), 320);
  // Two frames for the compositor to start the ghost's slide BEFORE the
  // destination's render work blocks the main thread.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    step();
    openView();
    window.scrollTo({ top: 0, behavior: 'instant' });   // a new leaf opens at its head, unseen while hidden
    slide.style.transform = move(dir > 0 ? span : -span);
    slide.style.visibility = '';
    void slide.offsetWidth;
    slide.style.transition = 'transform .22s ease-out';
    slide.style.transform = '';
    setTimeout(() => { slide.style.transition = ''; turning = false; }, 260);
  }));
}

// The moves, one per edge of the grammar.
const canLedger = (dir) => level === 'ledger' && li + dir >= 0 && li + dir < LEDGERS.length;
const canAddress = (dir) => level === 'address' && at + dir >= 0 && at + dir <= cur().addresses.length;
function turnLedger(dir) { if (canLedger(dir)) turnTo(() => { li += dir; }, dir, 'x'); }
function turnAddress(dir) { if (canAddress(dir)) turnTo(() => { at += dir; }, dir, 'x'); }
function ascend() {
  if (level === 'ledger') return turnTo(() => { level = 'appendix'; }, -1, 'y');
  if (level !== 'address') return;
  rememberedAt.set(li, at);
  turnTo(() => { level = 'ledger'; }, -1, 'y');
}
// Above the appendix leaf is the table of contents, which lists this shelf
// as its Appendix III. The turn is the inverse of the descent that brought
// the reader here -- the compendium sinks, the contents drop back in from
// above -- and it leaves the page, so it is played on the body rather than
// on the slide.
function leavePage(href, transform, flag, value = '1') {
  try { sessionStorage.setItem(flag, value); } catch (_) {}
  const go = () => { location.href = href; };
  if (REDUCED_MOTION) { go(); return; }
  document.body.style.transition = 'transform .2s linear';
  document.body.style.transform = transform;
  setTimeout(go, 180);
}
// Appendix III's own contents leaf: the contents runs a leaf per volume and
// per appendix, and this shelf IS Appendix III, so the ascent lands there.
const toContents = () => leavePage('./bitcoin-contents.html?part=ledgers', 'translateY(100vh)', 'glossia-toc-entrance');
// Sideways from the appendix leaf: the appendices turn between one another
// in their numbered order, and the ones before this are leaves of their own
// page. Nothing follows Appendix III, so only the backward turn exists.
const toPrevAppendix = () => {
  if (PREV_PART_HREF) leavePage(PREV_PART_HREF, 'translateX(100vw)', 'glossia-appendix-entrance', 'back');
};
function descend() {
  if (level === 'appendix') return turnTo(() => { level = 'ledger'; }, 1, 'y');
  if (level !== 'ledger') return;
  turnTo(() => { level = 'address'; at = rememberedAt.get(li) ?? 0; }, 1, 'y');
}
// The dive: a swipe over the record -- or, for hands on a mouse, a plain
// click on a row -- pulls in the page of the entry under the pointer. The
// row knows its entry (txid + sats name one side of one transaction) and,
// on the merged leaf, its home address. The row's own href (the book) still
// serves a modified or middle click, and the entry leaf's reference is the
// walking-pace door to the manuscript.
document.getElementById('anthology').addEventListener('click', (ev) => {
  const row = ev.target.closest && ev.target.closest('.idx-row[data-txid]');
  if (!row || turning) return;
  if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button !== 0) return;
  ev.preventDefault();
  dive(row);
});
function dive(row) {
  const addr = row.dataset.addr || cur().addresses[at];
  if (!addr) return;
  adhocEntry = null;   // a row dive is banked by definition
  entryAddr = addr;
  entryKey = { txid: row.dataset.txid, sats: Number(row.dataset.sats) };
  turnTo(() => { level = 'entry'; }, 1, 'x');
}
// The one door out of an entry: back to the record, scrolled to the entry
// left off at -- the list follows the dive.
function returnToRecord() {
  if (level !== 'entry') return;
  // A banked passage lands the record on its row; one below the frontier
  // has no row to land on -- the record opens where its reading stands.
  const wasAdhoc = adhocEntry && adhocEntry.txid === entryKey.txid && adhocEntry.sats === entryKey.sats;
  landAt = wasAdhoc ? null : { ...entryKey };
  adhocEntry = null;
  const idx = cur().addresses.indexOf(entryAddr);
  turnTo(() => { level = 'address'; at = Math.max(0, idx); }, -1, 'x');
}
// Time, at entry level: +1 is older (the direction the record scrolls),
// -1 newer. A turn commits only onto a neighbour whose section has been
// pregenerated (openEntryLeaf's warming) -- the reader's prefetch-gated
// contract: until the destination is ready to render, the swipe only
// rubber-bands. At the banked frontier the fetch-ahead and the warming
// are already reaching for the next page; the older-swipe opens the
// moment they land.
async function turnEntry(dir) {
  if (level !== 'entry' || turning) return;
  const line = await cachedLine(entryAddr);
  const ei = findEntry(line, entryKey);
  if (ei < 0) return;
  if (dir > 0) {   // older
    if (ei > 0 && entryNav.readyOlder) { const k = entryKeyOf(line.entries[ei - 1]); turnTo(() => { entryKey = k; }, 1, 'y'); }
  } else if (ei < line.entries.length - 1 && entryNav.readyNewer) {   // newer
    const k = entryKeyOf(line.entries[ei + 1]);
    turnTo(() => { entryKey = k; }, -1, 'y');
  }
}

// ── The gestures ───────────────────────────────────────────────────────────
// One handler, level-aware. The axis locks on first significant movement
// so a scroll never drags a leaf sideways. The zone under the finger picks
// the horizontal meaning on an address leaf: over the record, a leftward
// swipe dives into the entry nearest the touch; anywhere else it turns the
// address carousel. Vertically: at ledger level a push up descends; at
// address level a pull down FROM THE TOP ascends (anywhere lower it is
// simply the scroll); at entry level both directions walk the timeline.
// A direction with nothing behind it only rubber-bands.
(() => {
  let sx = null, sy = 0, st = 0, axis = null, startRow = null, topStart = false, botStart = false, shortStart = false;
  const snapBack = () => {
    if (!slide.style.transform) return;
    slide.style.transition = 'transform .15s ease';
    slide.style.transform = '';
  };
  const hDamp = (dx) => {
    const dir = dx < 0 ? 1 : -1;
    if (level === 'appendix') return dx > 0 && PREV_PART_HREF ? 1 : 0.25;   // back to the appendix before this one
    if (level === 'ledger') return canLedger(dir) ? 1 : 0.25;
    if (level === 'address') {
      if (startRow) return dx < 0 ? 1 : 0.25;          // the dive pulls leftward only
      return canAddress(dir) ? 1 : 0.25;
    }
    return dx > 0 ? 1 : 0.25;                          // entry: right returns; left is the edge
  };
  // The vertical swipe engages the way the reader's does: anywhere on a
  // page short enough not to scroll, and only from the scroll boundaries
  // on a tall one -- pulling down at the top, pushing up at the bottom --
  // so a long passage scrolls as prose first and turns only at its edges.
  const vArmed = (dy) => {
    // The two leaves above the record: up descends, down from the top rises
    // -- to the appendix from a ledger, and out to the contents from there.
    if (level === 'appendix' || level === 'ledger') return dy < 0 || topStart;
    if (level === 'entry') return shortStart || (topStart && dy > 0) || (botStart && dy < 0);
    return topStart && dy > 0;                         // address: pull down from the top ascends
  };
  // The follow is the reader's too: half-speed toward a live neighbour,
  // a firm rubber-band toward nothing -- and a neighbour counts as live
  // only once its section has been pregenerated, so the finger feels the
  // same gate the commit enforces.
  const vDamp = (dy) => {
    if (level === 'appendix' || level === 'ledger') return dy < 0 || topStart ? 0.5 : 0.18;
    if (level === 'address') return 0.5;
    // Entry level: up is older, down is newer.
    if (dy < 0) return entryNav.older && entryNav.readyOlder ? 0.5 : 0.18;
    return entryNav.newer && entryNav.readyNewer ? 0.5 : 0.18;
  };
  document.addEventListener('touchstart', (e) => {
    sx = null; axis = null; startRow = null;
    if (e.touches.length !== 1 || turning) return;
    const t = e.target;
    if (t.closest && t.closest('input, textarea, select, .settings-panel')) return;
    startRow = t.closest ? t.closest('.idx-row[data-txid]') : null;
    topStart = window.scrollY <= 2;
    botStart = window.scrollY >= document.documentElement.scrollHeight - window.innerHeight - 2;
    shortStart = document.documentElement.scrollHeight <= window.innerHeight + 24;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = performance.now();
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (sx === null || REDUCED_MOTION || turning) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (!axis) {
      if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
    if (axis === 'h') {
      slide.style.transition = 'none';
      slide.style.transform = `translateX(${dx * hDamp(dx)}px)`;
    } else if (vArmed(dy)) {
      slide.style.transition = 'none';
      slide.style.transform = `translateY(${dy * vDamp(dy)}px)`;
    }
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (sx === null || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    const dt = performance.now() - st;
    const row = startRow;
    sx = null; startRow = null;
    if (turning) return;
    const hCommit = axis === 'h' && dt <= 600 && Math.abs(dx) >= 60 && Math.abs(dy) <= Math.abs(dx) * 0.6;
    const vCommit = axis === 'v' && dt <= 600 && Math.abs(dy) >= 70 && Math.abs(dx) <= Math.abs(dy) * 0.6;
    if (hCommit) {
      const dir = dx < 0 ? 1 : -1;   // swiping left travels forward
      if (level === 'appendix') { if (dir < 0) return toPrevAppendix(); return snapBack(); }
      if (level === 'ledger' && canLedger(dir)) return turnLedger(dir);
      if (level === 'address') {
        if (row && dir > 0) return dive(row);
        if (!row && canAddress(dir)) return turnAddress(dir);
      }
      if (level === 'entry' && dir < 0) return returnToRecord();
      return snapBack();
    }
    if (vCommit && vArmed(dy)) {
      if ((level === 'appendix' || level === 'ledger') && dy < 0) return descend();
      if (level === 'appendix' && topStart && dy > 0) return toContents();
      if ((level === 'ledger' || level === 'address') && topStart && dy > 0) return ascend();
      if (level === 'entry') return void turnEntry(dy < 0 ? 1 : -1).then(() => { if (!turning) snapBack(); });
      return snapBack();
    }
    snapBack();
  }, { passive: true });
  document.addEventListener('touchcancel', () => { sx = null; startRow = null; if (!turning) snapBack(); }, { passive: true });
})();

// ── The same turns, from a keyboard ───────────────────────────────────────
// The arrow keys carry the gestures for hands on a keyboard, level for
// level: left and right turn the carousel (and, at entry level, left is
// the one door back to the record), up ascends and down descends -- the
// reader's own directions, though the swipe that means "descend" is a push
// UP. The vertical pair defers to the scroll: it turns on a leaf short
// enough not to scroll, or from the boundary the turn moves away from, so a
// long record is read to its foot before the next press walks the timeline.
// (A descending swipe from a title leaf commits from anywhere on it -- a
// finger has the scroll to itself. A key does not: the arrows ARE the
// scroll, and a leaf a little taller than the window would keep its foot
// unreachable. So every vertical key waits for the boundary.)
//
// The dive keeps no key of its own: it is aimed -- the swipe takes the entry
// nearest the finger, the click the row under the pointer -- and a keyboard
// has nothing to aim with. The row's own link, and the entry's reference,
// are its doors here.
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || e.repeat) return;
  const horizontal = e.key === 'ArrowLeft' || e.key === 'ArrowRight';
  const vertical = e.key === 'ArrowUp' || e.key === 'ArrowDown';
  if ((!horizontal && !vertical) || turning) return;
  const t = e.target;
  if (t && t.closest && t.closest('input, textarea, select, [contenteditable], .settings-panel')) return;

  if (horizontal) {
    const dir = e.key === 'ArrowRight' ? 1 : -1;   // right travels forward, as a leftward swipe does
    if (level === 'appendix') { if (dir < 0 && PREV_PART_HREF) { e.preventDefault(); toPrevAppendix(); } return; }
    if (level === 'ledger' && canLedger(dir)) { e.preventDefault(); turnLedger(dir); return; }
    if (level === 'address' && canAddress(dir)) { e.preventDefault(); turnAddress(dir); return; }
    if (level === 'entry' && dir < 0) { e.preventDefault(); returnToRecord(); }
    return;
  }

  const dir = e.key === 'ArrowDown' ? 1 : -1;      // down descends, up ascends
  const atTop = window.scrollY <= 2;
  const atBottom = window.scrollY >= document.documentElement.scrollHeight - window.innerHeight - 2;
  const short = document.documentElement.scrollHeight <= window.innerHeight + 24;
  if (!(short || (dir < 0 && atTop) || (dir > 0 && atBottom))) return;
  if (level === 'appendix' || level === 'ledger') {
    e.preventDefault();
    if (dir > 0) descend();
    else if (level === 'appendix') toContents();
    else ascend();
    return;
  }
  if (level === 'address') { if (dir < 0) { e.preventDefault(); ascend(); } return; }
  // Entry level: the timeline itself -- down is older, up newer.
  e.preventDefault();
  void turnEntry(dir);
});

openView();

// ── Landing on a shared reference ─────────────────────────────────────────
// A URL carrying ?ref=v…b…c…[s…][o…] routes by what the reference names.
// v…b…c… alone names a CHAPTER, and opens the chapter itself, in the book.
// A §section makes it a passage: with a ledger context (?address=…) the
// compendium lands on the entry leaf -- banked records checked first
// (offline-friendly, and a shared link usually names recent history), and
// a reference below the banked frontier is not walked to but jumped to:
// the §section inverts to a txid in two small requests (block hash by
// height, the block's txid at that index -- passageTxid), and the passage
// renders from its own fetched entry, banking nothing. Without a ledger
// context the same inversion opens the book at the § itself. Among
// entries sharing a height, the output index names the credit side; no
// output names the debit when one exists; a §section filters banked
// candidates only where the archive already knows sections. Nothing found
// (or mirrors unreachable) leaves the reader on the address leaf.
if (pRef) (async () => {
  // A reference without a § names the chapter, not a passage of it -- and
  // a §-reference without a ledger context reads in the manuscript itself.
  // Either way the book takes the reference whole (?ref=…): the URL carries
  // the citation and nothing else -- a txid never rides beside (or instead
  // of) the reference that already names the same place.
  if ((pRef.s == null && pRef.o == null) || !qList.length) {
    location.href = `./bitcoin-book.html?ref=${encodeURIComponent(pQ)}`;
    return;
  }
  const g = gen;                          // abandon if the reader turns away
  const alive = () => g === gen;
  const side = (entries) => {
    if (!entries?.length) return null;
    if (pRef.o != null) return entries.find((e) => e.out === pRef.o) ?? entries[0];
    return entries.find((e) => e.sats < 0) ?? entries[0];
  };
  const pickBanked = async (line) => {
    const cands = (line?.entries ?? []).filter((e) => e.height === pRef.height);
    if (!cands.length) return null;
    if (pRef.s != null && cands.length > 1) {
      // Keep candidates whose archived section agrees (or is unknown --
      // the archive filters, it never disqualifies what it hasn't read).
      const kept = [];
      for (const e of cands) {
        const pos = await sectionOf(e.txid);
        if (pos == null || pos + 1 === pRef.s) kept.push(e);
      }
      return side(kept.length ? kept : cands);
    }
    return side(cands);
  };
  const land = (addr, e, adhoc) => {
    if (!alive()) return;
    adhocEntry = adhoc ? e : null;
    entryAddr = addr;
    entryKey = entryKeyOf(e);
    level = 'entry';
    openView();
  };
  const addrs = cur().addresses;
  for (const a of addrs) {
    const hit = await pickBanked(await cachedLine(a) ?? await lineOnce(a));
    if (!alive()) return;
    if (hit) return land(a, hit, false);
  }
  // Below the frontier: invert the citation to its txid and jump.
  if (pRef.s == null) return;   // without a section there is nothing to invert
  const txid = await passageTxid(pRef.height, pRef.s - 1);
  if (!alive() || !txid) return;
  for (const a of addrs) {
    const line = await cachedLine(a);
    if (!alive()) return;
    const banked = side((line?.entries ?? []).filter((e) => e.txid === txid));
    if (banked) return land(a, banked, false);
    const built = side(await passageEntries(a, txid));
    if (!alive()) return;
    if (built) return land(a, built, true);
  }
})();
</script>
