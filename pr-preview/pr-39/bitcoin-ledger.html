<script>
  // The shelf of ledgers is the contents' Appendix III, and so sits below
  // the contents: arriving from it is a descent (the compendium rises from
  // beneath the list), and the ascent back is the inverse -- the compendium
  // sinks, the contents drop in from above. The flag is set just before the
  // navigation and consumed on first paint.
  try {
    const dir = sessionStorage.getItem('glossia-ledger-entrance');
    if (dir) {
      sessionStorage.removeItem('glossia-ledger-entrance');
      // A descent from the contents rises from below; a forward turn along
      // the volumes' line -- out of Appendix II -- arrives from the right.
      document.documentElement.classList.add(dir === 'fwd' ? 'ledger-entrance-fwd' : 'ledger-entrance');
    }
  } catch (_) {}
</script>
<script>
  // The page is assembled from ES modules that both the HTTP cache (GitHub
  // Pages serves max-age=600) and the service worker refresh file by file, so
  // a redeploy can briefly leave them mixed: this page from one build, a
  // module from another. A module whose imports no longer line up fails to
  // instantiate, and an aborted module graph renders nothing -- the ledger
  // goes blank. Detect the blankness itself, not the error (module failures
  // surface too many ways to catch reliably): a healthy module populates
  // #anthology synchronously, so an empty #anthology well after load means
  // the graph died. Recover by re-fetching this page's files with
  // cache:'reload' -- which refreshes the HTTP cache directly and, routed
  // through the service worker, makes its background revalidation hit the
  // true network -- then reloading once onto the matched set. A second blank
  // load shows a note instead of looping.
  (function () {
    const FILES = ['./bitcoin-ledger.html', './btc-index.js', './btc-index-data.js', './btc-citation.js', './btc-store.js', './btc-wordlists.js'];
    const FLAG = 'glossia-anthology-reloaded';
    window.addEventListener('load', () => {
      setTimeout(() => {
        // Healthy means the module rendered: the anthology has content, or
        // the reader has already dived to an entry leaf -- which empties
        // the anthology legitimately (its hero is the whole page).
        const el = document.getElementById('anthology');
        const entry = document.getElementById('entry-hero');
        if (!el || el.children.length || (entry && !entry.classList.contains('hidden'))) return;
        let retried = false;
        try { retried = !!sessionStorage.getItem(FLAG); } catch (_) {}
        if (retried) {
          const s = document.createElement('span');
          s.className = 'idx-note';
          s.textContent = 'The ledger failed to load — reload to retry.';
          el.replaceChildren(s);
          return;
        }
        try { sessionStorage.setItem(FLAG, '1'); } catch (_) {}
        Promise.allSettled(FILES.map((u) => fetch(u, { cache: 'reload' })))
          .then(() => setTimeout(() => location.reload(), 800));
      }, 2000);
    });
  })();
</script>

<style>
:root {
  --page:#08080a; --card:#0d0d10; --card-bd:#232228; --ink:#e8e4da; --ink-soft:#cfcabf;
  --accent:#c9a25f; --accent-2:#dcb877; --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;
  --input-bg:#151519; --input-bd:#2a2930;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; overscroll-behavior-y: contain; }
body { min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; line-height: 1.55; }
/* The entering half of the contents' descent into Appendix III: the shelf
   rises into place from below, matching the carousel's pace. */
@media (prefers-reduced-motion: no-preference) {
  .ledger-entrance body { animation: ledger-in .22s ease-out; }
  @keyframes ledger-in { from { transform: translateY(100vh); } }
  .ledger-entrance-fwd body { animation: ledger-in-fwd .22s ease-out; }
  @keyframes ledger-in-fwd { from { transform: translateX(100vw); } }
}
.wrap { max-width: 720px; margin: 0 auto; padding: 48px 22px 100px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Masthead chrome comes from btc-chrome.css; the compendium keeps its hero
   close beneath it. */
.masthead { margin-bottom:12px; }

/* Settings: where the chain is asked (Esplora-compatible endpoints, the
   chosen one first) -- the same stored choice the book page's Data source
   picker reads, in its own settings-panel manner. Seated here since the
   compendium took the shelf's place, and its Settings seat with it. */
.settings-menu { position:relative; }
.settings-panel { position:absolute; right:0; top:24px; z-index:10; width:min(420px, 92vw);
  background:var(--card); border:1px solid var(--card-bd); border-radius:6px; padding:16px 18px 18px;
  box-shadow:0 24px 60px -32px rgba(0,0,0,.8); text-align:left; }
.settings-panel.hidden { display:none; }
.settings-title { font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin:14px 0 8px; }
.settings-title:first-child { margin-top:0; }
.endpoint-row { display:flex; gap:8px; }
.bb-select { flex:1; min-width:0; background:var(--input-bg); border:1px solid var(--input-bd); border-radius:4px;
  color:var(--ink); font:400 12px/1.4 'IBM Plex Mono',monospace; padding:8px 8px; }
.bb-select:focus { outline:none; border-color:var(--accent); }
.ghost-btn, .save-btn { background:transparent; border:1px solid var(--input-bd); color:var(--dim); border-radius:4px;
  padding:0 10px; cursor:pointer; font:600 10.5px/1 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; }
.ghost-btn:hover:not(:disabled), .save-btn:hover { border-color:var(--accent); color:var(--accent); }
.ghost-btn:disabled { opacity:.4; cursor:default; }
.endpoint-add-row { display:flex; gap:8px; margin-top:8px; }
.endpoint-add-row.hidden { display:none; }
.endpoint-add-row input { flex:1; min-width:0; background:var(--input-bg); border:1px solid var(--input-bd); border-radius:4px;
  color:var(--ink); font:400 12px/1.4 'IBM Plex Mono',monospace; padding:8px 8px; }
.endpoint-add-row input:focus { outline:none; border-color:var(--accent); }
.settings-note { margin-top:12px; font:400 10.5px/1.6 'IBM Plex Mono',monospace; color:var(--meta); }

/* The anthology's title page: a full leaf. The eyebrow names the form, the
   serif names the anthology, and the address appears once, in the book's own
   tongue: its scriptPubKey read as Glossia prose -- the same bytes every
   paying chapter encodes, so the prose carries the address whole and the raw
   base58/bech32 form has nothing left to add. (It appears, in mono, only as
   the fallback when the engine can't be had.) Then the anthology's span: the
   volumes and the dates its chapters run. Navigation continues downward into
   the table of contents. */
.anth-hero { min-height: calc(100vh - 130px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 0 8px; }
.page-eyebrow { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); }
/* The eyebrow as a crumb: on an address leaf it points a level up, to the
   compendium's title leaf for this ledger. */
.page-eyebrow a { color:inherit; }
.anth-title { margin:16px 0 0; font:500 30px/1.25 'Newsreader',serif; color:var(--ink); }
/* A ledger has one title page. A passage leaf carries no name of its own --
   the passage is its title, set below -- so the empty heading takes no room. */
.anth-title:empty { display:none; }
/* What the title names, said plainly beneath it: the appendix leaf's title is
   its number, and this is the appendix. */
.anth-subtitle { margin-top:10px; font:400 19px/1.35 'Newsreader',serif; color:var(--dim); }
.anth-subtitle:empty { display:none; }
.anth-prose { margin:22px 0 0; max-width:560px; font:400 16px/1.7 'Newsreader',serif; font-style:italic; color:var(--ink-soft); }
.anth-prose:empty { display:none; }
/* On a passage leaf the script IS the leaf's title, so it is set at a
   title's size -- the same voice, only louder. */
.anth-prose.passage { margin-top:16px; font-size:21px; line-height:1.55; color:var(--ink); }
/* The appendix leaf says what the shelf is; that is plain prose, not a
   passage's script read aloud, so it drops the italic the prose wears. */
.anth-prose.explainer { font-style:normal; text-align:left; max-width:56ch; }
/* The scriptPubKey's notation, as the book styles it: opcode glyphs in
   accent, push marks quiet, data-type marks bold -- the grammar punctuating
   the prose that carries the opaque bytes. */
.anth-prose .op { color: var(--accent); font-style: normal; }
.anth-prose .op-name { font: 600 .62em/1 'IBM Plex Mono',monospace; letter-spacing:.04em; color: var(--dim); font-style: normal; vertical-align: .14em; white-space: nowrap; }
.anth-prose .op-push { color: var(--meta); }
.anth-prose .dt { color: var(--accent); font-style: normal; font-weight: 700; }
.anth-range { margin-top:22px; font:600 12px/1.6 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
.anth-range:empty { display:none; }
.anth-count { margin-top:8px; font:500 11px/1 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
.anth-count:empty { display:none; }
.anth-held { margin-top:8px; font:500 11px/1.6 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
.anth-held:empty { display:none; }
.anth-held .held-amt { color:var(--accent); }
.anth-down { margin-top:auto; padding-top:34px; font-size:20px; color:var(--dim); text-decoration:none; }
.anth-down:hover { color:var(--accent); text-decoration:none; }

/* The ledger's balance, headlining its title leaf -- the shelf row's figure,
   with a whole leaf to breathe on. Quiet pending style while unsettled or
   last-known; tappable to retry when nothing was ever known. */
.anth-balance { margin-top:26px; font:500 22px/1.3 'IBM Plex Mono',monospace; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; }
.anth-balance:empty { display:none; }
.anth-balance.pending { color:var(--meta); font-weight:400; font-size:14px; }
.anth-balance.retry { cursor:pointer; }

/* The contents and index, in the shared idx-*/sp-* classes btc-index.js
   renders into: Volume and Book headers (anthology numbering, canonical
   designations riding alongside), citation rows with the reference leading
   and the chapter's net closing, full eight decimals so the column aligns on
   the point. */
.idx-vol { margin:22px 0 2px; padding-top:14px; border-top:1px solid var(--hair);
  font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); }
.idx-vol:first-of-type { margin-top:10px; padding-top:0; border-top:none; }
.idx-book { margin:12px 0 1px; padding-left:14px;
  font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--meta); }
.idx-row { display:flex; align-items:baseline; gap:16px; padding:8px 2px 8px 14px; border-bottom:1px solid var(--hair); text-decoration:none; }
.idx-row.under-book { padding-left:28px; }
.idx-row:last-child { border-bottom:none; }
.idx-ref { flex:none; font:600 13px/1.4 'IBM Plex Mono',monospace; letter-spacing:.06em; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; }
.idx-amt { flex:1; min-width:0; text-align:right; font:500 13px/1.4 'IBM Plex Mono',monospace; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.idx-row:hover .idx-ref { text-decoration:underline; color:var(--accent-2); }
.idx-row:hover .idx-amt { color:var(--ink); }
.idx-note { display:block; margin-top:12px; padding-left:14px; font:400 12px/1.5 'IBM Plex Mono',monospace; color:var(--meta); }
/* The sync state, heading whatever data this level has to show. */
.idx-note.sync-note { text-align:center; padding-left:0; margin:22px 0 0; color:var(--dim); }

.sp-eyebrow { margin:30px 0 0; font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); text-align:center; scroll-margin-top:26px; }
.sp-toc { margin-bottom:8px; }
.sp-row { display:flex; align-items:baseline; gap:16px; padding:7px 2px 7px 14px; border-bottom:1px solid var(--hair); text-decoration:none; }
.sp-row:last-child { border-bottom:none; }
.sp-label { flex:none; font:600 13px/1.4 'IBM Plex Mono',monospace; letter-spacing:.06em; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; }
.sp-count { flex:1; min-width:0; text-align:right; font:400 12px/1.4 'IBM Plex Mono',monospace; color:var(--meta); white-space:nowrap; font-variant-numeric:tabular-nums; }
.sp-amt { flex:none; }
.sp-row:hover { text-decoration:none; }
.sp-row:hover .sp-label { text-decoration:underline; color:var(--accent-2); }
.sp-row:hover .idx-amt { color:var(--ink); }
/* An anchored index book lands with breathing room under the viewport top. */
.idx-book[id] { scroll-margin-top: 18px; }
/* The record's bookkeeping columns: the citation leads (and flexes), then
   debit, credit, status -- one amount per line, since an entry is one side
   of one transaction. The heads rule the columns above the run. */
.idx-row.acct { gap:10px; }
.idx-row.acct .idx-ref { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.idx-row.acct .idx-amt { flex:none; font-size:12.5px; }
.col-deb, .col-cred { flex:none; width:100px; text-align:right; }
.col-status { flex:none; width:56px; text-align:right; font:600 9.5px/1.6 'IBM Plex Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--meta); }
.idx-status.unspent { color:var(--accent); }
/* The unsynced entry: an unreferenced line heading the record -- the
   not-yet-gathered transaction count standing where its citations will,
   retiring once the record is whole. */
.idx-row.unsynced { cursor:default; }
.idx-row.unsynced .idx-ref, .idx-row.unsynced:hover .idx-ref { color:var(--meta); text-decoration:none; }
.acct-heads { display:flex; gap:10px; align-items:baseline; padding:10px 2px 2px 14px;
  font:600 9.5px/1 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--meta); }
.acct-heads .h-ref { flex:1; }
/* The totals bar: the reader pages' foot-nav seat -- sticky at the screen
   bottom, the rule its top edge, prose scrolling behind its page-colour
   backing -- holding the column sums and the balance they net to. */
.hidden { display:none !important; }
.acct-totals { position:sticky; bottom:0; z-index:40;
  display:flex; gap:10px; align-items:baseline; margin-top:30px;
  padding:12px 2px max(12px, env(safe-area-inset-bottom)) 14px;
  border-top:1px solid var(--rule); background:var(--page); }
.acct-totals .t-bal { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.acct-totals .t-label { font:600 9.5px/1 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--meta); margin-right:6px; }
.acct-totals .t-fig { font:600 13px/1.4 'IBM Plex Mono',monospace; color:var(--accent); font-variant-numeric:tabular-nums; }
.acct-totals .idx-amt { flex:none; font-size:12.5px; color:var(--ink-soft); }
@media (max-width: 560px) {
  .acct-totals .idx-amt { font-size:11px; }
  .acct-totals .t-fig { font-size:12px; }
}
@media (max-width: 560px) {
  .idx-row.acct .idx-amt { font-size:11px; }
  .col-deb, .col-cred { width:84px; }
}
/* A ledger entry's columns: the date in quiet mono, the citation into the
   manuscript, the entry's net, and the running balance ruling the row off.
   The balance column steps aside on narrow leaves. */
.idx-row.entry { gap:12px; }
.idx-when { flex:none; width:46px; font:400 11px/1.4 'IBM Plex Mono',monospace; color:var(--meta); white-space:nowrap; font-variant-numeric:tabular-nums; }
.idx-bal { flex:none; min-width:104px; text-align:right; font:400 12px/1.4 'IBM Plex Mono',monospace; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
.idx-row.entry:hover .idx-bal { color:var(--ink-soft); }
@media (max-width: 560px) { .idx-bal { display:none; } }

/* The chain's own bookmarks: an entry (or a whole quarter) whose value has
   all moved on reads dimmed; where value still rests, full ink. */
.idx-row.spent .idx-ref { color:var(--meta); }
.idx-row.spent .idx-amt { color:var(--meta); }
.idx-row.spent .idx-bal { color:var(--meta); }
.idx-row.spent:hover .idx-ref { color:var(--dim); }
.idx-row.spent:hover .idx-amt { color:var(--dim); }
.sp-row.spent .sp-label { color:var(--meta); }
.sp-row.spent:hover .sp-label { color:var(--dim); }

/* Keeping an unkept ledger: the shelf affordance, in the Install button's
   quiet outline manner. On the ledger's own title leaf -- curated ledgers
   (already shelved) carry no button. */
.anth-keep { display:none; margin-top:22px; background:transparent; border:1px solid var(--input-bd); color:var(--dim);
  border-radius:4px; padding:6px 14px; cursor:pointer; font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.08em; text-transform:uppercase;
  transition:border-color .15s ease, color .15s ease; }
.anth-keep.show { display:inline-block; }
.anth-keep:hover { border-color:var(--accent); color:var(--accent); }
.anth-keep.kept { border-color:var(--accent); color:var(--accent); }
.anth-keep .keep-rib { display:inline-block; width:8px; height:11px; margin-right:8px; vertical-align:-1px; }
.anth-keep .keep-rib svg { display:block; width:100%; height:100%; }
/* Naming a ledger on the way to the shelf: the settings panel's manner --
   the same field and the same two buttons, since it asks the same kind of
   question. Wraps on a narrow leaf rather than squeezing the field. */
.keep-title { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; max-width:440px; }
.keep-title.hidden { display:none; }
.keep-title input { flex:1 1 200px; min-width:0; background:var(--input-bg); border:1px solid var(--input-bd); border-radius:4px;
  color:var(--ink); font:400 12px/1.4 'IBM Plex Mono',monospace; padding:8px; }
.keep-title input:focus { outline:none; border-color:var(--accent); }
/* In the settings panel these buttons stretch to the height of the field
   beside them; on their own row they have to stand their own height. */
.keep-title-row { display:flex; gap:8px; }
.keep-title-row button { padding:8px 12px; }
.keep-title .save-btn:disabled { opacity:.4; cursor:default; border-color:var(--input-bd); color:var(--dim); }
/* The kept mark on a title leaf: the contents' ribbon, beside the name. */
.anth-title .toc-bm { width:12px; height:16px; margin-right:12px; vertical-align:baseline; }
/* The β sigil is a mark, not a letter: exempt from the headers' small caps. */
.no-tt { text-transform: none; }

/* The entry leaf: one transaction of the record, read as its own page. The
   net amount headlines in the record's own mono; beneath it the date, then
   the entry's particulars ruled like a small account card -- the citation
   into the manuscript (the one door to the book), the running balance where
   the map is whole, the coin's status, and the entry's place in the record. */
/* The passage's citation as the leaf's eyebrow -- the page-eyebrow manner
   the compendium's other leaves open with, carrying βoβ and the full
   reference: the handle a passage is quoted by (social media included),
   and the door back into the reader -- a tap opens the passage in the
   manuscript itself. No text-transform: uppercasing would turn the β
   sigils into capital Betas, which read as plain Bs. */
.entry-cite { font:600 11px/1.6 'IBM Plex Mono',monospace; letter-spacing:.3em; text-transform:none;
  color:var(--accent); text-align:center; font-variant-numeric:tabular-nums; }
.entry-cite:empty { display:none; }
.entry-cite:hover { color:var(--accent-2); text-decoration:none; }
/* The passage's title: the transaction's own name in the book's tongue --
   its txid as Glossia prose, the italic serif voice every hash speaks in. */
.entry-title { margin:14px 0 0; max-width:560px; font:italic 400 17px/1.65 'Newsreader',serif; font-weight:400; color:var(--ink-soft); }
.entry-amt { margin-top:16px; font:500 20px/1.25 'IBM Plex Mono',monospace; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums; }
.entry-amt.credit { color:var(--accent); }
/* The section, whole, in the reader's own manuscript layout -- the book
   page's classes, metrics and grid verbatim (chapter-body type, the
   [left margin | body | right margin] tx-flow grid, the version note in
   the margin, sequence marks, witness footnotes with each witness-only
   input's citation beside its entry, forward citations, the drop cap),
   scoped under this leaf --
   so a passage here renders exactly as its § does in the reader. The one
   addition beyond the title's txid prose: the referenced txo carries the
   accent rule (.hit), so the quoted line reads in context. */
.entry-section { margin-top:34px; width:100%; text-align:left;
  font-family:'Newsreader',serif; font-size:19px; line-height:1.75; color:var(--ink-soft); font-variant-numeric:oldstyle-nums; }
.entry-section:empty { display:none; }
.entry-section .tx-wrap { position:relative; margin:0 0 2em; }
.entry-section .tx-flow { display:grid; grid-template-columns:[left] 6.5em [body] minmax(0,1fr) [right] 7em; column-gap:1.3em; align-items:start; }
.entry-section .tx-inputs { grid-column:left / right; grid-row:1; display:grid; grid-template-columns:subgrid; column-gap:1.3em; align-items:start; }
.entry-section .tx-in-cite { grid-column:1; text-align:right; padding-top:.34em; font:500 12px/1.5 'IBM Plex Mono',monospace; color:var(--dim); word-break:break-word; }
.entry-section .tx-in-cite-group { grid-column:1; }
.entry-section .tx-in-cite-group > .tx-in-cite + .tx-in-cite { margin-top:.5em; }
.entry-section .tx-in-cite.resolving { color:var(--meta); }
.entry-section .tx-in-cite.cite-unresolved { color:var(--meta); font-style:italic; }
.entry-section .tx-in-cite.tx-version { color:var(--meta); letter-spacing:.03em; }
.entry-section .cite-section-link { color:var(--accent); text-decoration:none; }
.entry-section .cite-section-link:hover { color:var(--accent-2); text-decoration:underline; }
.entry-section .cite-amount { margin-top:.1em; text-align:right; font:italic 400 12px/1.3 'Newsreader',serif; color:var(--meta); font-variant-numeric:tabular-nums; }
.entry-section .fwd-cite { margin-top:.1em; font:500 12px/1.3 'IBM Plex Mono',monospace; color:var(--dim); }
.entry-section .tx-in-script { grid-column:2; min-width:0; }
.entry-section .tx-margin-cites { grid-column:left; grid-row:2; align-self:start; }
.entry-section .tx-outputs { grid-column:body / -1; grid-row:2;
  display:grid; grid-template-columns:minmax(0,1fr) 7em; grid-template-columns:subgrid; column-gap:1.3em; align-items:start; }
.entry-section .tx-out-script { grid-column:1; min-width:0; }
.entry-section .tx-out-value { grid-column:2; text-align:right; font-variant-numeric:tabular-nums; }
/* The closing balance line, mirroring the book: Σ inputs left, − fee
   between, Σ outputs right -- the geometry is the equation. */
.entry-section .tx-totals { grid-column:left / -1; grid-row:3; display:flex; justify-content:space-between; align-items:baseline; gap:1em; margin-top:.35em; font:italic 400 13.5px/1.4 'Newsreader',serif; color:var(--dim); font-variant-numeric:tabular-nums; }
.entry-section .tx-totals .t-fee { color:var(--meta); }
.entry-section .tx-locktime { grid-column:left / -1; grid-row:4; text-align:center; font-style:normal; }
.entry-section .tx-note { font:italic 400 13.5px/1.4 'Newsreader',serif; color:var(--dim); }
.entry-section .tx-seq { font-style:normal; color:var(--meta); }
.entry-section .tx-seq-rbf { color:var(--accent-2); }
.entry-section .tx-seq-block, .entry-section .tx-seq-time { color:var(--dim); font-variant-numeric:normal; }
.entry-section .tx-line { margin:0 0 .55em; }
.entry-section .tx-line.tx-body-lead::first-letter {
  font-size:3.4em; float:left; line-height:.82; padding:.04em .07em 0 0;
  font-weight:500; color:var(--accent); }
/* The book's script notation, wherever the ledger prints it. */
.entry-section .op { color: var(--accent); font-style: normal; }
.entry-section .op-name { font: 600 .62em/1 'IBM Plex Mono',monospace; letter-spacing:.04em; color: var(--dim); font-style: normal; vertical-align: .14em; white-space: nowrap; }
.entry-section .op-push { color: var(--meta); }
.entry-section .dt { color: var(--accent); font-style: normal; font-weight: 700; }
.entry-section .wit-sep, .entry-section .wit-empty { color:var(--meta); font-style:normal; }
.entry-section .glossia-lazy { color:var(--dim); }
.entry-section .tx-ascii { margin:0 0 .55em; padding:.12em 0 .12em 1.05em;
  border-left:2px solid var(--accent); border-radius:1px;
  font:italic 400 17.5px/1.6 'Newsreader',serif; color:var(--ink-soft); }
.entry-section .tab { display:inline-block; width:4ch; }
.entry-section .tx-witness-ref { font:500 .62em/1 'IBM Plex Mono',monospace; color:var(--accent); vertical-align:super; text-decoration:none; margin-left:.12em; }
.entry-section .tx-witness-ref:hover { text-decoration:underline; }
/* Mirrors the book's #ch-footnotes grid: a witness-only input's citation
   follows its witness down and takes the left cell of its footnote's row,
   paired by sparse auto-placement; entries for inputs that kept a body row
   leave the cell empty. */
.entry-section .chapter-footnotes { margin-top:48px; padding-top:24px; border-top:1px solid var(--rule);
  display:grid; grid-template-columns:[left] 6.5em [body] minmax(0,1fr); column-gap:1.3em; align-items:start; }
.entry-section .chapter-footnotes .footnote-entry { grid-column:2; }
/* The reference and its amount set right against the gutter, flush to the
   witness they cite -- the book's rule; the portrait collapse restacks them
   (see the media block below). */
.entry-section .chapter-footnotes .tx-in-cite { padding-top:0; text-align:right; }
.entry-section .chapter-footnotes .cite-amount { text-align:right; }
/* 11px/1.3 vs the 19px/1.75 body is the BIP141 discount set in type: 4x the
   character density, a quarter of the space per letter -- see the book page's
   .footnote-entry comment for the arithmetic. */
.entry-section .footnote-entry { margin:0 0 1.1em; font:italic 400 11px/1.3 'Newsreader',serif; color:var(--dim); }
.entry-section .footnote-entry:target { color:var(--ink-soft); }
.entry-section .footnote-mark { font:500 8px/1 'IBM Plex Mono',monospace; color:var(--accent); margin-right:.5em; font-style:normal; vertical-align:.35em; }
/* The one mark the reader doesn't draw: the txo this entry references --
   the accent rule beside it, and its prose set bold: the pushed bytes of
   this scriptPubKey are the address itself in the book's tongue, so the
   line the entry is about stands out from the page's other prose. The
   opcode glyphs keep their ordinary weight (the reset below); the small
   mono OP_* and data marks carry their own weights already. */
.entry-section .tx-out-script.hit { border-left:2px solid var(--accent); padding-left:.62em; margin-left:calc(-.62em - 2px); border-radius:1px; }
.entry-section .tx-out-script.hit .tx-line { font-weight:600; }
.entry-section .tx-out-script.hit .op { font-weight:400; }
.entry-section .tx-out-value.hit { color:var(--accent); }
@media (max-width: 560px) {
  /* The reader's own collapse: every band one column, citations leading
     their input, amounts following their output. */
  .entry-section .tx-flow { grid-template-columns:1fr; }
  .entry-section .tx-inputs, .entry-section .tx-margin-cites, .entry-section .tx-outputs, .entry-section .tx-locktime { grid-column:1; grid-row:auto; display:block; }
  /* The balance line keeps its three stations even collapsed (the book's rule). */
  .entry-section .tx-totals { grid-column:1; grid-row:auto; }
  .entry-section .tx-in-cite, .entry-section .cite-amount { text-align:left; margin:0 0 .2em; }
  /* The footnotes restack, the book's way: the citation leads its witness
     as a full-width block, and the index hangs in a fixed indent every
     wrapped line clears. */
  .entry-section .chapter-footnotes { display:block; }
  .entry-section .chapter-footnotes .tx-in-cite { text-align:left; margin:0 0 .2em; }
  .entry-section .chapter-footnotes .cite-amount { text-align:left; }
  .entry-section .chapter-footnotes .footnote-entry { padding-left:16px; text-indent:-16px; }
  .entry-section .chapter-footnotes .footnote-mark { display:inline-block; width:16px; margin-right:0; text-indent:0; }
  /* Output amounts keep the ledger's right edge even collapsed (the book's rule). */
  .entry-section .tx-out-value { margin:0 0 .55em; }
  .entry-section .tx-locktime { margin:0 0 .55em; }
  .entry-section .tx-line.tx-body-lead { padding-top:.8em; }
}
.entry-card { margin-top:34px; width:min(440px, 100%); text-align:left; border-top:1px solid var(--rule); }
.entry-card .e-row { display:flex; align-items:baseline; justify-content:space-between; gap:16px; padding:10px 2px; border-bottom:1px solid var(--hair); }
.entry-card .e-k { flex:none; font:600 10px/1.6 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--meta); }
.entry-card .e-v { flex:1; min-width:0; text-align:right; font:500 13px/1.5 'IBM Plex Mono',monospace; color:var(--ink-soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.entry-card .e-v.unspent { color:var(--accent); }
.entry-note { margin-top:20px; font:400 11px/1.6 'IBM Plex Mono',monospace; color:var(--meta); }
.entry-note:empty { display:none; }

/* The carousel, as the book turns its pages: the slide carries the whole
   leaf sideways -- or, at entry level, upward through time -- under the
   finger; the frame clips its travel so a mid-turn leaf never widens or
   lengthens the document. */
#ledger-frame { overflow: clip; }
/* The pager under the title: this leaf's place among its level's siblings,
   with arrows for hands without a touchscreen. */
.anth-pager { margin-top:14px; display:flex; gap:10px; align-items:baseline; justify-content:center;
  font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
.anth-pager:empty { display:none; }
.anth-pager a { color:var(--dim); font-size:15px; padding:0 8px; text-decoration:none; }
.anth-pager a:hover { color:var(--accent); text-decoration:none; }
.anth-pager a.off { opacity:.25; pointer-events:none; }
.anth-pager a.word { font-size:11px; letter-spacing:.14em; }


/* A reader's bookmarked reference, inline in the contents beneath its book:
   the ribbon it flies in the book, its title in the book's serif, its
   remaining reference on the right. */
.sp-bm { display:flex; align-items:baseline; gap:16px; padding:6px 2px 6px 30px; border-bottom:1px solid var(--hair); text-decoration:none; }
.sp-bm-title { flex:1; min-width:0; font:500 14.5px/1.35 'Newsreader',serif; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sp-bm-ref { flex:none; font:600 12px/1.4 'IBM Plex Mono',monospace; letter-spacing:.06em; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; }
.sp-bm:hover { text-decoration:none; }
.sp-bm:hover .sp-bm-title { color:var(--ink); }
.sp-bm:hover .sp-bm-ref { text-decoration:underline; color:var(--accent-2); }
.toc-bm { display:inline-block; width:9px; height:12px; margin-right:8px; color:var(--accent); vertical-align:baseline; }
.toc-bm svg { display:block; width:100%; height:100%; }

<body>
<div class="wrap">
  <div class="masthead">
    <span class="title">The <span class="beta">β</span>ook of <span class="beta">β</span>itcoin</span>
    <span class="home"><a href="./bitcoin-book.html">Read</a> · <a href="./bitcoin-contents.html?part=ledgers">Contents</a> · <a href="./bitcoin-search.html">Search</a> · <span class="settings-menu"><a href="#" id="settings-link" role="button" aria-haspopup="dialog" aria-expanded="false">Settings</a><div id="settings-panel" class="settings-panel hidden" role="dialog" aria-label="Ledger settings">
      <div class="settings-title">Data source</div>
      <div class="endpoint-row">
        <select id="bb-select" class="bb-select" aria-label="Esplora endpoint"></select>
        <button type="button" id="bb-add" class="ghost-btn">+ Add</button>
        <button type="button" id="bb-remove" class="ghost-btn" disabled>Remove</button>
      </div>
      <div id="bb-add-row" class="endpoint-add-row hidden">
        <input type="text" id="bb-url" placeholder="https://your-esplora/api" autocomplete="off" spellcheck="false">
        <button type="button" id="bb-save" class="save-btn">Save</button>
      </div>
      <div class="settings-note">Where the ledgers ask — Esplora-compatible endpoints, the chosen one tried first; the book's reading pages share this choice. Applies from the next fetch; banked history is never refetched.</div>
    </div></span></span>
  </div>

  <div id="ledger-frame">
    <div id="ledger-slide">
      <header class="anth-hero" id="anth-hero">
        <div class="page-eyebrow" id="anth-eyebrow">Ledger</div>
        <h1 class="anth-title" id="anth-title"></h1>
        <div class="anth-subtitle" id="anth-subtitle"></div>
        <div class="anth-pager" id="anth-pager"></div>
        <p class="anth-prose" id="anth-prose"></p>
        <div class="anth-balance" id="anth-balance"></div>
        <div class="anth-range" id="anth-range"></div>
        <div class="anth-count" id="anth-count"></div>
        <div class="anth-held" id="anth-held"></div>
        <!-- The readings kept on this name, where the curated index has any
             (web/notables.yaml): a toggle in the leaf itself, opening the same
             sheet the reading page raises over a passage. A ledger's title leaf
             shows every reading its addresses carry; an address's leaf shows
             its own. -->
        <div id="anth-commentary"></div>
        <button type="button" class="anth-keep" id="anth-keep"></button>
        <!-- A ledger the reader brings is named before it is shelved: it
             becomes a row in their own contents, and a row is read by its
             title. Opens under the button on a suggested name in the block
             version's own notation; the ledger is kept on save. -->
        <div class="keep-title hidden" id="keep-title">
          <input type="text" id="keep-title-input" placeholder="Title for the contents" autocomplete="off" spellcheck="false" maxlength="80">
          <div class="keep-title-row">
            <button type="button" class="save-btn" id="keep-title-save">Keep</button>
            <button type="button" class="ghost-btn" id="keep-title-cancel">Cancel</button>
          </div>
        </div>
        <a class="anth-down" id="anth-down" href="#anth-contents" aria-label="Down into this leaf">▾</a>
      </header>

      <!-- The entry leaf's own hero: one transaction, read as a page, bare
           of the compendium's chrome (no masthead, no crumbs, no pager --
           swipes alone move through the timeline, as the reader's pages
           turn). The passage's citation is the leaf's eyebrow -- βoβ and
           the full reference, the door back into the reader. The page is
           titled by the transaction's own name in the book's tongue -- its
           txid as Glossia prose -- and beneath the entry's net the WHOLE
           section is reproduced, so the referenced txo reads in context. -->
      <header class="anth-hero hidden" id="entry-hero">
        <a class="entry-cite" id="entry-cite"></a>
        <h1 class="entry-title" id="entry-title"></h1>
        <div class="entry-amt" id="entry-amt"></div>
        <div class="entry-section" id="entry-section"></div>
        <p class="anth-prose" id="entry-prose"></p>
        <div class="entry-card" id="entry-card"></div>
        <div class="entry-note" id="entry-note"></div>
      </header>

      <div id="anthology"></div>

      <!-- The totals bar, seated the way the reader's foot nav sits: sticky
           at the screen bottom while the record scrolls, settling at its
           foot when the reader arrives. It rules the running record off at
           every moment: the column sums (the unsynced remainder included,
           so the books always add up mid-scroll) and the balance they net
           to. -->
      <div class="acct-totals hidden" id="acct-totals">
        <span class="t-bal"><span class="t-label">balance</span> <span class="t-fig" id="t-balance"></span></span>
        <span class="idx-amt col-deb" id="t-debit"></span>
        <span class="idx-amt col-cred" id="t-credit"></span>
        <span class="idx-status col-status" id="t-count"></span>

<script type="module">
import { INDEXED, isAddress, keptLedgers, saveKeptLedgers, sameAddresses, addressScriptHex, cachedLine, resolveLine,
         extendLine, renderLedger, renderRows, periods, lineNote, reconciled, ledgerSum, heldCoins, addressState, lastKnownState,
         formatBalanceBtc, formatNetBtc, chainFailureText, citeHref, sectionOf, sectionOfFetched, citePlace, passageTxid, passageEntries, txHexOf, outspendsOf, prevoutValuesOf,
         DEFAULT_ESPLORA, esploraCustom, esploraSelected, setEsploraSettings } from './btc-index.js';
import { volumeBookChapter, heightOf, toRoman, parseReference, latinRefOf } from './btc-citation.js';
import { BIP39, HP_SPELLS } from './btc-wordlists.js';
import { appendix } from './btc-contents.js';
import './btc-fontscale.js';   // the reader's type sizes: a ledger's readings are set at the size the book page's Commentary row chose
import { loadNotables, partLabel } from './btc-notables.js';
import { commentaryForAddresses, commentaryHtml, resolveCommentary } from './btc-commentary.js';

// The curated index, started at import and never waited on: a ledger's record
// is the page, and its readings are an annotation that arrives when it arrives.
const notablesReady = loadNotables();

// The Ledger is a compendium now: every ledger in one document, read the way
// the book is read, four levels deep.
//
//   The appendix leaf      the compendium's own title page: the shelf is the
//                          contents' Appendix III, and this leaf carries that
//                          name and the paragraph saying what a ledger is
//                          and why it has no reference. Nothing is listed
//                          here -- the contents lists the ledgers, and this
//                          is where the reader arrives from that list.
//                          Pulling down at the top ascends to the contents;
//                          pushing up (or ▾) descends to the ledgers; a
//                          swipe back turns to the appendix before this one,
//                          on its own page.
//   Ledger title leaves    one per ledger (curated first, then kept, then an
//                          ad-hoc ?address= query) -- title, balance, span.
//                          Horizontal swipes browse between ledgers; pushing
//                          up (or ▾) descends into the ledger's passages,
//                          pulling down at the top ascends to the appendix.
//                          A ledger has one title page, and this is it.
//   Passage leaves         a ledger is a set of scripts, not one address:
//                          organizations rotate addresses, and an xpub (when
//                          the shelf takes them) gathers every leaf of one
//                          key. So the level below a ledger is one leaf per
//                          passage, TITLED BY THE PASSAGE -- the script in
//                          the book's own prose, the same words every
//                          chapter that pays it uses -- with the address
//                          beneath it and its appearances listed below as
//                          references, newest first. The ledger's name is
//                          the eyebrow here, not a second title. Past the
//                          last passage the ledger's whole table of entries
//                          gathers every appearance in one timeline. Horizontal swipes at the hero turn
//                          between them; pulling down at the top ascends to
//                          the ledger's title leaf. A horizontal swipe OVER
//                          the record pulls in the page of the entry nearest
//                          the finger.
//   Entry leaves           one transaction of the record, read as a page,
//                          from the bank alone -- no fetch. Vertical swipes
//                          walk the address's timeline (up = older, the
//                          direction the record scrolls; gated on the next
//                          page of history at the banked frontier); a swipe
//                          right returns to the record, scrolled to the
//                          entry left off at. Left of the record there is
//                          nothing: the swipe rubber-bands. The record is
//                          the only door.

// --- Settings: where the chain is asked. Reads and writes the same stored
// endpoint choice as the book page's Data source picker; the machinery
// reads it at call time, so a change applies from the very next fetch on
// any page.
{
  const link = document.getElementById('settings-link');
  const panel = document.getElementById('settings-panel');
  const select = document.getElementById('bb-select');
  const removeBtn = document.getElementById('bb-remove');
  const addRow = document.getElementById('bb-add-row');
  const urlInput = document.getElementById('bb-url');
  const shortName = (u) => u.replace(/^https?:\/\//, '').replace(/\/api\/?$/, '');
  const rebuild = () => {
    select.replaceChildren();
    for (const u of [...DEFAULT_ESPLORA, ...esploraCustom()]) {
      const o = document.createElement('option');
      o.value = u;
      o.textContent = shortName(u) + (DEFAULT_ESPLORA.includes(u) ? '' : ' · yours');
      select.append(o);
    }
    select.value = esploraSelected();
    removeBtn.disabled = DEFAULT_ESPLORA.includes(select.value);
  };
  link.addEventListener('click', (ev) => {
    ev.preventDefault();
    const open = panel.classList.toggle('hidden');
    link.setAttribute('aria-expanded', String(!open));
    if (!open) rebuild();
  });
  select.addEventListener('change', () => {
    setEsploraSettings({ selected: DEFAULT_ESPLORA[0] === select.value ? null : select.value });
    rebuild();
  });
  removeBtn.addEventListener('click', () => {
    const u = select.value;
    setEsploraSettings({ custom: esploraCustom().filter((c) => c !== u), selected: null });
    rebuild();
  });
  document.getElementById('bb-add').addEventListener('click', () => {
    addRow.classList.toggle('hidden');
    urlInput.focus();
  });
  document.getElementById('bb-save').addEventListener('click', () => {
    const u = urlInput.value.trim().replace(/\/+$/, '');
    if (!/^https?:\/\//.test(u)) return;
    if (![...DEFAULT_ESPLORA, ...esploraCustom()].includes(u)) {
      setEsploraSettings({ custom: [...esploraCustom(), u], selected: u });
    } else {
      setEsploraSettings({ selected: u });
    }
    urlInput.value = '';
    addRow.classList.add('hidden');
    rebuild();
  });
  rebuild();
}

// ── The compendium's ledgers ───────────────────────────────────────────────
// Curated donation ledgers first, then any the reader has kept, and a
// ?address=<addr>[,<addr>…] query that matches none of them prepends a
// temporary ledger of exactly those addresses. A query that names a member
// of a shelved ledger opens that whole ledger, positioned on the address.
const q = (new URLSearchParams(location.search).get('address') || '').trim();
const norm = (s) => (isAddress(s) ? s : isAddress(s.toLowerCase()) ? s.toLowerCase() : null);
const qList = q ? q.split(',').map((s) => norm(s.trim())).filter(Boolean) : [];
// …and &page=ledger asks for the ledger those addresses belong to, at its
// own title leaf, rather than the passage one of them names -- the book's
// convention for the same choice (?block=…&page=volume|book). A named
// ledger in the table of contents is a ledger, so its row opens the title
// leaf; a searched address is a passage, so it opens the passage.
const qPage = (new URLSearchParams(location.search).get('page') || '').trim();

// A passage named in the URL: the citation itself, carried in Latin --
// v4b1c3s85o4 for volume 4, book 1, chapter 3, §85, output .4 (section and
// output optional) -- so a shared reference navigates without any txid: the
// reference IS the address of the passage, on the page as on social media.
const pQ = (new URLSearchParams(location.search).get('ref') || '').trim();
// Read and written by btc-citation.js, the one parser for the citation scheme
// -- shared with the book's own lookup, the search box, and the curated
// contents, so a reference that resolves anywhere resolves here.
const pParsed = parseReference(pQ);
const pRef = pParsed ? { height: pParsed.height, s: pParsed.section, o: pParsed.out } : null;
// The same reference, written: what an entry leaf stamps into the URL.
const latinRef = (height, s, o) => latinRefOf(height, s, o);
const untitled = (l) => l.addresses[0] + (l.addresses.length > 1 ? ` +${l.addresses.length - 1}` : '');
const kept = keptLedgers().filter((k) => !INDEXED.some((e) => sameAddresses(e.addresses, k.addresses)));
// One member address names its whole ledger (ledgerFor's rule); only a query
// matching nothing shelved joins as its own temporary ledger.
const matchesQuery = (e) => (qList.length === 1
  ? e.addresses.includes(qList[0]) : sameAddresses(e.addresses, qList));
const adhoc = qList.length && ![...INDEXED, ...kept].some(matchesQuery)
  ? [{ title: '', addresses: qList, curated: false }] : [];
const LEDGERS = [
  ...adhoc,
  ...INDEXED.map((e) => ({ ...e, curated: true })),
  ...kept.map((e) => ({ ...e, curated: false })),
].map((e) => ({ ...e, name: e.title || untitled(e) }));

// The appendix this compendium is, taken from the contents' own list so the
// leaf and the row cannot disagree about its number or its explanation. The
// appendix before it is a leaf of bitcoin-appendix.html, one swipe back.
//
// This is the one thing the page waits for the index on -- a heading has to be
// right the first time it is painted, where a reading can arrive late.
await notablesReady;
const APPENDIX = appendix();
const LEDGER_PART = APPENDIX.find((p) => p.kind === 'ledgers');
const PART_INDEX = APPENDIX.indexOf(LEDGER_PART);
const PART_LABEL = partLabel(APPENDIX, LEDGER_PART);
const PREV_PART = PART_INDEX > 0 ? APPENDIX[PART_INDEX - 1] : null;
const PREV_PART_HREF = PREV_PART
  ? `./bitcoin-appendix.html?part=${PREV_PART.kind === 'mempool' ? 'mempool' : 'consensus'}`
  : null;

// ── Where the reader stands ────────────────────────────────────────────────
//   level 'appendix': the compendium's title page (Appendix III · Ledgers)
//   level 'ledger'  : the title leaf of LEDGERS[li]
//   level 'address' : passage leaf `at` of that ledger -- one script of it
//                     (addrs.length = the merged entries leaf)
//   level 'entry'   : one entry of entryAddr's record. The current entry is
//                     named by KEY, not index: extending the record PREPENDS
//                     older entries (the array is ascending), so an index
//                     would silently drift mid-read.
let level = 'appendix';
let li = 0;
let at = 0;
let entryAddr = null;
let entryKey = null;          // { txid, sats }
let adhocEntry = null;        // a landed passage below the banked frontier, carried whole
const rememberedAt = new Map();   // li -> the address leaf a descent returns to
let landAt = null;            // { txid, sats } -- scroll the record here on return

if (qList.length) {
  const i = LEDGERS.findIndex((e) => (qList.length === 1
    ? e.addresses.includes(qList[0]) : sameAddresses(e.addresses, qList)));
  li = Math.max(0, i);
  level = qPage === 'ledger' ? 'ledger' : 'address';
  at = Math.max(0, LEDGERS[li].addresses.indexOf(qList[0]));
}

const cur = () => LEDGERS[li];
const entryKeyOf = (e) => ({ txid: e.txid, sats: e.sats });
const findEntry = (line, key) =>
  line ? line.entries.findIndex((e) => e.txid === key.txid && e.sats === key.sats) : -1;

// The URL follows the reader (replaceState -- browsing is not history), so a
// reload or a share names the ledger being read; the compendium's own top
// level is the bare page.
function syncUrl() {
  // Only the appendix leaf is nobody's ledger; every leaf below it names the
  // ledger it belongs to, and a title leaf says so with &page=ledger -- so a
  // reload, or a link shared from here, comes back to the leaf it left.
  try {
    const url = level === 'appendix' ? location.pathname
      : `${location.pathname}?address=${cur().addresses.join(',')}${level === 'ledger' ? '&page=ledger' : ''}`;
    history.replaceState(null, '', url);
  } catch (_) { /* unavailable */ }
  document.title = level === 'appendix' ? `The βook of βitcoin — ${PART_LABEL}`
    : level === 'ledger' && !qList.length ? 'The βook of βitcoin — Ledger'
    : `The βook of βitcoin — Ledger · ${cur().name}`;
}

// ── Shared leaf furniture ──────────────────────────────────────────────────
const el = document.getElementById('anthology');
el.replaceChildren();   // populated-or-recovered is the head script's signal
const hero = document.getElementById('anth-hero');
const entryHero = document.getElementById('entry-hero');
const eyebrow = document.getElementById('anth-eyebrow');
const pager = document.getElementById('anth-pager');
const balanceEl = document.getElementById('anth-balance');
const count = document.getElementById('anth-count');
const range = document.getElementById('anth-range');
const heldEl = document.getElementById('anth-held');
const keepBtn = document.getElementById('anth-keep');
const keepTitle = document.getElementById('keep-title');
const keepTitleInput = document.getElementById('keep-title-input');
const downEl = document.getElementById('anth-down');
const totalsBar = document.getElementById('acct-totals');

const readBookmarks = () => {
  try { const v = JSON.parse(localStorage.getItem('glossia-btc-bookmarks')); return Array.isArray(v) ? v : []; }
  catch { return []; }
};
const shortHex = (hex) => `${hex.slice(0, 10)}…${hex.slice(-6)}`;
const shortAddr = (a) => (a.length > 17 ? `${a.slice(0, 8)}…${a.slice(-6)}` : a);
// The reader's bookmarked passages, which the ledger hangs in its quarters
// beside the entries they fall among. A bookmark of a volume or a book (b.page)
// is a span, not a passage: it has a height, but hanging it on that block's
// quarter would cite a whole volume as though it were the chapter that opens
// it. Those live in the table of contents, at the level they name.
const bookmarks = readBookmarks()
  .filter((b) => Number.isInteger(b.height) && !b.page)
  .map((b) => ({ hex: b.hex, height: b.height, pos: b.pos ?? null, title: b.title || b.prose || shortHex(b.hex) }));

const n = (v, one, many) => `${v.toLocaleString('en-US')} ${v === 1 ? one : many}`;

const showCount = (data) => {
  if (!data || !data.entries.length) { count.textContent = ''; return; }
  const parts = [n(data.entries.length, 'entry', 'entries')];
  const years = periods(data);
  if (years) {
    const quarters = years.reduce((nq, y) => nq + y.quarters.length, 0);
    parts.push(n(quarters, 'quarter', 'quarters'), n(years.length, 'year', 'years'));
  }
  count.textContent = parts.join(' · ');
};

// The leaf's span: the volumes its chapters run, and the dates -- block
// times ride on every mapped chapter, so both ranges read straight off
// the map's first and last.
const showRange = (data) => {
  if (!data || !data.entries.length) { range.textContent = ''; return; }
  const first = data.entries[0], last = data.entries[data.entries.length - 1];
  const v1 = volumeBookChapter(first.height).volume, v2 = volumeBookChapter(last.height).volume;
  const vols = v1 === v2 ? `Volume ${toRoman(v1)}` : `Volumes ${toRoman(v1)} – ${toRoman(v2)}`;
  if (!first.time || !last.time) { range.textContent = vols; return; }
  const fmt = (s) => new Date(s * 1000).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const dates = fmt(first.time) === fmt(last.time) ? fmt(first.time) : `${fmt(first.time)} – ${fmt(last.time)}`;
  range.textContent = `${vols} · ${dates}`;
};

// The held line, and the ledger's ink: the chain's own bookmarks. The
// UTXO snapshot is trusted only when it closes the triangle -- Σ held
// equal to the balance the gate already proved against the ledger sum --
// the same discipline everywhere: no number displays until it adds up.
// (A mid-spend race simply skips the view; the next visit agrees again.)
const heldView = (data, held) => {
  if (!held || !data || held.sum !== data.balance) return null;
  heldEl.replaceChildren();
  const amt = document.createElement('span'); amt.className = 'held-amt';
  amt.textContent = formatBalanceBtc(held.sum);
  if (held.count === 0) {
    heldEl.append('nothing still held — every gift has moved on');
  } else {
    heldEl.append(amt, ` still held · ${n(held.count, 'coin', 'coins')} outstanding`);
  }
  return held.byTxid;
};

// The referenced txo's prose, rendered once per address: a txo paying an
// address carries exactly addressScriptHex(address), so every entry of the
// address quotes the same script -- render it once, reuse it across the
// timeline's pages. Null when the engine (the WASM build) can't be had;
// the leaf simply carries no prose then, as the hero carries the mono form.
const txoProseMemo = new Map();   // address -> Promise<html|null>
function txoProse(addr) {
  if (!txoProseMemo.has(addr)) {
    txoProseMemo.set(addr, (async () => {
      try {
        const hex = addressScriptHex(addr);
        if (!hex) return null;
        const [gl, p] = await Promise.all([import('./glossia-msg.js'), import('./btc-prose.js')]);
        await gl.init();
        // renderScript's HTML is safe by its own contract: opcode glyphs and
        // marks are the only markup, pushed data arrives as Glossia prose.
        return p.renderScript(hex, (h) => gl.encodeSeedPhrase(h).prose);
      } catch { return null; }
    })());
  }
  return txoProseMemo.get(addr);
}

// The whole section, composed the way the book composes it: the banked (or
// fetched-once) raw bytes, parsed and self-verified -- the txid recomputed
// from the bytes, never trusted -- and every field Glossia-encoded through
// composeTransactionFields. The title is the transaction's own name in the
// book's tongue: its txid (byte-reversed, as the book prints hashes) as
// prose. Witnesses become numbered footnotes, as the book sets them; a
// data-carrier-sized one defers to the book, exactly as the book itself
// defers them on scroll.
// Memoized per txid, a dozen deep, like the book's own fields cache.
const reverseHex = (h) => (h.match(/../g) || []).reverse().join('');
const sectionMemo = new Map();   // txid -> Promise<{fields, verified, titleProse, witHtml}|null>
const SECTION_MEMO_MAX = 12;
function sectionFor(txid) {
  if (!sectionMemo.has(txid)) {
    sectionMemo.set(txid, (async () => {
      try {
        const [gl, p, t] = await Promise.all([
          import('./glossia-msg.js'), import('./btc-prose.js'), import('./btc-tx.js')]);
        await gl.init();
        const hex = await txHexOf(txid);
        if (!hex) return null;
        const parsed = t.parseTransaction(hex);
        const verified = (await t.computeTxid(parsed.baseHex)) === txid;
        // The encodes, in yielded chunks: a giant section (an exchange
        // batch withdrawal runs to hundreds of outputs) composed in one
        // synchronous pass freezes the page for its whole duration --
        // gestures, scrolling and the timeline's gate with it. So the
        // compose is dry-run first with a recording encoder to list the
        // exact pushes it will encode (compaction, nested reveals and the
        // coinbase preamble included), each is encoded with the event
        // loop yielded to between chunks, and the real compose then reads
        // the results back as lookups. Warming a neighbour costs the same
        // work but never the page's responsiveness.
        const proseMemo = new Map();
        let slice = performance.now();
        const chunkEncode = async (hexes) => {
          for (const h of hexes) {
            if (!h || proseMemo.has(h)) continue;
            if (performance.now() - slice > 24) {
              await new Promise((r2) => setTimeout(r2, 0));
              slice = performance.now();
            }
            proseMemo.set(h, gl.encodeSeedPhrase(h, 'english', 5));
          }
        };
        const record = [];
        const recording = (h) => { record.push(h); return { prose: '', payloadWords: [] }; };
        p.composeTransactionFields(parsed, 5, null, recording);
        for (const v of parsed.vin) {   // the eager witness stacks encode too
          const items = v.witness || [];
          if (!items.length || items.every((it) => /^0*$/.test(it))) continue;
          if (items.reduce((n2, it) => n2 + it.length / 2, 0) <= 2048) {
            p.renderWitness(items, (h) => { record.push(h); return ''; });
          }
        }
        record.push(reverseHex(txid));
        await chunkEncode(record);
        const memoEnc = (h, lang, n) => proseMemo.get(h) ?? gl.encodeSeedPhrase(h, lang ?? 'english', n ?? 5);
        const enc = (h) => memoEnc(h).prose;
        const fields = p.composeTransactionFields(parsed, 5, null, memoEnc);
        const titleProse = enc(reverseHex(txid));
        // Per-input witness prose, footnote-shaped as the book shapes it:
        // null = no witness (no footnote), '∅' = an all-zero witness (the
        // coinbase reserved value, an empty stack), a string = the rendered
        // items, undefined = data-carrier-sized -- encoded lazily when its
        // footnote scrolls near, the book's own deferral, so building the
        // leaf stays cheap while nothing is ever left out.
        const witHtml = fields.inputs.map((v) => {
          if (!v.witnessHex) return null;
          if (v.witnessZero) return '∅';
          const bytes = v.witnessItems.reduce((n2, it) => n2 + it.length / 2, 0);
          return bytes <= 2048 ? p.renderWitness(v.witnessItems, enc) : undefined;
        });
        return { fields, verified, titleProse, witHtml };
      } catch { return null; }
    })());
    while (sectionMemo.size > SECTION_MEMO_MAX) sectionMemo.delete(sectionMemo.keys().next().value);
  }
  return sectionMemo.get(txid);
}

// The entry leaf reads the held snapshot too (its status line); once per
// address per visit-window is plenty for a view that changes at chain speed.
const heldMemo = new Map();   // address -> { at, p }
const HELD_TTL = 10 * 60 * 1000;
function heldFresh(addr) {
  const m = heldMemo.get(addr);
  if (m && Date.now() - m.at < HELD_TTL) return m.p;
  const p = heldCoins(addr);
  heldMemo.set(addr, { at: Date.now(), p });
  return p;
}

// Whatever this leaf knows, shown with its state. A reconciled ledger
// reads whole -- periods, entries, running balance, held marks. A ledger
// not yet whole still shows everything banked so far, headed by a note
// saying exactly how far the record has been read; only the held marks
// wait for the full triple agreement. Nothing at all yields an
// unreachable note that retries in place.
const view = (data, held) => {
  renderLedger(el, data, { bookmarks, held: heldView(data, held) });
  showCount(data);
  showRange(data);
  if (!reconciled(data)) {
    const s = document.createElement('span');
    s.className = 'idx-note sync-note';
    s.textContent = data.complete
      ? 'unreconciled — this map disagrees with the chain balance; resyncing on the next visit'
      : `${data.walked.toLocaleString('en-US')} of ${data.txCount.toLocaleString('en-US')} transactions gathered — thumbing an address’s pages reaches deeper`;
    el.prepend(s);
  }
};
const unreachable = (alive, retry) => {
  el.replaceChildren();
  totalsBar.classList.add('hidden');
  count.textContent = '';
  range.textContent = '';
  heldEl.replaceChildren();
  const s = document.createElement('span');
  s.className = 'idx-note';
  s.append(`— the chain could not be reached (${chainFailureText()}) · `);
  const a = document.createElement('a');
  a.href = '#';
  a.textContent = 'retry';
  a.addEventListener('click', (ev) => { ev.preventDefault(); if (alive()) retry(); });
  s.append(a);
  el.append(s);
