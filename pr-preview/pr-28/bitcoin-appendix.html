<title>The βook of βitcoin — Appendix</title>
<meta name="description" content="The appendices of the Glossia Bitcoin Book: the mempool read as the chapters it is about to become, and the chapters consensus has already numbered but no block has reached.">

<!-- PWA: installable, offline-capable app shell. Shares the Bitcoin book's
     gold-β manifest so every page installs as one "Bitcoin Book" app. -->
<link rel="manifest" href="./bitcoin-book.webmanifest">
<meta name="theme-color" content="#08080a">
<link rel="apple-touch-icon" href="./icons/beta-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="βook of βitcoin">
<script>
  // An appendix is back matter, and it sits at the volumes' own level: the
  // contents is above it (arriving from there is a descent, the leaf rising
  // from beneath the list), and the volumes and the other appendices are
  // beside it (arriving from those is a sideways turn, the leaf entering
  // from the side the reader pushed). The flag carries which, and is set
  // just before the navigation and consumed on first paint.
  try {
    const dir = sessionStorage.getItem('glossia-appendix-entrance');
    if (dir) {
      sessionStorage.removeItem('glossia-appendix-entrance');
      document.documentElement.classList.add(
        dir === 'fwd' ? 'appx-entrance-fwd' : dir === 'back' ? 'appx-entrance-back'
        : dir === 'drop' ? 'appx-entrance-drop' : 'appx-entrance');
    }
  } catch (_) {}

  // The ascent: a pull DOWN starting at the page's top rises from the
  // appendix back to the contents -- the inverse of the heading's descent.
  // Sideways turns walk the appendices in their numbered order, the way the
  // front matter's leaves turn: back to the appendix before this one,
  // forward to the one after.
  (function () {
    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let sy = null, sx = 0, st = 0, atTop = false, atBottom = false;
    // Filled by the module once it knows which appendix this is; a turn
    // before then simply has nowhere to go.
    window.__appxTurns = { prev: null, next: null };
    const leave = (href, transform, flag, value = '1') => {
      try { sessionStorage.setItem(flag, value); } catch (_) {}
      const go = () => { location.href = href; };
      if (REDUCED) { go(); return; }
      document.body.style.transition = 'transform .2s linear';
      document.body.style.transform = transform;
      setTimeout(go, 180);
    };
    window.__appxAscend = () => leave('./bitcoin-contents.html', 'translateY(100vh)', 'glossia-toc-entrance', '1');
    // One turn sideways, in either direction: the leaf slides off the way the
    // reader pushed it, and the neighbour enters from the other side. Each
    // destination has its own entrance to wake -- the appendix leaves, the
    // ledger compendium (Appendix III), and the book itself, whose last
    // volume lies back of Appendix I.
    window.__appxTurn = (back) => {
      const to = back ? window.__appxTurns.prev : window.__appxTurns.next;
      if (!to) return;
      const flag = to.includes('bitcoin-ledger') ? 'glossia-ledger-entrance'
        : to.includes('bitcoin-book') ? 'glossia-book-entrance'
        : 'glossia-appendix-entrance';
      leave(to, `translateX(${back ? 100 : -100}vw)`, flag, back ? 'back' : 'fwd');
    };
    document.addEventListener('touchstart', (e) => {
      sy = null;
      if (e.touches.length !== 1) return;
      sy = e.touches[0].clientY; sx = e.touches[0].clientX; st = performance.now();
      atTop = window.scrollY <= 2;
      atBottom = window.scrollY >= document.documentElement.scrollHeight - window.innerHeight - 2;
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (sy === null || e.changedTouches.length !== 1) return;
      const dy = e.changedTouches[0].clientY - sy;
      const dx = e.changedTouches[0].clientX - sx;
      const dt = performance.now() - st;
      sy = null;
      const onTitle = !window.__appxLevel || window.__appxLevel() === 'title';
      // A committed horizontal turn: quick, far enough, and mostly sideways.
      // The appendices turn between one another at their own level, which is
      // the title page's; the list below turns nowhere sideways.
      if (dt <= 600 && Math.abs(dx) >= 60 && Math.abs(dy) <= Math.abs(dx) * 0.6) {
        if (onTitle) window.__appxTurn(dx > 0);    // swiping right turns back
        return;
      }
      // A push UP from the foot of the title page descends into the list, as
      // it descends from the contents into the book.
      if (onTitle && atBottom && dt <= 600 && dy <= -70 && Math.abs(dx) <= Math.abs(dy) * 0.6) {
        window.__appxDescend();
        return;
      }
      // A pull DOWN from the top rises one level: off the list back to the
      // title page, and off the title page out to the contents.
      if (atTop && dt <= 600 && dy >= 70 && Math.abs(dx) <= dy * 0.6) {
        if (onTitle) window.__appxAscend(); else window.__appxClimb();
      }
    }, { passive: true });
  })();
</script>

<script src="./btc-chrome.js"></script>

<!-- How a list of chapters is set: headings, rows, and the pencil the unmined
     ones are written in. Shared with the table of contents. -->
<link rel="stylesheet" href="./btc-toc.css">
<style>
:root {
  --page:#08080a; --card:#0d0d10; --card-bd:#232228; --ink:#e8e4da; --ink-soft:#cfcabf;
  --accent:#c9a25f; --accent-2:#dcb877; --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;
  --input-bg:#151519; --input-bd:#2a2930;
}
* { box-sizing: border-box; }
/* overscroll-behavior keeps the browser's pull-to-refresh from swallowing
   the pull-down-at-top ascent back to the contents. */
html, body { margin: 0; overscroll-behavior-y: none; }
body { min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; line-height: 1.55; }
/* The entering half of the contents' descent into an appendix: the leaf
   rises into place from below, matching the carousel's pace. */
@media (prefers-reduced-motion: no-preference) {
  .appx-entrance body { animation: appx-in .22s ease-out; }
  @keyframes appx-in { from { transform: translateY(100vh); } }
  /* …and the entering half of a sideways turn along the volumes' line: the
     leaf arrives from the side the reader turned toward. */
  .appx-entrance-fwd body { animation: appx-in-fwd .22s ease-out; }
  @keyframes appx-in-fwd { from { transform: translateX(100vw); } }
  .appx-entrance-back body { animation: appx-in-back .22s ease-out; }
  @keyframes appx-in-back { from { transform: translateX(-100vw); } }
  /* …and the entering half of an ascent out of a draft chapter: the appendix
     drops back into place from above as the chapter sinks. */
  .appx-entrance-drop body { animation: appx-in-drop .22s ease-out; }
  @keyframes appx-in-drop { from { transform: translateY(-100vh); } }
}
.wrap { max-width: 720px; margin: 0 auto; padding: 48px 22px 100px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* The leaf's head: the appendix's number as its title, its name beneath,
   and then the paragraph saying what is gathered here and why it could not
   be gathered in reading order. Nothing stands above the title -- the ways
   out are the masthead's Contents, the pull down at the top, and the turns
   at the foot. */
.page-head { text-align:center; padding:8px 0 26px; margin-bottom:14px; border-bottom:1px solid var(--rule); }
.appx-title { margin:0; font:300 clamp(28px,7vw,40px)/1.15 'Newsreader',serif; color:var(--ink); letter-spacing:-.01em; }
.appx-subtitle { margin-top:10px; font:400 19px/1.35 'Newsreader',serif; color:var(--dim); }
/* The crumb up, on the leaf below the appendix's own title page. */
.appx-up { display:inline-block; margin-bottom:16px; font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:.18em; text-transform:uppercase; color:var(--meta); }
.appx-up:hover { color:var(--accent); }
/* The descent, as the book's leaves wear it: one mark, centred, at the foot
   of the title page. */
.appx-down { display:block; margin:34px auto 0; width:2em; text-align:center; font-size:20px; line-height:1; color:var(--dim); }
.appx-down:hover { color:var(--accent); text-decoration:none; }
.hidden { display:none !important; }
.appx-note { max-width:56ch; margin:22px auto 30px; font:400 15px/1.7 'Newsreader',serif; color:var(--ink-soft); text-align:left; }

/* The rows themselves are btc-toc.css's, so a projected chapter reads the
   same here as it does in the contents. What this leaf adds is room for each
   entry's own note beneath it -- in the contents that note is a hover title;
   here, where there is a page for it, it is set as prose. */
.appx-row-note { margin:0; padding:6px 2px 13px 32px; max-width:60ch; font:400 12.5px/1.65 'Public Sans',sans-serif; color:var(--meta); }
/* The rule belongs under the note, not between a row and its own note: an
   entry and what is said about it are one entry. */
.toc-entry:has(+ .appx-row-note) { border-bottom:none; padding-bottom:2px; }
.appx-row-note { border-bottom:1px solid var(--hair); }
.appx-empty { padding:24px 2px; font:400 14px/1.7 'Newsreader',serif; color:var(--dim); }

/* The other appendices, at the foot: the leaf's own turns, spelled out for
   hands that are not swiping. */
.appx-turns { display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:44px; padding-top:18px; border-top:1px solid var(--rule);
  font:600 10px/1.5 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; }
.appx-turns a { color:var(--meta); }
.appx-turns a:hover { color:var(--accent); }
</style>
<body>
<div class="wrap">
  <div class="masthead">
    <span class="title">The <span class="beta">β</span>ook of <span class="beta">β</span>itcoin</span>
    <span class="home"><a href="./bitcoin-contents.html">Contents</a> · <a href="./bitcoin-book.html">Read</a> · <a href="./bitcoin-ledger.html">Ledger</a> · <a href="./bitcoin-search.html">Search</a></span>
  </div>

  <header class="page-head">
    <a class="appx-up hidden" id="appx-up" href="#">▴</a>
    <h1 class="appx-title" id="appx-title"></h1>
    <div class="appx-subtitle" id="appx-subtitle"></div>
  </header>
  <p class="appx-note" id="appx-note"></p>

  <div id="appx-body"></div>

  <a class="appx-down" id="appx-down" href="#" aria-label="Down into the appendix">▾</a>
  <nav class="appx-turns" id="appx-turns"></nav>
</div>

<script type="module">
import { APPENDIX, entryHref } from './btc-contents.js';
import { chainTip } from './btc-mempool.js';
import { toRoman, expectedReference, volumeBookChapter, heightOf } from './btc-citation.js';

// ── One appendix, given a leaf of its own ─────────────────────────────────
// The contents lists what each appendix holds; this is where an appendix
// says what it is. Which one is named by ?part=: the queue, or the chapters
// consensus has numbered ahead of the chain. The third appendix, the
// ledgers, has a leaf already -- the Ledger compendium -- and the contents
// points straight at it, so it is only ever a neighbour here.
const PARTS = { mempool: 'mempool', future: 'entries' };
const wanted = new URLSearchParams(location.search).get('part');
const kind = PARTS[wanted] || 'mempool';
const part = APPENDIX.find((p) => p.kind === kind) || APPENDIX[0];
const index = APPENDIX.indexOf(part);

const $ = (id) => document.getElementById(id);
const numeral = (i) => toRoman(i + 1);
const label = (p) => `Appendix ${numeral(APPENDIX.indexOf(p))} · ${p.title}`;
const hrefFor = (p) => p.kind === 'ledgers'
  ? './bitcoin-ledger.html'
  : `./bitcoin-appendix.html?part=${p.kind === 'mempool' ? 'mempool' : 'future'}`;

// Two leaves, as a volume has: the appendix's own title page, and beneath it
// what it gathers. The title page carries the name and the explanation and
// nothing else -- a title page is not a list -- and a push up (or ▾) descends
// to the list itself, which a pull down at its top returns from. ?page=list
// names the lower leaf, the way ?page=volume|book names the book's.
// Appendix I has no list of its own to descend into: what lies below it is
// the queue's first chapter -- the very block a reader reaches by swiping
// forward off the chain tip -- read in the book like any other, marked □.
// From there the queue is walked chapter by chapter, and the ascent from any
// of them lands back on this leaf. (The mempool's own equivalent of a book,
// the level between, is still to be written.) Appendix II does have a list,
// so it keeps its lower leaf here.
const HAS_LIST = kind !== 'mempool';
let level = HAS_LIST && new URLSearchParams(location.search).get('page') === 'list' ? 'list' : 'title';
// Appendix I's descent, once the chain says where the queue begins.
let firstDraft = null;
if (!HAS_LIST) {
  chainTip().then((tip) => {
    if (tip == null) return;
    firstDraft = `./bitcoin-book.html?block=${tip + 1}`;
    $('appx-down').classList.remove('hidden');
  }).catch(() => { /* no tip: nothing below to open */ });
}
function descend() {
  if (HAS_LIST) { turnLevel('list'); return; }
  if (!firstDraft) return;
  // A descent, so the chapter rises from below as this leaf slides up.
  try { sessionStorage.setItem('glossia-book-entrance', '1'); } catch (_) {}
  const go = () => { location.href = firstDraft; };
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { go(); return; }
  document.body.style.transition = 'transform .2s linear';
  document.body.style.transform = 'translateY(-100vh)';
  setTimeout(go, 180);
}

function syncUrl() {
  const q = `?part=${wanted === 'future' ? 'future' : 'mempool'}${level === 'list' ? '&page=list' : ''}`;
  try { history.replaceState(null, '', location.pathname + q); } catch (_) { /* unavailable */ }
  document.title = level === 'list'
    ? `The βook of βitcoin — ${part.list || part.title}`
    : `The βook of βitcoin — ${label(part)}`;
}

function renderLevel() {
  const onList = level === 'list';
  $('appx-up').classList.toggle('hidden', !onList);
  $('appx-up').textContent = `▴ Appendix ${numeral(index)}`;
  $('appx-title').textContent = onList ? (part.list || part.title) : `Appendix ${numeral(index)}`;
  $('appx-subtitle').textContent = onList ? '' : part.title;
  $('appx-note').textContent = onList ? '' : (part.note || '');
  $('appx-note').classList.toggle('hidden', onList);
  $('appx-body').classList.toggle('hidden', !onList);
  $('appx-down').classList.toggle('hidden', onList || (!HAS_LIST && !firstDraft));
  $('appx-turns').classList.toggle('hidden', onList);
  syncUrl();
  if (onList) fill();
}

// The turn between the two, played as the book plays a descent: the leaf
// being left slides away, and the one arriving comes in from the other side.
let turning = false;
function turnLevel(to) {
  if (turning || to === level) return;
  const down = to === 'list';
  const wrap = document.querySelector('.wrap');
  const finish = () => { level = to; renderLevel(); window.scrollTo({ top: 0, behavior: 'instant' }); };
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return; }
  turning = true;
  wrap.style.transition = 'transform .18s linear';
  wrap.style.transform = `translateY(${down ? -100 : 100}vh)`;
  setTimeout(() => {
    finish();
    wrap.style.transition = 'none';
    wrap.style.transform = `translateY(${down ? 100 : -100}vh)`;
    requestAnimationFrame(() => {
      wrap.style.transition = 'transform .18s ease-out';
      wrap.style.transform = '';
      setTimeout(() => { turning = false; }, 180);
    });
  }, 170);
}
window.__appxLevel = () => level;
window.__appxDescend = () => descend();
window.__appxClimb = () => turnLevel('title');
$('appx-down').addEventListener('click', (ev) => { ev.preventDefault(); descend(); });
$('appx-up').addEventListener('click', (ev) => { ev.preventDefault(); turnLevel('title'); });

// The neighbours, in the appendices' numbered order -- named at the foot and
// handed to the gesture layer, so a swipe and a tap turn to the same leaf.
// The appendices sit at the volumes' own level, continuing that line, so
// what lies back of the first of them is the body's last volume (below).
const prev = APPENDIX[index - 1] || null;
const next = APPENDIX[index + 1] || null;
window.__appxTurns = { prev: prev && hrefFor(prev), next: next && hrefFor(next) };
const turns = $('appx-turns');
function turnLink(href, text, back) {
  const a = document.createElement('a');
  a.href = href;
  a.textContent = text;
  if (!back) a.style.marginLeft = 'auto';
  // Tapping a neighbour plays the same sideways turn the swipe plays, so
  // the two agree about which way the leaves lie.
  a.addEventListener('click', (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button !== 0) return;
    ev.preventDefault();
    window.__appxTurn(back);
  });
  turns.append(a);
  return a;
}
if (prev) turnLink(hrefFor(prev), `‹ ${label(prev)}`, true);
if (next) turnLink(hrefFor(next), `${label(next)} ›`, false);

// Appendix I's backward turn leaves the appendices for the body: the last
// volume's own leaf, which is the page this one continues from. Which volume
// is last is a question for the chain, so the turn is wired once the tip
// answers -- until then a backward swipe simply has nowhere to go.
if (!prev) {
  chainTip().then((tip) => {
    if (tip == null) return;
    const volume = volumeBookChapter(tip).volume;
    const href = `./bitcoin-book.html?block=${heightOf(volume, 1, 1)}&page=volume`;
    window.__appxTurns.prev = href;
    const a = turnLink(href, `‹ Volume ${toRoman(volume)}`, true);
    turns.prepend(a);   // back is the left-hand turn, whenever it arrives
  }).catch(() => { /* no tip, no way back but the contents */ });
}

// ── Appendix II: the chapters already numbered ────────────────────────────
// Each row as the contents sets it -- title, then the whole expected
// reference, marked □ -- with the note the contents can only offer on hover
// set out beneath it as prose. The rows link into the book, which answers an
// unmined height with the date it is due instead of a page.
function showChapters() {
  const body = $('appx-body');
  const frag = document.createDocumentFragment();
  for (const e of part.entries) {
    const height = Number(e.id);
    const row = document.createElement('a');
    row.className = 'toc-entry under-book projected';
    row.href = entryHref(e.id);
    const t = document.createElement('span');
    t.className = 'toc-title';
    t.textContent = e.title;
    const r = document.createElement('span');
    r.className = 'toc-ref';
    r.textContent = expectedReference(height);
    r.title = `expected — block ${height.toLocaleString()} has not been mined, so its chapter carries □ rather than ■`;
    row.append(t, r);
    frag.append(row);
    if (e.note) {
      const n = document.createElement('p');
      n.className = 'appx-row-note';
      n.textContent = e.note;
      frag.append(n);
    }
  }
  body.replaceChildren(frag);
}

// The list is set when the reader descends to it, not before: a title page
// asks nothing of the network, and Appendix II's list is offline anyway --
// every reference in it is computed from a height.
let filled = false;
function fill() {
  if (!filled) { filled = true; showChapters(); }
}
renderLevel();
</script>
</body>
</html>
