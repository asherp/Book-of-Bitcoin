<script>
  // Arriving by the book page's pull-down-above-the-volume gesture: finish
  // that carousel turn here, sliding the contents in from the top. The flag
  // is set just before the navigation and consumed on first paint.
  // The flag's value carries the turn's direction: 'up' is the cover being
  // lifted away beneath us (the front page's swipe-up), so the contents
  // enter from below; anything else is the classic ascent, entering from
  // the top.
  try {
    const entrance = sessionStorage.getItem('glossia-toc-entrance');
    if (entrance) {
      sessionStorage.removeItem('glossia-toc-entrance');
      document.documentElement.classList.add(entrance === 'up' ? 'toc-entrance-up' : 'toc-entrance');
    }
  } catch (_) {}

  // The descend gesture: a push UP starting at the page's bottom drops from
  // the contents into Volume I's leaf -- the inverse of the book page's
  // pull-down-above-the-volume. The contents slide up and away; the book
  // page finishes the turn, entering from below (glossia-book-entrance).
  (function () {
    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let sy = null, sx = 0, st = 0, atBottom = false, atTop = false;
    const go = () => {
      // Descend into the volume the reader last ascended from (recorded by
      // the book page's trail memory); a fresh visit opens Volume I.
      let block = '0';
      try { block = sessionStorage.getItem('glossia-toc-descend') || '0'; } catch (_) {}
      try { sessionStorage.setItem('glossia-book-entrance', '1'); } catch (_) {}
      location.href = './bitcoin-book.html?block=' + encodeURIComponent(block) + '&page=volume';
    };
    document.addEventListener('touchstart', (e) => {
      sy = null;
      if (e.touches.length !== 1) return;
      sy = e.touches[0].clientY; sx = e.touches[0].clientX; st = performance.now();
      atBottom = window.scrollY >= document.documentElement.scrollHeight - window.innerHeight - 2;
      atTop = window.scrollY <= 2;
    }, { passive: true });
    // The contents sits inside the front matter on the horizontal axis, in the
    // standard order: title, terms, CONTENTS, preface, sigla. So both
    // sideways turns lead to a front-matter leaf -- back to the terms,
    // forward to the preface (the sigla follow it on that page). Purely horizontal: the vertical axis below is
    // untouched, and the contents remains the one leaf above the volumes, so
    // an ascent from Volume I still lands here.
    const goFront = (leaf, dir) => {
      try { sessionStorage.setItem('glossia-front-entrance', dir); } catch (_) {}
      location.href = './bitcoin-front.html?leaf=' + leaf;
    };
    document.addEventListener('touchend', (e) => {
      if (sy === null || e.changedTouches.length !== 1) return;
      const dy = e.changedTouches[0].clientY - sy;
      const dx = e.changedTouches[0].clientX - sx;
      const dt = performance.now() - st;
      sy = null;
      // A committed horizontal turn: quick, far enough, and mostly sideways.
      if (dt <= 600 && Math.abs(dx) >= 60 && Math.abs(dy) <= Math.abs(dx) * 0.6) {
        const back = dx > 0;                       // swiping right turns back
        const leaf = back ? 'terms' : 'preface';
        const dir = back ? 'back' : 'fwd';
        if (REDUCED) { goFront(leaf, dir); return; }
        document.body.style.transition = 'transform .2s linear';
        document.body.style.transform = `translateX(${back ? 100 : -100}vw)`;
        setTimeout(() => goFront(leaf, dir), 180);
        return;
      }
      // A pull DOWN starting at the page's top rises from the contents back
      // to the cover -- the inverse of the cover's lift-away: the contents
      // sink, and the cover drops back into place from above.
      if (atTop && dt <= 600 && dy >= 70 && Math.abs(dx) <= dy * 0.6) {
        try { sessionStorage.setItem('glossia-front-entrance', 'drop'); } catch (_) {}
        const goCover = () => { location.href = './bitcoin-front.html'; };
        if (REDUCED) { goCover(); return; }
        document.body.style.transition = 'transform .2s linear';
        document.body.style.transform = 'translateY(100vh)';
        setTimeout(goCover, 180);
        return;
      }
      if (!atBottom || dt > 600 || dy > -70 || Math.abs(dx) > Math.abs(dy) * 0.6) return;
      if (REDUCED) { go(); return; }
      document.body.style.transition = 'transform .2s linear';
      document.body.style.transform = 'translateY(-100vh)';
      setTimeout(go, 180);
    }, { passive: true });
  })();

</script>

<style>
:root {

  --accent:#c9a25f; --accent-2:#dcb877; --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;
  --input-bg:#151519; --input-bd:#2a2930;
}
* { box-sizing: border-box; }
/* overscroll-behavior keeps the browser's pull-to-refresh from swallowing
   the pull-down-at-top turn back to the cover (the book page does the same
   for its own vertical turns). */

body { min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; line-height: 1.55; }
/* The entering half of the book page's ascend-above-the-volume turn: the

  /* …and the entering half of the cover's lift-away: the contents rise into

}

.page-head { text-align:center; padding-bottom:30px; margin-bottom:36px; border-bottom:1px solid var(--rule); }

</style>
<body>
<div class="wrap">
  <div class="masthead">
    <span class="title">The <span class="beta">β</span>ook of <span class="beta">β</span>itcoin</span>
    <span class="home"><a href="./bitcoin-front.html?leaf=preface">Preface</a> · <a href="./bitcoin-book.html">Read</a> · <a href="./bitcoin-ledger.html">Ledger</a> · <a href="./bitcoin-search.html">Search</a></span>
  </div>

  <header class="page-head">
    <div class="page-eyebrow">Table of Contents</div>
  </header>

  <div id="toc"></div>
</div>

<script type="module">
import { NOTABLE, APPENDIX, isBlockId, isRelativeBlockId, entryHref } from './btc-contents.js';
import { readQueue, buildQueue, sourceLine } from './btc-mempool.js';
import { INDEXED, keptLedgers, sameAddresses } from './btc-index.js';
import { volumeBookChapter, toRoman, expectedReference } from './btc-citation.js';
import { storeGet, storePut } from './btc-store.js';
import { seedArchive } from './btc-seed.js';

// A first visit provisions the archive with the curated passages' chain data
// (idle-time, once ever; see btc-seed.js), so this page's entries -- and the
// book pages behind them -- open like revisits.
seedArchive();

const BOOKMARKS_KEY = 'glossia-btc-bookmarks';
const readBookmarks = () => {
  try { const v = JSON.parse(localStorage.getItem(BOOKMARKS_KEY)); return Array.isArray(v) ? v : []; }
  catch { return []; }
};
const shortHex = (hex) => `${hex.slice(0, 10)}…${hex.slice(-6)}`;

// The genesis coinbase places offline -- block 0, first transaction -- so the
// book opens at I 1 1 §1 without waiting on the network.
const GENESIS_COINBASE = '4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b';

// Every entry is cited by its reference, never its raw id. A block's placement
// is known offline from its height; a transaction's is resolved the same way the
// reader resolves a citation -- a /tx/<txid>/merkle-proof gives the confirming
// block height and the transaction's index (its §section). Tried across the same
// public mirrors the book uses.
const ESPLORA_MIRRORS = ['https://blockstream.info/api', 'https://mempool.space/api'];
// A book-page entry (page: 'book') places at its book with no chapter -- the
// leaf precedes every chapter of its book in reading order.
const placeOf = (height, pos, page, vout = null) => {
  const p = volumeBookChapter(height);
  if (page === 'book') return { volume: p.volume, book: p.book, chapter: null, section: null };
  // An output rides its section's citation with its vout appended -- §1.0,
  // as the book prints it (renderCitation in bitcoin-book.html).
  return { ...p, section: pos == null ? null : pos + 1, vout: pos == null ? null : vout };
};

// The chain tip height, fetched once and reused across relative entries.
let tipHeightPromise = null;
function tipHeight() {
  if (!tipHeightPromise) tipHeightPromise = (async () => {
    for (const base of ESPLORA_MIRRORS) {
      try {
        const res = await fetch(`${base}/blocks/tip/height`);
        if (res.ok) return Number((await res.text()).trim());
      } catch { /* try the next mirror */ }
    }
    return null;
  })();
  return tipHeightPromise;
}

// An entry's placement. A block entry places from its height (with an optional
// transaction index as its §section); a negative id counts back from the chain
// tip; a transaction id resolves the same way a reader resolves a citation --
// once: a confirmed placement is immutable, so the archive (btc-store.js)
// answers every later visit offline and for free.
async function resolvePlacement({ id, index, page }) {
  if (isBlockId(id)) return placeOf(Number(id), index ?? null, page);
  if (isRelativeBlockId(id)) {
    const tip = await tipHeight();
    if (tip == null) return null;
    const height = tip + Number(id) + 1;
    return height >= 0 ? placeOf(height, index ?? null) : null;
  }
  if (id === GENESIS_COINBASE) return placeOf(0, 0);
  const kept = await storeGet('placements', id);
  if (kept) return placeOf(kept.height, kept.pos);
  for (const base of ESPLORA_MIRRORS) {
    try {
      const res = await fetch(`${base}/tx/${id}/merkle-proof`);
      if (!res.ok) continue;
      const mp = await res.json();
      storePut('placements', id, { height: mp.block_height, pos: mp.pos });
      return placeOf(mp.block_height, mp.pos);
    } catch { /* try the next mirror */ }
  }
  return null;
}

// A bookmark's placement. Newer bookmarks carry their resolved reference
// (height + section), so they place offline. Older ones store only the hex,
// which may be a block hash or a txid -- try a block lookup first (its height is
// the chapter), then a txid's merkle proof (height + section), like the book.
async function resolveBookmark(b) {
  if (Number.isInteger(b.height)) return placeOf(b.height, b.pos ?? null);
  // A legacy bookmark's hex resolves once; the archive keeps the answer
  // (whether it proved a block hash or a txid) like any other placement.
  const kept = await storeGet('placements', b.hex);
  if (kept) return placeOf(kept.height, kept.pos);
  for (const base of ESPLORA_MIRRORS) {
    try {
      const res = await fetch(`${base}/block/${b.hex}`);
      if (res.ok) {
        const height = (await res.json()).height;
        storePut('placements', b.hex, { height, pos: null });
        return placeOf(height, null);
      }
    } catch { /* try the next mirror */ }
  }
  for (const base of ESPLORA_MIRRORS) {
    try {
      const res = await fetch(`${base}/tx/${b.hex}/merkle-proof`);
      if (res.ok) {
        const mp = await res.json();
        storePut('placements', b.hex, { height: mp.block_height, pos: mp.pos });
        return placeOf(mp.block_height, mp.pos);
      }
    } catch { /* try the next mirror */ }
  }
  return null;
}

// The tail of an entry's citation -- the part its heading hasn't already named.
// Under a Book heading only the ■chapter (and a transaction's §section) remains;
// directly under a Volume, the β-marked book leads it. Spaced like the book's
// own citations (e.g. "β29 ■596", "■1 §1").
function tailRef({ book, chapter, section, vout }, underBook) {
  // A book's own leaf: under its Book heading nothing remains to cite; under
  // a bare Volume, the β mark alone names it.
  if (chapter == null) return underBook ? '' : `β${book}`;
  let s = (underBook ? [`■${chapter}`] : [`β${book}`, `■${chapter}`]).join(' ');
  if (section != null) s += ` §${section}${vout == null ? '' : `.${vout}`}`;
  return s;
}

// One contents row: the title on the left, its remaining reference on the right;
// the whole row is a link that navigates into the book. An entry whose citation
// never resolved carries a dash in place of a reference.
function entryEl(entry, underBook) {
  const row = document.createElement('a');
  row.className = 'toc-entry' + (underBook ? ' under-book' : '') + (entry.bookmark ? ' is-bookmark' : '');
  row.dataset.entryId = entry.id;   // the projected section anchors after the tip's row
  row.href = entryHref(entry.id, entry.index, entry.page, entry.vout ?? null);
  const t = document.createElement('span'); t.className = 'toc-title';
  // A reader's own bookmark flies the same ribbon it wears in the book, so it's
  // distinguishable from a curated entry even though it sits in reading order.
  if (entry.bookmark) {
    const bm = document.createElement('span'); bm.className = 'toc-bm'; bm.setAttribute('aria-label', 'your bookmark');
    bm.innerHTML = '<svg viewBox="0 0 12 16"><path fill="currentColor" d="M0 0h12v16l-6-4-6 4z"/></svg>';
    t.append(bm);
  }
  t.append(document.createTextNode(entry.title));
  const r = document.createElement('span'); r.className = 'toc-ref';
  if (entry.place) r.textContent = tailRef(entry.place, underBook);
  else { r.textContent = '—'; r.classList.add('none'); }
  row.append(t, r);
  return row;
}
function head(cls, label) { const d = document.createElement('div'); d.className = cls; d.textContent = label; return d; }

// Render the placed entries as a nested contents: a Volume part header, then a
// Book sub-header wherever two or more consecutive entries share one, so each
// row need only cite the portion of its reference its headings haven't named.
// Entries arrive in reading order (ascending height), so anything sharing a
// volume or book is already contiguous.
const toc = document.getElementById('toc');
// The projected section (the mempool, see below), rebuilt by loadProjected and
// appended as Appendix I on every render -- directly after the volumes, whose
// last row is the chain tip's.
let projectedSection = null;

// The front matter that argues or informs -- the preface and the sigla -- is
// listed here as a book's contents lists them. The title and the terms are
// not: a table of contents omits the title and copyright pages, and both of
// those sit before the contents in reading order anyway. Neither entry has a
// chain reference, so both take the dash the stylesheet already styles.
const FRONT = [
  { title: 'Preface', leaf: 'preface' },
  { title: 'Sigla — the marks, and the citation form', leaf: 'sigla' },
];
function frontEl({ title, leaf }) {
  const row = document.createElement('a');
  row.className = 'toc-entry';
  row.href = `./bitcoin-front.html?leaf=${leaf}`;
  const t = document.createElement('span');
  t.className = 'toc-title';
  t.textContent = title;
  const r = document.createElement('span');
  r.className = 'toc-ref none';
  r.textContent = '—';
  row.append(t, r);
  return row;
}

// ── The appendices: the contents' back matter ─────────────────────────────
// What belongs to the book but not to its reading order -- reading order
// being the order blocks were mined. Three of them, in the order
// btc-contents-data.js sets: the mempool (built live, below), the future
// chapters, and the ledgers. They are numbered by their position in that
// list, not by what actually renders, so a part that cannot be built -- an
// unreachable mempool -- never renumbers the ones after it.
const appendixLabel = (part) => `Appendix ${toRoman(APPENDIX.indexOf(part) + 1)} · ${part.title}`;
const MEMPOOL_PART = APPENDIX.find((p) => p.kind === 'mempool');

// Each appendix has a leaf of its own, and its heading here is the door to
// it: the queue and the future chapters are leaves of the appendix page, and
// the ledgers' leaf is the Ledger compendium, which is what a shelf of
// ledgers is. What the appendix is and why it sits outside reading order is
// said on that leaf, not here -- the contents lists, the leaf explains.
const appendixHref = (part) => part.kind === 'ledgers'
  ? './bitcoin-ledger.html'
  : `./bitcoin-appendix.html?part=${part.kind === 'mempool' ? 'mempool' : 'future'}`;
function appendixLink(part) {
  const a = document.createElement('a');
  a.className = 'appx-link';
  a.href = appendixHref(part);
  a.textContent = appendixLabel(part);
  return a;
}
function partHead(part) {
  const heading = head('toc-vol', '');
  heading.append(appendixLink(part));
  return heading;
}

// Appendix II: chapters cited in full but marked □, the expected-chapter mark
// the mempool's projections wear, since no block has earned them an ■. Every
// row still links into the book, which answers an unmined height with the
// date it is due instead of a page. Offline, like every reference computed
// from a height.
function chaptersEl(part) {
  const frag = document.createDocumentFragment();
  frag.append(partHead(part));
  for (const e of part.entries) frag.append(provisionalEl(e));
  return frag;
}

// Appendix III: the shelf of ledgers -- the curated ones, then any the reader
// keeps, which fly the same ribbon a reader's bookmark flies in the contents
// above. These rows take the dash the front matter takes, and for a plainer
// reason than an unresolved lookup: a ledger has no reference because the
// chain never writes an address. It writes the script an address stands for,
// and the ledger's chapters are discovered from that as it is read -- so
// there is nothing to cite here, only somewhere to go. The rows open the
// Ledger compendium at that ledger, the way a contents row opens the book at
// its chapter.
function ledgersEl(part) {
  const frag = document.createDocumentFragment();
  frag.append(partHead(part));
  const kept = keptLedgers().filter((k) => !INDEXED.some((e) => sameAddresses(e.addresses, k.addresses)));
  for (const l of INDEXED) frag.append(ledgerEl(l, false));
  for (const l of kept) frag.append(ledgerEl(l, true));
  return frag;
}
const shortAddr = (a) => `${a.slice(0, 6)}…${a.slice(-4)}`;
function ledgerEl(ledger, isKept) {
  const row = document.createElement('a');
  row.className = 'toc-entry under-book';
  // A row here names a ledger, so it opens the ledger -- its title leaf,
  // where the compendium's descent into the passages begins. (An address
  // searched for is a passage, and the search page opens it as one, with
  // the same query and no &page.)
  row.href = `./bitcoin-ledger.html?address=${ledger.addresses.join(',')}&page=ledger`;
  const t = document.createElement('span');
  t.className = 'toc-title';
  if (isKept) {
    const bm = document.createElement('span'); bm.className = 'toc-bm'; bm.setAttribute('aria-label', 'your ledger');
    bm.innerHTML = '<svg viewBox="0 0 12 16"><path fill="currentColor" d="M0 0h12v16l-6-4-6 4z"/></svg>';
    t.append(bm);
  }
  // A kept ledger is named by its reader before it is shelved, so a title is
  // what a row prints. Ledgers kept before that was asked of them fall back
  // to their first address, the same stand-in name the Ledger page gives
  // them -- a name in the title column, never a citation in the reference's.
  t.append(document.createTextNode(ledger.title || shortAddr(ledger.addresses[0])));
  const r = document.createElement('span');
  r.className = 'toc-ref none';
  r.textContent = '—';
  row.append(t, r);
  return row;
}

// One provisional row, dressed like a projected chapter: the title, then the
// whole expected reference -- volume and all, since no Volume heading stands
// above the appendix to have named it already.
function provisionalEl(entry) {
  const height = Number(entry.id);
  const row = document.createElement('a');
  row.className = 'toc-entry under-book projected';
  row.href = entryHref(entry.id);
  const t = document.createElement('span');
  t.className = 'toc-title';
  t.textContent = entry.title;
  if (entry.note) t.title = entry.note;
  const r = document.createElement('span');
  r.className = 'toc-ref';
  r.textContent = expectedReference(height);
  r.title = `expected — block ${height.toLocaleString()} has not been mined, so its chapter carries □ rather than ■`;
  row.append(t, r);
  return row;
}

// An appendix's heading turns the page down into its leaf, so it turns the
// way the contents' other descents do: the list slides up and away, and the
// leaf enters from below (the flag it consumes on first paint). A modified
// click, or a reader who has asked for less motion, just follows the link.
document.addEventListener('click', (ev) => {
  const link = ev.target.closest && ev.target.closest('.appx-link');
  if (!link || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button !== 0) return;
  ev.preventDefault();
  const flag = link.getAttribute('href').includes('bitcoin-ledger') ? 'glossia-ledger-entrance' : 'glossia-appendix-entrance';
  try { sessionStorage.setItem(flag, 'down'); } catch (_) {}   // a descent: the leaf rises from below
  const go = () => { location.href = link.getAttribute('href'); };
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { go(); return; }
  document.body.style.transition = 'transform .2s linear';
  document.body.style.transform = 'translateY(-100vh)';
  setTimeout(go, 180);
});

function render() {
  toc.replaceChildren();
  toc.append(head('toc-vol', 'Front matter'));
  for (const f of FRONT) toc.append(frontEl(f));
  const entries = placed();
  for (let i = 0; i < entries.length;) {
    const vol = entries[i].place.volume;
    let jv = i + 1; while (jv < entries.length && entries[jv].place.volume === vol) jv++;
    toc.append(head('toc-vol', `Volume ${toRoman(vol)}`));
    for (let k = i; k < jv;) {
      const bk = entries[k].place.book;
      let jb = k + 1; while (jb < jv && entries[jb].place.book === bk) jb++;
      if (jb - k >= 2) {
        toc.append(head('toc-book', `Book ${bk}`));   // spelled out, no β; the β sigil rides only the compact tail references
        for (let m = k; m < jb; m++) toc.append(entryEl(entries[m], true));
      } else {
        toc.append(entryEl(entries[k], false));
      }
      k = jb;
    }
    i = jv;
  }
  // The appendices, in the order the data sets them. Appendix I is the
  // mempool, and it comes first for the reason it exists: the volumes close
  // on the chain tip's row, so the queue's chapters begin on the very next
  // line and the turn from the tip to the next provisional chapter stays one
  // step down the page. Its section is built asynchronously (and skipped
  // entirely when no queue can be read), so only what exists is appended.
  for (const part of APPENDIX) {
    if (part.kind === 'mempool') { if (projectedSection) toc.append(projectedSection); }
    else if (part.kind === 'entries') toc.append(chaptersEl(part));
    else if (part.kind === 'ledgers') toc.append(ledgersEl(part));
  }
  // Entries whose citation could not be resolved fall past even the
  // appendices, under a dash -- still linked, so the book can resolve and
  // open them on the next attempt.
  const stranded = unresolved();
  if (stranded.length) {
    toc.append(head('toc-vol', 'Unresolved'));
    for (const e of stranded) toc.append(entryEl(e, false));
  }
}

// Block placements are offline, so render them at once; transaction citations
// stream in as each resolves, slotting into their volume and book in order. An
// entry whose lookup fails (placement null) drops to an "Unresolved" tail
// rather than printing its raw id.
const placements = new Map();          // NOTABLE id -> place | null (once attempted)
const bmPlacements = new Map();        // bookmark hex -> place | null (once attempted)

// A reader's bookmarks join the curated set in one list. A bookmark that is
// already a curated entry is dropped (the curated title wins) so it isn't listed
// twice.
const NOTABLE_IDS = new Set(NOTABLE.map((e) => e.id));
// A bookmark is keyed by what it names: a hash by itself, an output by its
// hash and vout (the same key bitcoin-book.html writes). A bookmarked output
// is never a curated entry, so only hash bookmarks are dropped as duplicates.
const bmKey = (b) => (b.vout == null ? b.hex : `${b.hex}:${b.vout}`);
const bookmarks = readBookmarks().filter((b) => b.vout != null || !NOTABLE_IDS.has(b.hex));

// Every entry -- curated or bookmarked -- carrying whatever placement has
// resolved so far. A bookmark reuses its stored title and flies the book's ribbon.
const entries = () => [
  ...NOTABLE.map((e) => ({ ...e, place: placements.get(e.id), tried: placements.has(e.id) })),
  ...bookmarks.map((b) => ({
    id: b.hex, index: b.pos ?? undefined, vout: b.vout ?? undefined,
    title: b.title || b.prose || shortHex(b.hex),
    bookmark: true, place: bmPlacements.get(bmKey(b)), tried: bmPlacements.has(bmKey(b)),
  })),
];

// Placed entries, sorted into reading order by resolved citation (not array
// position): a transaction's or bookmark's height is unknown offline, so it can
// only take its place once it resolves. This keeps each volume's (and book's)
// entries contiguous, which the nested render relies on.
const placed = () => entries()
  .filter((e) => e.place)
  .sort((a, b) => a.place.volume - b.place.volume || a.place.book - b.place.book
    || a.place.chapter - b.place.chapter || (a.place.section ?? 0) - (b.place.section ?? 0));
const unresolved = () => entries().filter((e) => e.tried && !e.place);

// ── Appendix I: the mempool, read as far as it extends ────────────────────
// The queue itself is read and set by btc-mempool.js, shared with the
// appendix's own page. Here it needs only its heading -- the appendix's
// name, a link to that page, and the line naming the node the queue was
// read from.
async function loadProjected() {
  const tip = await tipHeight();
  const queue = await readQueue(tip, ESPLORA_MIRRORS);
  if (!queue) return;   // nowhere to read a queue from -- the contents simply end at the tip
  const heading = head('toc-vol toc-proj-head', '');
  const label = document.createElement('span');
  label.className = 'toc-proj-label';
  label.append(appendixLink(MEMPOOL_PART));
  heading.append(label, sourceLine(queue.srcBase));
  projectedSection = buildQueue(queue, heading);
  render();
}

// Block placements (curated, and bookmarks that stored their reference) are
// offline, so render at once; everything else streams in as its lookup resolves.
for (const e of NOTABLE) if (isBlockId(e.id)) placements.set(e.id, placeOf(Number(e.id), e.index ?? null, e.page));
for (const b of bookmarks) {
  if (Number.isInteger(b.height)) bmPlacements.set(bmKey(b), placeOf(b.height, b.pos ?? null, undefined, b.vout ?? null));
}
render();
// The projected section loads alongside the citation lookups, and the queue
// keeps moving -- blocks land, replacements arrive -- so it refreshes itself
// each minute while the page is on screen.
loadProjected();
setInterval(() => { if (!document.hidden) loadProjected(); }, 60_000);
await Promise.all([
  ...NOTABLE.filter((e) => !placements.has(e.id)).map(async (e) => {
    placements.set(e.id, await resolvePlacement(e));
    render();
  }),
  ...bookmarks.filter((b) => !bmPlacements.has(bmKey(b))).map(async (b) => {
    // An output bookmark resolves through its transaction, then takes its vout.
    const place = await resolveBookmark(b);
    bmPlacements.set(bmKey(b), place && b.vout != null ? { ...place, vout: b.vout } : place);
    render();
  }),
]);
</script>
</body>
</html>
