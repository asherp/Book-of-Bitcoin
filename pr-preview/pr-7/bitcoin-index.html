<style>
:root {
  --page:#08080a; --card:#0d0d10; --card-bd:#232228; --ink:#e8e4da; --ink-soft:#cfcabf;
  --accent:#c9a25f; --accent-2:#dcb877; --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;
  --input-bg:#151519; --input-bd:#2a2930;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; line-height: 1.55; }
.wrap { max-width: 720px; margin: 0 auto; padding: 48px 22px 100px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.masthead { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:40px; }
.masthead .title { font:600 13px/1 'IBM Plex Mono',monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--ink); }
.masthead .title .beta { color:var(--accent); text-transform:none; font-family:'Newsreader','Source Serif 4',Georgia,serif; font-weight:600; font-size:1.12em; }
.masthead .home { margin-left:auto; font:500 12px/1 'IBM Plex Mono',monospace; letter-spacing:.04em; }

.page-head { text-align:center; padding-bottom:30px; margin-bottom:36px; border-bottom:1px solid var(--rule); }
.page-eyebrow { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); }

/* An index entry: the name on its own line -- the title in the book's serif,
   the address itself beneath in mono -- then the run of citations trailing it,
   comma-separated and wrapping like page numbers after a name. */
.idx-entry { padding:16px 2px 17px; border-bottom:1px solid var(--hair); }
.idx-title { font:500 17px/1.35 'Newsreader',serif; color:var(--ink-soft); }
.idx-addr { display:block; margin-top:2px; font:400 11.5px/1.5 'IBM Plex Mono',monospace; letter-spacing:.02em; color:var(--meta); word-break:break-all; }
.idx-cites { margin-top:8px; font:600 13px/1.9 'IBM Plex Mono',monospace; letter-spacing:.06em; font-variant-numeric:tabular-nums; }
.idx-cite { color:var(--accent); white-space:nowrap; }
.idx-cite:hover { color:var(--accent-2); }
.idx-cite + .idx-cite::before, .idx-cite + .idx-note::before { content:',\00a0\00a0'; color:var(--meta); font-weight:400; }
/* Still resolving, failed to resolve, or the trailing "of N appearances" note. */
.idx-note { color:var(--meta); font-weight:400; white-space:nowrap; }
</style>
<body>
<div class="wrap">
  <div class="masthead">
    <span class="title">The <span class="beta">β</span>ook of <span class="beta">β</span>itcoin</span>
    <span class="home"><a href="./bitcoin-book.html">Read</a> · <a href="./bitcoin-contents.html">Contents</a> · <a href="./bitcoin-search.html">Search</a> · <a href="https://glossia.io/">Glossia</a></span>
  </div>

  <header class="page-head">
    <div class="page-eyebrow">Index</div>
  </header>

  <div id="index"></div>
</div>

<script type="module">
import { INDEXED, isAddress, citeHref } from './btc-index.js';
import { volumeBookChapter, toRoman } from './btc-citation.js';

// Citations are discovered the way the reader resolves one: from the chain,
// tried across the same public mirrors the book uses. An address's history
// comes from /address/<addr> (its confirmed transaction count) and
// /address/<addr>/txs/chain (its confirmed transactions, newest first,
// paginated by last-seen txid).
const ESPLORA_MIRRORS = ['https://blockstream.info/api', 'https://mempool.space/api'];

// A famous address accumulates history without end (the genesis address alone
// has thousands of tribute payments), so each entry's chain walk is capped.
// The walk runs newest-first -- the only direction the API pages -- so a
// capped entry lists its *latest* appearances and says how many it stands
// among; an uncapped one is the address's complete index line.
const MAX_TX_PAGES = 8;

// A reader's own query joins the curated set: ?address=<addr> prepends a
// temporary entry (titled by the address itself), so the search page can hand
// any address here the way it hands blocks and transactions to the book. A
// query that duplicates a curated address is dropped -- the curated title wins.
const q = (new URLSearchParams(location.search).get('address') || '').trim();
const adhoc = isAddress(q) && !INDEXED.some((e) => e.address === q)
  ? [{ title: q, address: q, adhoc: true }] : [];
const entries = [...adhoc, ...INDEXED];

// One chain walk for an address: its confirmed tx count, and up to
// MAX_TX_PAGES pages of its confirmed transactions (newest first).
async function addressHistory(address) {
  for (const base of ESPLORA_MIRRORS) {
    try {
      const info = await fetch(`${base}/address/${address}`);
      if (!info.ok) continue;
      const txCount = (await info.json()).chain_stats.tx_count;
      const txs = [];
      let lastSeen = '';
      for (let page = 0; page < MAX_TX_PAGES && txs.length < txCount; page++) {
        const res = await fetch(`${base}/address/${address}/txs/chain${lastSeen}`);
        if (!res.ok) break;
        const batch = (await res.json()).filter((t) => t.status?.confirmed);
        if (!batch.length) break;
        txs.push(...batch);
        lastSeen = `/${batch[batch.length - 1].txid}`;
      }
      return { txCount, txs };
    } catch { /* try the next mirror */ }
  }
  return null;
}

// The chapters where the address appears: one citation per chapter, the way a
// book's index lists a page once however often the name recurs on it. The walk
// arrives newest-first, so the last write per height keeps the earliest-seen
// transaction there -- that's the one the citation opens.
function chapters(txs) {
  const byHeight = new Map();
  for (const t of txs) byHeight.set(t.status.block_height, t.txid);
  return [...byHeight.entries()].sort((a, b) => a[0] - b[0]);
}

// Render an entry's citation run. Like the contents, each citation names only
// what the run hasn't already named: the Roman volume once, the β-marked book
// once beneath it, then bare ■chapters -- so a name that haunts one book reads
// as a string of chapter marks, and each mark is its own link into the book.
function renderCites(el, history) {
  el.replaceChildren();
  if (!history) { note(el, '—'); return; }
  const chs = chapters(history.txs);
  if (!chs.length) { note(el, 'no appearances yet'); return; }
  let vol = 0, book = 0;
  for (const [height, txid] of chs) {
    const p = volumeBookChapter(height);
    const parts = [];
    if (p.volume !== vol) { parts.push(toRoman(p.volume)); vol = p.volume; book = 0; }
    if (p.book !== book) { parts.push(`β${p.book}`); book = p.book; }
    parts.push(`■${p.chapter}`);
    const a = document.createElement('a');
    a.className = 'idx-cite';
    a.href = citeHref(txid);
    a.textContent = parts.join(' ');
    el.append(a);
  }
  // A capped walk names what it left behind; the count is of transactions,
  // which is what the chain counts (several may share a chapter above).
  if (history.txs.length < history.txCount) {
    note(el, `… the latest ${history.txs.length} of ${history.txCount.toLocaleString('en-US')} appearances`);
  }
}
function note(el, text) {
  const s = document.createElement('span');
  s.className = 'idx-note';
  s.textContent = text;
  el.append(s);
}

// Build every entry at once -- name and address are known offline -- and let
// each citation run stream in as its chain walk resolves, like the contents'
// transaction citations.
const index = document.getElementById('index');
for (const e of entries) {
  const row = document.createElement('div');
  row.className = 'idx-entry';
  const t = document.createElement('div'); t.className = 'idx-title';
  t.textContent = e.title;
  // An ad-hoc entry is titled by its address, so the mono sub-line would only
  // repeat it; curated entries carry both name and address.
  if (!e.adhoc) {
    const addr = document.createElement('span'); addr.className = 'idx-addr';
    addr.textContent = e.address;
    t.append(addr);
  }
  const cites = document.createElement('div'); cites.className = 'idx-cites';
  note(cites, '…');
  row.append(t, cites);
  index.append(row);
  addressHistory(e.address).then((history) => renderCites(cites, history));
}
</script>
