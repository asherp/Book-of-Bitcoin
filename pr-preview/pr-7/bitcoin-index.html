<!-- PWA: installable, offline-capable app shell. Shares the Bitcoin book's
     gold-β manifest so every page installs as one "Bitcoin Book" app. -->
<link rel="manifest" href="./bitcoin-book.webmanifest">
<meta name="theme-color" content="#08080a">
<link rel="apple-touch-icon" href="./icons/beta-icon-180.png">

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed:', e));
    });
  }

  // The page is assembled from ES modules that both the HTTP cache (GitHub
  // Pages serves max-age=600) and the service worker refresh file by file, so
  // a redeploy can briefly leave them mixed: this page from one build, a
  // module from another. A module whose imports no longer line up fails to
  // instantiate, and an aborted module graph renders nothing -- the index
  // goes blank. Detect the blankness itself, not the error (module failures
  // surface too many ways to catch reliably): a healthy module populates
  // #index synchronously, so an empty #index well after load means the graph
  // died. Recover by re-fetching this page's files with cache:'reload' --
  // which refreshes the HTTP cache directly and, routed through the service
  // worker, makes its background revalidation hit the true network -- then
  // reloading once onto the matched set. A second blank load shows a note
  // instead of looping.
  (function () {
    const FILES = ['./bitcoin-index.html', './btc-index.js', './btc-citation.js'];
    const FLAG = 'glossia-index-reloaded';
    window.addEventListener('load', () => {
      setTimeout(() => {
        const idx = document.getElementById('index');
        if (!idx || idx.children.length) return;   // the module rendered; nothing to recover
        let retried = false;
        try { retried = !!sessionStorage.getItem(FLAG); } catch (_) {}
        if (retried) {
          const s = document.createElement('span');
          s.className = 'idx-note';
          s.textContent = 'The index failed to load — reload to retry.';
          idx.replaceChildren(s);
          return;
        }
        try { sessionStorage.setItem(FLAG, '1'); } catch (_) {}
        Promise.allSettled(FILES.map((u) => fetch(u, { cache: 'reload' })))
          .then(() => setTimeout(() => location.reload(), 800));
      }, 2000);
    });
  })();
</script>

<style>
:root {
  --page:#08080a; --card:#0d0d10; --card-bd:#232228; --ink:#e8e4da; --ink-soft:#cfcabf;
  --accent:#c9a25f; --accent-2:#dcb877; --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;
  --input-bg:#151519; --input-bd:#2a2930;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; line-height: 1.55; }
.wrap { max-width: 720px; margin: 0 auto; padding: 48px 22px 100px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.masthead { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:40px; }
.masthead .title { font:600 13px/1 'IBM Plex Mono',monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--ink); }
.masthead .title .beta { color:var(--accent); text-transform:none; font-family:'Newsreader','Source Serif 4',Georgia,serif; font-weight:600; font-size:1.12em; }
.masthead .home { margin-left:auto; font:500 12px/1 'IBM Plex Mono',monospace; letter-spacing:.04em; }

.page-head { text-align:center; padding-bottom:30px; margin-bottom:36px; border-bottom:1px solid var(--rule); }
.page-eyebrow { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); }

/* An index entry: the name on its own line -- the title in the book's serif,
   the address itself beneath in mono -- then its citations laid out like the
   table of contents (Volume part headers, Book sub-headers), with the row
   mirrored: the reference on the left, and on the right the chapter's net
   amount for the address. */
.idx-entry { padding:18px 2px 20px; border-bottom:1px solid var(--rule); }
.idx-title { font:500 17px/1.35 'Newsreader',serif; color:var(--ink-soft); }
.idx-addr { display:block; margin-top:2px; font:400 11.5px/1.5 'IBM Plex Mono',monospace; letter-spacing:.02em; color:var(--meta); word-break:break-all; }
.idx-cites { margin-top:6px; }

/* The nesting headers, scaled down a step from the contents page's -- here
   they sit inside an entry rather than heading the whole page. */
.idx-vol { margin:14px 0 2px; padding-top:10px; border-top:1px solid var(--hair);
  font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); }
.idx-vol:first-child { margin-top:6px; padding-top:0; border-top:none; }
.idx-book { margin:10px 0 1px; padding-left:14px;
  font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--meta); }

/* A citation row -- the contents row mirrored: the tail reference on the left
   in the citation mono, the chapter's net amount on the right, full eight
   decimals so the column aligns on the point. The whole row is a link into
   the book. */
.idx-row { display:flex; align-items:baseline; gap:16px; padding:7px 2px 7px 14px; border-bottom:1px solid var(--hair); text-decoration:none; }
.idx-row.under-book { padding-left:28px; }
.idx-row:last-child { border-bottom:none; }
.idx-ref { flex:none; font:600 13px/1.4 'IBM Plex Mono',monospace; letter-spacing:.06em; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; }
.idx-amt { flex:1; min-width:0; text-align:right; font:500 13px/1.4 'IBM Plex Mono',monospace; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.idx-row:hover .idx-ref { text-decoration:underline; color:var(--accent-2); }
.idx-row:hover .idx-amt { color:var(--ink); }

/* Still resolving, failed to resolve, or the trailing "of N appearances" note. */
.idx-note { display:block; margin-top:8px; padding-left:14px; font:400 12px/1.5 'IBM Plex Mono',monospace; color:var(--meta); }
</style>
<body>
<div class="wrap">
  <div class="masthead">
    <span class="title">The <span class="beta">β</span>ook of <span class="beta">β</span>itcoin</span>
    <span class="home"><a href="./bitcoin-book.html">Read</a> · <a href="./bitcoin-contents.html">Contents</a> · <a href="./bitcoin-search.html">Search</a> · <a href="https://glossia.io/">Glossia</a></span>
  </div>

  <header class="page-head">
    <div class="page-eyebrow">Index</div>
  </header>

  <div id="index"></div>
</div>

<script type="module">
import { INDEXED, isAddress, citeHref, netSats, formatNetBtc } from './btc-index.js';
import { volumeBookChapter, toRoman } from './btc-citation.js';

// Citations are discovered the way the reader resolves one: from the chain,
// tried across the same public mirrors the book uses. An address's history
// comes from /address/<addr> (its confirmed transaction count) and
// /address/<addr>/txs/chain (its confirmed transactions, newest first,
// paginated by last-seen txid).
const ESPLORA_MIRRORS = ['https://blockstream.info/api', 'https://mempool.space/api'];

// A famous address accumulates history without end (the genesis address alone
// has thousands of tribute payments), so each entry's chain walk is capped.
// The walk runs newest-first -- the only direction the API pages -- so a
// capped entry lists its *latest* appearances and says how many it stands
// among; an uncapped one is the address's complete index line.
const MAX_TX_PAGES = 8;

// Each address's resolved index line is cached, so a revisit renders whole
// from storage -- offline too -- and revalidates with a single request: the
// confirmed tx count only ever grows, so an unchanged count means the cached
// chapters are still the address's complete story and the walk is skipped.
// Bounded to the most recently used addresses so ad-hoc queries can't grow
// the cache without end.
const CACHE_KEY = 'glossia-btc-index-cache';
const CACHE_MAX_ADDRESSES = 12;
const readCache = () => {
  try { const v = JSON.parse(localStorage.getItem(CACHE_KEY)); return v && typeof v === 'object' ? v : {}; }
  catch { return {}; }
};
const cache = readCache();
function saveCache() {
  const keep = Object.entries(cache).sort((a, b) => b[1].at - a[1].at).slice(0, CACHE_MAX_ADDRESSES);
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(Object.fromEntries(keep))); } catch { /* full or unavailable */ }
}

// A reader's own query joins the curated set: ?address=<addr> prepends a
// temporary entry (titled by the address itself), so the search page can hand
// any address here the way it hands blocks and transactions to the book. A
// query that duplicates a curated address is dropped -- the curated title wins.
const q = (new URLSearchParams(location.search).get('address') || '').trim();
const adhoc = isAddress(q) && !INDEXED.some((e) => e.address === q)
  ? [{ title: q, address: q, adhoc: true }] : [];
const entries = [...adhoc, ...INDEXED];

async function fetchJson(path) {
  for (const base of ESPLORA_MIRRORS) {
    try {
      const res = await fetch(base + path);
      if (res.ok) return await res.json();
    } catch { /* try the next mirror */ }
  }
  return null;
}

// Up to MAX_TX_PAGES pages of the address's confirmed transactions, newest
// first. Pagination is by last-seen txid, so pages compose across mirrors.
async function walkChain(address, txCount) {
  const txs = [];
  let lastSeen = '';
  for (let page = 0; page < MAX_TX_PAGES && txs.length < txCount; page++) {
    const batch = await fetchJson(`/address/${address}/txs/chain${lastSeen}`);
    const confirmed = (batch || []).filter((t) => t.status?.confirmed);
    if (!confirmed.length) break;
    txs.push(...confirmed);
    lastSeen = `/${confirmed[confirmed.length - 1].txid}`;
  }
  return txs;
}

// The chapters where the address appears, ascending: one row per chapter, the
// way a book's index lists a page once however often the name recurs on it --
// its amount the *net* of every touch in that chapter. The walk arrives
// newest-first, so the last write per height keeps the earliest transaction
// there; that's the one the row opens.
function chapterize(txs, address) {
  const byHeight = new Map();
  for (const t of txs) {
    const h = t.status.block_height;
    byHeight.set(h, { txid: t.txid, sats: (byHeight.get(h)?.sats ?? 0) + netSats(t, address) });
  }
  return [...byHeight.entries()]
    .map(([height, v]) => ({ height, ...v }))
    .sort((a, b) => a.height - b.height);
}

// Resolve one entry: cached line first (instantly, offline included), then a
// one-request revalidation against the confirmed tx count; only a grown count
// walks the chain again.
async function resolveEntry(address, cites) {
  const cached = cache[address];
  if (cached) renderCites(cites, cached);
  const info = await fetchJson(`/address/${address}`);
  if (!info) { if (!cached) renderCites(cites, null); return; }
  const txCount = info.chain_stats.tx_count;
  if (cached && cached.txCount === txCount) return;
  const txs = await walkChain(address, txCount);
  // A walk that returned nothing for a non-empty address failed mid-flight:
  // keep whatever the cache already tells, rather than caching the failure.
  if (!txs.length && txCount > 0) { if (!cached) renderCites(cites, null); return; }
  const data = { at: Date.now(), txCount, walked: txs.length, chapters: chapterize(txs, address) };
  renderCites(cites, data);
  cache[address] = data;
  saveCache();
}

// Render an entry's citations the way the contents page nests its own: a
// Volume part header, then a Book sub-header wherever two or more consecutive
// chapters share one, each row citing only the portion of its reference the
// headings haven't named -- mirrored, with the reference leading the row and
// the chapter's net amount closing it.
function renderCites(el, data) {
  el.replaceChildren();
  if (!data) { note(el, '—'); return; }
  const rows = data.chapters.map((c) => ({ ...c, place: volumeBookChapter(c.height) }));
  if (!rows.length) { note(el, 'no appearances yet'); return; }
  for (let i = 0; i < rows.length;) {
    const vol = rows[i].place.volume;
    let jv = i + 1; while (jv < rows.length && rows[jv].place.volume === vol) jv++;
    el.append(head('idx-vol', `Volume ${toRoman(vol)}`));
    for (let k = i; k < jv;) {
      const bk = rows[k].place.book;
      let jb = k + 1; while (jb < jv && rows[jb].place.book === bk) jb++;
      if (jb - k >= 2) {
        el.append(head('idx-book', `Book ${bk}`));
        for (let m = k; m < jb; m++) el.append(rowEl(rows[m], true));
      } else {
        el.append(rowEl(rows[k], false));
      }
      k = jb;
    }
    i = jv;
  }
  // A capped walk names what it left behind; the count is of transactions,
  // which is what the chain counts (several may share a chapter above).
  if (data.walked < data.txCount) {
    note(el, `… the latest ${data.walked} of ${data.txCount.toLocaleString('en-US')} appearances`);
  }
}
function rowEl({ txid, sats, place }, underBook) {
  const row = document.createElement('a');
  row.className = 'idx-row' + (underBook ? ' under-book' : '');
  row.href = citeHref(txid);
  const r = document.createElement('span'); r.className = 'idx-ref';
  r.textContent = underBook ? `■${place.chapter}` : `β${place.book} ■${place.chapter}`;
  const amt = document.createElement('span'); amt.className = 'idx-amt';
  amt.textContent = formatNetBtc(sats);
  row.append(r, amt);
  return row;
}
function head(cls, label) { const d = document.createElement('div'); d.className = cls; d.textContent = label; return d; }
function note(el, text) {
  const s = document.createElement('span');
  s.className = 'idx-note';
  s.textContent = text;
  el.append(s);
}

// Build every entry at once -- name and address are known offline -- and let
// each citation list render from cache and refresh as its chain walk resolves.
// Built onto a cleared #index: a late module evaluation may land after the
// head's blank-page recovery has already written its failure note.
const index = document.getElementById('index');
index.replaceChildren();
for (const e of entries) {
  const row = document.createElement('div');
  row.className = 'idx-entry';
  const t = document.createElement('div'); t.className = 'idx-title';
  t.textContent = e.title;
  // An ad-hoc entry is titled by its address, so the mono sub-line would only
  // repeat it; curated entries carry both name and address.
  if (!e.adhoc) {
    const addr = document.createElement('span'); addr.className = 'idx-addr';
    addr.textContent = e.address;
    t.append(addr);
  }
  const cites = document.createElement('div'); cites.className = 'idx-cites';
  note(cites, '…');
  row.append(t, cites);
  index.append(row);
  resolveEntry(e.address, cites);
}

// The module graph loaded whole: clear the mixed-build recovery flag (set in
// the head) so a future redeploy gets its own one-shot reload again.
try { sessionStorage.removeItem('glossia-index-reloaded'); } catch (_) {}
</script>
</body>
</html>
