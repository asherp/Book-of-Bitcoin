<script>
  // An appendix is back matter, and it sits at the volumes' own level: the
  // contents is above it (arriving from there is a descent, the leaf rising
  // from beneath the list), and the volumes and the other appendices are
  // beside it (arriving from those is a sideways turn, the leaf entering
  // from the side the reader pushed). The flag carries which, and is set
  // just before the navigation and consumed on first paint.
  try {
    const dir = sessionStorage.getItem('glossia-appendix-entrance');
    if (dir) {
      sessionStorage.removeItem('glossia-appendix-entrance');
      document.documentElement.classList.add(
        dir === 'fwd' ? 'appx-entrance-fwd' : dir === 'back' ? 'appx-entrance-back'
        : dir === 'drop' ? 'appx-entrance-drop' : 'appx-entrance');
    }
  } catch (_) {}

  // The ascent: a pull DOWN starting at the page's top rises from the
  // appendix back to the contents -- the inverse of the heading's descent.
  // Sideways turns walk the appendices in their numbered order, the way the
  // front matter's leaves turn: back to the appendix before this one,
  // forward to the one after.
  (function () {
    const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let sy = null, sx = 0, st = 0, atTop = false, atBottom = false;
    // Filled by the module once it knows which appendix this is; a turn
    // before then simply has nowhere to go.
    window.__appxTurns = { prev: null, next: null };
    const leave = (href, transform, flag, value = '1') => {
      try { sessionStorage.setItem(flag, value); } catch (_) {}
      const go = () => { location.href = href; };
      if (REDUCED) { go(); return; }
      document.body.style.transition = 'transform .2s linear';
      document.body.style.transform = transform;
      setTimeout(go, 180);
    };
    // The contents runs a leaf per volume and per appendix, so the ascent
    // names this appendix and lands on its own contents leaf -- as an ascent
    // from Volume III lands on Volume III's. The name passes through as
    // given; the contents' own aliases resolve it (bitcoin-contents.html).
    const PART = new URLSearchParams(location.search).get('part') || 'mining';
    window.__appxAscend = () => leave(`./bitcoin-contents.html?part=${PART}`, 'translateY(100vh)', 'glossia-toc-entrance', '1');
    // One turn sideways, in either direction: the leaf slides off the way the
    // reader pushed it, and the neighbour enters from the other side. Each
    // destination has its own entrance to wake -- the appendix leaves, the
    // ledger compendium (Appendix III), and the book itself, whose last
    // volume lies back of Appendix I.
    window.__appxTurn = (back) => {
      const to = back ? window.__appxTurns.prev : window.__appxTurns.next;
      if (!to) return;
      const flag = to.includes('bitcoin-ledger') ? 'glossia-ledger-entrance'
        : to.includes('bitcoin-book') ? 'glossia-book-entrance'
        : 'glossia-appendix-entrance';
      leave(to, `translateX(${back ? 100 : -100}vw)`, flag, back ? 'back' : 'fwd');
    };
    document.addEventListener('touchstart', (e) => {
      sy = null;
      if (e.touches.length !== 1) return;
      sy = e.touches[0].clientY; sx = e.touches[0].clientX; st = performance.now();
      atTop = window.scrollY <= 2;
      atBottom = window.scrollY >= document.documentElement.scrollHeight - window.innerHeight - 2;
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (sy === null || e.changedTouches.length !== 1) return;
      const dy = e.changedTouches[0].clientY - sy;
      const dx = e.changedTouches[0].clientX - sx;
      const dt = performance.now() - st;
      sy = null;
      // A committed horizontal turn: quick, far enough, and mostly sideways.
      // Nothing that way and the edge simply holds.
      if (dt <= 600 && Math.abs(dx) >= 60 && Math.abs(dy) <= Math.abs(dx) * 0.6) {
        window.__appxTurn(dx > 0);                 // swiping right turns back
        return;
      }
      // A push UP from the foot descends into the appendix's first chapter,
      // as a push up descends from the contents into the book…
      if (atBottom && dt <= 600 && dy <= -70 && Math.abs(dx) <= Math.abs(dy) * 0.6) {
        window.__appxDescend();
        return;
      }
      // …and a pull DOWN from the top rises to the contents, which lists it.
      if (atTop && dt <= 600 && dy >= 70 && Math.abs(dx) <= dy * 0.6) window.__appxAscend();
    }, { passive: true });

    // The same turns from a keyboard: left and right along the appendices'
    // numbered line, up to the contents and down into the first chapter --
    // the reader's own directions, though the swipe that means "descend" is
    // a push UP. The vertical pair defers to the scroll as the swipes do,
    // turning only from the boundary it moves away from (or on a leaf too
    // short to scroll at all). A turn with nothing behind it keeps the key's
    // ordinary meaning rather than swallowing it.
    document.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || e.repeat) return;
      const t = e.target;
      if (t && t.closest && t.closest('input, textarea, select, [contenteditable], .settings-panel')) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        const back = e.key === 'ArrowLeft';
        if (!(back ? window.__appxTurns.prev : window.__appxTurns.next)) return;
        e.preventDefault();
        window.__appxTurn(back);
        return;
      }
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      const top = window.scrollY <= 2;
      const bottom = window.scrollY >= document.documentElement.scrollHeight - window.innerHeight - 2;
      const short = document.documentElement.scrollHeight <= window.innerHeight + 24;
      if (e.key === 'ArrowUp') { if (short || top) { e.preventDefault(); window.__appxAscend(); } return; }
      if (short || bottom) { e.preventDefault(); if (window.__appxDescend) window.__appxDescend(); }
    });
  })();
</script>

<!-- The faces every leaf sets text in, fetched alongside the stylesheet
     that declares them rather than after it. crossorigin is required even
     same-origin: a font request is CORS-anonymous, and a preload without it
     matches nothing and downloads the file twice. The rest of web/fonts/ is
     left to unicode-range, which asks for a face only where its glyphs
     appear -- the sigla leaf pulls the whole alphabet, a chapter four files. -->
<link rel="preload" as="font" type="font/woff2" href="./fonts/newsreader-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="./fonts/plexmono-500-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="./fonts/plexmono-600-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="./fonts/sigla-dejavu.woff2" crossorigin>

<style>
:root {
  --page:#08080a; --card:#0d0d10; --card-bd:#232228; --ink:#e8e4da; --ink-soft:#cfcabf;
  --accent:#c9a25f; --accent-2:#dcb877; --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;
  --input-bg:#151519; --input-bd:#2a2930;
}
* { box-sizing: border-box; }
/* overscroll-behavior keeps the browser's pull-to-refresh from swallowing
   the pull-down-at-top ascent back to the contents. */
html, body { margin: 0; overscroll-behavior-y: none; }
body { min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Public Sans','Book Sigla', system-ui, sans-serif; line-height: 1.55; }
/* The entering half of the contents' descent into an appendix: the leaf
   rises into place from below, matching the carousel's pace. */
@media (prefers-reduced-motion: no-preference) {
  .appx-entrance body { animation: appx-in .22s ease-out; }
  @keyframes appx-in { from { transform: translateY(100vh); } }
  /* …and the entering half of a sideways turn along the volumes' line: the
     leaf arrives from the side the reader turned toward. */
  .appx-entrance-fwd body { animation: appx-in-fwd .22s ease-out; }
  @keyframes appx-in-fwd { from { transform: translateX(100vw); } }
  .appx-entrance-back body { animation: appx-in-back .22s ease-out; }
  @keyframes appx-in-back { from { transform: translateX(-100vw); } }
  /* …and the entering half of an ascent out of a draft chapter: the appendix
     drops back into place from above as the chapter sinks. */
  .appx-entrance-drop body { animation: appx-in-drop .22s ease-out; }
  @keyframes appx-in-drop { from { transform: translateY(-100vh); } }
}
.wrap { max-width: 720px; margin: 0 auto; padding: 48px 22px 100px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* The leaf's head: the appendix's number as its title, its name beneath,
   and then the paragraph saying what is gathered here and why it could not
   be gathered in reading order. Nothing stands above the title -- the ways
   out are the masthead's Contents, the pull down at the top, and the turns
   at the foot. */
.page-head { text-align:center; padding:8px 0 26px; margin-bottom:14px; border-bottom:1px solid var(--rule); }
.appx-title { margin:0; font:300 clamp(28px,7vw,40px)/1.15 'Newsreader','Book Sigla',serif; color:var(--ink); letter-spacing:-.01em; }
.appx-subtitle { margin-top:10px; font:400 19px/1.35 'Newsreader','Book Sigla',serif; color:var(--dim); }
/* The descent, as the book's leaves wear it: one mark, centred, at the foot
   of the title page. */
.appx-down { display:block; margin:34px auto 0; width:2em; text-align:center; font-size:20px; line-height:1; color:var(--dim); }
.appx-down:hover { color:var(--accent); text-decoration:none; }
.hidden { display:none !important; }
.appx-note { max-width:56ch; margin:22px auto 30px; font:400 15px/1.7 'Newsreader','Book Sigla',serif; color:var(--ink-soft); text-align:left; }
/* The way up from a fork's leaf: the part that lists it, named above the
   title the way the ledger leaves name their compendium. */
.appx-up { display:inline-block; margin-bottom:12px; font:600 10px/1.5 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--meta); }
.appx-up:hover { color:var(--accent); text-decoration:none; }
/* A fork's activation statistics: the same key/value dress the proof picker
   reads results in -- these too are a record being read out. */
.bip-stats { max-width:56ch; margin:0 auto 6px; font:400 13.5px/1.6 'Public Sans','Book Sigla',sans-serif; color:var(--ink-soft); }
/* A chapter no block has reached yet keeps the manuscript's pencil. */
.proof-row.bip-expected .proof-name { color:var(--meta); font-style:italic; }
.proof-row.bip-expected .proof-cite { color:var(--meta); font-weight:400; }
/* The ballot itself: one row per block of the counted window -- its chapter,
   its version as the frontispiece writes it, and whether it says yes. Drawn a
   page at a time as the foot comes into reach, the way a ledger's record is. */
.bip-blocks { max-width:56ch; margin:0 auto; }
.bb-heads { display:flex; gap:14px; padding:0 2px 6px; border-bottom:1px solid var(--rule); }
/* The heads borrow the rows' column classes for their widths alone; the
   dress is the ruling register's, not the row's -- and a head never breaks
   its word, however narrow the column beneath it runs. */
.bb-heads > span { color:var(--meta); font:600 10px/1 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.14em; text-transform:uppercase; text-align:left; white-space:nowrap; }
.bb-heads > .bb-status { text-align:right; }
.bb-row { display:flex; gap:14px; align-items:baseline; padding:6px 2px; border-bottom:1px solid var(--hair); }
.bb-ref { flex:none; min-width:118px; font:600 12px/1.5 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.04em;
  color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; }
a.bb-ref:hover { color:var(--accent-2); }
.bb-ver { flex:1; min-width:0; font:italic 400 14px/1.5 'Newsreader','Book Sigla',serif; color:var(--dim); overflow-wrap:anywhere; }
.bb-ver .dt { font-style:normal; }
.bb-status { flex:none; min-width:48px; text-align:right; font:500 10.5px/1.6 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.06em; }
.bb-status.yes { color:var(--accent); }
.bb-status.no { color:var(--meta); }
/* A coinbase ballot's middle column: the miner's own line, kept to one --
   the full text rides the hover. */
.bb-say { font-style:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; }
/* Inside a signaling period the version writes raw: the number in binary,
   the counted bit in bold accent -- the ballot is read off this word, so
   the record shows the word rather than the frontispiece's encoding of it
   (which packs bits 13-28 into a word pair and would swallow the signal).
   The prose reading still rides the hover. */
.bb-bits { font:400 10.5px/1.6 'IBM Plex Mono','Book Sigla',monospace; font-style:normal; letter-spacing:.05em;
  color:var(--meta); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.bb-bits .bb-bit { font-weight:700; font-style:normal; color:var(--accent); }
/* The clock at the row's head: the replay is chronological, and the days
   head their runs -- each row keeps only its minute. */
.bb-time { flex:none; font:400 10px/1.7 'IBM Plex Mono','Book Sigla',monospace; color:var(--meta); white-space:nowrap; font-variant-numeric:tabular-nums; }
.bb-day { margin:14px 0 1px; padding:2px; font:600 10px/1 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--meta); }
/* The accumulation: the count and the rate as they stood at each block, so
   the activation replays down the page. */
.bb-sum { flex:none; min-width:44px; text-align:right; font:500 11px/1.6 'IBM Plex Mono','Book Sigla',monospace; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
/* What a chapter paid its miner, on the right of the row it belongs to. The
   full eight places, tabular, so a column of them aligns on the point the way
   the ledger's own amounts do -- and 'Book Sigla' behind the mono face
   because ₿ is one of the marks the vendored alphabet carries. */
.bb-fees { flex:1; min-width:0; text-align:right; font:400 11.5px/1.6 'IBM Plex Mono','Book Sigla',monospace;
  color:var(--dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
.bb-fees.unsaid { color:var(--meta); }
.bb-pct { flex:none; min-width:40px; text-align:right; font:600 11px/1.6 'IBM Plex Mono','Book Sigla',monospace; color:var(--accent); font-variant-numeric:tabular-nums; }
/* Portrait: the row folds to two lines -- the clock, the chapter and the
   count keep the first; the version or coinbase text takes a full-width
   second of its own, so no column is ever squeezed to a letter a line and
   nothing bleeds past the page's edge. Its head retires with it: a column
   on its own line needs no ruling. */
@media (max-width: 620px) {
  .bb-heads { gap:8px; }
  .bb-heads > .bb-ver { display:none; }
  .bb-row { flex-wrap:wrap; gap:2px 8px; }
  .bb-time { font-size:9.5px; }
  .bb-ref { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .bb-status { min-width:40px; }
  .bb-sum { min-width:34px; }
  .bb-pct { min-width:34px; }
  .bb-row .bb-ver { order:9; flex:1 0 100%; min-width:100%; padding-left:2px; }
}
.bb-foot { display:block; padding:9px 2px; text-align:center; font:400 12px/1.6 'Public Sans','Book Sigla',sans-serif; color:var(--meta); }
/* A labeled rule across the ballot, above the block it names -- where the
   signaling began, where the count crossed: the fork's own curated chapters,
   drawn as lines in the record they punctuate. */
.bb-mark { display:flex; align-items:center; gap:10px; padding:12px 2px 4px;
  font:600 9.5px/1 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
.bb-mark::before, .bb-mark::after { content:''; flex:1; border-top:1px solid var(--accent); opacity:.45; }
/* A block notable beyond the fork -- a chapter the contents curates, or one
   the reader bookmarked -- keeps its label in the record too, a quieter rule
   in the contents' own words. A reader's own flies the bookmark's ribbon. */
.bb-mark.bb-toc { color:var(--meta); }
.bb-mark.bb-toc::before, .bb-mark.bb-toc::after { border-top-color:var(--rule); opacity:1; }
.bb-bm-rib { display:inline-block; flex:none; width:8px; height:11px; margin-right:-2px; color:var(--accent); }
.bb-bm-rib svg { display:block; width:100%; height:100%; }
/* The fork leaf's foot, seated the way the Ledger's totals bar sits: sticky
   at the screen bottom, the rule its top edge, holding the running tally and
   -- beneath the summary line -- the fork's commentary, so the reading is at
   hand at every moment of the scroll. An opened sheet rises from the foot,
   capped so the ballot stays in view behind it. */
.bip-foot { position:sticky; bottom:0; z-index:40;
  max-width:56ch; margin:0 auto;
  padding-bottom:max(6px, env(safe-area-inset-bottom));
  border-top:1px solid var(--rule); background:var(--page); }
/* A leaf with no long record to scroll past -- an inscription's, whose body
   scrolls inside its own box -- has nothing for the foot to follow, so the
   foot rests where it falls. Sticky there earns nothing and costs something:
   on a leaf that nearly fits the screen it pins the sheet over the turns. */
.bip-foot.at-rest { position:static; }
.bip-tally { display:flex; gap:10px; align-items:baseline;
  padding:12px 2px 10px 14px; }
.bip-foot .leaf-commentary { margin:0; max-width:none; border-top:1px solid var(--hair); padding:0 2px; }
.bip-foot .commentary-body { max-height:45vh; overflow:auto; }
.bip-tally .t-label { font:600 9.5px/1 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--meta); margin-right:6px; }
.bip-tally .t-fig { font:600 13px/1.4 'IBM Plex Mono','Book Sigla',monospace; color:var(--accent); font-variant-numeric:tabular-nums; }
.bip-tally .t-note { flex:1; min-width:0; text-align:right; font:400 11.5px/1.5 'Public Sans','Book Sigla',sans-serif; color:var(--meta);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* The Citations register's foot: the picker. A leaf lists nothing, as a rule -- the
   contents lists, the leaf explains -- but this appendix is the one a reader
   can add to, and the adding has to happen somewhere. It sits at the END,
   after the note and after what is already kept, so the page still reads as a
   leaf and the invitation comes last, the way a subscription card sits at the
   back of a book rather than the front. */
.proof-card { margin:34px auto 0; max-width:56ch; }
.proof-drop {
  border:1px dashed var(--input-bd); border-radius:4px; background:var(--input-bg);
  padding:16px 16px 14px; text-align:center; transition:border-color .15s ease, background .15s ease;
}
.proof-drop.over { border-color:var(--accent); background:#191712; }
.proof-say { display:block; font:400 13.5px/1.5 'Newsreader','Book Sigla',serif; color:var(--dim); margin-bottom:11px; }
.ghost {
  background:none; color:var(--accent); border:1px solid var(--input-bd); border-radius:4px;
  padding:8px 16px; font:600 11.5px/1 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.04em;
  text-transform:uppercase; cursor:pointer;
}
.ghost:hover { border-color:var(--accent); color:var(--accent-2); }
.mono { font-family:'IBM Plex Mono','Book Sigla',monospace; }

.proof-result { margin-top:16px; font:400 13.5px/1.6 'Public Sans','Book Sigla',sans-serif; color:var(--ink-soft); }
.proof-line { display:flex; gap:14px; padding:5px 2px; border-bottom:1px solid var(--hair); }
.proof-key { flex:none; width:96px; font:500 10.5px/1.9 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--meta); }
.proof-val { flex:1; min-width:0; overflow-wrap:anywhere; }
/* The book's own marks, on the book's own terms: ⌘ the identity hash, h a
   hash, ⋔ the merkle root, each with its count riding after it, and the hash
   itself set as prose in the reading face. */
.dt, .merkle-mark { color:var(--accent); font-weight:700; font-style:normal; }
.op-count { color:var(--meta); font-size:.85em; }
.proof-figure { font:italic 400 14px/1.55 'Newsreader','Book Sigla',serif; color:var(--dim); }
.proof-figure.waiting { color:var(--meta); }
.proof-verdict { margin-top:14px; font:400 14px/1.5 'Newsreader','Book Sigla',serif; }
.proof-verdict.good { color:var(--ink); }
.proof-verdict.bad { color:#e08b7a; }
.proof-verdict.unsure { color:var(--dim); }
.proof-open { display:inline-block; margin-top:14px; font:500 13px/1 'IBM Plex Mono','Book Sigla',monospace; }

/* What is already kept, listed above the picker: the appendix's own rows, in
   reading order, each one a door into the book. A reader's own carry the
   ribbon a bookmark carries, and the ✕ that takes it back out again. */
.proof-list { max-width:56ch; margin:26px auto 0; }
.proof-row { display:flex; align-items:baseline; gap:14px; padding:8px 2px; border-bottom:1px solid var(--hair); }
.proof-row a { flex:1; min-width:0; display:flex; align-items:baseline; gap:10px; color:var(--ink-soft); }
.proof-row a:hover { color:var(--ink); }

.proof-drop-btn:hover { color:#e08b7a; }

/* An inscription's content, as the witness carries it: an image stands as

.ins-text { max-height:60vh; overflow:auto; text-align:left; white-space:pre-wrap; overflow-wrap:anywhere;
  font:400 12px/1.6 'IBM Plex Mono','Book Sigla',monospace; color:var(--ink-soft); background:var(--card);
  border:1px solid var(--card-bd); border-radius:4px; padding:14px 16px; margin:0; }
/* Not a caption: the leaf explains nothing about the content it shows. This
   is the line that stands where the content would be while the witness is
   being read, and stays only when there is nothing a plate can show. */

/* What a collection says of itself, set as a form: the fields as written and

.ins-field:first-child { border-top:1px solid var(--rule); }

/* A work of a collection, on its leaf: its txid said in the book's own prose

/* A work's reference, in its head beneath the name: the chapter, the section

.work-ref.waiting { color:var(--meta); }
/* The plate's place is held before the plate arrives: a member whose witness

  font:600 10px/1.5 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.14em; text-transform:uppercase; }

<body>
<div class="wrap">
  <div class="masthead">
    <span class="title">The <span class="beta">β</span>ook of <span class="beta">β</span>itcoin</span>
    <span class="home"><a href="./bitcoin-contents.html" id="toc-link">Contents</a> · <a href="./bitcoin-book.html">Read</a> · <a href="./bitcoin-search.html">Search</a></span>
  </div>

  <header class="page-head">
    <a class="appx-up hidden" id="appx-up" href="#"></a>
    <h1 class="appx-title" id="appx-title"></h1>
    <div class="appx-subtitle" id="appx-subtitle"></div>
  </header>
  <p class="appx-note" id="appx-note"></p>

  <!-- One block of a ballot (?part=consensus&bip=N&block=H), reprinted as a
       leaf of its own: the chapter's title page -- its hash as prose between
       the ⌘ and ⓪ marks, and every header field as the frontispiece writes
       it -- so the ballot is read the way the Ledger's record is read: the
       table names, the leaf reprints, and the vertical turns walk the window
       block by block. The ascent lands back on the table at the row left
       off. -->
  <a class="appx-down hidden" id="block-up" href="#" aria-label="The next newer block">▴</a>
  <div class="bip-stats hidden" id="block-card"></div>

  <!-- A fork's own leaf (?part=consensus&bip=N). Below the description, the
       ballot: every block of the counted window, its version as the
       frontispiece writes it, and whether it says yes -- drawn a page at a
       time as the reader scrolls, with the running tally held in a sticky
       bar at the screen's foot. Then the statistics as the file states them,
       and the chapters and sections the fork names, each a door into the
       book. -->
  <div class="bip-blocks hidden" id="bip-blocks"></div>
  <div class="bip-stats hidden" id="bip-stats"></div>
  <div class="proof-list hidden" id="bip-entries"></div>

  <!-- The Consensus leaf itself lists its forks: one row per BIP, each the
       door to that fork's own leaf. The Inscriptions leaf borrows the same
       shelf for its entries. -->
  <div class="proof-list hidden" id="bip-list"></div>

  <!-- One inscription's own leaf (?part=inscriptions&ins=<reveal>): the
       record first -- what the witness carries, read out of the reveal's own
       bytes (btc-inscriptions.js) -- and then the content itself, rendered
       where its declared type can be rendered without believing anything the
       bytes do not say. -->
  <figure class="ins-content hidden" id="ins-content"></figure>

  <!-- A manifest names further reveals rather than carrying content of its
       own, so its leaf is a title page: the name the collection gives
       itself above, and beneath it the rest of what it says of itself, set
       as a form -- the fields as written, in the manifest's own order. -->
  <div class="ins-form hidden" id="ins-form"></div>

  <!-- …and the works themselves stand one level below (&item=n), one to a
       leaf: the txid said in the book's own prose, the image its witness
       carries, and the manifest's caption for it. Turned to sideways, the
       way every run of leaves in this book is turned. -->

  <div class="proof-list hidden" id="proof-list"></div>

  <div class="proof-card hidden" id="proof-card">
    <div class="proof-drop" id="proof-drop">
      <span class="proof-say">Drop an OpenTimestamps proof here — with the file it stamps, to check that too —
        and this appendix keeps it. A <span class="mono">.ots</span> names the chapter its file was
        stamped into; the book checks that against the block's own header before it lists it.</span>
      <button type="button" class="ghost" id="proof-pick">Choose a file</button>
      <input type="file" id="proof-file" multiple hidden>
    </div>
    <div class="proof-result hidden" id="proof-result"></div>
  </div>

  <a class="appx-down" id="appx-down" href="#" aria-label="Down into the appendix">▾</a>
  <nav class="appx-turns" id="appx-turns"></nav>

  <!-- The fork leaf's sticky foot: the summary line, and beneath it the
       fork's reading -- what the fork is, and what somebody makes of it --
       kept where every reading is kept: behind a toggle, over the record
       rather than in it. Last in the flow, so it holds the screen's foot
       for the whole of the scroll. -->
  <div class="bip-foot hidden" id="bip-foot">
    <div class="bip-tally hidden" id="bip-tally"></div>
    <details class="leaf-commentary hidden" id="bip-commentary">
      <summary title="What this fork is, and readings of it — editorial, and kept apart from the record above">Commentary</summary>
      <div class="commentary-body" id="bip-commentary-body"></div>
    </details>
  </div>
</div>

<script type="module">
import { localizeHome, mountLangMenu } from './btc-strings.js';
localizeHome();   // the masthead in the reader's UI language
mountLangMenu();  // …with the Language item, which any page can now set
import { loadNotables, appendix, entryHref, isBlockId, places, placeTitle } from './btc-contents.js';
import { partLabel, partNumber } from './btc-notables.js';

// The appendix is read from appendix.yaml (btc-notables.js), so it arrives
// asynchronously; this leaf IS one of its parts, so it waits for it.
await loadNotables();
const APPENDIX = appendix();
import { chainTip, MEMPOOL_MIRRORS, readQueue, expectedRevenue, MVB } from './btc-mempool.js';
import {
  minedWindow, tallyMines, shareSay, sharePct, MINE_WINDOW, signatureOf,
  networkHashrate, formatHashrate,
  UNATTRIBUTED as MINES_UNATTRIBUTED,
} from './btc-mines.js';
import { toRoman, volumeBookChapter, heightOf, expectedReference, footnoteMark } from './btc-citation.js';
import { formatBlockVersion, composeBlockHeaderFields } from './btc-prose.js';
import { toSuperscript } from './btc-sigla.js';
// Amounts read in whatever notation the reader has chosen -- ₿, satoshis, or
// their own unit -- through the one call every printed amount goes through.
import { formatAmount, formatBtc, amountUnit, setDayPrice } from './btc-amounts.js';
import { usdOn } from './btc-price.js';
import { readAlpha } from './btc-projected.js';

// ── One appendix, given a leaf of its own ─────────────────────────────────
// The contents lists what each appendix holds; this is where an appendix
// says what it is. Which one is named by ?part=: the queue, or the chapters
// consensus has numbered ahead of the chain. The third appendix, the
// ledgers, has a leaf already -- the Ledger compendium -- and the contents
// points straight at it, so it is only ever a neighbour here.
// ?part=future is the name Appendix II answered to before its forks were
// grouped by BIP; saved links keep working.
// ?part=mining is the name the queue and the mines answered to while they
// stood under one heading; a saved link resolves by what it asked for --
// &at=mines to the mines, anything else to the queue, which is where a bare
// ?part=mining used to land.
const PARTS = { mempool: 'mempool', mines: 'mines', future: 'consensus', consensus: 'consensus', proofs: 'proofs', inscriptions: 'inscriptions' };
const params = new URLSearchParams(location.search);
const wanted = params.get('part');
const kind = PARTS[wanted]
  || (wanted === 'mining' ? (params.get('at') === 'mines' || params.get('mine') ? 'mines' : 'mempool') : null)
  || 'mempool';
const part = APPENDIX.find((p) => p.kind === kind) || APPENDIX[0];
const index = APPENDIX.indexOf(part);
// ── The Mines' own levels ─────────────────────────────────────────────────
// The shelf runs one leaf to a pool, with that pool's chapters below it --
// the same two storeys Consensus keeps under a fork and Inscriptions under a
// work:
//
//   ?part=mines                        the shelf
//   ?part=mines&mine=<slug>            one mine's title page
//   ?part=mines&mine=<slug>&at=blocks  the chapters it mined
//
// `mine` names one pool by the slug the attribution uses. The queue has no
// levels of its own: ?part=mempool is a leaf, and what lies below it is the
// first draft chapter, read in the book like any other.
const atParam = String(params.get('at') || '').toLowerCase();
const mineSlug = kind === 'mines' ? String(params.get('mine') || '').toLowerCase() : '';
const AT = kind === 'mines' && mineSlug ? (atParam === 'blocks' ? 'blocks' : 'mine') : null;
// ── The Mempool's own book level ──────────────────────────────────────────
// The part's leaf stands at the volumes' level, as every appendix does. A
// storey down -- the level a book occupies in the body -- the queue is read
// three ways, side by side:
//
//   ?part=mempool             the part's leaf: the queue entire
//   ?part=mempool&at=alpha    the next chapter, as itself
//   ?part=mempool&at=amount   its transactions, by what they move
//   ?part=mempool&at=vbytes   its transactions, by what they weigh
//
// Only alpha is read this closely. It is the one projected block that is a
// forecast rather than a statement about the queue now, and its contents cost
// a websocket and 600 KB where the rest would cost five megabytes
// (btc-projected.js says why at length).
const QUEUE_LEAVES = ['alpha', 'amount', 'vbytes'];
const QUEUE = kind === 'mempool' && QUEUE_LEAVES.includes(atParam) ? atParam : null;
// One fork's own leaf, a level below the part's: ?bip= names it by number,
// the way the contents' sub-heads link it.
const bips = part.kind === 'consensus' ? (part.bips || []) : [];
const bip = bips.find((b) => b.key === String(params.get('bip'))) || null;
const bipAt = bip ? bips.indexOf(bip) : -1;
// One inscription's own leaf, the same level down: ?ins= names it by its
// reveal transaction, the way the part's rows link it.
const insEntries = part.kind === 'inscriptions' ? (part.entries || []) : [];
const insParam = String(params.get('ins') || '').toLowerCase();
const insCurated = insEntries.find((e) => e.reveal === insParam) || null;
// An inscription the book has not curated is still an inscription, and this
// leaf can still read it: the reveal names a witness, the witness carries an
// envelope, and everything the leaf shows comes out of those bytes anyway. So
// ?ins= takes any reveal, and an uncurated one simply arrives without the
// things curation supplies -- a title, a note, a place in the shelf's run --
// which it discovers from the chain instead (renderUncuratedHead). This is
// what the reader's witness footnotes link to: the book names a witness by
// what its bytes say, and that name is a door to the thing itself.
const ins = insCurated
  || (part.kind === 'inscriptions' && /^[0-9a-f]{64}$/.test(insParam)
    ? { reveal: insParam, title: 'Inscription', uncurated: true }
    : null);
const insAt = insCurated ? insEntries.indexOf(insCurated) : -1;
// A collection has one more level beneath its title page: &item=n opens the
// nth work, one to a leaf, turned to sideways the way every other run of
// leaves in this book is turned. The title page says what the collection
// claims to be; the leaves below it are the collection.
const itemRaw = parseInt(params.get('item'), 10);
const itemAt = ins != null && Number.isFinite(itemRaw) && itemRaw >= 1 ? itemRaw : null;
// One block of a fork's ballot, a level below the fork's own leaf: ?block=
// names it by height, the way a ballot row links it.
const blockLeaf = bip && /^[0-9]+$/.test(params.get('block') || '') ? Number(params.get('block')) : null;

// ── The version word, as a consensus view writes it ───────────────────────
// Inside an active signaling period the version IS the ballot, so these
// leaves write it raw: the number in binary, the bit the fork counts in
// boldface. The frontispiece's encoding stays for every block outside a
// period -- it packs the rolling range (bits 13-28) into its word pair, and
// would swallow the very bit a ballot is reading (Classic's 28 sits in it).
// The prose form still speaks on hover, title-deep, wherever binary stands.
//
// A period: a closed ballot's window is one by definition; a live fork's
// runs from its first cast (the earliest chapter its entries name) -- ahead
// of that first cast nothing was signaling, and the frontispiece's own
// notation stands.
const inSignalingPeriod = (h) => {
  if (!bip) return false;
  if (bip.ballot != null) {
    const floor = bip.ballot - (Number.isFinite(bip.window) ? bip.window : 2016) + 1;
    return h >= floor && h <= bip.ballot;
  }
  const casts = (bip.entries || [])
    .filter((e) => !e.expected && !e.page && isBlockId(e.id))
    .map((e) => Number(e.id));
  return casts.length ? h >= Math.min(...casts) : true;
};
// A minimum version, named the way its era wrote it: the integer forms read
// as themselves (v3, v4), a version-bits form in hex -- XT's 0x20000007 is a
// version word, and 536870919 is nobody's name for it.
const versionName = (n) => ((n >>> 29) === 1 ? '0x' + (n >>> 0).toString(16) : String(n));
// The binary word itself. A bit-read fork bolds its one counted bit (set --
// an unset bit is a no, and a no is not a signal); a supermajority fork's
// signal is the whole number clearing the minimum, so the whole number goes
// bold when it does.
const versionBitsEl = (version, bit, aye) => {
  const bin = (version >>> 0).toString(2);
  const el = document.createElement('span');
  const bold = (text) => {
    const b = document.createElement('b');
    b.className = 'bb-bit';
    b.textContent = text;
    return b;
  };
  if (bit == null) {
    el.append(aye ? bold(bin) : document.createTextNode(bin));
    return el;
  }
  const at = (bin.length - 1) - bit;   // the counted bit's character
  if (at < 0 || bin[at] !== '1') { el.append(document.createTextNode(bin)); return el; }
  if (at > 0) el.append(document.createTextNode(bin.slice(0, at)));
  el.append(bold('1'));
  if (at < bin.length - 1) el.append(document.createTextNode(bin.slice(at + 1)));
  return el;
};

const $ = (id) => document.getElementById(id);
// A citation written whole -- volume and all, since no heading here has named
// any part of it -- with □ standing in for the ■ a block has yet to earn
// (expectedReference makes the same substitution from the height).
const wholeRef = (height, section = null, vout = null, page = null) => {
  const { volume, book, chapter } = volumeBookChapter(height);
  if (page === 'volume') return toRoman(volume);
  if (page === 'book') return `${toRoman(volume)} β${book}`;
  let s = `${toRoman(volume)} β${book} ■${chapter}`;
  if (section != null) s += ` §${section}${vout == null ? '' : `.${vout}`}`;
  return s;
};
// A path tried across the public mirrors; null when none answers.
const overMirrors = async (path, kind = 'json') => {
  for (const base of MEMPOOL_MIRRORS) {
    try {
      const res = await fetch(base + path);
      if (res.ok) return kind === 'json' ? await res.json() : (await res.text()).trim();
    } catch { /* try the next mirror */ }
  }
  return null;
};
// The printable runs of a coinbase scriptSig -- the miner's own line at the
// head of the chapter, as the ballot Bitcoin Unlimited wrote was read: runs
// of three or more legible characters, the structural bytes between them
// dropped.
const coinbaseSay = (scriptsigHex) => {
  const bytes = (String(scriptsigHex || '').match(/../g) || []).map((x) => parseInt(x, 16));
  const runs = [];
  let run = '';
  for (const c of bytes) {
    if (c >= 0x20 && c <= 0x7e) { run += String.fromCharCode(c); continue; }
    if (run.length >= 3) runs.push(run);
    run = '';
  }
  if (run.length >= 3) runs.push(run);
  return runs.join(' ');
};
// A block's coinbase text, two small calls: the chapter's first txid, then
// the transaction itself. Null when the chain will not say.
const coinbaseOf = async (blockHash) => {
  const txid = await overMirrors(`/block/${blockHash}/txid/0`, 'text');
  if (!txid || !/^[0-9a-f]{64}$/.test(txid)) return null;
  const tx = await overMirrors(`/tx/${txid}`);
  if (!tx || !Array.isArray(tx.vin) || !tx.vin[0]) return null;
  return coinbaseSay(tx.vin[0].scriptsig);
};

// A vertical move within the appendix -- down a level, or along a ballot's
// window -- played the way every leaf turn is played: this page slides off
// the way the reader pushed, and the destination enters from the other side.
// dir 'drop' rises toward what lies above (the newcomer drops in from the
// top); 'down' descends toward what lies below (the newcomer rises from the
// foot).
const navTo = (href, dir) => {
  try { sessionStorage.setItem('glossia-appendix-entrance', dir); } catch (_) { /* unavailable */ }
  const go = () => { location.href = href; };
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { go(); return; }
  document.body.style.transition = 'transform .2s linear';
  document.body.style.transform = dir === 'drop' ? 'translateY(100vh)' : 'translateY(-100vh)';
  setTimeout(go, 180);
};
const label = (p) => partLabel(APPENDIX, p);
// The contents runs a leaf per volume and per appendix; the masthead's link
// opens this appendix's own, as the ascent does.
$('toc-link').href = `./bitcoin-contents.html?part=${kind}`;
// At the level of one inscription and below, the site's row of links stands
// down. What is shown here is a picture or a page of somebody's text, and it
// should be met as that rather than framed by a chrome offering three other
// places to be. Nothing is lost: the crumb above the title climbs, the ▴
// and the pull-down ascend, and the masthead's own name still stands as the
// running head, saying whose book this is.
if (ins) document.querySelector('.masthead .home')?.classList.add('hidden');
const PART_QUERY = { mining: 'mining', consensus: 'consensus', proofs: 'proofs', inscriptions: 'inscriptions' };
const hrefFor = (p) => (p.kind === 'ledgers'
  ? './bitcoin-ledger.html'
  : `./bitcoin-appendix.html?part=${PART_QUERY[p.kind]}`);
const bipHref = (b) => `./bitcoin-appendix.html?part=consensus&bip=${b.key}`;
// Appendix I's own leaves, addressed the way every other leaf here is.
const queueHref = (at) => `./bitcoin-appendix.html?part=mempool&at=${at}`;
const QUEUE_TITLES = { alpha: 'Alpha', amount: 'By amount', vbytes: 'By size' };
const minesHref = () => './bitcoin-appendix.html?part=mines';
const mineHref = (slug) => `./bitcoin-appendix.html?part=mines&mine=${encodeURIComponent(slug)}`;
const mineBlocksHref = (slug) => `${mineHref(slug)}&at=blocks`;
// A mine's name before the count has landed. The slug is all the URL carries,
// and a leaf opened cold has to be titled with something; the attribution's
// own name replaces it the moment the window is read, so this is a
// placeholder in the strict sense -- never what the page settles on.
const mineTitle = (slug) => (slug === MINES_UNATTRIBUTED ? 'Unattributed'
  : slug.replace(/[-_]+/g, ' ').replace(/\b[a-z]/g, (c) => c.toUpperCase()));
// An inscription entry's three addresses: its own leaf here, its citation
// written whole (§n with the footnote's letter after the point — the place
// the envelope reads at), and the door into the book at that very footnote
// (&wit takes the letter, and the book brings the note to the top).
const insHref = (e) => `./bitcoin-appendix.html?part=inscriptions&ins=${e.reveal}`;
const insItemHref = (e, n) => `${insHref(e)}&item=${n}`;
const insRef = (e) => `${wholeRef(Number(e.id), e.index + 1)}.${footnoteMark(e.wit)}`;
const insDoor = (e) => `./bitcoin-book.html?block=${e.id}&index=${e.index}&wit=${footnoteMark(e.wit)}`;

// An appendix leaf lists nothing: what it gathers lies below it, and below
// it is the first chapter of what it gathers, read in the book like any
// other. For Appendix I that is the queue's first chapter -- the very block
// a reader reaches by swiping forward off the chain tip -- and the queue is
// walked from there, chapter by chapter, the ascent from any of them landing

// A part may carry a reading of what it gathers (appendix.yaml), and the

if (!bip && !ins && !AT && blockLeaf == null && part.kind !== 'proofs') {

  const readings = readingsOf(part);
  if (readings.length) {

// Where the descent lands. A fork's leaf opens its first chapter (known

let firstChapter = null;

    ? (bip.entries.length ? entryHref(bip.entries[0].id, bip.entries[0].index, bip.entries[0].page, bip.entries[0].out ?? null) : null)

// The neighbours, in the appendices' numbered order -- named at the foot and

// The appendices sit at the volumes' own level, continuing that line, so
// what lies back of the first of them is the body's last volume (below).
// A fork's leaf turns among the forks instead: back of the first lies the
// Consensus leaf that lists them, and past the last the shelf simply ends --
// the way up is the ascent.
// A block leaf turns nowhere sideways: its moves are vertical -- along the
// window, and up to the ballot -- so the foot carries no neighbours.
// A mine's neighbours are the mines either side of it in the shelf's order,
// which is not known until the window has been counted, so those are named

const queueAt = QUEUE ? QUEUE_LEAVES.indexOf(QUEUE) : -1;
const prevTo = blockLeaf != null ? null : QUEUE
  ? (queueAt > 0
    ? { href: queueHref(QUEUE_LEAVES[queueAt - 1]), text: QUEUE_TITLES[QUEUE_LEAVES[queueAt - 1]] }

  ? (insAt > 0
    ? { href: insHref(insEntries[insAt - 1]), text: insEntries[insAt - 1].title }

  : bip
  ? (bipAt < bips.length - 1 ? { href: bipHref(bips[bipAt + 1]), text: bips[bipAt + 1].label } : null)

const turns = $('appx-turns');

// Appendix I's backward turn leaves the appendices for the body: the last
// volume's own leaf, which is the page this one continues from. Which volume
// is last is a question for the chain, so the turn is wired once the tip
// answers -- until then a backward swipe simply has nowhere to go.
// ── Consensus: the forks, each with a leaf of its own ─────────────────────
//
// The part's leaf lists its forks -- one row per BIP, each the door to that
// fork's own leaf -- and the fork's leaf carries what the contents cannot: the
// activation statistics (how the rule was counted in, editorial like every

  for (const b of bips) {

// ── Inscriptions: the shelf, each with a leaf of its own ──────────────────
// The part's leaf lists its entries the way the Consensus leaf lists its

if (kind === 'inscriptions' && !ins) {
  const listEl = $('bip-list');

// A key/value row on a part's leaf, made once and rewritten as figures
// arrive -- the same dress a fork's activation statistics wear. Returns a
// setter, so a caller can name the row now and fill it when the chain

function statRowOf(key) {
  const stats = $('bip-stats');

  const k = document.createElement('div'); k.className = 'proof-key'; k.textContent = key;

// ── Appendix I: the queue ─────────────────────────────────────────────────
//
// The leaf lists nothing -- listing is the contents' business, and what lies
// below is the first draft chapter itself. What it states instead is the only
// thing about a queue worth stating and the one thing no file could hold in
// advance: how deep it is, and what mining it is expected to pay. Both are
// mempool.space's, asked of mempool.space alone so the credit is exact -- a
// count of what one node holds at one moment is that node's claim about its
// own queue, not a fact about any block that will ever exist.
if (kind === 'mempool' && QUEUE === null) {
  const setQueue = statRowOf('queue');
  const setSubsidy = statRowOf('subsidy');
  const setFees = statRowOf('fees');
  const setPaid = statRowOf('expected');
  (async () => {
    // The reader's own notation, honoured before a single amount is set.
    // Only 'usd' asks anything of anyone, and it asks for TODAY's rate --
    // this figure is about chapters not yet written, so the day it belongs to
    // is this one (btc-price.js caches by day, so the ask is usually a
    // lookup). Every other notation clears the rate, so a stale one cannot
    // outlive the choice, and a rate no source will give falls back to the
    // record's own ₿ rather than to nothing.
    if (amountUnit() === 'usd') setDayPrice(await usdOn(Math.floor(Date.now() / 1000)));
    else setDayPrice(null);

    const tip = await chainTip();
    const [queue, rev] = await Promise.all([
      readQueue(tip, ['https://mempool.space/api']),
      expectedRevenue(tip, ['https://mempool.space/api']),
    ]);
    const credit = 'what mempool.space is holding at this moment — that node\'s claim about its own queue, '
      + 'not a fact about any block that will ever exist';
    if (!queue || !queue.summary) {
      setQueue('could not be read just now',
        'no mirror answered — the appendix simply ends at the chain tip until one does');
    } else {
      const txs = queue.summary.count.toLocaleString('en-US');
      const deep = queue.blocks ? queue.blocks.length : Math.max(1, Math.ceil(queue.summary.vsize / MVB));
      setQueue(`${txs} transactions waiting, ${deep} ${deep === 1 ? 'chapter' : 'chapters'} deep`, credit);
    }
    if (!rev) { setSubsidy(null); setFees(null); setPaid(null); return; }
    const over = `over the ${rev.chapters.toLocaleString('en-US')} chapters now queued`;
    setSubsidy(formatAmount(rev.sats - rev.fees),
      `${formatBtc(rev.sats - rev.fees)} — what the schedule mints for writing them, ${over}`);
    setFees(formatAmount(rev.fees),
      `${formatBtc(rev.fees)} — what the sections in them carry, ${over}. ${credit}.`);
    setPaid(formatAmount(rev.sats), `${formatBtc(rev.sats)} in all, ${over}. ${credit}.`);
  })().catch(() => { setQueue(null); setSubsidy(null); setFees(null); setPaid(null); });
}

// ── The queue, read at the book level ─────────────────────────────────────
//
// Alpha as itself, and its transactions ranked two ways. Alpha's own figures
// come off the REST API for nothing; the rankings need the block's contents,
// which is a websocket and about 600 KB (btc-projected.js). One reading

if (QUEUE) {
  (async () => {

    if (amountUnit() === 'usd') setDayPrice(await usdOn(Math.floor(Date.now() / 1000)));
    else setDayPrice(null);
    const credit = 'mempool.space\'s reading of its own queue at this moment — not a fact about any '
      + 'block that will ever exist, and true only while the queue holds';

      const queue = await readQueue(tip, ['https://mempool.space/api']);
      const first = queue?.blocks?.[0];

      say(tip == null ? 'the next chapter, if the queue holds'
        : `${expectedReference(tip + 1)} — the next chapter, if the queue holds`, credit);
      const set = (k) => statRowOf(k);
      set('sections')(Number(first.nTx).toLocaleString('en-US'),
        'how many transactions the next chapter would carry');
      set('weight')(`${(first.blockVSize / MVB).toFixed(3)} MvB`,
        'virtual size, against the one million vB a block may hold');
      set('fees')(formatAmount(Number(first.totalFees) || 0),
        `${formatBtc(Number(first.totalFees) || 0)} — what its sections carry for whoever writes it`);
      set('median rate')(`${Number(first.medianFee).toFixed(2)} sat/vB`, credit);
      return;
    }

    // The two rankings. Both read the same snapshot.
    say('reading the queue…');
    const snap = await readAlpha();
    if (!snap) {
      say('the next chapter\'s transactions could not be read just now',
        'this ranking comes over a websocket, which no mirror serves as an ordinary request — '
        + 'nothing here is guessed at in its absence');
      return;
    }
    const byValue = QUEUE === 'amount';
    const rows = byValue ? snap.byAmount : snap.bySize;
    const when = new Date(snap.readAt * 1000).toISOString().slice(11, 16);
    say(`the largest ${rows.length.toLocaleString('en-US')} of ${snap.n.toLocaleString('en-US')} · read at ${when} UTC`,
      `${credit}. The whole of the next chapter is ${snap.n.toLocaleString('en-US')} transactions, `
      + `${formatBtc(snap.value)} moved across ${(snap.vsize / MVB).toFixed(3)} MvB; these are its largest by `
      + `${byValue ? 'what they move' : 'what they weigh'}.`);

    // Set as the ballot's rows are: a name on the left, its figure on the
    // right. A transaction here has no citation -- no block has recorded it,
    // so there is no chapter and no §section to name it by -- and its txid
    // stands in until one does.
    const el = $('bip-blocks');
    for (const t of rows) {
      const row = document.createElement('div');
      row.className = 'bb-row';
      const id = document.createElement('span');
      id.className = 'bb-ref';
      id.textContent = `${t.txid.slice(0, 8)}…${t.txid.slice(-4)}`;
      id.title = `${t.txid} — ${formatBtc(t.value)} across ${t.vsize.toLocaleString('en-US')} vB`
        + `${t.fee == null ? '' : `, paying ${formatBtc(t.fee)} in fees`}`;
      const fig = document.createElement('span');
      fig.className = 'bb-fees';
      fig.textContent = byValue ? formatAmount(t.value) : `${t.vsize.toLocaleString('en-US')} vB`;
      row.append(id, fig);
      el.append(row);
    }
    el.classList.remove('hidden');
  })().catch((e) => {
    $('appx-subtitle').textContent = 'the queue could not be read just now';
    console.warn('the projected block could not be read —', e);
  });
}

// ── The mines ─────────────────────────────────────────────────────────────
//
// The shelf, and each mine on it, read from the same count: the last
// difficulty window's blocks, attributed and tallied (btc-mines.js). One
// reading serves all three leaves below the pair, so a reader walking from
// the shelf into a mine and down to its chapters is reading one window
// throughout rather than three that might disagree.
if (kind === 'mines') {
  (async () => {
    // The window's own row, which is also where the reading reports itself:
    // "1,050 of 2,016 chapters read" while it works, the span once it has
    // finished. The head keeps the part's numeral and name throughout, as
    // every other appendix's does.
    // The shelf reports itself in a `window` row beside the network's, so its
    // head can keep the part's numeral and name the way every other
    // appendix's does. A mine's leaf and its chapters have their own titles
    // already, so theirs reports in the subtitle, as it did.
    const sub = $('appx-subtitle');
    const setWindow = AT ? null : statRowOf('window');
    const say = (t, title = '') => {
      if (setWindow) { setWindow(t, title); return; }
      sub.textContent = t;
      if (title) sub.title = title;
    };
    // One figure the shares cannot give, asked for at once rather than after
    // the window: how fast the whole network is hashing. Nobody observes it --
    // it is inferred from the difficulty and the rate blocks arrive -- which
    // is exactly why it stands beside the shelf rather than among it. The
    // shares below are ratios of chapters won and carry none of its error.
    if (!AT) {
      const setRate = statRowOf('network');
      networkHashrate().then((got) => {
        setRate(got && formatHashrate(got.hashrate),
          'mempool.space\'s estimate of the whole network\'s hash rate, inferred from the difficulty '
          + 'and the rate blocks arrive — nobody observes this figure. The shares below are ratios of chapters '
          + 'won, which is why they carry no part of its error.');
      }).catch(() => setRate(null));
    }
    const tip = await chainTip();
    if (tip == null) { say('the chain would not say where it is'); return; }

    const credit = 'who mined each chapter is mempool.space\'s attribution, from the coinbase tag — '
      + 'an unauthenticated string anyone may copy, so it is a reading and not the record';
    const spanOf = (read, counted) =>
      `${counted.toLocaleString('en-US')} chapters — ${wholeRef(read.from)} to ${wholeRef(read.tip)}`;

    // The shelf, drawn from a reading of the window -- and drawn AGAIN when a
    // fuller reading arrives, which is what a revisit is. Replacing the rows
    // rather than adding to them, so the second drawing is the whole shelf
    // and not the first one twice.
    const drawShelf = (read, { complete }) => {
      const { mines, counted } = tallyMines(read);
      if (!counted) return 0;
      // A partial shelf says so, and says how far it has got -- naming the
      // span would claim a window it has not finished reading, so while it
      // reads it counts instead. The shares are live: they move as chapters
      // land, and settle when the last page does.
      say(complete
        ? spanOf(read, counted)
        : `${counted.toLocaleString('en-US')} of ${MINE_WINDOW.toLocaleString('en-US')} chapters read`,
      complete ? credit
        : `${credit}. Still reading the window — every share here will move as the rest of the chapters land.`);
      const listEl = $('bip-list');
      listEl.replaceChildren();
      for (const m of mines) {
        const row = document.createElement('div');
        row.className = 'proof-row';
        const a = document.createElement('a');
        a.href = mineHref(m.slug);
        a.title = m.named
          ? `${m.name} won ${m.won.toLocaleString('en-US')} of ${counted.toLocaleString('en-US')} chapters — ${shareSay(m)} points, `
            + 'the ± being the lottery rather than the pool'
          : `${m.won.toLocaleString('en-US')} chapters carrying no tag mempool.space could name`;
        const t = document.createElement('span');
        t.className = 'proof-name';
        t.textContent = m.name;
        if (!m.named) t.style.fontStyle = 'italic';
        const s = document.createElement('span');
        s.className = 'proof-cite';
        s.textContent = shareSay(m);
        a.append(t, s);
        a.addEventListener('click', (ev) => {
          if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button !== 0) return;
          ev.preventDefault();
          navTo(mineHref(m.slug), 'down');
        });
        row.append(a);
        listEl.append(row);
      }
      listEl.classList.remove('hidden');
      if (mines.length) {
        firstChapter = mineHref(mines[0].slug);
        $('appx-down').classList.remove('hidden');
      }
      return mines.length;
    };

    // The window, drawn with its progress in the subtitle: on a cold archive
    // this is a hundred and thirty-five pages, and a leaf that said nothing
    // while it read them would look broken rather than busy. On a revisit the
    // archive holds all but the newest chapters, so the shelf is drawn from
    // it at once and redrawn when those land.
    // The shelf redraws as the window is read, but not on every one of a
    // hundred and thirty-five pages: a table re-sorting itself faster than it
    // can be read is noise, not information. A few times a second is enough
    // to see it filling and settling.
    const REDRAW_EVERY = 300;
    let lastDraw = 0;
    let drawn = false;
    const read = await minedWindow(tip, {
      onProgress: (got, want) => {
        // Only until there is a shelf to look at; past that the shelf's own
        // line says how far the reading has got, and two lines saying it
        // would disagree with each other half the time.
        if (!drawn && got < want) say(`counting the last ${want.toLocaleString('en-US')} chapters — ${got.toLocaleString('en-US')} so far`);
      },
      onReading: AT ? null : (soFar) => {
        const now = performance.now();
        if (drawn && now - lastDraw < REDRAW_EVERY) return;
        lastDraw = now;
        drawn = drawShelf(soFar, { complete: false }) > 0;
      },
    });
    const { mines, counted } = tallyMines(read);
    if (!counted) {
      say('the window could not be counted just now',
        'no mirror served the block pages this count reads — nothing here is guessed at in their absence');
      return;
    }
    const window = spanOf(read, counted);

    if (!AT) {
      // The descent onto the shelf's first mine is set by the drawing, so it
      // names whichever mine leads the finished count.
      drawShelf(read, { complete: true });
      // And one figure the shares cannot give: how fast the whole network is
      // hashing. Nobody observes it -- it is inferred from the difficulty and
      // the rate blocks arrive -- which is exactly why it stands apart from
      // the shelf rather than among it. The shares below are ratios of
      // chapters won and carry no part of this estimate's error.
      return;
    }

    // One mine: its title page, and -- a level below -- the chapters it won.
    const at = mines.findIndex((m) => m.slug === mineSlug);
    const mine = at >= 0 ? mines[at] : null;
    if (!mine) {
      say('no chapter in this window carries this mine\'s tag',
        'a pool that won nothing in the last difficulty window has no share to state — which is itself the reading');
      return;
    }
    $('appx-title').textContent = mine.name;
    document.title = `The βook of βitcoin — ${mine.name}`;
    // A mine's own leaf names its neighbours on the shelf, which could not be
    // known until the window was counted -- the same late naming a work of a
    // collection does, so the swipe, the keys and the foot all agree.
    if (AT === 'mine') {
      setTurns(
        at > 0 ? { href: mineHref(mines[at - 1].slug), text: mines[at - 1].name } : { href: minesHref(), text: 'The Mines' },
        at < mines.length - 1 ? { href: mineHref(mines[at + 1].slug), text: mines[at + 1].name } : null,
      );
    }

    if (AT === 'mine') {
      say(`${shareSay(mine)} of ${window}`, credit);
      const stats = $('bip-stats');
      const statRow = (key, value, title = '') => {
        const line = document.createElement('div'); line.className = 'proof-line';
        const k = document.createElement('div'); k.className = 'proof-key'; k.textContent = key;
        const v = document.createElement('div'); v.className = 'proof-val'; v.textContent = value;
        if (title) line.title = title;
        line.append(k, v); stats.append(line);
        return v;
      };
      statRow('rank', `${at + 1} of ${mines.length}`, 'by chapters won over this window, which is what the shelf is ordered by');
      statRow('chapters', `${mine.won.toLocaleString('en-US')} of ${counted.toLocaleString('en-US')}`);
      statRow('share', shareSay(mine),
        'the ± is one standard error — √(p(1−p)/N), the lottery rather than the pool. A share published without it is a headline.');
      statRow('window', `${window} · one difficulty epoch, about a fortnight`);
      // The bytes the attribution is an inference FROM: the pool's own
      // signature, as the most recent chapter it won carries it. Printed
      // because it is the record, where the name above it is a reading.
      // The bytes the attribution is an inference FROM: what this mine wrote
      // into its newest chapter's coinbase, quoted to exactly the extent the
      // book's own signature table can vouch for (btc-pools.js) and no
      // further. A mine whose tag that table cannot name prints no line at
      // all rather than a run of bytes nobody wrote.
      const sig = mine.blocks.map((b) => signatureOf(b.sig)).find(Boolean);
      if (sig) {
        statRow('signature', sig, 'the pool\'s own writing in the coinbase, as its newest chapter in this window carries it, '
          + 'cut to where the book\'s signature table says it ends — the record the name above is a reading of');
      }
      statRow('attribution', 'mempool.space', credit);
      if (mine.link) {
        const v = statRow('the mine says', mine.link);
        v.replaceChildren(Object.assign(document.createElement('a'), {
          href: mine.link, target: '_blank', rel: 'noopener noreferrer', textContent: mine.link,
        }));
      }
      stats.classList.remove('hidden');
      return;
    }

    // The chapters themselves: every block this mine won in the window,
    // newest first, each row the door into the book -- and each row NOTHING
    // BUT its citation.
    //
    // The row carried the minute, the coinbase's writing and a count of
    // sections before this. All three are true, and none of them is what
    // this table is about: a chapter's contents belong to the chapter, and
    // the book prints them where the chapter is read. What this table
    // asserts is a list of places — these are the chapters this mine won —
    // and a reference is exactly the book's way of naming a place. The rest
    // was the ballot's dress worn by a table that is not a ballot: a ballot
    // needs a column for the vote, because the vote is the claim; here the
    // membership IS the claim, and it is made in full by the citation.
    //
    // The days still head their runs. A heading is not a field of a row, and
    // without one a mine's fortnight is several hundred references with no
    // sense of pace -- which day was busy, where the run went quiet.
    say(`${mine.won.toLocaleString('en-US')} chapters of ${window}`, credit);
    const blocksEl = $('bip-blocks');
    const DAY = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    let lastDay = null;
    for (const b of mine.blocks) {
      const day = DAY.format(b.t * 1000);
      if (day !== lastDay) {
        lastDay = day;
        const d = document.createElement('div');
        d.className = 'bb-day';
        d.textContent = day;
        blocksEl.append(d);
      }
      const row = document.createElement('div');
      row.className = 'bb-row';
      const a = document.createElement('a');
      a.className = 'bb-ref';
      a.href = `./bitcoin-book.html?block=${b.height}`;
      a.textContent = wholeRef(b.height);
      // What the row no longer prints, it still knows: the hover keeps the
      // minute and the mine's own writing, for a reader who wants them
      // without the page insisting on them.
      a.title = `block ${b.height.toLocaleString('en-US')} — mined `
        + `${new Date(b.t * 1000).toISOString().slice(0, 19).replace('T', ' ')} UTC`
        + `${signatureOf(b.sig) ? `, signed ${signatureOf(b.sig)}` : ''}. Read this chapter in the book.`;
      // What the chapter paid its miner. The fees and not the reward: the
      // subsidy is the same for whoever wins, so it says nothing about the
      // mine, where the fees are what that chapter's own queue was worth.
      // Set in the reader's chosen notation, through the one call every
      // amount in the book goes through.
      const fee = document.createElement('span');
      fee.className = 'bb-fees';
      if (b.f == null) {
        fee.textContent = '—';
        fee.classList.add('unsaid');
        fee.title = 'the source did not state this chapter\'s fees — which is not the same as none';
      } else {
        fee.textContent = formatAmount(b.f);
        fee.title = `${formatBtc(b.f)} in fees — what this chapter paid its miner, over and above the subsidy every winner gets`;
      }
      row.append(a, fee);
      blocksEl.append(row);
    }
    blocksEl.classList.remove('hidden');
  })().catch((e) => {
    $('appx-subtitle').textContent = 'the mines could not be read just now';
    console.warn('the mines could not be read —', e);
  });
}

// ── One inscription, read out of its own witness ──────────────────────────
//
// The shelf names; this leaf reads. The reveal transaction is fetched off
// the same mirrors everything here reads, its input's tapscript is scanned
// for the envelope (btc-inscriptions.js), and what the leaf then shows is
// the body and nothing else: an image standing as the plate, text standing
// as text, a manifest standing as the members it names.
//
// No card of declarations above it, no gloss beneath it. What the envelope
// says of itself -- its type, its length, the input it rides -- is the
// witness's own matter, and the witness is one turn away in the book, set
// there push by push in the book's own notation; the subtitle is that door.
// A leaf that reprinted those declarations would be describing the content
// instead of showing it. Nothing past the bytes is stated as record either:
// the numbering, the sat, the market's collections all live in commentary,
// credited, behind the sheet at the foot.
if (ins) {
  // The leaf says what it is doing until the witness answers, and then gets
  // out of the way: the content takes the status line's place.
  const fig = $('ins-content');
  const status = document.createElement('figcaption');
  status.className = 'ins-status';
  status.textContent = 'reading the witness…';
  fig.append(status);
  fig.classList.remove('hidden');

  // Where a witness sits, in the book's own notation. The chapter and the
  // section come off the merkle proof -- the height, and the position in the
  // block that IS the §section -- and the footnote letter off the input's
  // place among the witness-bearing inputs, which is how the book letters its
  // notes. Null when the chain will not place it; a dash is better than a
  // citation nobody can follow.
  async function citeOfWitness(txid, tx, env) {
    const mp = await overMirrors(`/tx/${txid}/merkle-proof`);
    if (!mp || !Number.isFinite(mp.block_height) || !Number.isFinite(mp.pos)) return null;
    let ref = wholeRef(mp.block_height, mp.pos + 1);
    let href = `./bitcoin-book.html?block=${mp.block_height}&index=${mp.pos}`;
    if (env) {
      const wn = (tx.vin || []).slice(0, env.vin + 1).filter((v) => (v.witness || []).length).length;
      if (wn > 0) { ref += `.${footnoteMark(wn)}`; href += `&wit=${footnoteMark(wn)}`; }
    }
    return { ref, href };
  }
  // Fill an element that is standing in for a citation until the chain
  // answers -- the head's door here, a work's reference on the leaf below.
  const placeCite = (el, place) => {
    el.textContent = place ? place.ref : '—';
    if (place) el.href = place.href;
    else el.title = 'the chain would not say where this witness sits';
    el.classList.remove('waiting');
  };

  (async () => {
    const tx = await overMirrors(`/tx/${ins.reveal}`);
    if (!tx) { status.textContent = 'the chain could not be reached'; return; }
    const { inscriptionInTx, parseCollection, assetOfEnvelope } = await import('./btc-inscriptions.js');
    const found = inscriptionInTx(tx);
    // An uncurated leaf has no citation of its own to print and no name but
    // the one its bytes earn it, so the chain supplies both.
    if (!insCurated && !itemAt) {
      citeOfWitness(ins.reveal, tx, found).then((p) => placeCite($('appx-subtitle').firstChild, p))
        .catch(() => placeCite($('appx-subtitle').firstChild, null));
      // The same name the book's own footnote gives this witness, so a
      // reader arriving through that door finds the leaf already answering
      // to it: a manifest by the name it gives itself, anything else by what
      // its bytes announce, and failing both by what was declared of them.
      const named = found ? assetOfEnvelope(found) : null;
      const title = (named && named.label) || 'Inscription';
      $('appx-title').textContent = title;
      document.title = `The βook of βitcoin — ${title}`;
    }
    if (!found) {
      // The transaction stands; the reading does not. Say which is which.
      status.textContent = 'no envelope — this witness does not read as an inscription';
      return;
    }

    // A manifest carries no content of its own: it names further reveals, and
    // what it names is the collection. So the leaf spends the JSON rather
    // than showing it -- the ids become the members below, and the manifest's
    // own editorial matter (the names, the artists, the cities) is left where
    // it was written, being the inscriber's claim about those members rather
    // than anything the chain holds.
    const collection = found.contentEncoding ? null : parseCollection(found.body);
    if (collection) {
      status.remove();
      fig.classList.add('hidden');
      if (itemAt) renderWork(collection, itemAt);
      else renderTitlePage(collection);
      return;
    }
    // &items on something that names nothing has no level to open; the
    // inscription's own content stands, which is what the bare leaf shows.
    showOrdFields(found);

    // The body, and nothing about it. What the envelope declares, how long it
    // runs, which input carries it -- all of that is the witness's own, and
    // the witness is one turn away in the book, printed there push by push
    // (the subtitle is the door). Here the leaf IS the content: an image
    // stands as the plate, text stands as text, and the status line gives up
    // its place to whichever it turns out to be.
    const ct = String(found.contentType || '').toLowerCase();
    if (found.contentEncoding) {
      // Compressed: there is no content to show without unpacking it, and
      // unpacking is a reading. Say the shape of what the witness holds.
      status.textContent = `${found.body.length.toLocaleString('en-US')} bytes, ${found.contentEncoding}-compressed`;
      return;
    }
    if (ct.startsWith('image/')) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(new Blob([found.body], { type: found.contentType }));
      img.alt = ins.title;
      status.replaceWith(img);
      return;
    }
    if (ct.startsWith('text/') || ct.includes('json')) {
      const pre = document.createElement('pre');
      pre.className = 'ins-text';
      let text = new TextDecoder().decode(found.body);
      if (ct.includes('json')) {
        try { text = JSON.stringify(JSON.parse(text), null, 2); } catch { /* not quite JSON: the bytes stand as written */ }
      }
      pre.textContent = text;
      status.replaceWith(pre);
      return;
    }
    // A kind no plate can show. Naming it is not an explanation of the leaf;
    // it is the only thing there is to say.
    status.textContent = `${found.body.length.toLocaleString('en-US')} bytes of ${found.contentType || 'an undeclared kind'}`;
  })();

  // What ord's own fields say about this inscription, under whatever it
  // shows. A manifest is somebody's JSON and reads as a claim; these are
  // written into the envelope itself under numbered tags, which makes them
  // the inscriber's statement in ord's own grammar rather than a
  // marketplace's -- and provenance in particular is checkable, since ord
  // honours a parent only when that parent is spent in the same transaction.
  function showOrdFields(env) {
    const rows = [];
    for (const p of env.parents || []) {
      rows.push(['parent', { href: `./bitcoin-appendix.html?part=inscriptions&ins=${p.slice(0, 64)}`, text: p }]);
    }
    if (env.metaprotocol) rows.push(['metaprotocol', env.metaprotocol]);
    // Tag 5 is a document, so its own fields become the form's rows.
    const meta = env.metadata;
    if (meta && typeof meta === 'object' && !Array.isArray(meta)) {
      for (const [k, v] of Object.entries(meta)) {
        if (v !== null && typeof v !== 'object') rows.push([k, String(v)]);
      }
    }
    if (rows.length) fillForm($('ins-form'), rows);
  }

  // Somebody's words about something the chain holds, set as a form: the
  // fields as written and in the order they were written, the key in the
  // ruling register and the value in the reading face. Shared by the two
  // levels because it is the same kind of claim at both -- the collection
  // speaking about itself, and the collection speaking about one work.
  function fillForm(form, fields) {
    const rows = fields.filter(([, v]) => (v && typeof v === 'object' && v.href) || String(v).trim());
    for (const [k, v] of rows) {
      const row = document.createElement('div');
      row.className = 'ins-field';
      const key = document.createElement('div');
      key.className = 'ins-key';
      key.textContent = k.replace(/[_-]+/g, ' ');
      const val = document.createElement('div');
      val.className = 'ins-val';
      // A value given as {href, text} is a place in the book -- a parent
      // inscription's own leaf -- and reads as the door it is.
      if (v && typeof v === 'object' && v.href) {
        const a = document.createElement('a');
        a.href = v.href; a.textContent = v.text; a.className = 'raw-link';
        val.append(a);
        row.append(key, val);
        form.append(row);
        continue;
      }
      // A link is followed; an id or a key is a handle and reads as one; a
      // quotation is set as one, since a manifest that quotes a wall is
      // quoting somebody and the marks should say so. Everything else is
      // plain matter, in the reading face.
      if (/^https?:\/\//.test(v)) {
        const a = document.createElement('a');
        a.href = v; a.textContent = v; a.rel = 'noopener nofollow'; a.target = '_blank';
        val.append(a);
      } else if (/^\s*["“]/.test(v)) {
        val.classList.add('quote');
        val.textContent = v.trim();
      } else {
        if (/^[0-9a-f]{64}i\d+$/i.test(v) || /^npub1[0-9a-z]+$/.test(v)) val.classList.add('raw');
        val.textContent = v;
      }
      row.append(key, val);
      form.append(row);
    }
    form.classList.toggle('hidden', !rows.length);
  }

  // ── A collection's title page ──
  // The head takes the name the collection gives itself, and beneath it the
  // rest of what the manifest says: the fields as written, in the manifest's
  // own order, set as a form. Every line of it is the collection's own claim
  // -- a name, a count, a description, a disclaimer about its own
  // attributions -- so the leaf repeats it and does not vouch for it. What it
  // NAMES stands one level below, where the works are.
  function renderTitlePage(collection) {
    const meta = collection.meta || {};
    const name = (meta.name || '').trim();
    if (name) {
      // The book's own title for the entry was a placeholder for this.
      $('appx-title').textContent = name;
      document.title = `The βook of βitcoin — ${name}`;
    }
    // The name is the head; a form that repeated it would say it twice.
    fillForm($('ins-form'), Object.entries(meta).filter(([k]) => k !== 'name'));
    // The descent now opens the collection rather than the book: the works
    // are what lies under the page that names them, and the first of them is
    // where a descent lands, as it does from every leaf that has a run below.
    firstChapter = insItemHref(ins, 1);
    const down = $('appx-down');
    down.classList.remove('hidden');
    down.title = `the works — ${collection.members.length.toLocaleString('en-US')} of them`;
    down.setAttribute('aria-label', 'Down into the collection');
  }

  // ── One work of a collection, on its own leaf ──
  // The txid said in the book's own prose -- the same encoding a section's
  // title wears, over the same reversed bytes -- and beneath it the image
  // that work's own witness carries. The poem is the door into the chapter
  // the work sits in; the book resolves a bare txid to its section.
  //
  // Then the manifest's caption for it, in the same form the collection's
  // own statement takes one level up: the work first, then what its
  // collection says about the work. Same dress because it is the same kind
  // of claim -- somebody's words, repeated here, about something the chain
  // holds.
  //
  // The works are a run of leaves and turn like one: ‹ back and forward ›
  // along the collection, up to the title page that names them. One leaf is
  // one reveal fetched, which is the whole reason this is a run rather than
  // a page -- a hundred photographs are megabytes, and a reader turns to
  // them one at a time.
  function renderWork(collection, n) {
    const members = collection.members;
    const at = Math.min(Math.max(1, n), members.length);
    const m = members[at - 1];
    const collectionName = (collection.meta && collection.meta.name || '').trim() || ins.title;

    // The head: the manifest's name for this work, the collection above it,
    // and beneath the name the citation alone -- above the rule, where every
    // leaf in this book puts the reference for the thing it is showing. The
    // citation is filled in when the chain places the witness (below); until
    // then it is a mark. Nothing counts the run off beside it: a book does
    // not number the plate against the total, and the turns at the foot
    // already say what lies either side.
    $('appx-title').textContent = (m.name || '').trim() || `Work ${at.toLocaleString('en-US')}`;
    $('appx-up').textContent = `▴ ${collectionName}`;
    document.title = `The βook of βitcoin — ${(m.name || '').trim() || `Work ${at}`}`;
    const cite = document.createElement('a');
    cite.className = 'work-ref waiting';
    cite.href = `./bitcoin-book.html?txid=${m.txid}`;
    cite.title = 'read this witness in the book';
    cite.textContent = '…';
    $('appx-subtitle').replaceChildren(cite);

    // The neighbours: another work either side, and NOTHING either side of
    // the run's ends. A sideways turn walks the works and only the works --
    // the way out of a collection is the way in, the ▴ and the pull-down to
    // the title page that names them. Turning left off the first work used
    // to land on that page, which reads as a sideways move but is a level
    // up: press on and the run leaks into the neighbouring inscriptions and
    // then out of the appendix altogether. A run should close at both ends,
    // as the ballot's block leaves do.
    setTurns(
      at > 1
        ? { href: insItemHref(ins, at - 1), text: (members[at - 2].name || `Work ${at - 1}`).trim() }
        : null,
      at < members.length
