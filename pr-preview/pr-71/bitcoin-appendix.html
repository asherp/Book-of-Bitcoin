        ? { href: insItemHref(ins, at + 1), text: (members[at].name || `Work ${at + 1}`).trim() }
        : null,
    );

    // The work itself: the plate, and nothing over it. Its reference stands
    // in the head above the rule, where a leaf states what it is showing.
    const plate = document.createElement('figure');
    plate.className = 'ins-member';
    const body = document.createElement('div');
    body.className = 'ins-member-body';
    plate.append(body);
    fig.replaceChildren(plate);
    fig.classList.remove('hidden');

    (async () => {
      const say = (text) => { const s = document.createElement('div'); s.className = 'ins-member-say'; s.textContent = text; body.replaceChildren(s); };
      const mtx = await overMirrors(`/tx/${m.txid}`);
      if (!mtx) {
        say('the chain could not be reached for this work');
        cite.textContent = '—';
        cite.classList.remove('waiting');
        return;
      }
      const { inscriptionInTx } = await import('./btc-inscriptions.js');
      const e = inscriptionInTx(mtx);

      // The citation, read off the chain exactly as the head's is.
      citeOfWitness(m.txid, mtx, e).then((p) => placeCite(cite, p))
        .catch(() => placeCite(cite, null));

      if (!e) { say('no envelope in this witness'); return; }
      const ct = String(e.contentType || '').toLowerCase();
      if (e.contentEncoding || !ct.startsWith('image/')) {
        say(`${e.body.length.toLocaleString('en-US')} bytes of ${e.contentType || 'an undeclared kind'}`);
        return;
      }
      const img = document.createElement('img');
      img.src = URL.createObjectURL(new Blob([e.body], { type: e.contentType }));
      img.alt = (m.name || '').trim();
      body.replaceChildren(img);
    })().catch(() => { /* the citation stands: a work's plate is not its name */ });

    // The caption: the manifest's attributes for this work, as written and in
    // its own order. A quote is set as the quotation it is; everything else
    // reads as the form's plain value.
    fillForm($('ins-form'), Object.entries(m.attributes || {}));
  }

  // The entry's reading, raised the way a fork's is: the note leads the
  // sheet, then whatever else is written of it, then the part's own.
  const { readingsOf, resolveCommentary, commentaryHtml } = await import('./btc-commentary.js');
  const items = [];
  const own = [];
  if (ins.note) own.push({ note: ins.note });
  own.push(...readingsOf(ins));
  if (own.length) items.push({ title: ins.title, readings: own });
  if (readingsOf(part).length) items.push({ title: part.title, readings: readingsOf(part) });
  if (items.length) {
    const box = $('bip-commentary');
    const body = $('bip-commentary-body');
    box.classList.remove('hidden');
    const foot = $('bip-foot');
    foot.classList.remove('hidden');
    foot.classList.add('at-rest');   // no ballot to scroll past: the foot sits where it falls
    let filled = false;
    box.addEventListener('toggle', async () => {
      if (!box.open || filled) return;
      filled = true;
      body.innerHTML = '<div class="commentary-measure"><p class="commentary-loading">reading…</p></div>';
      await resolveCommentary(items);
      // Built from authored Markdown, escaped at the source (btc-markdown.js).
      body.innerHTML = commentaryHtml(items);
    });
  }
}

if (bip && blockLeaf == null) {
  // The statistics, as key/value rows: the status first, then what the file
  // says about how the fork was counted.
  const stats = $('bip-stats');
  const statRow = (key, value) => {
    const line = document.createElement('div'); line.className = 'proof-line';
    const k = document.createElement('div'); k.className = 'proof-key'; k.textContent = key;
    const v = document.createElement('div'); v.className = 'proof-val'; v.textContent = value;
    line.append(k, v); stats.append(line);
    return v;
  };
  statRow('status', bip.status);
  for (const s of bip.stats || []) statRow(s.label, s.value);
  stats.classList.remove('hidden');

  // ── The ballot, block by block ──
  // A fork counted in block versions lays its whole window out: one row per
  // block -- its chapter, its version exactly as the chapter's frontispiece
  // writes it (formatBlockVersion: v1..v4 in the integer era, the word pair
  // and its signaling bits under BIP9), and whether it reads as a yes. A
  // closed ballot opens at its last block and runs back to the window's
  // opening; a fork still signaling has no closed window, so it opens at the
  // chain tip and runs one window deep. Drawn a page at a time as the foot
  // comes into reach, banked a page ahead, the way the Ledger draws a record
  // -- and the running tally holds in a sticky bar at the screen's foot, so
  // the count stands beside the ballot at every moment of the scroll.
  if (bip.bit != null || bip.version != null || bip.coinbase != null) {
    // Three ways a yes is read: a version bit set, a minimum version, or --
    // for the one ballot written outside the version word -- text the
    // coinbase must carry. A first line the chain would not give up reads as
    // no vote, and says so.
    const COIN = typeof bip.coinbase === 'string' && bip.coinbase ? bip.coinbase : null;
    const yes = (b) => (COIN ? (b.say != null && b.say.includes(COIN))
      : bip.bit != null ? ((b.version >>> bip.bit) & 1) === 1
      : (b.version >>> 0) >= bip.version);
    const yesSays = COIN ? `${COIN}…/ written in the coinbase` : bip.bit != null ? `bit ${bip.bit} set` : `version ${versionName(bip.version)} or above`;
    const noSays = COIN ? `no ${COIN}…/ in the coinbase` : bip.bit != null ? `bit ${bip.bit} not set` : `below version ${versionName(bip.version)}`;
    const WINDOW = Number.isFinite(bip.window) ? bip.window : 2016;

    const blocksEl = $('bip-blocks');
    const heads = document.createElement('div');
    heads.className = 'bb-heads';
    for (const [cls, text, why] of [
      ['bb-time', 'mined', 'the minute the block was mined, UTC — the days head their runs'],
      ['bb-ref', 'chapter', ''],
      COIN ? ['bb-ver', 'coinbase', "the chapter's first line — the printable runs of the coinbase scriptSig"]
           : ['bb-ver', 'version', 'in binary while the period runs, the counted bit in bold — the frontispiece\'s own form outside it, and always on hover'],
      ['bb-status', 'signal', `a yes is ${yesSays}`],
      ['bb-sum', 'Σ', 'the yeses so far — the count as it stood with this block written'],
      ['bb-pct', '%', 'the rate so far — the yeses over the blocks written to this point'],
    ]) {
      const h = document.createElement('span');
      h.className = cls; h.textContent = text;
      if (why) h.title = why;
      heads.append(h);
    }
    const rowsEl = document.createElement('div');
    const foot = document.createElement('span');
    foot.className = 'bb-foot'; foot.textContent = '…';
    blocksEl.append(heads, rowsEl, foot);
    blocksEl.classList.remove('hidden');
    const tallyEl = $('bip-tally');

    // The fork's curated chapters, drawn as labeled rules across the ballot
    // where their blocks fall -- the line where the signaling began, the
    // line where the count crossed. The label is the entry's own title; the
    // rule stands above the block it names.
    const marks = new Map(bip.entries
      .filter((e) => !e.expected && !e.page && isBlockId(e.id))
      .map((e) => [Number(e.id), e]));
    const markEl = (e) => {
      const d = document.createElement('div');
      d.className = 'bb-mark';
      d.textContent = e.title;
      if (e.note) d.title = e.note;
      return d;
    };

    // A ballot's blocks can be notable beyond the fork: a chapter the
    // contents curates, or one the reader bookmarked. Those labels join the
    // record where their blocks fall -- quieter rules, in the contents' own
    // words -- so a window read here says what the contents would say about
    // the same blocks. The fork's own entries keep precedence over the
    // curated set (a height they already name is not ruled twice), but a
    // reader's bookmark always flies: it is theirs, under the ribbon it
    // wears everywhere else. Leaf-level places (page: book or volume) name
    // spans rather than chapters, so they stay out of a table of blocks.
    const extraMarks = new Map();   // height -> [{title, bm}]
    const addExtra = (h, m) => { (extraMarks.get(h) ?? extraMarks.set(h, []).get(h)).push(m); };
    for (const p of places()) {
      if (p.page || p.address || !isBlockId(p.id)) continue;
      const h = Number(p.id);
      if (!marks.has(h)) addExtra(h, { title: placeTitle(p) });
    }
    try {
      const kept = JSON.parse(localStorage.getItem('glossia-btc-bookmarks'));
      for (const b of Array.isArray(kept) ? kept : []) {
        if (!Number.isInteger(b.height) || b.page) continue;
        addExtra(b.height, { title: String(b.title ?? '').trim() || 'bookmark', bm: true });
      }
    } catch (_) { /* unavailable */ }
    const extraMarkEl = (m) => {
      const d = document.createElement('div');
      d.className = 'bb-mark bb-toc';
      if (m.bm) {
        const rib = document.createElement('span');
        rib.className = 'bb-bm-rib';
        rib.setAttribute('aria-label', 'your bookmark');
        rib.innerHTML = '<svg viewBox="0 0 12 16"><path fill="currentColor" d="M0 0h12v16l-6-4-6 4z"/></svg>';
        d.append(rib);
        d.title = 'your bookmark';
      } else {
        d.title = 'a curated chapter — as the table of contents names it';
      }
      d.append(document.createTextNode(m.title));
      return d;
    };

    const rowEl = (b) => {
      const row = document.createElement('div');
      row.className = 'bb-row';
      row.dataset.height = b.height;
      // The clock first: the replay is chronological, and the dates are what
      // make its pace legible -- a window is weeks, a stall is visible.
      const when = document.createElement('span');
      when.className = 'bb-time';
      when.textContent = new Date(b.timestamp * 1000).toISOString().slice(11, 16);
      when.title = `mined ${new Date(b.timestamp * 1000).toISOString().slice(0, 19).replace('T', ' ')} UTC — unix ${b.timestamp}`;
      row.append(when);
      // A row opens the block's own leaf, one level down -- the reprint the
      // vertical turns walk -- not the book itself; the leaf carries the one
      // door into the book, as a Ledger entry's citation does.
      const a = document.createElement('a');
      a.className = 'bb-ref';
      a.href = `./bitcoin-appendix.html?part=consensus&bip=${bip.key}&block=${b.height}`;
      a.textContent = wholeRef(b.height);
      a.title = `block ${b.height.toLocaleString()} — read this block's leaf`;
      a.addEventListener('click', (ev) => {
        if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button !== 0) return;
        ev.preventDefault();
        navTo(a.getAttribute('href'), 'down');
      });
      const aye = yes(b);
      const v = document.createElement('span');
      if (COIN) {
        v.className = 'bb-ver bb-say';
        v.textContent = b.say == null ? 'unread' : (b.say || '—');
        v.title = b.say == null ? 'the coinbase could not be read — counted as no vote' : `the coinbase text\n${b.say}`;
      } else if (inSignalingPeriod(b.height)) {
        // In the period the version is the ballot: binary, the counted bit
        // bold. The frontispiece's reading rides the hover.
        const ver = formatBlockVersion(b.version);
        v.className = 'bb-ver bb-bits';
        const mark = document.createElement('span');
        mark.className = 'dt'; mark.textContent = 'v';
        v.append(mark, versionBitsEl(b.version, bip.bit ?? null, aye));
        v.title = ver.title;
      } else {
        const ver = formatBlockVersion(b.version);
        v.className = 'bb-ver';
        const mark = document.createElement('span');
        mark.className = 'dt'; mark.textContent = 'v';
        // The frontispiece's own spacing: tight against a numeral (v1), a
        // space before a word form (v accio library 100).
        const text = ver.text.replace(/^v/, '');
        v.append(mark, document.createTextNode((/^\d/.test(text) ? '' : ' ') + text));
        v.title = ver.title;
      }
      const st = document.createElement('span');
      st.className = 'bb-status ' + (aye ? 'yes' : 'no');
      st.textContent = aye ? 'signals' : '—';
      st.title = aye ? yesSays : noSays;
      // The accumulation, row by row: the count and the rate as they stood
      // when this block was written -- scrolling down replays the activation.
      const sum = document.createElement('span');
      sum.className = 'bb-sum';
      sum.textContent = b.sum.toLocaleString('en-US');
      sum.title = `${b.sum.toLocaleString('en-US')} signaling of the ${b.n.toLocaleString('en-US')} blocks to this point`;
      const pct = document.createElement('span');
      pct.className = 'bb-pct';
      pct.textContent = `${(100 * b.sum / b.n).toFixed(1)}`;
      pct.title = sum.title;
      row.append(a, v, st, sum, pct);
      return row;
    };

    // The bank: blocks fetched ahead of the draw, ten a call off the same
    // mirrors the queue reads, descending from the anchor to the window's
    // opening. `done` closes the record -- the floor reached, or a chain that
    // stopped answering; either way the foot says which.
    // The bank runs OLDEST FIRST: the table begins at the window's opening
    // and scrolling down replays the activation in the order it occurred,
    // each row carrying the count and the rate as they stood at that block.
    // The pages still arrive ten a call off the same mirrors (esplora pages
    // descend from the height asked for, so each is asked for by its top and
    // read reversed), climbing from the floor toward the ballot's close --
    // or, for a fork still signaling, toward the chain tip.
    const bank = [];
    let anchor = Number.isFinite(bip.ballot) ? bip.ballot : null;
    let floor = null, at = null;
    let done = false, tallied = 0, ayes = 0;
    let fetching = null;
    const fetchMore = () => {
      if (done || fetching) return fetching || Promise.resolve();
      fetching = (async () => {
        if (anchor == null) {
          const tip = await chainTip();
          if (tip == null) { done = true; return; }
          anchor = tip;
        }
        if (floor == null) {
          floor = Math.max(0, anchor - WINDOW + 1);
          // A live ballot's record opens where its story begins: the
          // earliest chapter the fork names (the first signaling block), so
          // the line marking it is read first, not just named.
          if (bip.ballot == null && marks.size) floor = Math.min(floor, Math.min(...marks.keys()));
          at = Math.min(floor + 9, anchor);
        }
        let blocks = null;
        if (COIN) {
          // The fast path for a coinbase ballot: mempool.space's v1 block
          // pages bundle each block's coinbase scriptSig
          // (extras.coinbaseRaw), fifteen blocks a call -- a whole page of
          // first lines in one request. A mirror without v1 just misses
          // (vanilla esplora answers 404), and any block the page did not
          // carry a coinbase for falls back to two small calls of its own.
          const v1 = await overMirrors(`/v1/blocks/${at}`);
          if (Array.isArray(v1) && v1.length) {
            for (const b of v1) {
              if (b && b.extras && b.extras.coinbaseRaw != null) b.say = coinbaseSay(b.extras.coinbaseRaw);
            }
            blocks = v1;
          }
        }
        if (!blocks) blocks = await overMirrors(`/blocks/${at}`);
        if (!Array.isArray(blocks) || !blocks.length) { done = true; return; }
        if (COIN) {
          await Promise.all(blocks.map(async (b) => { if (b.say === undefined) b.say = await coinbaseOf(b.id); }));
        }
        // Oldest first, each block carrying the count as it stood with that
        // block written: the yeses so far, over the blocks so far.
        for (const b of blocks.reverse()) {
          if (b.height < floor || b.height > anchor) continue;
          // The final page is clamped to the anchor and may overlap the one
          // before it; a height already banked is not counted twice.
          if (bank.length && b.height <= bank[bank.length - 1].height) continue;
          tallied++;
          if (yes(b)) ayes++;
          bank.push({ height: b.height, version: b.version, say: b.say ?? null, timestamp: b.timestamp, sum: ayes, n: tallied });
        }
        const reached = bank.length ? bank[bank.length - 1].height : floor - 1;
        if (reached >= anchor) { done = true; return; }
        at = Math.min(reached + Math.max(blocks.length, 1), anchor);
      })().finally(() => { fetching = null; });
      return fetching;
    };

    const setTally = (says, of, noteText, title = '') => {
      tallyEl.replaceChildren();
      const fig = document.createElement('span');
      const label = document.createElement('span');
      label.className = 't-label'; label.textContent = 'Σ';
      const num = document.createElement('span');
      num.className = 't-fig';
      num.textContent = `${says.toLocaleString('en-US')} of ${of.toLocaleString('en-US')} · ${(100 * says / of).toFixed(1)}%`;
      fig.append(label, num);
      const note = document.createElement('span');
      note.className = 't-note';
      note.textContent = noteText;
      tallyEl.append(fig, note);
      if (title) tallyEl.title = title;
      tallyEl.classList.remove('hidden');
      $('bip-foot').classList.remove('hidden');
    };
    const against = Number.isFinite(bip.threshold) ? `against ${bip.threshold}% — ` : '';
    // The bar prefers the period's WHOLE count over the table's sample: a
    // fork still signaling can name a monitor (appendix.yaml) that publishes
    // the current period's total, which is the statistic the threshold is
    // about. The figure is that site's claim, not the chain's, so the bar
    // names its source; until it answers -- and whenever it cannot -- the
    // drawn count stands, and says that it is only the drawn count.
    // The bar states no ending the table has not reached: it holds the count
    // as far as the reading has gone, and the reader who scrolls to the
    // ballot's close discovers the total the way it was discovered the first
    // time -- block by block.
    let pinned = false;
    const tally = () => {
      if (pinned) return;
      // The last row read, not the last block fetched: the bank runs a page
      // ahead of the reader, and the bar must not.
      const last = rendered ? bank[rendered - 1] : null;
      if (!last) { tallyEl.classList.add('hidden'); return; }
      setTally(last.sum, last.n, `${against}the window, as far as read`);
    };
    if (bip.monitor) {
      (async () => {
        const res = await fetch(bip.monitor);
        if (!res.ok) return;
        const m = await res.json();
        const says = Number(m.signalingCount);
        const of = Number(m.totalBlocks);
        if (!Number.isFinite(says) || !(of > 0)) return;
        pinned = true;
        const period = Number.isFinite(Number(m.periodStart)) && Number.isFinite(Number(m.periodEnd))
          ? `, blocks ${Number(m.periodStart).toLocaleString('en-US')}–${Number(m.periodEnd).toLocaleString('en-US')}`
          : '';
        const host = new URL(bip.monitor).host;
        setTally(says, of, `${against}this period${period} · ${host}`,
          `the whole period's count, as ${host} publishes it${m.updatedAt ? ` (as of ${m.updatedAt})` : ''} — a claim of that site's, checkable block by block in the table`);
      })().catch(() => { /* the drawn count stands */ });
    }

    // The rows group by day: a quiet head opens each day's run as the draw
    // crosses midnight UTC, so the replay's pace reads at a glance -- a
    // window is weeks, and a slow day is a long entry.
    const DAY = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    let lastDay = null;
    const dayEl = (ts) => {
      const d = document.createElement('div');
      d.className = 'bb-day';
      d.textContent = DAY.format(ts * 1000);
      d.title = new Date(ts * 1000).toISOString().slice(0, 10);
      return d;
    };

    const PAGE = 30;
    // The landing: an ascent from a block's leaf wants the ballot scrolled to
    // the row left off at, so the scroll keeps drawing until that height is
    // on the page, then centers it -- the Ledger's own dive-and-return. A
    // landing outside the window is simply dropped.
    let land = null;
    try {
      land = sessionStorage.getItem('glossia-ballot-land');
      sessionStorage.removeItem('glossia-ballot-land');
    } catch (_) { /* unavailable */ }
    const tryLand = () => {
      if (land == null) return false;
      if (floor != null && (Number(land) < floor || Number(land) > anchor)) { land = null; return false; }
      const row = rowsEl.querySelector(`[data-height="${land}"]`);
      if (!row) return true;   // keep drawing
      land = null;
      requestAnimationFrame(() => row.scrollIntoView({ block: 'center', behavior: 'instant' }));
      return false;
    };
    let rendered = 0, led = false, busy = false, io = null;
    const scroll = async () => {
      if (busy) return;
      busy = true;
      while (bank.length - rendered < PAGE && !done) await fetchMore();
      // The table opens where the ballot opens, and says so -- unless a
      // marked chapter (the first signaling block) already heads it.
      if (!led && bank.length) {
        led = true;
        const lead = document.createElement('span');
        lead.className = 'bb-foot';
        lead.textContent = bip.ballot != null
          ? `— the window's opening, block ${floor.toLocaleString('en-US')}`
          : (marks.has(floor) ? '' : '— one window back from the tip');
        if (lead.textContent) rowsEl.before(lead);
      }
      const take = Math.min(bank.length - rendered, PAGE);
      for (const b of bank.slice(rendered, rendered + take)) {
        const day = new Date(b.timestamp * 1000).toISOString().slice(0, 10);
        if (day !== lastDay) { lastDay = day; rowsEl.append(dayEl(b.timestamp)); }
        if (marks.has(b.height)) rowsEl.append(markEl(marks.get(b.height)));
        for (const m of extraMarks.get(b.height) ?? []) rowsEl.append(extraMarkEl(m));
        rowsEl.append(rowEl(b));
      }
      rendered += take;
      tally();
      foot.textContent = done && rendered >= bank.length
        ? (bank.length
          ? (bip.ballot != null ? `— the ballot's close, block ${anchor.toLocaleString('en-US')}` : '— the chain tip, and counting')
          : 'the chain could not be reached')
        : '…';
      // The fetch ahead: keep a page banked beyond what's drawn.
      if (!done && bank.length - rendered < PAGE) fetchMore();
      busy = false;
      // The landing keeps drawing until its row exists (within the window,
      // so bounded).
      if (tryLand() && (rendered < bank.length || !done)) { queueMicrotask(scroll); return; }
      // Re-arm: appending moved the sentinel; observe it afresh so a foot
      // still within reach fires again.
      if (io) { io.unobserve(foot); io.observe(foot); }
    };
    io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) scroll(); },
                                  { rootMargin: '1600px 0px' });
    io.observe(foot);
    scroll();
  }

  // The chapters and sections the fork names. Heights cite offline; a
  // transaction's citation resolves the way the reader's would -- a
  // merkle-proof lookup, kept in the archive so it is asked once ever.
  const listEl = $('bip-entries');
  const pending = [];
  for (const e of bip.entries) {
    const row = document.createElement('div');
    row.className = 'proof-row' + (e.expected ? ' bip-expected' : '');
    const a = document.createElement('a');
    a.href = entryHref(e.id, e.index, e.page, e.out ?? null);
    const name = document.createElement('span');
    name.className = 'proof-name'; name.textContent = e.title;
    const cite = document.createElement('span');
    cite.className = 'proof-cite';
    if (e.expected) {
      cite.textContent = expectedReference(Number(e.id));
      a.title = `${e.note ? `${e.note}\n` : ''}expected — block ${Number(e.id).toLocaleString()} has not been mined`;
    } else if (isBlockId(e.id)) {
      cite.textContent = wholeRef(Number(e.id), e.index != null ? e.index + 1 : null, e.out ?? null, e.page);
      if (e.note) a.title = e.note;
    } else {
      cite.textContent = '—';
      if (e.note) a.title = e.note;
      pending.push({ e, cite });
    }
    a.append(name, cite);
    row.append(a);
    listEl.append(row);
  }
  listEl.classList.toggle('hidden', !bip.entries.length);
  if (pending.length) {
    const { storeGet, storePut } = await import('./btc-store.js');
    const placeTx = async (id) => {
      const kept = await storeGet('placements', id);
      if (kept) return kept;
      for (const base of MEMPOOL_MIRRORS) {
        try {
          const res = await fetch(`${base}/tx/${id}/merkle-proof`);
          if (!res.ok) continue;
          const mp = await res.json();
          const place = { height: mp.block_height, pos: mp.pos };
          storePut('placements', id, place);
          return place;
        } catch { /* try the next mirror */ }
      }
      return null;
    };
    for (const { e, cite } of pending) {
      placeTx(e.id).then((place) => {
        if (place) cite.textContent = wholeRef(place.height, place.pos + 1, e.out ?? null);
      }).catch(() => { /* the dash stands: the row still opens the section */ });
    }
  }

  // The fork's reading, and the part's, raised the way the proof leaves raise
  // theirs: specific before general, nothing fetched until the sheet opens.
  const { readingsOf, resolveCommentary, commentaryHtml } = await import('./btc-commentary.js');
  const items = [];
  // The fork's description leads its sheet -- what the fork is, in the
  // book's own voice, moved off the front of the leaf and into the reading
  // it always was -- then whatever else is written of it, then the part's.
  const own = [];
  if (bip.note) own.push({ note: bip.note });
  own.push(...readingsOf(bip));
  if (own.length) items.push({ title: bip.title, readings: own });
  if (readingsOf(part).length) items.push({ title: part.title, readings: readingsOf(part) });
  if (items.length) {
    const box = $('bip-commentary');
    const body = $('bip-commentary-body');
    box.classList.remove('hidden');
    $('bip-foot').classList.remove('hidden');
    let filled = false;
    box.addEventListener('toggle', async () => {
      if (!box.open || filled) return;
      filled = true;
      body.innerHTML = '<div class="commentary-measure"><p class="commentary-loading">reading…</p></div>';
      await resolveCommentary(items);
      // Built from authored Markdown, escaped at the source (btc-markdown.js).
      body.innerHTML = commentaryHtml(items);
    });
  }
}

// ── One block of a ballot, reprinted as its own leaf ──────────────────────
//
// The ballot names; this leaf reprints. What is reprinted is the chapter's
// title page as the book prints one: the block's hash as prose between the
// ⌘ and ⓪ marks (the proof-of-work zeros written after the prose, where
// they sit in the bytes), and every header field as the frontispiece writes
// it -- the version with its verdict beside it, since a ballot is what
// brought the reader here. The vertical turns walk the window: newer above,
// older below, the ballot itself above the newest -- and the crumb climbs
// back to the table, landing on this block's row.
if (blockLeaf != null) {
  const card = $('block-card');
  card.classList.remove('hidden');
  const line = (key) => {
    const l = document.createElement('div'); l.className = 'proof-line';
    const k = document.createElement('div'); k.className = 'proof-key'; k.textContent = key;
    const v = document.createElement('div'); v.className = 'proof-val';
    l.append(k, v); card.append(l);
    return v;
  };

  // The block-hash notation ⌘ᵐ … ⓪ⁿ, as bitcoin-book.html defines it: the
  // prose encodes internal order with the proof-of-work zeros trimmed off
  // the end (byte-granular), and the two superscripts state the true bit
  // counts, summing to 256.
  const reverseHex = (hex) => (hex.match(/../g) || []).reverse().join('');
  const trimTrailingZeroBytes = (hex) => {
    let end = hex.length;
    while (end >= 2 && hex.slice(end - 2, end) === '00') end -= 2;
    return hex.slice(0, end);
  };
  const leadingZeroBits = (displayHex) => {
    const stripped = displayHex.replace(/^0+/, '');
    let bits = (displayHex.length - stripped.length) * 4;
    if (stripped) {
      const d = parseInt(stripped[0], 16);
      bits += d >= 8 ? 0 : d >= 4 ? 1 : d >= 2 ? 2 : 3;
    }
    return bits;
  };
  const blockHashParts = (displayHex) => ({
    hex: trimTrailingZeroBytes(reverseHex(displayHex)),
    zeroBits: leadingZeroBits(displayHex),
    remainBits: 256 - leadingZeroBits(displayHex),
  });

  // Prose, the way the picker says it: the engine arrives lazily, a figure
  // it never reaches stays unsaid, and the hex rides the mark for a reader
  // checking an explorer -- never the page.
  let engineP = null;
  const glossia = () => (engineP ||= import('./glossia-msg.js').then(async (m) => { await m.init(); return m; }));
  const cells = [];
  const UNSAID = 'the engine that puts a hash into words did not load';
  const mark = (glyph, cls, title) => {
    const m = document.createElement('span');
    m.className = cls; m.textContent = glyph; m.title = title;
    return m;
  };
  const sup = (n, title) => {
    const s = document.createElement('span');
    s.className = 'op-count'; s.textContent = toSuperscript(n); s.title = title;
    return s;
  };
  const fig = (hexToEncode) => {
    const s = document.createElement('span');
    s.className = 'proof-figure waiting'; s.textContent = '…';
    cells.push({ el: s, hex: hexToEncode });
    return s;
  };
  const sayProse = () => {
    if (!cells.length) return;
    glossia().then((m) => {
      for (const { el, hex } of cells) {
        try {
          el.textContent = m.encodeCanonical(hex, m.bookLang(), 5).prose;
          el.classList.remove('waiting');
        } catch { el.textContent = 'unsaid'; el.title = UNSAID; }
      }
    }).catch(() => {
      for (const { el } of cells) { el.textContent = 'unsaid'; el.title = UNSAID; }
    });
  };
  // A hash with proof-of-work zeros: ⌘ᵐ prose ⓪ⁿ.
  const powFigure = (v, displayHex, what) => {
    const parts = blockHashParts(displayHex);
    v.append(
      mark('⌘', 'dt', `${what}\n${displayHex}`),
      sup(parts.remainBits, `the hash's remaining ${parts.remainBits} bits, Glossia-encoded as ${Math.ceil(parts.remainBits / 8)} bytes (⌘ — double-SHA256, the identity hash)`),
      ' ', fig(parts.hex), ' ',
      mark('⓪', 'dt', `${parts.zeroBits} leading zero bits — the proof of work`),
      sup(parts.zeroBits, `${parts.zeroBits} leading zero bits — the proof-of-work; the ${Math.floor(parts.zeroBits / 8)} whole zero bytes are dropped before encoding`),
    );
  };

  (async () => {
    // The block, off the same mirrors everything here reads: its hash by
    // height, then the header's fields by hash.
    let data = null;
    for (const base of MEMPOOL_MIRRORS) {
      try {
        const hRes = await fetch(`${base}/block-height/${blockLeaf}`);
        if (!hRes.ok) continue;
        const hash = (await hRes.text()).trim();
        const bRes = await fetch(`${base}/block/${hash}`);
        if (!bRes.ok) continue;
        data = await bRes.json();
        if (!data.id) data.id = hash;
        break;
      } catch { /* try the next mirror */ }
    }
    if (!data) {
      line('this block').textContent = 'the chain could not be reached';
      return;
    }

    const hf = composeBlockHeaderFields(data);
    powFigure(line('chapter hash'), data.id, 'the block hash — the chapter\'s own name');

    const ver = formatBlockVersion(data.version);
    const vv = line('version');
    if ((bip.bit != null || bip.version != null) && inSignalingPeriod(blockLeaf)) {
      // The reprint keeps the ballot's own reading of the word: binary,
      // the counted bit bold, the frontispiece's form on hover.
      const aye = bip.bit != null ? ((data.version >>> bip.bit) & 1) === 1 : (data.version >>> 0) >= bip.version;
      vv.classList.add('bb-bits');
      vv.append(mark('v', 'dt', ver.title), versionBitsEl(data.version, bip.bit ?? null, aye));
    } else {
      const text = ver.text.replace(/^v/, '');
      vv.append(mark('v', 'dt', ver.title), document.createTextNode((/^\d/.test(text) ? '' : ' ') + text));
    }
    vv.title = ver.title;

    // The verdict, beside the field it is read off: a ballot is what brought
    // the reader here. A coinbase ballot's verdict reads off the chapter's
    // first line instead, fetched and quoted in its own row.
    if (bip.bit != null || bip.version != null) {
      const aye = bip.bit != null ? ((data.version >>> bip.bit) & 1) === 1 : (data.version >>> 0) >= bip.version;
      const sv = line('signal');
      sv.textContent = aye
        ? `signals — ${bip.bit != null ? `bit ${bip.bit} set` : `version ${versionName(bip.version)} or above`}`
        : `— ${bip.bit != null ? `bit ${bip.bit} not set` : `below version ${versionName(bip.version)}`}`;
      sv.style.color = aye ? 'var(--accent)' : 'var(--meta)';
    } else if (bip.coinbase) {
      const sayV = line('coinbase');
      sayV.textContent = '…';
      const sigV = line('signal');
      sigV.textContent = '…';
      coinbaseOf(data.id).then((say) => {
        if (say == null) { sayV.textContent = 'the chain could not be reached'; sigV.textContent = '—'; return; }
        sayV.textContent = say || '(nothing legible)';
        sayV.title = "the chapter's first line — the printable runs of the coinbase scriptSig";
        const aye = say.includes(bip.coinbase);
        sigV.textContent = aye ? `signals — ${bip.coinbase}…/ in the coinbase` : `— no ${bip.coinbase}…/ in the coinbase`;
        sigV.style.color = aye ? 'var(--accent)' : 'var(--meta)';
      }).catch(() => { sayV.textContent = 'the chain could not be reached'; sigV.textContent = '—'; });
    }

    if (data.previousblockhash) {
      powFigure(line('previous'), data.previousblockhash, 'the previous chapter\'s hash — what this header commits to behind it');
    }
    const mr = line('merkle root');
    mr.append(
      mark('⋔', 'merkle-mark', `the merkle root — every section of the chapter, committed\n${data.merkle_root}`),
      sup(32, '32 bytes'),
      ' ', fig(reverseHex(data.merkle_root)),
    );
    line('mined').textContent = hf.timestamp;
    const tv = line('target');
    tv.textContent = hf.bitsExpr ? `${hf.bits} < ${hf.bitsExpr}` : hf.bits;
    tv.title = hf.bitsTitle;
    const nv = line('nonce');
    nv.append(mark('η', 'dt', hf.nonceTitle ?? 'the nonce'), document.createTextNode(hf.nonce));
    sayProse();
  })();

  // The window's bounds, for the vertical turns: a closed ballot's are the
  // file's own arithmetic; a live one's wait on the tip. Above the newest
  // block lies the ballot itself.
  const WINDOW = Number.isFinite(bip.window) ? bip.window : 2016;
  let newest = Number.isFinite(bip.ballot) ? bip.ballot : null;
  const blockHref = (h) => `./bitcoin-appendix.html?part=consensus&bip=${bip.key}&block=${h}`;
  const upEl = $('block-up');
  const downEl = $('appx-down');
  const toBallot = () => {
    try { sessionStorage.setItem('glossia-ballot-land', String(blockLeaf)); } catch (_) { /* unavailable */ }
    navTo(bipHref(bip), 'drop');
  };
  // A live ballot's record runs back to where its story begins (the earliest
  // chapter the fork names), and the vertical walk reaches as far as the
  // table does.
  const markedFloor = bip.ballot == null
    ? bip.entries.filter((e) => !e.expected && !e.page && isBlockId(e.id)).map((e) => Number(e.id))
      .reduce((a, b) => Math.min(a, b), Infinity)
    : Infinity;
  const wire = () => {
    let oldest = newest != null ? Math.max(0, newest - WINDOW + 1) : null;
    if (oldest != null && Number.isFinite(markedFloor)) oldest = Math.min(oldest, markedFloor);
    // The table reads oldest first, so its leaves stack the same way: older
    // above, newer below, the ballot itself above the window's opening --
    // and the reader who keeps pushing up from any block surfaces where the
    // replay starts.
    const olderUp = blockLeaf > 0 && (oldest == null || blockLeaf > oldest);
    upEl.title = olderUp ? 'the next older block of the window' : 'up to the ballot';
    upEl.setAttribute('aria-label', olderUp ? 'The next older block of the window' : 'Up to the ballot');
    upEl.href = olderUp ? blockHref(blockLeaf - 1) : bipHref(bip);
    upEl.classList.remove('hidden');
    window.__appxAscend = () => (olderUp ? navTo(blockHref(blockLeaf - 1), 'drop') : toBallot());
    const newer = newest == null || blockLeaf < newest;
    downEl.classList.toggle('hidden', !newer);
    if (newer) {
      downEl.setAttribute('aria-label', 'The next newer block of the window');
      downEl.title = 'the next newer block of the window';
      firstChapter = null;   // the ▾ is this leaf's own turn, not a descent into the book
      window.__appxDescend = () => navTo(blockHref(blockLeaf + 1), 'down');
    } else {
      window.__appxDescend = () => { /* the ballot's close: nothing below */ };
    }
  };
  wire();
  if (newest == null) {
    chainTip().then((tip) => {
      if (tip != null) { newest = tip; wire(); }
    }).catch(() => { /* the blind bounds stand */ });
  }
  upEl.addEventListener('click', (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button !== 0) return;
    ev.preventDefault();
    window.__appxAscend();
  });
  downEl.addEventListener('click', (ev) => {
    ev.preventDefault();
    window.__appxDescend();
  }, { capture: true });
}

// ── Citations: the works, and the door for adding one ─────────────────────
//
// The rule for a leaf is that it lists nothing -- the contents lists, the leaf
// explains. This appendix bends it, for the reason it exists: it is the one a
// reader can add to, and what they add has to be shown back to them somewhere
// they can also take it out again. So the leaf carries the list and, at its
// foot, the picker: a proof dropped there is read, checked against the block
// its own bytes name, and kept -- after which it stands in the contents beside
// the bundled ones, under the ribbon a bookmark flies.
if (kind === 'proofs') {
  const { allProofs, readProof, attests, keepProof, dropProof, citeOf, hrefOf, leafOf, estimatedDate, minedDate } = await import('./btc-proofs.js');
  const { isOtsProof } = await import('./btc-ots.js');
  const { blockAt } = await import('./btc-index.js');
  const { toSuperscript, toSubscript } = await import('./btc-sigla.js');

  const listEl = $('proof-list');
  const card = $('proof-card');
  const result = $('proof-result');
  const fileInput = $('proof-file');
  const dropZone = $('proof-drop');
  card.classList.remove('hidden');

  // The list, rebuilt from storage and from the bundled index each time it
  // changes. The first row is also where the ▾ descends to: an appendix opens
  // at the first chapter of what it gathers, and here that is the earliest
  // chapter any of these files was stamped into.
  async function paintList() {
    const listed = await allProofs(part).catch(() => []);
    listEl.textContent = '';
    for (const proof of listed) {
      const row = document.createElement('div');
      row.className = 'proof-row';
      const a = document.createElement('a');
      a.href = leafOf(proof);       // the file's own leaf: its proof, rung by rung
      if (proof.kept) {
        const bm = document.createElement('span');
        bm.className = 'proof-bm'; bm.setAttribute('aria-label', 'your proof');
        bm.innerHTML = '<svg viewBox="0 0 12 16" width="8"><path fill="currentColor" d="M0 0h12v16l-6-4-6 4z"/></svg>';
        a.append(bm);
      }
      const mark = document.createElement('span');
      mark.className = 'proof-cite-mark';
      mark.textContent = proof.n ? `‡${toSubscript(proof.n)} ` : '‡ ';
      mark.title = proof.n ? `cited work ${proof.n}` : "your addendum — kept in this browser, outside the edition's numbering";
      const name = document.createElement('span');
      name.className = 'proof-name'; name.textContent = proof.title;
      // The date the citation amounts to: the height's own estimate at once,
      // hedged; the clock of the block the proof lands in, replacing it when
      // the archive or a mirror answers.
      const when = document.createElement('span');
      when.className = 'proof-date';
      when.textContent = estimatedDate(proof.place.height);
      when.title = 'about when the chapter its proof lands in was mined — estimated from the height alone, offline';
      minedDate(proof.place.height).then((exact) => {
        if (!exact) return;
        when.textContent = exact;
        when.title = 'the clock of the block its proof lands in — the chain\'s own date for this file';
      });
      const cite = document.createElement('span');
      cite.className = 'proof-cite'; cite.textContent = citeOf(proof.place);
      a.append(mark, name, when, cite);
      // What the row claims, in full, on hover -- including whether anyone has
      // yet asked the chain about it.
      a.title = `${proof.file} — ${proof.hash} ${proof.digest}\nstamped into ${citeOf(proof.place)}`
        + (proof.verified === false ? '\nnot yet checked against the chain' : '');
      row.append(a);
      if (proof.kept) {
        const x = document.createElement('button');
        x.type = 'button'; x.className = 'proof-drop-btn'; x.textContent = '✕';
        x.title = `Take "${proof.title}" out of this appendix`;
        x.setAttribute('aria-label', `Remove ${proof.title}`);
        x.addEventListener('click', () => { dropProof(proof.digest); paintList(); });
        row.append(x);
      }
      listEl.append(row);
    }
    listEl.classList.toggle('hidden', !listed.length);
    if (listed.length) {
      firstChapter = leafOf(listed[0]);
      $('appx-down').classList.remove('hidden');
    }
  }
  await paintList();

  // The picker, moved here from the search page: a proof is a query, but it is
  // also a thing a reader keeps, and keeping belongs where the kept things are.
  const stamp = (ts) => new Date(ts * 1000).toISOString().slice(0, 16).replace('T', ' ');
  const reverseHex = (hex) => (hex.match(/../g) || []).reverse().join('');
  const BEST_OF = 5;
  let engine = null;
  const glossia = () => (engine ||= import('./glossia-msg.js').then(async (m) => { await m.init(); return m; }));

  // A hash, as the book sets one: its mark, its count, then the figure itself
  // in words. There is no hex fallback -- hex is the one notation this book
  // does not write in -- so a figure the engine never arrives to say stays
  // unsaid, with the hex on the mark for a reader checking an explorer.
  const figure = (hex, mark, markClass, sup, title, reverse) => ({ hex, mark, markClass, sup, title, reverse });
  const hashFig = (hex, title) => figure(hex, 'h', 'dt', hex.length / 2, title, false);
  const identityFig = (hex, title) => figure(hex, '⌘', 'dt', 256, title, true);
  const merkleFig = (hex, title) => figure(hex, '⋔', 'merkle-mark', hex.length / 2, title, true);

  const prosed = new Map();
  const UNSAID = 'the engine that puts a hash into words did not load';
  const unsay = (el) => { el.textContent = 'unsaid'; el.title = UNSAID; el.classList.add('waiting'); };
  function setProse(cells) {
    if (!cells.length) return;
    glossia().then((m) => {
      for (const { el, hex, reverse } of cells) {
        try {
          const bytes = reverse ? reverseHex(hex) : hex;
          if (!prosed.has(bytes)) prosed.set(bytes, m.encodeCanonical(bytes, m.bookLang(), BEST_OF).prose);
          el.textContent = prosed.get(bytes);
          el.classList.remove('waiting');
        } catch { unsay(el); }
      }
    }).catch(() => { for (const { el } of cells) unsay(el); });
  }

  const say = (rows, verdict = null, href = null, label = '') => {
    result.textContent = '';
    const cells = [];
    for (const [key, val] of rows) {
      const line = document.createElement('div'); line.className = 'proof-line';
      const k = document.createElement('div'); k.className = 'proof-key'; k.textContent = key;
      const v = document.createElement('div'); v.className = 'proof-val';
      if (typeof val === 'string') {
        v.textContent = val;
      } else {
        const m = document.createElement('span');
        m.className = val.markClass; m.textContent = val.mark;
        m.title = `${val.title}\n${val.hex}`;      // the mark carries the hex, as the book's copy menu does
        const sup = document.createElement('span');
        sup.className = 'op-count'; sup.textContent = toSuperscript(val.sup);
        sup.title = val.mark === '⌘' ? `${val.sup} bits — ⌘'s superscript counts bits` : `${val.sup} bytes`;
        const fig = document.createElement('span');
        fig.className = 'proof-figure waiting'; fig.textContent = '…';
        v.append(m, sup, ' ', fig);
        cells.push({ el: fig, hex: val.hex, reverse: val.reverse });
      }
      line.append(k, v); result.append(line);
    }
    setProse(cells);
    if (verdict) {
      const el = document.createElement('div');
      el.className = `proof-verdict ${verdict[1]}`; el.textContent = verdict[0];
      result.append(el);
    }
    if (href) {
      const a = document.createElement('a');
      a.className = 'proof-open'; a.href = href; a.textContent = label;
      result.append(a);
    }
    result.classList.remove('hidden');
  };

  async function takeProof(fileList) {
    const files = [...fileList];
    if (!files.length) return;
    say([['reading', files.map((f) => f.name).join(', ')]]);
    const read = await Promise.all(files.map(async (f) => ({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) })));
    // The proof is recognized by its magic, not its name: a proof saved as
    // anything at all is still a proof, and the file beside it is the subject.
    const file = read.find((f) => isOtsProof(f.bytes));
    if (!file) {
      say([['dropped', read.map((f) => f.name).join(', ')]],
        ['No OpenTimestamps proof here — a .ots file opens with its own magic, and none of these do.', 'bad']);
      return;
    }
    let proof;
    try { proof = await readProof(file.bytes); }
    catch (e) { say([['proof', file.name]], [`This proof will not read: ${e.message}.`, 'bad']); return; }

    const rows = [['proof', file.name],
      [proof.hash, hashFig(proof.digest, `${proof.hash} digest — the bytes this proof commits to`)]];

    // A proof commits to a digest, not to a file. With the subject in hand too,
    // the reader can see for themselves which file this proof is about -- and
    // the entry is named after that file rather than after the proof.
    const subject = read.find((f) => f !== file);
    let checked = null;
    let title = file.name.replace(/\.ots$/i, '');
    if (subject) {
      checked = await attests(proof, subject.bytes);
      rows.push([subject.name, checked ? 'matches the proof' : 'does NOT match the proof']);
      if (checked) title = subject.name;
    }

    if (!proof.place) {
      for (const uri of proof.pending) rows.push(['pending', uri]);
      say(rows, [proof.pending.length
        ? 'Not in a block yet, so there is no chapter to keep it under. The calendars above are holding this digest for the next transaction they publish; come back and upgrade the proof once it confirms.'
        : 'This proof reaches no Bitcoin block, so it names no chapter here.', 'unsure']);
      return;
    }

    const cite = citeOf(proof.place);
    const href = hrefOf(proof.place);
    rows.push(['stamped into', `block ${proof.place.height} — ${cite}`]);
    if (proof.place.txid) rows.push(['transaction', identityFig(proof.place.txid, 'the transaction carrying the commitment — its txid')]);
    rows.push(['merkle root', merkleFig(proof.place.merkleRoot, 'the merkle root the proof reduces to — what the block header must commit to')]);
    say(rows, ['Asking the chain for that block…', 'unsure']);

    // The verification, entire: the operations reduce to 32 bytes, and those
    // bytes either are the merkle root the block's header commits to or they
    // are not. Nothing else about the proof matters, and no calendar is
    // consulted -- an upgraded proof needs nobody's word for anything.
    const block = await blockAt(proof.place.height).catch(() => null);
    if (block && block.merkleRoot !== proof.place.merkleRoot) {
      rows.push(['chain says', merkleFig(block.merkleRoot, "the merkle root that block's header actually commits to")]);
      say(rows, ['The roots differ. This proof does not commit to that block, whatever it says — nothing has been kept.', 'bad']);
      return;
    }
    const verified = !!block;
    if (verified) rows.push(['mined', `${stamp(block.timestamp)} UTC`]);
    keepProof({ file: subject ? subject.name : file.name, title, bytes: file.bytes, digest: proof.digest, verified, checked });
    await paintList();
    say(rows, [verified
      ? `Verified, and kept: “${title}” now stands in this appendix at ${cite}${
        checked ? ', and the file beside the proof is the one it attests' : ''}.`
      : `The chain could not be reached, so nothing here is checked — “${title}” is kept at ${cite} as the proof's own claim, and says so until someone asks.`,
    verified ? 'good' : 'unsure'], href, `Read ${cite} →`);
  }

  $('proof-pick').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { const f = fileInput.files; takeProof(f).finally(() => { fileInput.value = ''; }); });
  for (const type of ['dragenter', 'dragover']) {
    dropZone.addEventListener(type, (e) => { e.preventDefault(); dropZone.classList.add('over'); });
  }
  for (const type of ['dragleave', 'drop']) {
    dropZone.addEventListener(type, (e) => { e.preventDefault(); dropZone.classList.remove('over'); });
  }
  dropZone.addEventListener('drop', (e) => { if (e.dataTransfer?.files?.length) takeProof(e.dataTransfer.files); });
}

// Only the FIRST appendix's own leaf turns back into the body -- a leaf
// inside it (the queue, the mines, one mine, its chapters) turns among its
// own siblings, and its lack of a backward neighbour means the run simply
// starts there. Without that guard a mine would offer the last volume as its
// left-hand turn, which is a turn out of two levels at once.
if (!prevTo && !bip && !ins && !QUEUE && AT === null) {
  chainTip().then((tip) => {
    if (tip == null) return;
    const volume = volumeBookChapter(tip).volume;
    const href = `./bitcoin-book.html?block=${heightOf(volume, 1, 1)}&page=volume`;
    window.__appxTurns.prev = href;
    const a = turnLink(href, `‹ Volume ${toRoman(volume)}`, true);
    turns.prepend(a);   // back is the left-hand turn, whenever it arrives
  }).catch(() => { /* no tip, no way back but the contents */ });
}


</script>
