# CLTV's first famous accident, twelve days after BIP65 activated. weex,
# testing the new opcode, sent 0.0003 ₿ to a P2SH address intending a lock
# that expired the same evening — timestamp 1451166600, Dec 26 2015 21:50
# UTC. Written into the script with its four bytes reversed it reads
# 2282454870: April 30 2042, 07:14:30 UTC. Diagnosed in the coinb.in issue
# thread by dabura667 ("this is why we have testnet"); untouched since. The
# redeem script, being P2SH, stays off the chain until a spend that cannot
# come before 2042 — the evidence for the lock is itself timelocked, a caveat
# the reading states in so many words.
