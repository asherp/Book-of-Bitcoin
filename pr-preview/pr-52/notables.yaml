# Entries kept without a reading, waiting on a note rather than on a citation:
# Eligius, the first coinbase OP_RETURN, Romans 12:21, the Sermon on the Mount,
# and the supply-cap section above. Each is worth reading; none has a published
# reading yet, and an annotation layer that guesses is worse than one with gaps.
