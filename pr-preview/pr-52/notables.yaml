# SPDX-License-Identifier: CC-BY-4.0
#
# notables.yaml — the curated table of contents for the Bitcoin Book: which
# blocks and transactions are worth a reader's attention, what to call them,
# and where the reading of each one lives.
#
# This file and the commentary/ directory beside it are the editorial layer — a
# reading of the record, not the record itself — and are licensed CC BY 4.0,
# separately from the machinery that loads and renders them (btc-notables.js,
# btc-commentary.js, MIT OR Apache-2.0) and from the book's prose (CC0, the
# chain's own speech). See the README's License section. The split is the book's
# argument applied to its own source tree: what the chain says belongs to no
# one; what someone decided is worth naming carries their name.
#
# YAML and Markdown rather than JavaScript because this is the part of the
# repository written by hand, by people who are writing rather than programming.
# Nothing is generated from it: the browser reads this file and those Markdown
# files as they stand (btc-yaml.js reads the small subset used here, and fails
# loudly rather than guessing).
#
# An `id` is written in any form the search box takes (the grammar is
# btc-lookup.js, one parser for the whole book, so a form that works in one
# place works in every place):
#
#   57043                a block height
#   -1                   counted back from the chain tip: -1 is the latest block
#   4a5e1e…33b           a 64-hex transaction id (or a block hash)
#   III β2 ■5            the book's own citation — sigils optional ("III 2 5")
#   I β29 ■596 §85       …to whatever depth is meant: a section here
#   I β29 ■596 §85.4     …an output within that section
#   v1b29c596s85         the same citation in the spelling a link carries
#   1HB5XMLmzFVj8AL…     an address — a name rather than a place, so it opens
#                        no chapter: the entry reads in the Ledger, and its
#                        readings are readings of that name
#
# A reference is resolved by arithmetic when the file is read, into exactly the
# height and index an entry would otherwise carry by hand — and its depth says
# which page it means, so `III β2` is a book's leaf and `III` a volume's. Write
# whichever form reads better where you are working; `node
# tools/check-editorial.mjs` prints what each one resolved to.
#
# Every entry is cited by its reference, never its raw id: a block's is known
# offline (volume·book·chapter from its height); a transaction's is resolved the
# same way the reader resolves a citation — a /tx/<txid>/merkle-proof lookup
# gives its block height and index, yielding volume·book·chapter·§section.
# Ordered chronologically (reading order).
#
# An entry may be found in more than one place. Write `ids:` instead of `id:`,
# each item a place of its own (with its own index / page / out where it needs
# them), and `as:` naming what that place is within the entry — the contents
# prints it after the title, so rows sharing a name still say which is which.
# The readings below belong to the entry, so one reading serves every place: the
# four printings of the two twice-confirmed coinbases are one story, told once.
#
#   - title: The twice-confirmed coinbases
#     ids:
#       - id: '91722'
#         index: 0
#         as: first printing
#       - id: '91880'
#         index: 0
#         as: second printing
#     commentary:
#       - file: bip30-duplicate-coinbases.md
#
# The fields, all optional but `title` and `id` (or `ids`):
#
#   index: 2          the transaction's position within the block (0-based),
#                     rendered as its §section — how the twice-confirmed BIP30
#                     coinbases are cited, their txid alone being ambiguous.
#                     A §section reference sets this instead, and a reference
#                     that disagrees with it is an error rather than a ranking
#   page: book        the id is then the first block of a book (a difficulty
#                     window) and the entry opens that book's own leaf rather
#                     than a chapter; `page: volume` likewise for a volume's.
#                     A book- or volume-deep reference sets this too
#   out: 4            an output within the section, as a §85.4 reference names —
#                     the page opens at that output
#   commentary:       the readings of this passage, in reading order, each one a
#     - file: x.md    Markdown file in commentary/. A file with no `by` is the
#     - file: y.md    book's own reading, unsigned, because the book is its
#       by: Name      author; a `by` is somebody else's, published under CC BY
#       href: https://…   4.0 with their name on it (see CONTRIBUTING.md) and
#                     credited in the table of contents as well as on the page
#
# Translations. A title or a reading may carry translations as suffixed keys
# beside the English original, which is the source text and the fallback — a
# language with no suffix reads the original, so translations arrive one at a
# time. The suffixes are the reader's UI languages (-cs Czech, -de German;
# Latin has none on purpose: a Latin reader gets the last modern tongue, the
# rule the whole chrome keeps). A translated reading is a variant of the SAME
# reading — one entry, its author's `by` unchanged — and the translation is
# itself authored work, so `translator-cs:` names who made it and is credited
# beside the author when that variant is shown:
#
#   - title: The Genesis Block
#     title-cs: Blok genesis
#     title-de: Der Genesis-Block
#     id: '0'
#     commentary:
#       - file: the-genesis-block.md
#         file-cs: the-genesis-block.cs.md
#         translator-cs: Jméno Příjmení
#
# An inline `note:` translates the same way (`note-cs:`). `node
# tools/check-editorial.mjs` verifies translated files exist and carry their
# CC-BY SPDX line, exactly as it does the originals.
#
# An entry with no commentary is the normal case, not an oversight: a passage
# can be worth keeping before anyone has finished saying why. Where a story is
# not yet checked against the chain it stays a comment here rather than becoming
# a file — commentary is published matter, and publishing it is the assertion.
# A reading speaks to what is VISIBLE in the passage, read with hindsight —
# what it set in motion, the precedent it became — and says it plainly:
# declarative sentences, checkable facts, no flourish (see CONTRIBUTING.md).
#
# The soft forks that activated by miner signaling — the 95% supermajority forks
# (BIP34/66/65) and the version-bits forks (CSV, SegWit, Taproot) — each mark
# the book their activation closed with `page: book`, since for them the
# difficulty window is the ballot box; flag-day and release-based forks get no
# book. BIP91 signaled over its own 336-block epochs, which no book aligns
# with — but its whole drama still fits one book: III β29 opens, locks it in at
# ■321, and activates it at ■673.

# Block 0 itself. Its coinbase follows as the next entry — the chapter
# precedes its own §1 in reading order.
- title: The Genesis Block
  id: '0'
  commentary:
    - file: the-genesis-block.md
      by: Claude Fable 5
