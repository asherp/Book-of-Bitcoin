name: Twitter Bot Tests

# The bot's own checks, on every change that could break it — its sources,
# and the book modules it composes passages through (a change to
# btc-prose.js or btc-tx.js reaches the bot's output directly).
#
# This is the expensive half of CI, and the only half that needs a `paths:`
# filter: it builds the WASM engine from source and installs Chromium. With
# both present the tests that skip on a bare checkout come off the bench —
# one renders a real verse and asserts it decodes back to the genesis txid,
# one renders a real PNG and asserts the fit — and the rehearsal drives a
# whole pass (search, resolve, render, upload, reply, record) against local
# stand-ins for the chain and for X. It needs no credential and cannot
# reach either real service.
#
# The cheap half — the same suite on a bare checkout — runs unconditionally
# on every change in tests.yml, which is where a page's font stacks and the
# rest of the guards that read web/ actually get checked.

# The hand-listed test files these filters used to carry are gone: the run
# below is a glob now, so naming individual suites here could only put the
# two out of step again. `tools/*.test.mjs` covers every one of them at
# once, including any that lands next.
on:
  push:
    paths:
      - 'tools/twitter-bot/**'
      - 'tools/*.test.mjs'
      - 'web/btc-prose.js'
      - 'web/btc-tx.js'
      - 'web/btc-citation.js'
      - 'web/notables.yaml'
      - 'web/glossia-msg.js'
      - 'tools/passage-page.mjs'
      - 'tools/prerender-passages.mjs'
      - 'web/btc-contribute.js'
      - 'web/sw.js'
      - 'build_web.sh'
      - '.github/workflows/twitter-bot-test.yml'
  pull_request:
    paths:
      - 'tools/twitter-bot/**'
      - 'tools/*.test.mjs'
      - 'web/btc-prose.js'
      - 'web/btc-tx.js'
      - 'web/btc-citation.js'
      - 'web/notables.yaml'
      - 'web/glossia-msg.js'
      - 'tools/passage-page.mjs'
      - 'tools/prerender-passages.mjs'
      - 'web/btc-contribute.js'
      - 'web/sw.js'
      - 'build_web.sh'
      - '.github/workflows/twitter-bot-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same suite tests.yml runs bare, with everything present — plus the
  # full-pass rehearsal, which is the part that exists only here.
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same sequence deploy-web.yml builds the engine with — including
      # its warning about a system wasm-opt, which applies here too.
      - name: Fetch glossia engine crate
        run: |
          ./build_web.sh --fetch-only
          echo "GLOSSIA_VERSION=$(sed -n 's/.*GLOSSIA_VERSION:-\([0-9][0-9.]*\).*/\1/p' build_web.sh)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .glossia-build/glossia-${{ env.GLOSSIA_VERSION }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: ./build_web.sh

      - name: Install the image renderer
        working-directory: tools/twitter-bot
        run: npm install --no-audit --no-fund

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tools/twitter-bot/package.json') }}

      - name: Install Chromium
        working-directory: tools/twitter-bot
        run: npx playwright install --with-deps chromium

      # With the engine and the browser present, the tests that skip on a bare
      # checkout now run: one renders a real verse and asserts it decodes back
      # to the genesis txid, one renders a real PNG and asserts the fit, and
      # the composition checks across the notation suites (which need
      # btc-prose.js to import, engine and all) come off the bench. The whole
      # suite, by the same glob tests.yml uses — every one of those skips is
      # gated on web/glossia.js, and this is the only job that has it.
      - name: Run the suite (engine + renderer)
        run: node --test 'tools/**/*.test.mjs' tools/twitter-bot/test.mjs

      - name: Rehearse a full pass
        run: node tools/twitter-bot/rehearse.mjs
