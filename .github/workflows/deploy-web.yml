name: Deploy Web App

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/**'
      - 'build_web.sh'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Pushing the built site to the gh-pages branch requires write access.
permissions:
  contents: write

# Serialize every workflow that pushes to gh-pages under one repo-wide group.
# Each push to gh-pages triggers GitHub's own pages-build-deployment, and Pages
# only runs one deployment at a time — two overlapping pushes make the loser
# fail with "Deployment failed, try again later", which is what leaves a freshly
# deployed path (e.g. a PR preview) returning 404. The PR Preview workflow shares
# this exact group name so production and preview deploys can never race.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every production deploy is a release, versioned by calendar:
      # vYYYY.0M.0D.HH — the UTC date and hour the deploy started. A second
      # release in the same hour appends the minute (vYYYY.0M.0D.HH.MM) to
      # stay unique; the gh-pages-deploy concurrency group serializes these
      # runs, so two deploys can never compute the same version.
      - name: Compute release version
        run: |
          git fetch --quiet origin 'refs/tags/*:refs/tags/*'
          version="$(date -u +%Y.%m.%d.%H)"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            version="${version}.$(date -u +%M)"
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      # The Glossia engine (the Rust core compiled to WASM) is consumed as a
      # published crates.io release, pinned in build_web.sh. Fetch its source
      # tarball first so the cargo cache below can key off the extracted crate.
      - name: Fetch glossia engine crate
        run: |
          ./build_web.sh --fetch-only
          echo "GLOSSIA_VERSION=$(sed -n 's/.*GLOSSIA_VERSION:-\([0-9][0-9.]*\).*/\1/p' build_web.sh)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .glossia-build/glossia-${{ env.GLOSSIA_VERSION }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # NOTE: do not install a system `wasm-opt` here. wasm-pack uses its own
      # bundled wasm-opt and runs the size pass configured under
      # [package.metadata.wasm-pack.profile.release] in glossia's Cargo.toml; a
      # system binary gets picked up instead and can reject modern wasm features.
      - name: Build WASM
        run: ./build_web.sh

      # Headless Chromium, for the passage cards: each curated passage's page
      # carries its own og:image, rendered by the same renderer the reply bot
      # uses (tools/twitter-bot/image.mjs). Optional at runtime — without it
      # the pages still ship and fall back to the site's standing card — so
      # this step must never fail the deploy.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tools/twitter-bot/package.json') }}

      - name: Install the card renderer
        continue-on-error: true
        working-directory: tools/twitter-bot
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Pre-render the curated passages as static markdown (web/passages/) and
      # generate sitemap.xml — the text AI crawlers and no-JS readers actually
      # get, since the live pages compose their prose in the browser. Runs the
      # same parse/compose/encode pipeline in Node against the WASM artifact
      # just built. Also writes each passage's page at its citation path
      # (web/III/2/5/1/) with its own card under web/cards/, so a shared link
      # previews as that passage rather than as the site (tools/passage-page.mjs).
      # Best-effort: the script skips entries whose explorer data can't be
      # fetched and always exits 0, so an explorer outage never blocks a deploy
      # (the sitemap still ships, covering whatever rendered).
      - name: Pre-render curated passages
        run: node tools/prerender-passages.mjs

      # Stamp the version into the deployed site so a running copy can be
      # asked which release it is: https://bookofbitcoin.io/version.json
      - name: Stamp version.json
        run: printf '{"version":"%s"}\n' "$VERSION" > web/version.json

      # Deploy the production site to the root of gh-pages. clean-exclude keeps
      # the pr-preview/ directory (managed by the PR Preview workflow) intact so
      # production deploys don't wipe live preview deployments.
      - name: Deploy to GitHub Pages (production)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: web
          clean: true
          clean-exclude: |
            pr-preview/

      # Tag the commit only after the deploy step succeeded, so every tag
      # marks a release that actually shipped.
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/v${VERSION}"
