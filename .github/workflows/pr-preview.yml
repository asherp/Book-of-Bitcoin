name: PR Preview

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

# contents: write to push the preview into gh-pages; pull-requests: write so the
# action can post/update the preview-link comment on the PR.
permissions:
  contents: write
  pull-requests: write

# Share one repo-wide group with the Deploy Web App workflow so no two gh-pages
# pushes overlap. GitHub Pages serves one deployment at a time; overlapping
# pushes make the loser fail with "Deployment failed, try again later", leaving
# the just-deployed preview at pr-preview/pr-<N>/ returning 404. cancel-in-progress
# is false so an in-flight deploy always finishes publishing before the next runs.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    # Skip pull requests from forks: their restricted GITHUB_TOKEN cannot push to
    # gh-pages, so a preview deploy would always fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      # The build steps are skipped when a PR is closed: pr-preview-action only
      # needs to tear down the existing preview directory in that case.

      # The curated contents and its commentary are hand-authored files that
      # nothing is generated from (web/notables.yaml, web/commentary/*.md), so
      # this is the check that stands in for a build step: it reads them the way
      # the browser will and fails on anything that would reach a reader as a
      # missing reading or an empty contents. First, and cheapest — a PR that
      # breaks the editorial layer says so before the WASM build runs.
      - name: Check the editorial layer
        if: github.event.action != 'closed'
        run: node tools/check-editorial.mjs

      # The Glossia engine (the Rust core compiled to WASM) is consumed as a
      # published crates.io release, pinned in build_web.sh. Fetch its source
      # tarball first so the cargo cache below can key off the extracted crate.
      - name: Fetch glossia engine crate
        if: github.event.action != 'closed'
        run: |
          ./build_web.sh --fetch-only
          echo "GLOSSIA_VERSION=$(sed -n 's/.*GLOSSIA_VERSION:-\([0-9][0-9.]*\).*/\1/p' build_web.sh)" >> "$GITHUB_ENV"

      # The Scriptorium engine (the decoration layer's Rust core) is the same
      # arrangement: its own crate, pinned in build_scriptorium.sh.
      - name: Fetch scriptorium engine crate
        if: github.event.action != 'closed'
        run: |
          dir="$(./build_scriptorium.sh --fetch-only | sed -n 's/^==> Engine source ready at //p')"
          echo "SCRIPTORIUM_DIR=${dir%.}" >> "$GITHUB_ENV"

      - name: Install Rust
        if: github.event.action != 'closed'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        if: github.event.action != 'closed'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .glossia-build/glossia-${{ env.GLOSSIA_VERSION }}
            ${{ env.SCRIPTORIUM_DIR }}

      - name: Install wasm-pack
        if: github.event.action != 'closed'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # NOTE: do not install a system `wasm-opt` here. wasm-pack uses its own
      # bundled wasm-opt and runs the size pass configured under
      # [package.metadata.wasm-pack.profile.release] in glossia's Cargo.toml; a
      # system binary gets picked up instead and can reject modern wasm features.
      - name: Build WASM
        if: github.event.action != 'closed'
        run: |
          ./build_web.sh
          ./build_scriptorium.sh

      # Previews are not releases — they get no tag and no place in the CalVer
      # sequence — but the cover's edition line and version.json should still
      # work, so stamp the preview's deploy time marked as the preview it is
      # (v2026.07.28.14-pr21). The -prN suffix deliberately fails the CalVer
      # parse in btc-chrome.js, so the Update button's behind-arithmetic
      # stays off on previews.
      - name: Stamp preview version.json
        if: github.event.action != 'closed'
        run: printf '{"version":"%s-pr%s"}\n' "$(date -u +%Y.%m.%d.%H)" "${{ github.event.pull_request.number }}" > web/version.json

      # On open/synchronize/reopen: deploy web/ to gh-pages under
      # pr-preview/pr-<N>/ and comment the URL. On close: remove that directory.
      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./web/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
