# The difficulty series, each entry citing the BOOK whose pace earned the
# adjustment rather than the chapter where the new target first bound: a
# retarget is computed from the 2,016 blocks behind it, and a book is exactly
# those blocks. Titled only by the percentage moved — the story behind each
# swing is its note. Figures from the canonical difficulty history. The five
# largest climbs are all from 2010; the deep cuts cluster later. The up-clamp
# (×4) was hit once; the deepest cut ever is −27.94%, against a −75% floor.
#
# Only Volume I can be cited this way. Book numbering restarts at each halving
# and 210,000 is not a multiple of 2016, so from Volume II on a real retarget
# window straddles two books — offset 672 blocks in Volume III, 1,008 in
# Volume IV — and no book names it. Those later entries stay on their retarget
# chapter, below.
