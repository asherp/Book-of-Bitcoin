# A curated entry may name an ADDRESS instead of a place in the chain. An
# address is a name rather than a place, so it opens no chapter: the row reads
# in the Ledger (bitcoin-ledger.html), which is where a name's record is kept —
# and the readings below it are readings of a name, which is the kind of claim
# this book is most insistent about crediting. That these coins are that party's
# is somebody's assertion, however well evidenced; the Ledger sets it apart from
# the record exactly as the reading page sets a passage's commentary apart.
#
# Which ledgers the book shelves, and what each is called, is still
