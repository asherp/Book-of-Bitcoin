# BIP30's origin story, and the clearest case for `ids:` — one thing the book
# keeps, found in four places. The coinbases of 91,722 and 91,812 were repeated
# verbatim by 91,880 and 91,842, overwriting them in the UTXO set — the only two
# txids ever confirmed twice:
#   e3bf3d07d4b0375638d5f1db5255fe07ba2c4cb067cd81b84ee974b6585fb468 (91,722 -> 91,880)
#   d5d27987d2a3dfc724e359870c6644b40e497bdc0589a033220fe15429d88599 (91,812 -> 91,842)
# All four printings are cited by height (§1 of their blocks) — a txid lookup can
# only ever land on one of a duplicate's two sections — and each owns its own
# page number: pages count positions, not distinct txids, so the chain's page
# count runs exactly two past its distinct-txid count, and these are the two (see
# btc-pages.js). `as` is what tells the four rows apart in the contents; the
# reading beneath them is written once.
- title: The twice-confirmed coinbases
  ids:
    - id: '91722'
      index: 0
      as: e3bf…468, first printing
    - id: '91812'
      index: 0
      as: d5d2…599, first printing
    - id: '91842'
      index: 0
      as: d5d2…599, second printing
    - id: '91880'
      index: 0
      as: e3bf…468, second printing
