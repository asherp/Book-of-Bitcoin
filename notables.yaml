# More transaction-level entries still to confirm against the chain before
# adding: the first P2TR output ever (a purse.io withdrawal of 5,431 sats,
# Dec 17, 2019, pre-activation — txid still to confirm) and the first P2TR
# key-path and script-path spends; a Lightning force-close revealing an HTLC
# (the famous first LN payment, Dec 28, 2017, was off-chain, so it needs an
# on-chain artifact). For the version story, still to confirm: the first
# version-rolled (overt-AsicBoost, BIP320) block — no canonical height exists,
# so it needs a chain scan to identify a good exemplar whose frontispiece
# breaks the accio.abandon idiom.
#
# Entries kept without a reading, waiting on a note rather than on a citation:
# Eligius, the first coinbase OP_RETURN, Romans 12:21, the Sermon on the Mount,
# and the supply-cap section above. Each is worth reading; none has a published
# reading yet, and an annotation layer that guesses is worse than one with gaps.
#
# Heights consensus has fixed but no block has reached — BIP110's flag heights,
# BIP42's cap — are not entries here: a chapter cited before it exists cannot be
# read in sequence with chapters that do (dropped in among the volumes, BIP42
# alone opened a Volume LXV two centuries wide). They are gathered in
# appendix.yaml, as Appendix II: Consensus, grouped under their BIPs beside the
# forks already active.
