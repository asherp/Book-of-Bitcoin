#
# appendix.yaml — what the contents gathers after the volumes.
#
# A chain with no last block has no back, which is why the sigla sit in the
# front matter (see the README). What can still be gathered at the end of the
# CONTENTS is what belongs to the book but not to its reading order — reading
# order being the order blocks were mined.
#
# Four parts, numbered like volumes and rendered in this order:
#
#   I   The Mempool — the chapters the queue is already forming, which is why
#       it comes first: it opens where the volumes close, so the turn from the
#       chain tip to the next provisional chapter stays a single step down the
#       page. Built live by the page from the queue itself
#       (bitcoin-contents.html); nothing to list here but its heading.
#   II  Future Chapters — heights consensus has already fixed, too far out for
#       any queue to reach: flag days, activations, the 21M cap. A height is a
#       citation the moment consensus fixes it, whether or not a block has
#       reached it — the reference is exact and computable today and only the ■
#       is unearned, so these print the expected mark □, the same mark the
#       mempool's projections wear, and their lookups answer with a date
#       instead of a page. Listed apart rather than in reading order because a
#       chapter cited before it exists cannot be read in sequence with chapters
#       that do: dropped in among the volumes, BIP42 alone opened a Volume LXV
#       two centuries wide.
#   III Ledgers — the shelf of curated ledgers (btc-index-data.js), and any the
#       reader keeps. Keepers, not chapters, and so the only entries in the
#       contents with no reference at all: the chain never writes an address,
#       only the script one stands for, and a ledger's chapters are discovered
#       by reading rather than cited in advance. A ledger holds as many scripts
#       as its keeper uses — one address, a rotated set, or every leaf of one
#       extended key — each read as a passage on the Ledger compendium's own
#       leaves, which is why this part lists ledgers here and explains itself
#       there. The contents and the index are inverses; this is where the
#       contents points at the other one.
#   IV  Contemporary Sources — documents whose existence this chain attests,
#       in the sense a historian means: written at the time, and provably so.
#       An OpenTimestamps proof reduces a file's digest to the merkle root of
#       one block, so a document that never touched the chain is nonetheless
#       dated by it, and cited at the chapter and §section its proof lands in.
#       Listed apart because the document is not in the book — what is in the
#       book is the transaction its proof lands on, and the document is the
#       thing outside the chain that the chain is being asked about. The
#       entries below ship with the app; a reader's own proofs, dropped on the
#       appendix's leaf, are kept beside them the way bookmarks are.
#
# A part's `kind` says who fills it: `entries` is listed here, `mempool` and
# `ledgers` are gathered by the page, and `proofs` is listed here too but names
# files rather than places — each entry a `proof:` (an .ots file in proofs/) and
# the `subject:` it stamps, if the file itself is small enough to ship. Nothing
# else is written down for a proof, and nothing else should be: the citation, the
# transaction and the merkle root all come out of the proof's own bytes when it
# is read, so an entry here cannot claim a chapter the proof does not.
#
# An `entries` entry takes the same shape as a curated entry in notables.yaml —
# its `id` is handed to the same lookup, in any form the search box takes — with
# a `note` carrying the caveat the row shows on hover. Editorial, like the titles: what is promised is a citation,
# not a prophecy. This file and notables.yaml are read by the same machinery
# (btc-notables.js) and licensed the same way; see the README's License section.

- kind: mempool
  title: The Mempool
  note: The chapters the queue is already forming, ordered as a miner would take them — provisional numbers that hold only while the queue does, and only the first is a real forecast.

- kind: entries
  title: Future Chapters
  note: Chapters whose citations are fixed but whose blocks are unmined: consensus has named the height, the chain has yet to reach it. Each reference carries □, the expected-chapter mark, until a block earns it the ■.
  entries:
    # BIP110 (reduced_data, the 2026 temporary data-limit attempt; bit 4, 55% of
    # a signaling window): nothing has activated to cite — ~0.5% signaling as of
    # July 2026 — but its BIP8-style heights are citable sight unseen, three real
    # retarget boundaries one book apart, sharing a chapter number. Conditional in
    # a way BIP42's height is not: the blocks will be mined either way, on
    # schedule, and will carry these names only if the fork locks in. The
    # signaling story's exemplar is already in the contents proper: the first
    # bit-4 block, V β50 ■120.
    - title: BIP110 mandatory signaling
      id: '961632'
      note: BIP8-style flag height — mandatory signaling from 961,632, should BIP110 lock in. ~0.5% of blocks signaling as of July 2026, against a 55% threshold.
      commentary:
        - file: bip110-mandatory-signaling.md
    - title: BIP110 lock-in
      id: '963648'
      note: Lock-in by 963,648, one book on, should the threshold be met.
      commentary:
        - file: bip110-lock-in.md
    - title: BIP110 activation
      id: '965664'
      note: Activation at 965,664, one book after lock-in — the height where the reduced data limit would first bind.
      commentary:
        - file: bip110-activation.md
    # The one activation block whose height is already consensus and still will
    # not exist for two centuries: BIP42 (April 1, 2014) capped the subsidy
    # schedule where the 64th halving's undefined bit-shift would have resurrected
    # the 50-BTC reward. Cited now, mineable later; until then its lookup answers
    # "Block not found. Come back in the year 2262."
    - title: BIP42 activation (21M cap)
      id: LXV β1 □1
      note: The book's last chapter, and the only one whose date is already known: BIP42's cap first binds at 13,440,000, the opening chapter of Volume LXV, due around the year 2262.
      commentary:
        - file: bip42-activation-21m-cap.md

- kind: ledgers
  title: Ledgers of Note
  note: A ledger gathers what one keeper spends from — a single address, a set rotated over the years, or in time every leaf of one extended key — and reads each of its scripts as a passage, with the chapters that passage appears in listed beneath it. Nothing here carries a reference: the chain never writes an address, only the script one stands for, so a ledger is not cited but discovered, and its run of chapters stays open-ended.

- kind: proofs
  title: Contemporary Sources
  note: Documents whose existence the chain attests — contemporary in the sense a historian means it: written at the time, and provably so. An OpenTimestamps proof reduces a document's digest, through a merkle path, to the root one block header commits to, so a file that never touched the chain is nonetheless dated by it, and cited at the chapter and section its proof lands in. Drop a proof at the foot of this appendix and it is kept here beside these.
  # A reading of what this part gathers, rather than of any one file in it: the
  # leaves raise it beneath each file's own, which is where the page explains
  # itself. The leaf itself explains nothing — it sets the proof and gets out of
  # the way; saying what a proof IS is a reading, and readings are signed and
  # kept apart from the record.
  commentary:
    - file: contemporary-sources.md
  entries:
    - title: Hello World!
      proof: hello-world.txt.ots
      subject: hello-world.txt
      note: The OpenTimestamps client's own example proof, and the oldest anyone can still replay — May 2015, a year before the calendar servers, its commitment sitting where a public key's hash belongs.
      commentary:
        - file: the-hello-world-timestamp.md
