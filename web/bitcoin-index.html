<title>The βook of βitcoin — Index</title>
<meta name="description" content="An index for the Glossia Bitcoin Book: notable addresses, each trailing every chapter where it appears — like a name in a book's index trailing its pages.">

<!-- PWA: installable, offline-capable app shell. Shares the Bitcoin book's
     gold-β manifest so every page installs as one "Bitcoin Book" app. -->
<link rel="manifest" href="./bitcoin-book.webmanifest">
<meta name="theme-color" content="#08080a">
<link rel="apple-touch-icon" href="./icons/beta-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="βook of βitcoin">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed:', e));
    });
  }

  // The page is assembled from ES modules that both the HTTP cache (GitHub
  // Pages serves max-age=600) and the service worker refresh file by file, so
  // a redeploy can briefly leave them mixed: this page from one build, a
  // module from another. A module whose imports no longer line up fails to
  // instantiate, and an aborted module graph renders nothing -- the index
  // goes blank. Detect the blankness itself, not the error (module failures
  // surface too many ways to catch reliably): a healthy module populates
  // #index synchronously, so an empty #index well after load means the graph
  // died. Recover by re-fetching this page's files with cache:'reload' --
  // which refreshes the HTTP cache directly and, routed through the service
  // worker, makes its background revalidation hit the true network -- then
  // reloading once onto the matched set. A second blank load shows a note
  // instead of looping.
  (function () {
    const FILES = ['./bitcoin-index.html', './btc-index.js', './btc-citation.js'];
    const FLAG = 'glossia-index-reloaded';
    window.addEventListener('load', () => {
      setTimeout(() => {
        const idx = document.getElementById('index');
        if (!idx || idx.children.length) return;   // the module rendered; nothing to recover
        let retried = false;
        try { retried = !!sessionStorage.getItem(FLAG); } catch (_) {}
        if (retried) {
          const s = document.createElement('span');
          s.className = 'idx-note';
          s.textContent = 'The index failed to load — reload to retry.';
          idx.replaceChildren(s);
          return;
        }
        try { sessionStorage.setItem(FLAG, '1'); } catch (_) {}
        Promise.allSettled(FILES.map((u) => fetch(u, { cache: 'reload' })))
          .then(() => setTimeout(() => location.reload(), 800));
      }, 2000);
    });
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --page:#08080a; --card:#0d0d10; --card-bd:#232228; --ink:#e8e4da; --ink-soft:#cfcabf;
  --accent:#c9a25f; --accent-2:#dcb877; --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;
  --input-bg:#151519; --input-bd:#2a2930;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; line-height: 1.55; }
.wrap { max-width: 720px; margin: 0 auto; padding: 48px 22px 100px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.masthead { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:40px; }
.masthead .title { font:600 13px/1 'IBM Plex Mono',monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--ink); }
.masthead .title .beta { color:var(--accent); text-transform:none; font-family:'Newsreader','Source Serif 4',Georgia,serif; font-weight:600; font-size:1.12em; }
.masthead .home { margin-left:auto; font:500 12px/1 'IBM Plex Mono',monospace; letter-spacing:.04em; }

.page-head { text-align:center; padding-bottom:30px; margin-bottom:36px; border-bottom:1px solid var(--rule); }
.page-eyebrow { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); }

/* An index entry: the name on its own line -- the title in the book's serif,
   the address itself beneath in mono -- then its citations laid out like the
   table of contents (Volume part headers, Book sub-headers), with the row
   mirrored: the reference on the left, and on the right the chapter's net
   amount for the address. The name links to the entry's anthology: the same
   line on a page of its own, walked far deeper. */
.idx-entry { padding:18px 2px 20px; border-bottom:1px solid var(--rule); }
.idx-title { display:block; font:500 17px/1.35 'Newsreader',serif; color:var(--ink-soft); }
a.idx-title:hover { color:var(--ink); text-decoration:none; }
a.idx-title:hover .idx-addr { color:var(--dim); }
.idx-addr { display:block; margin-top:2px; font:400 11.5px/1.5 'IBM Plex Mono',monospace; letter-spacing:.02em; color:var(--meta); word-break:break-all; }
.idx-cites { margin-top:6px; }

/* The nesting headers, scaled down a step from the contents page's -- here
   they sit inside an entry rather than heading the whole page. */
.idx-vol { margin:14px 0 2px; padding-top:10px; border-top:1px solid var(--hair);
  font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); }
.idx-vol:first-child { margin-top:6px; padding-top:0; border-top:none; }
.idx-book { margin:10px 0 1px; padding-left:14px;
  font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--meta); }

/* A citation row -- the contents row mirrored: the tail reference on the left
   in the citation mono, the chapter's net amount on the right, full eight
   decimals so the column aligns on the point. The whole row is a link into
   the book. */
.idx-row { display:flex; align-items:baseline; gap:16px; padding:7px 2px 7px 14px; border-bottom:1px solid var(--hair); text-decoration:none; }
.idx-row.under-book { padding-left:28px; }
.idx-row:last-child { border-bottom:none; }
.idx-ref { flex:none; font:600 13px/1.4 'IBM Plex Mono',monospace; letter-spacing:.06em; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; }
.idx-amt { flex:1; min-width:0; text-align:right; font:500 13px/1.4 'IBM Plex Mono',monospace; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.idx-row:hover .idx-ref { text-decoration:underline; color:var(--accent-2); }
.idx-row:hover .idx-amt { color:var(--ink); }

/* Still resolving, failed to resolve, or the trailing "of N appearances" note. */
.idx-note { display:block; margin-top:8px; padding-left:14px; font:400 12px/1.5 'IBM Plex Mono',monospace; color:var(--meta); }
</style>
<body>
<div class="wrap">
  <div class="masthead">
    <span class="title">The <span class="beta">β</span>ook of <span class="beta">β</span>itcoin</span>
    <span class="home"><a href="./bitcoin-book.html">Read</a> · <a href="./bitcoin-contents.html">Contents</a> · <a href="./bitcoin-search.html">Search</a> · <a href="https://glossia.io/">Glossia</a></span>
  </div>

  <header class="page-head">
    <div class="page-eyebrow">Index</div>
  </header>

  <div id="index"></div>
</div>

<script type="module">
import { INDEXED, isAddress, cachedLine, resolveLine, renderLine, lineNote } from './btc-index.js';

// The index skims: each entry's chain walk is shallow, enough to read the
// shape of a line. An entry's title opens its anthology -- the same line as
// its own page, walked far deeper. The walk, cache, and renderer live in
// btc-index.js, shared with the anthology page, so the two depths are one
// machinery and one cache.
const INDEX_TX_PAGES = 8;

// A reader's own query joins the curated set: ?address=<addr> prepends a
// temporary entry (titled by the address itself), so any address is
// indexable in place. A query that duplicates a curated address is dropped --
// the curated title wins.
const q = (new URLSearchParams(location.search).get('address') || '').trim();
const adhoc = isAddress(q) && !INDEXED.some((e) => e.address === q)
  ? [{ title: q, address: q, adhoc: true }] : [];
const entries = [...adhoc, ...INDEXED];

// Build every entry at once -- name and address are known offline -- and let
// each citation list render from cache and refresh as its chain walk resolves.
// Built onto a cleared #index: a late module evaluation may land after the
// head's blank-page recovery has already written its failure note.
const index = document.getElementById('index');
index.replaceChildren();
for (const e of entries) {
  const row = document.createElement('div');
  row.className = 'idx-entry';
  // The entry's name is the door to its anthology: the whole line, on a page
  // of its own.
  const t = document.createElement('a'); t.className = 'idx-title';
  t.href = `bitcoin-anthology.html?address=${e.address}`;
  t.textContent = e.title;
  // An ad-hoc entry is titled by its address, so the mono sub-line would only
  // repeat it; curated entries carry both name and address.
  if (!e.adhoc) {
    const addr = document.createElement('span'); addr.className = 'idx-addr';
    addr.textContent = e.address;
    t.append(addr);
  }
  const cites = document.createElement('div'); cites.className = 'idx-cites';
  lineNote(cites, '…');
  row.append(t, cites);
  index.append(row);
  const cached = cachedLine(e.address);
  if (cached) renderLine(cites, cached);
  resolveLine(e.address, INDEX_TX_PAGES).then((data) => renderLine(cites, data));
}

// The module graph loaded whole: clear the mixed-build recovery flag (set in
// the head) so a future redeploy gets its own one-shot reload again.
try { sessionStorage.removeItem('glossia-index-reloaded'); } catch (_) {}
</script>
</body>
</html>
