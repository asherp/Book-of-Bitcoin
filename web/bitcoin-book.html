  return null;
}

// The projection, cached briefly -- the queue reshuffles with every arrival,
// but stepping between projected chapters shouldn't refetch per page. Only
// whole blocks page as chapters; the backend's final entry aggregates the
// deep backlog whenever more remains (recognizable by exceeding the 1 MvB a
// real block can hold) and is dropped here -- those depths keep the
// "come back" message instead. Manifests are cached on the same snapshot,
// so a refresh drops them together.
let projectedCache = null;   // { at, blocks, manifests }
const PROJECTED_TTL = 60_000;
async function loadProjection() {
  if (projectedCache && Date.now() - projectedCache.at < PROJECTED_TTL) return projectedCache;
  const blocks = await mempoolBackendFetch('/v1/fees/mempool-blocks');
  projectedCache = {
    at: Date.now(),
    blocks: Array.isArray(blocks)
      ? blocks.filter((b, i) => i < blocks.length - 1 || b.blockVSize <= 1.05 * MVB)
      : null,
    manifests: new Map(),
  };
  return projectedCache;
}
// How many chapters past the tip page as real projected chapters right now.
const projectedReach = () => projectedCache?.blocks?.length ?? 0;

// The chapter mark for a height: ■ states fact (a mined block's place in
// its book), □ expectation (an unmined block cited by the place it would
// take -- good only while the queue holds). References follow suit.
const chapterMark = (height) => (tipHeight !== null && height > tipHeight) ? '□' : '■';
function referenceOf(height) {
  if (tipHeight === null || height <= tipHeight) return reference(height);
  const p = volumeBookChapter(height);
  return `${toRoman(p.volume)} β${p.book} □${p.chapter}`;
}

// A projected block's manifest over the backend websocket: subscribe with
// {"track-mempool-block": k}, take the first full listing for our index
// (later frames are deltas -- the draft being reshuffled -- which a book
// page deliberately ignores: each opening is a snapshot), close. The wire
// rows are compressed: [txid, fee, vsize, value, rate, flags, time, acc],
// in template order; `rate` is the effective (ancestor-package) fee rate,
// so a rate above fee/vsize marks a child-pays-for-parent passenger.
function fetchProjectedManifest(k) {
  return new Promise((resolve, reject) => {
    if (!mempoolBackendBase) { reject(new Error('No projection source is reachable.')); return; }
    let ws;
    try { ws = new WebSocket(`${mempoolBackendBase.replace(/^http/, 'ws')}/v1/ws`); }
    catch (e) { reject(e); return; }
    let settled = false;
    const fail = (msg) => { if (settled) return; settled = true; try { ws.close(); } catch {} reject(new Error(msg)); };
    const timer = setTimeout(() => fail('The projection feed timed out.'), 15000);
    ws.addEventListener('open', () => { try { ws.send(JSON.stringify({ 'track-mempool-block': k })); } catch {} });
    ws.addEventListener('error', () => { clearTimeout(timer); fail('The projection feed failed.'); });
    ws.addEventListener('close', () => { clearTimeout(timer); fail('The projection feed closed early.'); });
    ws.addEventListener('message', (ev) => {
      try {
        const pbt = JSON.parse(ev.data)['projected-block-transactions'];
        if (!pbt || pbt.index !== k || !Array.isArray(pbt.blockTransactions)) return;
        clearTimeout(timer);
        settled = true;
        try { ws.close(); } catch {}
        resolve(pbt.blockTransactions.map((t) => ({ txid: t[0], fee: t[1], vsize: t[2], value: t[3], rate: t[4] })));
      } catch { /* not ours -- keep listening */ }
    });
  });
}
function projectedManifest(k) {
  const snap = projectedCache;
  if (!snap.manifests.has(k)) {
    snap.manifests.set(k, fetchProjectedManifest(k).catch((e) => { snap.manifests.delete(k); throw e; }));
  }
  return snap.manifests.get(k);
}

// Open a projected chapter. `where` picks the page: -1 the chapter's own
// page, a number that section, 'last' the final section (stepping backward
// across a projected boundary). Returns false when the height is past the
// projection's pageable reach -- the caller falls back to the queue/calendar
// message. A manifest that can't be read still opens the chapter page (its
// figures are REST-served); only its sections are out of reach.
async function stepProjected(height, where = -1) {
  const proj = await loadProjection().catch(() => null);
  if (tipHeight === null || !proj || !proj.blocks) return false;
  const k = height - tipHeight - 1;
  if (k < 0 || k >= proj.blocks.length) return false;
  const b = proj.blocks[k];
  state = {
    projected: true, projIndex: k, proj: b,
    hash: null, height, block: null, header: null,
    txCount: b.nTx, txids: null, manifest: null, index: -1,
  };
  let manifestErr = null;
  if (where !== -1) {
    try {
      await ensureTxids(state);
      state.index = where === 'last' ? state.txCount - 1 : Math.min(where, state.txCount - 1);
    } catch (e) { manifestErr = e; }
  }
  await showCurrentTx();
  if (manifestErr) setStatus('The projected manifest could not be read from this source — the chapter opens, but its sections are out of reach.', 'err');
  return true;
}

// ── Live frontage ─────────────────────────────────────────────────────────
// The reader is on the chain tip's own chapter page: the last written
// chapter, the one page besides the projected ones that the chain can still
// change under. A section of the tip block doesn't count -- a reader inside
// a chapter is reading, not watching the head of the chain.
const atTipPage = () => !!(state && !state.projected && state.index === -1
  && tipHeight !== null && state.height === tipHeight);

// The tip moved while its own page was on screen, so the page follows it:
// the new latest block opens in place of the old one, which -- no longer the
// latest -- loses its clock with the render. The block announcement can beat
// the REST mirror's index by a second or two, so a lookup that doesn't answer
// yet is retried a few times; the fetch runs quietly behind the page already
// on screen, which stays put until its successor is ready to replace it.
// A reader who turns a page during any of this takes the wheel back: the
// follow is only ever allowed to replace the page it was watching, untouched.
const TIP_FOLLOW_TRIES = 4;
const TIP_FOLLOW_WAIT = 2_000;
let tipFollowing = false;
async function followTip() {
  if (tipFollowing) return;   // one follow at a time -- it re-aims at the current tip itself
  tipFollowing = true;
  tipClock.retire();          // this page is not the latest block anymore, whatever the fetch does next
  let mine = state;
  // Still the page this follow owns: the same state object (a step within
  // the block edits it in place, so the index is checked too), a chapter
  // page, and behind the tip.
  const ours = () => state === mine && !state.projected && state.index === -1;
  try {
    for (let tries = 0; tries < TIP_FOLLOW_TRIES; tries++) {
      if (!ours() || tipHeight === null || state.height >= tipHeight) return;
      const target = tipHeight;
      const meta = await loadBlockByHeight(target, { withTxids: false }).catch(() => null);
      if (!ours()) return;
      if (!meta) { await new Promise((r) => setTimeout(r, TIP_FOLLOW_WAIT * (tries + 1))); continue; }
      state = mine = { ...meta, index: -1 };
      await showCurrentTx();
      tries = -1;   // caught the tip we aimed at; if it moved again mid-fetch, aim again
    }
    // The mirror never answered for the new tip. Stay on the block we have,
    // repainted: it isn't the latest anymore, so its clock comes off (and
    // with it, on the render, the feed that was watching for this).
    if (ours()) await showCurrentTx();
  } finally { tipFollowing = false; }
}

// While a page that the chain can still change is on screen -- a projected
// chapter, or the chain tip's own -- the backend websocket keeps its head
// honest: {"action":"want","data":["blocks","mempool-blocks"]} answers at
// once with the current projection, then pushes 'mempool-blocks' on every
// reshuffle of the queue and 'block' whenever one is mined. The chapter
// page's figures repaint in place as the draft moves; a mined block
// re-seats the chapter one nearer the tip (the ETA shortens, β and the
// prev-hash slot re-resolve, k = 0 gains its predecessor) -- and when the
// new ink covers THIS very height, the page reloads itself as the mined
// chapter: the pencil inked over, live. On the tip's page the same push does
// the same work one chapter later: the block that was the latest is now the
// second latest, so the page turns to the one that took its place. Sections
// keep their deliberate manifest snapshot; on them the feed only advances the
// tip and the nav.
// A websocket that won't connect degrades to a slow REST poll.
const liveProjection = (() => {
  let ws = null, retryTimer = null, pollTimer = null, active = false, connecting = false;
  let trackedTx = null;          // the section's txid the feed is following
  let subBlock = null;           // projected-block index the manifest feed follows
  let expectedSeq = null;        // next delta sequence expected on that feed
  let pendingBlockSwitch = null; // block index a txPosition says we're moving to
  let wanted = null;             // the 'want' set last sent on this socket

  const clearTimers = () => {
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  };
  const stop = () => {
    active = false;
    trackedTx = null;
    subBlock = null;
    expectedSeq = null;
    pendingBlockSwitch = null;
    wanted = null;
    clearTimers();
    if (ws) { try { ws.close(); } catch {} ws = null; }
  };

  // What the page on screen needs pushed to it. A projected chapter is a cut
  // of the queue, so it wants every reshuffle; the tip's page only wants to
  // hear when it stops being the tip. The backend takes the whole set on each
  // 'want', so this is sent again whenever the page changes what it needs.
  const sendWant = () => {
    if (!ws || ws.readyState !== 1) return;
    const data = (state && state.projected) ? ['blocks', 'mempool-blocks'] : ['blocks'];
    const key = data.join(',');
    if (key === wanted) return;
    wanted = key;
    try { ws.send(JSON.stringify({ action: 'want', data })); } catch {}
  };

  // Follow (or stop following) the on-screen section's transaction. The
  // backend replaces a client's tracked tx on each send; anything non-hex
  // ('stop') clears it.
  const sendTrack = () => {
    if (!ws || ws.readyState !== 1) return;
    const want = (state && state.projected && state.index >= 0 && state.txids) ? state.txids[state.index] : null;
    if (want === trackedTx) return;
    trackedTx = want;
    try { ws.send(JSON.stringify({ 'track-tx': want || 'stop' })); } catch {}
  };

  // Follow (or stop following) the manifest of the projected block the
  // section sits in. The subscription answers with a full listing, then
  // deltas as the queue reshuffles; -1 unsubscribes.
  const sendBlockSub = (k) => {
    if (!ws || ws.readyState !== 1) return;
    const want = (state && state.projected && state.index >= 0) ? (k ?? state.projIndex) : null;
    if (want === subBlock) return;
    subBlock = want;
    expectedSeq = null;
    try { ws.send(JSON.stringify({ 'track-mempool-block': want === null ? -1 : want })); } catch {}
  };

  // The queue reshuffled: re-cut the cached projection and re-seat this
  // chapter's figures. Surgically -- a push arrives every few seconds when
  // the pool is busy, and rebuilding the head each time would flash its
  // async slots (the tip's hash prose, β) back through their placeholders.
  // Only the figures line's text is touched, and the nav relabels only when
  // the projection's reach actually changed.
  const refreshProjectedFigures = () => {
    if (!state || !state.projected || state.index !== -1) return;
    const b = state.proj;
    $('ch-hash-short').textContent = `${b.nTx.toLocaleString()} § · ${(b.blockVSize / MVB).toFixed(2)} MvB · ${(b.totalFees / 1e8).toFixed(4)} ₿ in fees`;
  };
  const applyBlocks = (blocks) => {
    if (!Array.isArray(blocks) || !state || !state.projected || tipHeight === null) return;
    const reachBefore = projectedReach();
    projectedCache = {
      at: Date.now(),
      blocks: blocks.filter((b, i) => i < blocks.length - 1 || b.blockVSize <= 1.05 * MVB),
      manifests: new Map(),   // the draft moved; already-open sections keep their snapshot
    };
    const k = state.height - tipHeight - 1;
    if (k < 0 || k >= projectedCache.blocks.length) { labelNav(); return; }   // out of reach now -- the nav adjusts, the page keeps its snapshot
    const b = projectedCache.blocks[k];
    const moved = state.proj.nTx !== b.nTx || state.proj.totalFees !== b.totalFees || state.proj.blockVSize !== b.blockVSize;
    state.projIndex = k;
    state.proj = b;
    if (!state.txids) state.txCount = b.nTx;
    if (moved) refreshProjectedFigures();
    if (projectedReach() !== reachBefore) labelNav();
  };

  // A block was mined: every projected chapter moves one nearer the tip --
  // and if the new ink covers a chapter page's very height, trade the pencil
  // for it, silently: the frontage speaks for itself. A section never turns
  // on the block alone -- its transaction may or may not have made it in --
  // it waits for its own verdict: txConfirmed (mined) or txPosition
  // (re-queued) names where it landed.
  const applyBlock = async (block) => {
    if (!block || !Number.isFinite(block.height)) return;
    if (tipHeight !== null && block.height <= tipHeight) return;   // stale or repeated
    const wasTip = atTipPage();
    tipHeight = block.height;
    projectedCache = null;   // every projected height re-seats
    refreshSectionConfirmations();   // an open section deepens in place
    if (!state || !state.projected) {
      // The tip's page was on screen: turn it to the block that just took the
      // tip. The page it leaves keeps nothing of its lateness -- the clock is
      // rendered from the tip, so it comes off wherever that chapter is read
      // next.
      if (wasTip) await followTip();
      return;
    }
    if (state.index === -1) {
      if (state.height <= tipHeight) {
        stop();
        await openLookup(String(state.height));
        return;
      }
      try { await stepProjected(state.height, -1); } catch { /* keep the snapshot */ }
    } else {
      // A section's best provisional guess: same projected block, one nearer
      // the tip -- corrected moments later by the fresh listing/txPosition.
      const height = tipHeight + 1 + state.projIndex;
      if (height !== state.height) { state.height = height; refreshProjectedSectionFurniture(); }
      else labelNav();
    }
  };

  // Install a manifest for the section on screen and re-seat its furniture
  // when what the page says about it changed. A listing that no longer
  // carries the transaction is ignored -- txPosition or txConfirmed names
  // where it went instead.
  const reseatSection = (k, manifest, txid) => {
    const idx = manifest.findIndex((t) => t.txid === txid);
    if (idx < 0) return;
    pendingBlockSwitch = null;
    const height = tipHeight + 1 + k;
    // A projected section shows two live things: where it sits (chapter, §)
    // and what it is paying to sit there. A reshuffle that leaves the seat
    // alone can still change the price -- a CPFP child arriving lifts the
    // package rate under it, a sibling's family breaking up drops it -- and
    // the rate line is on screen, so that counts as a move as much as the §
    // does.
    const was = state.manifest && state.manifest[state.index];
    const now = manifest[idx];
    const moved = height !== state.height || idx !== state.index
      || (was && now && was.rate !== now.rate);
    state.projIndex = k;
    state.height = height;
    state.manifest = manifest;
    state.txids = manifest.map((t) => t.txid);
    state.txCount = state.txids.length;
    state.index = idx;
    state.proj = projectedCache?.blocks?.[k] ?? state.proj;
    if (moved) refreshProjectedSectionFurniture();
  };

  // The manifest feed: a full listing (re)establishes exact template order;
  // deltas maintain it in real time -- removals and rate changes exactly,
  // insertions seated by effective rate, the template's own ordering rule up
  // to package adjacency. A sequence gap resubscribes for a fresh listing.
  const applyManifestMsg = (pbt) => {
    if (!pbt || !state || !state.projected || state.index < 0 || tipHeight === null) return;
    if (!Number.isFinite(pbt.index)) return;
    const txid = state.txids && state.txids[state.index];
    if (!txid) return;
    if (Array.isArray(pbt.blockTransactions)) {
      if (pbt.index !== state.projIndex && pbt.index !== pendingBlockSwitch) return;
      expectedSeq = Number.isFinite(pbt.sequence) ? pbt.sequence + 1 : null;
      reseatSection(pbt.index, pbt.blockTransactions.map((t) => ({ txid: t[0], fee: t[1], vsize: t[2], value: t[3], rate: t[4] })), txid);
      return;
    }
    if (!pbt.delta || pbt.index !== state.projIndex || subBlock !== pbt.index || !state.manifest) return;
    if (expectedSeq !== null && Number.isFinite(pbt.sequence) && pbt.sequence !== expectedSeq) {
      subBlock = null;   // missed a frame -- resubscribe for a fresh full listing
      sendBlockSub();
      return;
    }
    expectedSeq = Number.isFinite(pbt.sequence) ? pbt.sequence + 1 : expectedSeq;
    const d = pbt.delta;
    const removed = new Set(d.removed || []);
    let out = removed.size ? state.manifest.filter((t) => !removed.has(t.txid)) : state.manifest.slice();
    if (Array.isArray(d.changed) && d.changed.length) {
      const changes = new Map(d.changed.map((c) => [c[0], c[1]]));
      out = out.map((t) => changes.has(t.txid) ? { ...t, rate: changes.get(t.txid) } : t);
    }
    if (Array.isArray(d.added)) {
      for (const row of d.added) {
        const t = { txid: row[0], fee: row[1], vsize: row[2], value: row[3], rate: row[4] };
        if (out.some((x) => x.txid === t.txid)) continue;   // already seated (e.g. an RBF successor swapped in locally)
        let i = out.findIndex((x) => x.rate < t.rate);
        if (i < 0) i = out.length;
        out.splice(i, 0, t);
      }
    }
    reseatSection(pbt.index, out, txid);
  };

  // The tracked transaction moved to another projected block: switch the
  // manifest feed there; the full listing that answers re-seats the section
  // (chapter, §, URL) around its unchanged body. Same-block § drift needs
  // nothing here -- the delta feed owns it, in real time.
  const applyTxPosition = (tp) => {
    if (!tp || !state || !state.projected || state.index < 0 || tipHeight === null) return;
    if (!state.txids || state.txids[state.index] !== tp.txid) return;
    const b = tp.position && Number.isFinite(tp.position.block) ? tp.position.block : null;
    if (b === null || b === state.projIndex) return;
    pendingBlockSwitch = b;
    sendBlockSub(b);
  };

  // The tracked transaction was mined: its section now exists in ink. Open
  // it by txid -- the lookup resolves the real chapter and § -- and let the
  // page speak for itself.
  const applyTxConfirmed = async (txid) => {
    if (!state || !state.projected || state.index < 0) return;
    if (!state.txids || state.txids[state.index] !== txid) return;
    stop();
    await openLookup(txid);
  };

  // The tracked transaction was replaced by fee. It vanishes from every
  // mempool -- but not from the book: the ledger records the succession
  // (the successor spends the very same coins), the successor takes the
  // seat and the tracking, and if the reader was reading the replaced
  // draft it stays on screen, seated beneath as a ghost with its rung up.
  const applyRbf = async (newTxid) => {
    if (!newTxid || !/^[0-9a-f]{64}$/i.test(newTxid)) return;
    if (!state || !state.projected || state.index < 0 || !state.txids) return;
    const seat = state.txids[state.index];
    if (!seat || newTxid === seat) return;
    await recordReplaced(seat, newTxid);
    rbfHistoryCache.delete(seat);
    rbfHistoryCache.delete(newTxid);   // the successor's history just grew
    if (!state.ghost) state.ghost = seat;
    if (state.manifest && state.manifest[state.index]) {
      state.manifest[state.index] = { ...state.manifest[state.index], txid: newTxid };
      state.txids[state.index] = newTxid;
    }
    trackedTx = newTxid;
    try { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ 'track-tx': newTxid })); } catch {}
    try { await showCurrentTx(); } catch { /* the ghost stays as rendered */ }
  };

  const handleMessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg['mempool-blocks']) applyBlocks(msg['mempool-blocks']);
    if (msg['projected-block-transactions']) applyManifestMsg(msg['projected-block-transactions']);
    if (msg.block) applyBlock(msg.block);
    if (msg.txPosition) applyTxPosition(msg.txPosition);
    if (msg.txConfirmed) applyTxConfirmed(msg.txConfirmed);
    if (msg.rbfTransaction && msg.rbfTransaction.txid) applyRbf(msg.rbfTransaction.txid);
    if (msg.txReplaced && msg.txReplaced.txid) applyRbf(msg.txReplaced.txid);
  };

  const startPolling = () => {
    if (pollTimer) return;
    pollTimer = setInterval(async () => {
      if (!active || document.hidden) return;
      // On the tip's page there is no projection to refresh -- the one thing
      // worth asking is whether the tip is still the tip. Vanilla Esplora
      // answers that, so this fallback works on any mirror.
      if (atTipPage()) {
        const t = Number(await loadTipHeight().catch(() => NaN));
        if (active && Number.isFinite(t)) applyBlock({ height: t });
        return;
      }
      const blocks = await mempoolBackendFetch('/v1/fees/mempool-blocks');
      if (active && Array.isArray(blocks)) applyBlocks(blocks);
    }, 45_000);
  };

  const connect = async () => {
    if (!active || ws || connecting) return;
    // The backend host is learned from the first projection fetch; a reader
    // who arrived straight at the chain tip has made none, so probe for it
    // here -- the websocket is what makes the tip turn the moment a block
    // lands rather than at the next poll.
    if (!mempoolBackendBase) {
      connecting = true;
      try { await mempoolBackendFetch('/v1/fees/mempool-blocks'); } finally { connecting = false; }
      if (!active || ws) return;
      if (!mempoolBackendBase) { startPolling(); return; }
    }
    try { ws = new WebSocket(`${mempoolBackendBase.replace(/^http/, 'ws')}/v1/ws`); }
    catch { ws = null; startPolling(); return; }
    ws.addEventListener('open', () => {
      wanted = null;   // a fresh socket subscribes to nothing until told
      sendWant();
      sendTrack();
      sendBlockSub();
    });
    ws.addEventListener('message', handleMessage);
    ws.addEventListener('close', () => {
      ws = null;
      if (active && !retryTimer) retryTimer = setTimeout(() => { retryTimer = null; connect(); }, 10_000);
    });
    ws.addEventListener('error', () => { try { ws.close(); } catch {} });
  };

  return {
    // Called after every page render: the feed runs exactly while a page the
    // chain can still change is on screen -- a projected chapter, or the
    // tip's own -- and not a moment longer, and keeps its tracked transaction
    // in step with the section on screen.
    sync: () => {
      const want = !!(state && state.projected) || atTipPage();
      if (want && !active) { active = true; connect(); }
      else if (!want && active) stop();
      else if (want) { sendWant(); sendTrack(); sendBlockSub(); }
    },
  };
})();

// Resolve a height that may lie past the tip: a mined block loads normally;
// a height within the projection opens as a projected chapter (returning
// {done} -- stepProjected has already rendered); anything deeper throws the
// queue/calendar message. Leaf requests (index -2/-3) never go projected --
// an unwritten book has no leaf to open.
async function loadHeightOrProjected(height, index, tipP) {
  try {
    return { meta: await loadBlockByHeight(height, { withTxids: index >= 0 }) };
  } catch (e) {
    const tip = await tipP;
    if (e && e.notFound && tip !== null && height > tip && index >= -1) {
      if (await stepProjected(height, index >= 0 ? index : -1)) return { done: true };
    }
    throw await unwrittenOr(e, height, tipP);
  }
}

// A txid -> the block that confirmed it, plus the transaction's index within
// that block (its section). The section comes from the merkle proof's position, so
// opening one transaction never downloads the whole block's txid list -- that's
// deferred (ensureTxids) until the reader steps Prev/Next. This is what makes
// navigation by reference fast regardless of how large the block is.
async function loadBlockByTxid(txid) {
  const [txRes, mpRes] = await Promise.all([
    esploraFetch(`${ESPLORA}/tx/${txid}`),
    esploraFetch(`${ESPLORA}/tx/${txid}/merkle-proof`),
  ]);
  if (!txRes.ok) throw new Error(txRes.status === 404 ? `No transaction ${txid.slice(0, 8)}…` : `Esplora returned ${txRes.status}.`);
  const tx = await txRes.json();
  if (!tx.status || !tx.status.confirmed) throw new Error('That transaction is unconfirmed — it has no section yet. If it pays its way, it sits in one of the projected chapters past the tip.');
  const hash = tx.status.block_hash;
  if (mpRes.ok) {
    const meta = await loadBlockMeta(hash, { withTxids: false });
    return { meta, index: (await mpRes.json()).pos, txid };
  }
  // No merkle proof -- fall back to locating the tx in the full txid list.
  const meta = await loadBlockMeta(hash);
  const index = meta.txids.indexOf(txid);
  if (index < 0) throw new Error('Transaction not found in its confirming block.');
  return { meta, index, txid };
}

// A confirmed transaction's raw hex is immutable -- the txid is its hash -- so
// it's memoized. Re-opening a section, or stepping back to one, re-parses from
// cache instead of re-fetching the (potentially large) hex. Unlike the block
// core (small, kept unbounded), a single tx hex can run to kilobytes -- an
// inscription witness, megabytes -- so this cache is bounded by a small LRU: the
// least-recently-viewed entries fall out once the cap is reached, which is fine
// since navigation only ever needs a handful at once. A Map keeps insertion
// order, so re-inserting on a hit marks it most-recently-used and the oldest key
// is always first.
const TX_HEX_CACHE_MAX = 64;
const txHexCache = new Map();   // txid -> Promise<hex>, ordered least- to most-recently-used
function loadTxHex(txid) {
  const cached = txHexCache.get(txid);
  if (cached) {
    txHexCache.delete(txid);
    txHexCache.set(txid, cached);   // move to the most-recently-used end
    return cached;
  }
  const p = (async () => {
    const kept = await storeGet('tx', txid);   // a transaction's bytes are its txid's forever
    if (kept) return kept;
    const r = await esploraFetch(`${ESPLORA}/tx/${txid}/hex`);
    if (!r.ok) throw new Error(`Esplora returned ${r.status} fetching tx ${txid.slice(0, 8)}…`);
    const hex = (await r.text()).trim();
    storePut('tx', txid, hex);
    return hex;
  })().catch((e) => { txHexCache.delete(txid); throw e; });
  txHexCache.set(txid, p);
  // Evict least-recently-used entries past the cap (Map iterates oldest-first).
  while (txHexCache.size > TX_HEX_CACHE_MAX) txHexCache.delete(txHexCache.keys().next().value);
  return p;
}

// ── The replaced ledger ───────────────────────────────────────────────────
// A transaction replaced by fee vanishes from every mempool -- but this
// reader saw it, so the book keeps it. The ledger records old -> new (the
// successor spends the very same coins, so the two are bound by
// construction) together with the replaced raw hex, which no endpoint will
// serve once the pool has dropped it. A superseded draft doesn't disappear
// from the book: it seats beneath its successor as a ghost page (see
// renderChapter / applyRbf), and the ledger is what lets it render forever.
const REPLACED_KEY = 'glossia-btc-replaced';
const REPLACED_MAX = 40;
let replacedLedger = (() => {
  try { const v = JSON.parse(localStorage.getItem(REPLACED_KEY)); return v && typeof v === 'object' ? v : {}; }
  catch { return {}; }
})();
const successorOf = (txid) => replacedLedger[txid]?.by || null;
const predecessorOf = (txid) => Object.keys(replacedLedger).find((k) => replacedLedger[k].by === txid) || null;
async function recordReplaced(oldTxid, newTxid) {
  let hex = null;
  try { hex = txHexCache.has(oldTxid) ? await txHexCache.get(oldTxid) : null; } catch { hex = null; }
  replacedLedger[oldTxid] = { by: newTxid, at: Math.floor(Date.now() / 1000), ...(hex ? { hex } : {}) };
  const keys = Object.keys(replacedLedger);
  if (keys.length > REPLACED_MAX) {
    keys.sort((a, b) => (replacedLedger[a].at || 0) - (replacedLedger[b].at || 0));
    for (const k of keys.slice(0, keys.length - REPLACED_MAX)) delete replacedLedger[k];
  }
  try { localStorage.setItem(REPLACED_KEY, JSON.stringify(replacedLedger)); } catch {}
}
// Open a superseded draft beneath the section on screen: seed its hex from
// the ledger (the network no longer has it) and render it as the ghost. A
// ghost whose hex this reader never held falls back to loadTxHex -- and,
// failing that, to the tombstone (see showCurrentTx).
function openGhost(oldTxid) {
  const rec = replacedLedger[oldTxid];
  if (rec && rec.hex && !txHexCache.has(oldTxid)) txHexCache.set(oldTxid, Promise.resolve(rec.hex));
  state.ghost = oldTxid;
  showCurrentTx();
}

// Backfill: successions this reader never witnessed, from the backend's RBF
// archive (/v1/tx/:txid/rbf -- { replacements: tree | null, replaces:
// txid[] | null }). The reader's own ledger answers first and always; the
// archive adds what it knows, which for mined transactions is roughly the
// last day (mined trees expire from it after ~24 h). Every tree node's
// stripped figures are harvested into ghostMeta so a hexless ghost can at
// least render its tombstone, and archive successions join the in-memory
// ledger (not persisted -- they're refetchable and carry no hex).
const rbfHistoryCache = new Map();   // txid -> Promise<{ predecessors: string[] }>
const ghostMeta = new Map();         // txid -> { fee, vsize, value, rate, time }
function loadRbfHistory(txid) {
  if (!rbfHistoryCache.has(txid)) {
    rbfHistoryCache.set(txid, (async () => {
      const preds = new Set(Object.keys(replacedLedger).filter((k) => replacedLedger[k].by === txid));
      const h = await mempoolBackendFetch(`/v1/tx/${txid}/rbf`).catch(() => null);
      if (h) {
        for (const p of (h.replaces || [])) preds.add(p);
        const walk = (node) => {
          if (!node || !node.tx) return;
          ghostMeta.set(node.tx.txid, { fee: node.tx.fee, vsize: node.tx.vsize, value: node.tx.value, rate: node.tx.rate, time: node.time });
          for (const child of node.replaces || []) {
            if (!child || !child.tx) continue;
            if (!replacedLedger[child.tx.txid]) replacedLedger[child.tx.txid] = { by: node.tx.txid, at: child.time || 0 };
            if (node.tx.txid === txid) preds.add(child.tx.txid);
            walk(child);
          }
        };
        walk(h.replacements);
      }
      return { predecessors: [...preds] };
    })());
  }
  return rbfHistoryCache.get(txid);
}

// A section's composed page -- parsed, txid-verified, Glossia-encoded fields
// -- memoized by txid (LRU, like loadTxHex). The neighbour prefetch warms
// this, so a swipe turn renders straight from cache with no encode work
// inside the animation. A bulky OP_RETURN data carrier is still deferred like
// a witness push -- its prose streams in on scroll (see lazyEncode); every
// other body field is encoded here.
const fieldsCache = new Map();   // txid -> { fields, verified }, LRU order
const FIELDS_CACHE_MAX = 12;
async function sectionFields(txid) {
  const cached = fieldsCache.get(txid);
  if (cached) {
    fieldsCache.delete(txid);
    fieldsCache.set(txid, cached);   // move to the most-recently-used end
    return cached;
  }
  const hex = await loadTxHex(txid);
  const parsed = parseTransaction(hex);
  const verifiedTxid = await computeTxid(parsed.baseHex);
  const entry = {
    // The encoder pins the reader's chosen language (composeTransactionFields'
    // own default is english); the cache is flushed when the choice changes,
    // so an entry never outlives the language it was composed in.
    fields: composeTransactionFields(parsed, BEST_OF, lazyEncode.placeholder,
      (hex, lang, bestOf) => encodeSeedPhrase(hex, bookLang(), bestOf)),
    verified: verifiedTxid === txid,
    // Which of the notation key's script patterns this section puts on the
    // page, for the key's filter. Classified once, beside the fields.
    templates: transactionTemplates(parsed),
  };
  fieldsCache.set(txid, entry);
  while (fieldsCache.size > FIELDS_CACHE_MAX) fieldsCache.delete(fieldsCache.keys().next().value);
  return entry;
}

async function showCurrentTx() {
  // A leaf (index < 0): no transaction to fetch -- the volume (-3), book (-2),
  // or chapter (-1) page renders straight from the metadata already in state.
  if (state.index < 0) {
    if (!ready) await init().catch(() => {});
    if (state.index === -3) renderVolumeLeaf();
    else if (state.index === -2) renderBookLeaf();
    else renderTitlePage();
    pageTemplates = new Set();
    updateUrl();
    $('chapter').classList.remove('hidden');
    setStatus('');
    consumeSlide();
    refreshNotationKey();
    liveProjection.sync();
    return;
  }
  setStatus(SPINNER_HTML + tr('fetching transaction…'));
  // The current txid: from the loaded list when we have it, else the single
  // transaction we opened by id (before its block's list is ever fetched).
  // A ghost -- a fee-replaced draft seated beneath its successor -- renders
  // its own body while the seat (list entry, tracking, §) stays the
  // successor's.
  const txid = state.ghost ? state.ghost
    : state.txids ? state.txids[state.index] : state.txid;
  if (!ready) await init().catch(() => {});
  // Parse, verify, and encode -- or, when the neighbour prefetch already
  // warmed this section, a straight cache hit (see sectionFields). A ghost
  // whose raw bytes nobody holds anymore -- replaced before this reader
  // ever saw it, dropped by every mempool since -- gets its tombstone: the
  // succession is remembered even where the text is not.
  let entry;
  try {
    entry = await sectionFields(txid);
  } catch (e) {
    if (state.ghost === txid) {
      renderGhostTombstone(txid);
      pageTemplates = new Set();
      updateUrl();
      $('chapter').classList.remove('hidden');
      setStatus('');
      consumeSlide();
      refreshNotationKey();
      liveProjection.sync();
      return;
    }
    throw e;
  }
  const { fields, verified } = entry;
  // Witnesses aren't encoded here -- they're the heaviest thing to render.
  // renderChapter marks each witness-bearing input with a footnote reference and
  // lays out the footnotes as placeholders; their prose is encoded lazily, per
  // push, as the reader scrolls to it (see lazyEncode / renderFootnotes).
  renderChapter({ num: state.index + 1, txid, fields, verified, ghost: !!state.ghost });
  pageTemplates = entry.templates ?? new Set();
  updateUrl();
  $('chapter').classList.remove('hidden');
  setStatus('');
  consumeSlide();
  refreshNotationKey();
  liveProjection.sync();
}

// What each keepable place is called, in the ribbon that offers to keep it.
// The reader keeps a chapter, a section, an output — not a hash, a txid, or a
// value; those are what the copy menu beside the ribbon is about. The two
// leaves name themselves the same way (attachLeafBookmark).
const KEEPS = {
  'block hash': 'this chapter',
  'transaction id': 'this section',
  output: 'this output',
  witness: 'this witness',
  'locking script': 'this locking script',
  volume: 'this volume',
  book: 'this book',
};

// Attach a click menu to an element already showing a Glossia-encoded hash as
// prose: `hex` is the exact raw value that prose encodes. Clicking (or
// Enter/Space) opens the hash menu -- copy the hex, or bookmark it; the raw hex
// is never revealed on the page. A hash that's a lookup target (a block hash,
// previous-block hash, or txid) can be bookmarked; a merkle root, which leads
// nowhere, is copy-only.
function attachHashCopy(el, hex, label, prose = el.textContent, vout = null, vin = null, wn = null) {
  // `prose` is the readable form the menu offers to copy. The hit target may be
  // a leading mark (⋔ for a merkle root) or a persistent heading (the chapter /
  // section title), so the prose is passed in explicitly rather than read off
  // `el`. Only the chapter's own hashes are navigable, hence bookmarkable;
  // every other label (merkle root, previous block hash, version, difficulty
  // target, nonce) is copy-only.
  // An output is bookmarkable too: it is not a hash, but it is a place in the
  // book -- the finest one the citation scheme names (§1.0) -- and the thing a
  // reader most often wants to keep. So is an input's witness: a footnote is
  // a place on the page, named by its section and the input that carries it.
  const nav = label === 'block hash' || label === 'transaction id' || label === 'output' || label === 'witness';
  el.classList.add('hash-copy');
  el.tabIndex = 0;
  el.setAttribute('aria-label', `${label}${vout == null ? '' : ` ${vout}`}${vin == null ? '' : ` of input ${vin + 1}`}: ${hex} — click for menu`);
  // A persistent element (a title) is re-attached with fresh hash data on every
  // section render: the menu params live on the element and are re-read at open
  // time, while the listeners are wired exactly once.
  // `wn` is a witness's 1-based footnote number -- its alphabet index on the
  // page -- carried so the keep can be cited by it (§17.a).
  const entry = { hex, label, prose, nav, vout, vin, wn, what: KEEPS[label] };
  el.__hashMenu = entry;
  // The ribbon is offered only where the place can actually be kept: a merkle
  // root leads nowhere, and a draft chapter has no settled reference yet, so
  // a bookmark of either could never take a row in the contents.
  if (nav && entryPlacement(entry)) {
    el.__bmEntry = entry;
    el.__bmKey = bookmarkKey(hex, bmSubOf(entry));
    setBookmarkRibbon(el, isBookmarked(hex, bmSubOf(entry)));
  } else {
    clearBookmarkRibbon(el);
    el.__bmKey = null;
  }
  if (el.__hashWired) return;
  el.__hashWired = true;
  const open = (e) => { if (el.__hashMenu) openHashMenu(e, el.__hashMenu, el); };
  // A mouse click on this focusable element would otherwise scroll it into view
  // (native focus behaviour); that scroll trips the menu's scroll-dismiss and
  // closes it the instant it opens. Suppress the focus scroll on mousedown.
  el.addEventListener('mousedown', (e) => e.preventDefault());
  el.addEventListener('click', open);
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(e); } });
}

// Strip the hash-menu affordance from a persistent element: the chapter-title
// slot doubles as the volume/book leaf title, where there is no hash to copy.
// The wired listeners stay; a null __hashMenu makes them inert.
function detachHashCopy(el) {
  el.classList.remove('hash-copy');
  el.removeAttribute('aria-label');
  el.tabIndex = -1;
  el.__hashMenu = null;
  el.__bmKey = null;
  clearBookmarkRibbon(el);
}

// A leaf's own bookmark: a volume or a book is a place the citation scheme
// names (III, III β2) and the search box answers to, so it is a place a reader
// can keep -- and the leaf's title carries the ribbon exactly as a chapter's
// does. There is no hash menu here: a span has no hex of its own, only the
// hash of the block it opens, which is that chapter's to copy and not the
// span's. So the ribbon stands alone, the whole of what this title offers.
function attachLeafBookmark(el, page) {
  const { volume, book } = volumeBookChapter(state.height);
  const entry = {
    hex: state.hash, label: page, page, what: KEEPS[page],
    // The citation to the depth this leaf stands at -- the whole of what
    // there is to say about where a span sits.
    prose: page === 'volume' ? toRoman(volume) : `${toRoman(volume)} β${book}`,
  };
  if (!state.hash || !entryPlacement(entry)) { clearBookmarkRibbon(el); el.__bmKey = null; return; }
  el.__bmEntry = entry;
  el.__bmKey = bookmarkKey(entry.hex, null, page);
  setBookmarkRibbon(el, isBookmarked(entry.hex, null, page));
}

// Render a Glossia-encoded hash into `el` as its bold-gold data mark (⌘ for a
// block hash, ⋔ for the merkle root) followed by the plain prose. The mark is
// the clickable handle for the copy/bookmark menu; the prose is never interactive.
// `zeros` ({ sup, title }), for a block hash, closes the line with the ⓪
// push-zero glyph carrying the dropped proof-of-work zero-bit count -- after
// the prose, where those zeros sit in the bytes it encodes (see the notation
// comment above blockHashParts).
function fillMarkedHash(el, mark, markClass, hex, label, prose, sup, supTitle, zeros) {
  el.textContent = '';
  const m = document.createElement('span');
  m.className = markClass;
  m.textContent = mark;
  // A block hash's copy-text carries its full ⌘ᵐ … ⓪ⁿ notation, so the text
  // form states the proof-of-work zeros just as the page does. A hash with no
  // zeros to state (the merkle root) copies as bare prose, as it always has.
  attachHashCopy(m, hex, label, zeros
    ? `${mark}${toSuperscript(sup)} ${prose} ⓪${toSuperscript(zeros.sup)}`
    : prose);
  el.append(m);
  // The mark can carry a count as a superscript riding after it, the way a
  // typed script push reads (p⁶⁵) -- a header field isn't a push, but the
  // notation is the same. The merkle root's ⋔ counts bytes; a block hash's ⌘
  // counts BITS by definition, pairing with the ⓪ mark so the two sum to 256.
  if (sup) {
    const s = document.createElement('span');
    s.className = 'op op-push op-count';   // a bare count: prose-sized, like a push's
    s.textContent = toSuperscript(sup);
    if (supTitle) s.title = supTitle;
    el.append(s);
  }
  el.append(' ' + prose);
  if (zeros) {
    const z = document.createElement('span');
    z.className = markClass;
    z.textContent = '⓪';
    z.title = zeros.title;
    const zs = document.createElement('span');
    zs.className = 'op op-push';
    zs.textContent = toSuperscript(zeros.sup);
    zs.title = zeros.title;
    el.append(' ', z, zs);
  }
}

// The block header itself, in wire order, as a small mono line under the
// chapter hash: version, previous-block hash, merkle root, timestamp,
// difficulty target, nonce. The target's line states the proof of work as
// the inequality it is -- β₇₈ < 2¹⁶⁰·213529 -- the < binding the chapter
// hash at the head of the page to the ceiling it reads below, without the
// field leaving its wire slot. The two hashes are Glossia-encoded here
// (like the chapter/section hash above); the rest come pre-decoded from
// composeBlockHeaderFields. Genesis has no previous block: all 256 bits
// are zero, which the notation states literally as ⓪²⁵⁶ -- nothing to
// encode.
function renderFrontispiece(header) {
  const el = $('ch-frontispiece');
  el.innerHTML = '';
  const hf = composeBlockHeaderFields(header);
  const isGenesisPrev = header.prevBlockHash === '00'.repeat(32);
  const prevParts = isGenesisPrev ? null : blockHashParts(header.prevBlockHash);
  const prevProse = isGenesisPrev
    ? '⓪' + toSuperscript(256)
    : encodeSeedPhrase(prevParts.hex, bookLang(), BEST_OF).prose;
  // The merkle root isn't proof-of-work-constrained, so unlike a block hash
  // it has no expected run of zero bytes worth trimming.
  const merkleProse = encodeSeedPhrase(reverseHex(header.merkleRoot), bookLang(), BEST_OF).prose;
  // Each on-chain hash leads with a bold-gold mark (⌘ for a block hash, ⋔ for
  // the merkle root) that carries the copy menu; the prose beside it is not
  // itself clickable. The rest of the fields are plain decoded numbers.
  const items = [
    // The version wears its bold-gold v mark in both forms -- the pre-BIP9
    // integer (v1) and the BIP9 word-pair (v accio library 100) -- and the
    // mark opens a copy menu: the compact hex, or the notation text.
    { text: hf.version, mark: 'v', markClass: 'fx-mark', title: hf.versionTitle,
      menu: { hex: (header.version >>> 0).toString(16).padStart(8, '0'), label: 'block version',
              prose: /^\d/.test(hf.version) ? `v${hf.version}` : hf.version } },
    isGenesisPrev
      ? { text: prevProse, title: 'no earlier block — this is the genesis block (all 256 bits zero)' }
      : { text: prevProse, mark: '⌘', markClass: 'dt', sup: prevParts.remainBits,
          supTitle: remainBitsTitle(prevParts.remainBits),
          zeros: prevParts.zeroBits ? { sup: prevParts.zeroBits, title: zeroBitsTitle(prevParts.zeroBits) } : null,
          copy: { hex: header.prevBlockHash, label: 'previous block hash' } },
    { text: merkleProse, mark: '⋔', markClass: 'merkle-mark', sup: 32, supTitle: '32 bytes',
      copy: { hex: header.merkleRoot, label: 'merkle root' } },
    { text: hf.timestamp, title: hf.timestampTitle },
    // The proof of work, stated as the inequality it is: β₇₈ < 2¹⁶⁰·213529,
    // in nBits' own wire slot. The gold β mark's subscript is the target's
    // leading zero run (the demand, the mining vernacular); the < binds the
    // chapter hash at the head of the page to the exact target after it --
    // the 256-bit ceiling in primes, the power of two carrying its scale and
    // the small factors what a retarget last moved. β opens a copy menu: the
    // compact 4-byte hex, or the display form.
    hf.bitsExpr
      ? { text: `< ${hf.bitsExpr}`, mark: hf.bits, markClass: 'fx-mark', gap: true,
          title: `the proof of work — the chapter hash at the head of the page, read as a 256-bit number, is below this target. ${hf.bitsTitle}`,
          menu: { hex: (header.bits >>> 0).toString(16).padStart(8, '0'), label: 'difficulty target', prose: `${hf.bits} ${hf.bitsExpr}` } }
      : { text: hf.bits, title: hf.bitsTitle, gold: true,
          menu: { hex: (header.bits >>> 0).toString(16).padStart(8, '0'), label: 'difficulty target', prose: hf.bits } },
    // The η mark alone is bold gold; the nonce beside it stays plain -- and is
    // factored, as the target above it is, so the two products can be read
    // against each other: structure on one line, none at all on the next.
    { text: hf.nonce, mark: 'η', markClass: 'fx-mark', title: hf.nonceTitle,
      menu: { hex: (header.nonce >>> 0).toString(16).padStart(8, '0'), label: 'nonce', prose: hf.nonce } },
  ];
  for (const { text, title, copy, mark, markClass, gold, sup, supTitle, zeros, gap, menu } of items) {
    const span = document.createElement('span');
    span.className = gold ? 'cfx cfx-gold' : 'cfx';
    if (mark && copy) {
      fillMarkedHash(span, mark, markClass, copy.hex, copy.label, text, sup, supTitle, zeros);
    } else if (mark) {
      // A marked plain field: the mark leads, the value follows -- tight
      // against a numeral (v1, η2573394689), a space before a word form
      // (v accio library 100) -- or where `gap` insists on one (β₇₈'s target
      // expression is a product beside the mark, not a value it prefixes).
      // A `menu` makes the mark a copy handle.
      const m = document.createElement('span');
      m.className = markClass;
      m.textContent = mark;
      if (menu) attachHashCopy(m, menu.hex, menu.label, menu.prose);
      span.append(m, (gap || !/^\d/.test(text) ? ' ' : '') + text);
      if (title) span.title = title;
    } else {
      span.textContent = text;
      if (title) span.title = title;
      if (menu) attachHashCopy(span, menu.hex, menu.label, menu.prose);   // β: the whole mark is the handle
    }
    el.append(span);
  }
}

// ── The tip's clock ───────────────────────────────────────────────────────
// Every chapter in the book is finished except the last, and the last is only
// finished until the next one arrives. Its page says so: the chain tip wears
// "latest block: T+3m40s" as its subtitle, counting up from the block's own
// timestamp, a second at a time, for as long as it stands at the head of the
// chain. Nothing else on a mined page moves.
// The clock is a property of the tip, not of the block -- it comes off the
// moment the page stops being the tip's: another chapter opened, a section
// entered, or the next block mined (which turns the page to the new tip and
// leaves this one plain).
const tipClock = (() => {
  let timer = null, el = null, since = 0, sep = '';
  const stop = () => {
    if (timer) { clearInterval(timer); timer = null; }
    el = null;
  };
  // A miner's timestamp may sit ahead of the reader's clock -- consensus
  // allows it to run up to two hours fast -- so the age is floored at zero
  // rather than counting backwards toward the block.
  const paint = () => {
    if (!el || !el.isConnected) { stop(); return; }   // the subtitle was rewritten out from under us
    const s = Math.max(0, Math.floor(Date.now() / 1000 - since));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const pad = (n) => String(n).padStart(2, '0');
    const age = h ? `T+${h}h${pad(m)}m${pad(sec)}s` : m ? `T+${m}m${pad(sec)}s` : `T+${sec}s`;
    el.textContent = `${sep}latest block: ${age}`;
  };
  return {
    // Hang the running age off the end of the subtitle line, after whatever
    // the chapter already carries there (a curated block keeps its name), and
    // start the tick. The separator rides inside the same span, so retiring
    // the clock takes the whole phrase with it.
    show(subtitle, timestamp) {
      stop();
      since = timestamp;
      sep = subtitle.textContent ? ' · ' : '';
      el = document.createElement('span');
      el.title = 'how long this block has stood at the head of the chain — counted from the timestamp its miner wrote';
      subtitle.append(el);
      paint();
      timer = setInterval(paint, 1000);
    },
    // The block stopped being the tip while its page is still on screen (its
    // successor is being fetched): the line comes off at once rather than
    // counting on under a claim that has just stopped being true.
    retire() {
      const host = el && el.parentNode;
      if (el) el.remove();
      stop();
      if (host && !host.textContent) host.classList.add('hidden');
    },
    stop,
  };
})();

// The chapter head in its two dresses. The chapter's own page (index -1) wears
// the full head -- big title, hash prose, frontispiece; a section page folds
// the chapter into the Volume/Book eyebrow line -- "Volume 1 · Book 100 ·
// Chapter 333" -- a running head, not a heading. A block that's a curated
// entry (a halving, an activation, ...) keeps its "Chapter n" heading and
// carries its event name as a subtitle on the full head, and as the crumb's
// compact name in the running head -- the genesis block included, which is a
// curated entry like the halvings rather than a special case here.
// Chapter headings spell their numbers out the way a book sets them --
// "Chapter One" through "Chapter One Hundred" -- and fall back to numerals
// past SPELLED_CHAPTER_MAX ("Chapter 101"), where spelled forms grow unwieldy.
const SPELLED_CHAPTER_MAX = 100;
const SPELLED_ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight',
  'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen',
  'Seventeen', 'Eighteen', 'Nineteen'];
const SPELLED_TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
function chapterName(n) {
  if (n > SPELLED_CHAPTER_MAX) return n.toLocaleString();
  if (n === 100) return 'One Hundred';
  if (n < 20) return SPELLED_ONES[n];
  return SPELLED_TENS[Math.floor(n / 10)] + (n % 10 ? '-' + SPELLED_ONES[n % 10] : '');
}

function renderChapterHead(onTitlePage) {
  tipClock.stop();   // re-started below if this render is the tip's own page
  if (state.projected) return renderProjectedHead(onTitlePage);
  const { volume, book, chapter } = volumeBookChapter(state.height);
  // The chapter's own page carries the Volume · Book crumbs; a section's
  // running head carries just the chapter (the crumb back to its page) --
  // the higher levels are a swipe or a crumb away, not a headline.
  showEyebrowCrumbs(onTitlePage, onTitlePage);
  $('ch-volume').textContent = volume.toLocaleString();
  $('ch-book').textContent = book.toLocaleString();
  // A notable block keeps its "Chapter n" heading and carries its event name
  // as a subtitle beneath it. A height with several notable entries (the
  // supply-cap fork carries two) shows them all, dot-separated. The genesis
  // block is one of those entries -- it used to be subtitled from a hardcoded
  // case here, which kept it out of the table of contents.
  // A page: 'book' entry shares the height namespace (its id is its book's
  // first block) but names the book's leaf, not this chapter -- excluded here.
  const eventTitles = places()
    .filter((p) => p.id === String(state.height) && !p.page && !p.address)
    .map(placeTitle);
  const eventTitle = eventTitles[0];
  $('ch-title').textContent = `Chapter ${chapterName(chapter)}`;
  // The chapter's name line: the reader's keep of this chapter (a block-hash
  // bookmark) overrides the curated event names while it stands, and the
  // names return the moment the keep is removed -- syncBookmarkTitles
  // repaints this span live and manages the subtitle's visibility with it
  // (which is why the render-time hidden toggle that used to sit below the
  // crumb block is gone). The text lives in a child span so the tip clock,
  // appended beside it, survives a rename.
  const subtitle = $('ch-subtitle');
  subtitle.textContent = '';
  const evSpan = document.createElement('span');
  evSpan.dataset.bmSubtitle = state.hash;
  evSpan.dataset.fallback = eventTitles.join(' · ');
  evSpan.dataset.bmChapter = onTitlePage ? 'title' : 'head';
  subtitle.append(evSpan);
  // The chain tip, and only on its own page, carries the running clock.
  if (onTitlePage && atTipPage()) tipClock.show(subtitle, state.block.timestamp);
  syncBookmarkTitles();
  // On a section page the running head's chapter is a crumb back to the
  // chapter's own page -- no fetch needed, the block is already in state.
  const inline = $('ch-chapter-inline');
  inline.textContent = '';
  if (!onTitlePage) {
    const crumb = document.createElement('button');
    crumb.type = 'button';
    crumb.className = 'crumb';
    crumb.textContent = eventTitle || `Chapter ${chapterName(chapter)}`;
    crumb.title = `Chapter page (${reference(state.height)})`;
    crumb.setAttribute('aria-label', `Open this chapter's own page (${reference(state.height)})`);
    crumb.addEventListener('click', () => { rememberTrail(); state.ghost = null; state.index = -1; showCurrentTx(); });
    inline.append(crumb);
  }
  $('ch-title').classList.toggle('hidden', !onTitlePage);
  $('ch-hash-short').classList.toggle('hidden', !onTitlePage);
  $('ch-frontispiece').classList.toggle('hidden', !onTitlePage);
  if (onTitlePage) {
    const parts = blockHashParts(state.hash);
    const { prose: hashProse } = encodeSeedPhrase(parts.hex, bookLang(), BEST_OF);
    // The hash prose sits between its marks -- ⌘ᵐ opening, the encoded
    // remainder, then the ⓪ⁿ proof-of-work zeros that follow those bytes; the
    // chapter title above it is the clickable handle for its copy/bookmark menu.
    $('ch-hash-short').classList.remove('plain');   // hash prose: italic voice
    $('ch-hash-short').innerHTML = hashNotationHtml(parts, hashProse);   // marks + Glossia prose -- safe as innerHTML
    attachHashCopy($('ch-title'), state.hash, 'block hash', hashNotationText(parts, hashProse));
    renderFrontispiece(state.header);
  }
  return { volume, book, chapter };
}

// The projected chapter's head: the inversion of a mined chapter's. There,
// the header is certain and immutable while nothing else is on the page;
// here the body is a live draft and the header does not exist -- so the
// frontispiece shows the six header slots with most of them empty. Two are
// already determined and fill in from the tip: the first projected
// chapter's previous-block hash IS the tip's hash, and within the tip's own
// difficulty window the target β is already law (the window, not the book --
// the two coincide only in Volume I). The hash line, having no hash to
// encode, carries the draft's figures. Everything renders from state (REST
// figures) -- the manifest is only needed once the reader pages into a
// section.
function renderProjectedHead(onTitlePage) {
  const gen = renderGen;
  const { volume, book, chapter } = volumeBookChapter(state.height);
  const k = state.projIndex;
  // A draft chapter hangs under Appendix I, not under a volume and a book of
  // the body: no block has placed it in one, and the queue's own equivalent
  // of a book is still to be written. So the crumb above it -- and the
  // ascent -- is the appendix.
  showEyebrowCrumbs(false, false, onTitlePage);
  $('ch-volume').textContent = volume.toLocaleString();
  $('ch-book').textContent = book.toLocaleString();
  $('ch-title').textContent = `Chapter ${chapterName(chapter)}`;
  const subtitle = $('ch-subtitle');
  // Named the way Appendix I names it -- alpha for the draft at the head of
  // the queue, then the ones behind it. A mined chapter's subtitle carries
  // what it is known for; a draft has nothing it is known for yet, so it
  // carries its place in the queue and how long that place is expected to
  // last.
  subtitle.textContent = `${queueLabel(k + 1)} — ETA ${blocksEta(k + 1)}`;
  subtitle.title = 'a draft chapter read from the mempool: these transactions are what a miner working right now would take, in the order they pay for';
  const inline = $('ch-chapter-inline');
  inline.textContent = '';
  if (!onTitlePage) {
    const crumb = document.createElement('button');
    crumb.type = 'button';
    crumb.className = 'crumb';
    crumb.textContent = `Chapter ${chapterName(chapter)}`;
    crumb.title = `Projected chapter page (${referenceOf(state.height)})`;
    crumb.setAttribute('aria-label', `Open this projected chapter's own page (${referenceOf(state.height)})`);
    crumb.addEventListener('click', () => { rememberTrail(); state.ghost = null; state.index = -1; showCurrentTx(); });
    inline.append(crumb);
  }
  $('ch-title').classList.toggle('hidden', !onTitlePage);
  subtitle.classList.toggle('hidden', !onTitlePage);
  $('ch-hash-short').classList.toggle('hidden', !onTitlePage);
  $('ch-frontispiece').classList.toggle('hidden', !onTitlePage);
  if (!onTitlePage) return { volume, book, chapter };

  detachHashCopy($('ch-title'));   // no hash exists yet -- nothing to copy or bookmark
  const b = state.proj;
  const line = $('ch-hash-short');
  line.classList.add('plain');   // figures, not hash prose -- upright
  line.textContent = `${b.nTx.toLocaleString()} § · ${(b.blockVSize / MVB).toFixed(2)} MvB · ${(b.totalFees / 1e8).toFixed(4)} ₿ in fees`;
  line.title = 'the draft’s figures — a snapshot of the queue, reshuffled by every arrival and renumbered by every block';

  const el = $('ch-frontispiece');
  el.innerHTML = '';
  const slot = ({ mark, markClass, text, title, gold }) => {
    const span = document.createElement('span');
    span.className = gold ? 'cfx cfx-gold' : 'cfx';
    if (mark) {
      const m = document.createElement('span');
      m.className = markClass;
      m.textContent = mark;
      span.append(m, (/^[\d]/.test(text) ? '' : ' ') + text);
    } else {
      span.textContent = text;
    }
    if (title) span.title = title;
    el.append(span);
    return span;
  };
  slot({ mark: 'v', markClass: 'fx-mark', text: '—', title: 'no version until a miner writes one — and with it, their rule vote' });
  const prevSpan = slot(k === 0
    ? { mark: 'h', markClass: 'dt', text: '⋯', title: 'the previous block — the chain tip, resolving…' }
    : { text: '⋯', title: 'the previous chapter is itself unwritten' });
  slot({ mark: '⋔', markClass: 'merkle-mark', text: '—', title: 'no merkle root until the section list is sealed' });
  slot({ text: `ETA ${blocksEta(k + 1)}`, title: `no timestamp until mined — expected in about ${(k + 1) * 10} min, give or take ${Math.round(10 * Math.sqrt(k + 1))}: block arrivals average one per ten minutes` });
  const betaSpan = slot({ text: 'β —', gold: true, title: 'the difficulty target' });
  slot({ mark: 'η', markClass: 'fx-mark', text: '—', title: 'no nonce until the proof of work is found' });

  // The determined slots fill from the tip's (cached) core.
  loadBlockByHeight(tipHeight, { withTxids: false }).then((tipCore) => {
    if (gen !== renderGen) return;
    if (k === 0) {
      const prevTrimmed = trimTrailingZeroBytes(reverseHex(tipCore.hash));
      const prevBytes = prevTrimmed.length / 2;
      const prose = encodeSeedPhrase(prevTrimmed, bookLang(), BEST_OF).prose;
      fillMarkedHash(prevSpan, 'h', 'dt', tipCore.hash, 'previous block hash', prose, prevBytes,
        prevBytes < 32
          ? `${prevBytes} bytes encoded — the hash's ${32 - prevBytes} trailing zero bytes (required by proof-of-work) carry nothing and are dropped`
          : '32 bytes');
      prevSpan.title = 'already determined: whatever this chapter becomes, it follows the tip';
    }
    // The window, not the book: the two are the same 2,016 blocks only in
    // Volume I, so what settles whether the tip's target is already law for
    // this chapter is whether the two share a retarget window.
    if (windowStartOf(state.height) === windowStartOf(tipCore.height)) {
      const hf = composeBlockHeaderFields(tipCore.header);
      betaSpan.textContent = hf.bits;
      betaSpan.title = `${hf.bitsTitle} — already law for this chapter: it falls in the tip's own difficulty window`;
    } else {
      betaSpan.title = 'this chapter opens a new difficulty window, and a new window means a retarget — its target is not yet set';
    }
  }).catch(() => { /* the tip's core is a nicety here -- the slots stay pending */ });
  return { volume, book, chapter };
}

// The shared shell of every leaf (volume, book, chapter page): clear the
// section apparatus and drop in-flight section work. Returns the new render
// generation so a leaf's async fills can drop stale updates.
function renderLeafShell() {
  $('chapter').classList.add('title-leaf');
  ++renderGen;
  lazyEncode.reset();
  tipClock.stop();
  // Cleared, not just hidden: the chapter subtitle's live span (see
  // renderChapterHead / syncBookmarkTitles) must not survive onto a leaf,
  // where a later bookmark change would re-show it with stale text.
  $('ch-subtitle').textContent = '';
  $('ch-subtitle').classList.add('hidden');
  // A leaf has no folio -- pages belong to sections -- and its grid cell goes
  // back to the chapter-next stepper.
  $('page-folio').classList.add('hidden');
  $('section-title').classList.add('hidden');
  $('section-hash').classList.add('hidden');
  $('section-meta').classList.add('hidden');
  $('ch-paragraphs').innerHTML = '';
  $('ch-footnotes').innerHTML = '';
  $('ch-totals').innerHTML = '';
  $('ch-footnotes-section').classList.add('hidden');
  currentFootnotes = [];
  footnotesLoaded = false;
  return renderGen;
}

// Show/hide the eyebrow's three crumbs (volume · book · chapter-inline is
// managed separately). A leaf hides the parts at or below its own level.
function showEyebrowCrumbs(volume, book, appendix = false) {
  $('ch-volume-link').classList.toggle('hidden', !volume);
  $('ch-sep-1').classList.toggle('hidden', !(volume && book));
  $('ch-book-link').classList.toggle('hidden', !book);
  $('ch-appendix-link').classList.toggle('hidden', !appendix);
}

// The chapter's own page: the head alone -- title, hash prose, frontispiece --
// with the section apparatus cleared, the way a printed chapter opens on its
// own leaf before the first section's page.
function renderTitlePage() {
  renderLeafShell();
  $('chapter').classList.remove('span-leaf');
  renderChapterHead(true);
  labelNav();
}

// The volume's own page: its Roman numeral over the block numbers it spans
// and the years those blocks were recorded (the closing year streams in; an
// unfinished volume's range ends at the chain tip so far).
function renderVolumeLeaf() {
  const gen = renderLeafShell();
  $('chapter').classList.add('span-leaf');
  const { volume } = volumeBookChapter(state.height);
  showEyebrowCrumbs(false, false);
  $('ch-chapter-inline').textContent = '';
  const title = $('ch-title');
  title.textContent = `Volume ${toRoman(volume)}`;
  title.classList.remove('hidden');
  detachHashCopy(title);
  attachLeafBookmark(title, 'volume');
  const volEnd = heightOf(volume + 1, 1, 1) - 1;
  const finished = tipHeight !== null && tipHeight >= volEnd;
  // An unfinished volume's range runs to the chain tip -- its current last
  // recorded book -- trailed by the em dash that marks it still being
  // written; only an unknown tip leaves the range open after book 1.
  const tipIn = !finished && tipHeight !== null && tipHeight >= state.height ? tipHeight : null;
  const line = $('ch-hash-short');
  line.classList.remove('hidden');
  line.classList.add('plain');   // a range, not hash prose -- upright
  line.textContent = finished ? `β1 – β${volumeBookChapter(volEnd).book}`
    : tipIn !== null ? `β1 – β${volumeBookChapter(tipIn).book} —`
    : 'β1 —';
  line.title = finished ? 'the books this volume spans' : 'the books recorded so far — this volume is still being written';
  const firstYear = new Date(state.block.timestamp * 1000).getUTCFullYear();
  const fp = $('ch-frontispiece');
  fp.classList.remove('hidden');
  const yearEnd = finished ? volEnd : tipIn;
  if (yearEnd === null) {
    fp.textContent = `${firstYear} —`;
    fp.title = 'this volume is still being written';
  } else {
    fp.textContent = `${firstYear} – …`;
    if (!finished) fp.title = 'the years recorded so far — this volume is still being written';
    loadBlockStamp(yearEnd).then((ts) => {
      if (gen !== renderGen) return;
      const lastYear = new Date(ts * 1000).getUTCFullYear();
      const range = firstYear === lastYear ? String(firstYear) : `${firstYear} – ${lastYear}`;
      fp.textContent = finished ? range : `${range} —`;
    }).catch(() => { if (gen === renderGen) fp.textContent = finished ? String(firstYear) : `${firstYear} —`; });
  }
  labelNav();
}

// One difficulty target on the book leaf, in the same β₇₈ < 2¹⁶⁰·213529 form
// a chapter's frontispiece uses: the gold mark, the exact factored ceiling
// beside it, and the same copy menu (compact hex, or the mark with its
// expression). `governs` names the chapters mined under it, for the tooltip.
// The marks go straight into `parent` and carry no furniture of their own --
// a book with one target puts them on the line exactly as this leaf always
// has, and a book with two gives each its own row to stand on.
function appendBookTarget(parent, bits, governs) {
  const info = bitsInfo(bits);
  const title = info.expr
    ? `the proof of work — ${governs}, read as a 256-bit number, is below this target. ${info.title}`
    : info.title;
  const beta = document.createElement('span');
  beta.className = 'cfx-gold';
  beta.textContent = info.sym;
  beta.title = title;
  attachHashCopy(beta, (bits >>> 0).toString(16).padStart(8, '0'), 'difficulty target',
    info.expr ? `${info.sym} ${info.expr}` : info.sym);
  parent.append(beta);
  if (info.expr) {
    const expr = document.createElement('span');
    // Marked mk: the < is a mark of the notation like any other, and the key's
    // filter has to be able to see it here as it does in the frontispiece.
    expr.className = 'mk';
    expr.textContent = ' < ' + info.expr;
    expr.title = title;
    parent.append(expr);
  }
}

// A target on a row of its own, for a book that was mined under two: the same
// marks, on their own line, and held there -- a row breaks between the targets
// because that is where the book changed, never inside a β < 2ᵏ·p….
function targetRow(parent, bits, governs) {
  const row = document.createElement('div');
  row.className = 'book-target';
  if (bits !== null) appendBookTarget(row, bits, governs);
  parent.append(row);
  return row;
}

// A difficulty, in the same shape bitsInfo's tooltip gives it.
const formatDifficulty = (d) => d.toLocaleString(undefined, { maximumFractionDigits: d < 1000 ? 2 : 0 });

// What the retarget between a book's two targets did, stated as the move in
// difficulty rather than in the targets printed above it. The two run
// opposite ways -- a target is a ceiling, so a higher one is easier work --
// and difficulty is the direction the book's own commentary speaks in
// ("Difficulty +49%", "−10.8%"). Equal nBits is stated as unchanged rather
// than as +0.00%: a retarget that recomputes to the same compact target left
// the work alone, and saying so is truer than a rounded zero.
function difficultyMove(bitsBefore, bitsAfter, before, after) {
  if ((bitsBefore >>> 0) === (bitsAfter >>> 0)) return 'difficulty unchanged';
  const pct = (after / before - 1) * 100;
  return `difficulty ${pct > 0 ? '+' : '−'}${Math.abs(pct).toFixed(2)}%`;
}

// The book's own page: its number over the dates and times its first and last
// blocks were recorded (the closing timestamp streams in; an unfinished
// book's range ends at the chain tip so far).
function renderBookLeaf() {
  const gen = renderLeafShell();
  $('chapter').classList.add('span-leaf');
  const { volume, book, chapterCount } = volumeBookChapter(state.height);
  showEyebrowCrumbs(true, false);
  $('ch-volume').textContent = volume.toLocaleString();
  $('ch-chapter-inline').textContent = '';
  const title = $('ch-title');
  title.textContent = `Book ${book.toLocaleString()}`;
  title.classList.remove('hidden');
  detachHashCopy(title);
  attachLeafBookmark(title, 'book');
  // A curated book (a soft fork's signaling epoch) wears its name as the
  // leaf's subtitle, the same dress a notable chapter wears.
  const bookEvent = places().find((p) => p.page === 'book' && p.id === String(state.height));
  const subtitle = $('ch-subtitle');
  subtitle.textContent = bookEvent ? placeTitle(bookEvent) : '';
  subtitle.classList.toggle('hidden', !bookEvent);
  $('ch-frontispiece').classList.add('hidden');
  const bookEnd = state.height + chapterCount - 1;
  const finished = tipHeight !== null && tipHeight >= bookEnd;
  // As on the volume leaf: an open book's range runs to the tip, its current
  // last recorded chapter, with the em dash marking it still being written.
  const tipIn = !finished && tipHeight !== null && tipHeight >= state.height ? tipHeight : null;
  // Right beneath the title: the ceilings this book was mined under. A book
  // that is a whole difficulty window has one, and prints it as this leaf
  // always has -- all of Volume I, and every volume's truncated last book. A
  // book that straddles a retarget has two, and gives each a row of its own,
  // opening above closing, with what the retarget did to the difficulty on the
  // line beneath. Nothing is written between the two rows: they are the same
  // field stated twice, and the change from one to the next is what the move
  // underneath says in the unit the change is felt in. Two is the ceiling on
  // ceilings -- see retargetInside.
  const line = $('ch-hash-short');
  line.classList.remove('hidden');
  line.classList.add('plain');   // a target mark, not hash prose -- upright
  line.textContent = '';
  const cut = retargetInside(state.height, chapterCount);
  const cutChapter = cut === null ? null : cut - state.height + 1;
  // A retarget the book has not reached yet has no target to state, so an
  // unfinished book stands on the one it has been mined under so far.
  const straddles = cut !== null && (tipHeight === null || tipHeight >= cut);
  if (!straddles) {
    // One target, and the leaf it has always made: the mark and its ceiling
    // on the line, nothing around them. The < speaks for a run of chapters
    // rather than one hash, so it names the run -- the whole book where the
    // book is a whole window, and only what is settled where a retarget is
    // still to come.
    appendBookTarget(line, state.header.bits, cut === null
      ? 'every chapter hash in this book'
      : `every chapter hash from ■1 to ■${(cutChapter - 1).toLocaleString()}`);
  } else {
    targetRow(line, state.header.bits,
      `every chapter hash from ■1 to ■${(cutChapter - 1).toLocaleString()}`);
    // The closing target comes from the retarget block, which is a fetch away:
    // the row it will stand on is drawn straight away, holding an ellipsis, so
    // the leaf does not jump when the answer lands.
    const second = targetRow(line, null, null);
    second.textContent = '…';
    const move = document.createElement('div');
    move.className = 'book-move';
    line.append(move);
    loadBlockInfoByHeight(cut).then((info) => {
      if (gen !== renderGen) return;
      second.textContent = '';
      appendBookTarget(second, info.bits,
        `every chapter hash from ■${cutChapter.toLocaleString()} to ■${chapterCount.toLocaleString()}`);
      const before = bitsToDifficulty(state.header.bits), after = bitsToDifficulty(info.bits);
      move.textContent = difficultyMove(state.header.bits, info.bits, before, after);
      move.title = `the retarget at ■${cutChapter.toLocaleString()} (block ${cut.toLocaleString()}), where this book crosses from one difficulty window into the next`
        + ` — difficulty ${formatDifficulty(before)} → ${formatDifficulty(after)}, relative to the genesis block`;
    }).catch(() => { if (gen === renderGen) { second.remove(); move.remove(); } });
  }
  // Then the chapters the book spans, under the block glyph (■, as references
  // write chapter numbers -- chapters restart at 1 each book, so a full book
  // reads ■1 – ■2,016 and an era's truncated last book ■1 – ■336; an
  // unfinished book has no closing chapter to name), and the recorded dates
  // (em dash while the book is still being written).
  const fp = $('ch-frontispiece');
  fp.classList.remove('hidden');
  fp.textContent = '';
  const range = document.createElement('div');
  range.textContent = finished ? `■1 – ■${chapterCount.toLocaleString()}`
    : tipIn !== null ? `■1 – ■${(tipIn - state.height + 1).toLocaleString()} —`
    : '■1 —';
  range.title = finished ? 'the chapters this book spans' : 'the chapters recorded so far — this book is still being written';
  fp.append(range);
  const dates = document.createElement('div');
  const dateEnd = finished ? bookEnd : tipIn;
  if (dateEnd === null) {
    dates.textContent = `${timestampInfo(state.block.timestamp).mark} —`;
  } else {
    dates.textContent = `${timestampInfo(state.block.timestamp).mark} – …`;
    loadBlockStamp(dateEnd).then((ts) => {
      if (gen !== renderGen) return;
      dates.textContent = `${timestampInfo(state.block.timestamp).mark} – ${timestampInfo(ts).mark}${finished ? '' : ' —'}`;
    }).catch(() => { if (gen === renderGen) dates.textContent = `${timestampInfo(state.block.timestamp).mark}${finished ? '' : ' —'}`; });
  }
  fp.append(dates);
  labelNav();
}

// A projected section's price of admission, as its event line: the effective
// fee rate the ordering ran on, marked as a package rate where it departs
// from the transaction's own fee ÷ vsize (family money -- CPFP).
function projectedRateLine(m) {
  const fmtR = (f) => f >= 10 ? String(Math.round(f)) : String(Math.round(f * 10) / 10);
  const own = m.vsize ? m.fee / m.vsize : m.rate;
  return `~${fmtR(m.rate)} sat/vB${Math.abs(m.rate - own) > 0.05 ? ' — package rate (CPFP)' : ''}`;
}

// Re-seat a projected section's furniture in place -- eyebrow and running-
// head crumb, § number, rate line, URL, nav -- around an unchanged body: the
// live tracker moves the page's address, never its text.
function refreshProjectedSectionFurniture() {
  renderProjectedHead(false);
  // The § number is the span's leading text node; a ghost's replaceability
  // dagger rides after it as an element of its own, so write the text alone
  // -- a reseat moves the seat, it doesn't revoke the mark.
  const secNum = document.querySelector('#section-title .section-num');
  const num = `§ ${state.index + 1}`;
  if (secNum && secNum.firstChild && secNum.firstChild.nodeType === Node.TEXT_NODE) secNum.firstChild.nodeValue = num;
  else if (secNum) secNum.textContent = num;
  if (!state.ghost) {
    const m = state.manifest && state.manifest[state.index];
    const ev = document.querySelector('#section-title .section-event');
    if (ev && m && Number.isFinite(m.rate)) {
      // Keep the stored fallback current too: syncBookmarkTitles repaints
      // from it (a projected section can't be kept, so the line shows it).
      ev.dataset.fallback = projectedRateLine(m);
      ev.textContent = ev.dataset.fallback;
    }
  }
  updateUrl();
  labelNav();
}

// The tombstone: a superseded draft whose raw text this reader never held.
// No endpoint serves a replaced transaction's bytes once the pool has
// dropped them, so the page carries what the succession remembers -- the
// txid (encodable always), the archive's stripped figures, and the rung up
// to the transaction that replaced it.
function renderGhostTombstone(txid) {
  $('chapter').classList.remove('title-leaf');
  $('chapter').classList.remove('span-leaf');
  renderChapterHead(false);
  ++renderGen;
  lazyEncode.reset();
  $('section-title').classList.remove('hidden');
  $('section-hash').classList.remove('hidden');
  $('section-meta').classList.add('hidden');   // never mined: no date, no depth
  const { prose: txidProse } = encodeSeedPhrase(reverseHex(txid), bookLang(), BEST_OF);
  $('section-hash').textContent = txidProse;
  const sectionTitle = $('section-title');
  sectionTitle.textContent = '';
  const secNum = document.createElement('span');
  secNum.className = 'section-num';
  secNum.textContent = `§ ${state.index + 1}`;
  const dag = document.createElement('span');
  dag.className = 'tx-seq-rbf section-ghost-mark';
  dag.textContent = ' †';
  dag.title = 'replaced by fee — this draft was superseded; the section above holds the seat';
  secNum.append(dag);
  sectionTitle.append(secNum);
  const secEv = document.createElement('span');
  secEv.className = 'section-event';
  secEv.textContent = '† replaced by fee';
  sectionTitle.append(secEv);
  const up = document.createElement('a');
  up.className = 'section-event ghost-up';
  up.href = '#';
  up.textContent = 'its successor ↑';
  up.title = 'the transaction that replaced this one — the current holder of this §';
  up.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); state.ghost = null; showCurrentTx(); });
  sectionTitle.append(up);
  sectionTitle.title = `txid ${txid} — replaced by fee; its raw form was never recorded here`;
  attachHashCopy(sectionTitle, txid, 'transaction id', txidProse);
  $('page-folio').classList.add('hidden');   // a superseded draft holds no page of its own
  const body = $('ch-paragraphs');
  body.innerHTML = '';
  const note = document.createElement('p');
  note.className = 'footnote-entry';
  const m = ghostMeta.get(txid);
  const fmtR = (f) => f >= 10 ? String(Math.round(f)) : String(Math.round(f * 10) / 10);
  note.textContent = (m
