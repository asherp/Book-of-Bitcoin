    ? `${(m.fee ?? 0).toLocaleString()} sat over ${(m.vsize ?? 0).toLocaleString()} vB (~${fmtR(m.rate ?? (m.vsize ? m.fee / m.vsize : 0))} sat/vB), moving ${formatBtc(m.value ?? 0)}${m.time ? ` — replaced ${timestampInfo(m.time).mark}` : ''}. `
    : '')
    + 'Its raw text is gone with the mempools that dropped it — only its place in the succession survives.';
  body.append(note);
  $('ch-footnotes').innerHTML = '';
  $('ch-totals').innerHTML = '';
  $('ch-footnotes-section').classList.add('hidden');
  currentFootnotes = [];
  footnotesLoaded = false;
  labelNav();
}

// The section's two derived lines beneath its txid prose (see #section-meta):
// the containing block's header time, then its confirmation count -- how many
// chapters stand from this one to the tip, both counted. Readings, not bytes:
// the date is the header's nTime interpreted, the depth is arithmetic against
// a tip this page never carries. A projected section has no sealed block to
// date and a ghost was never mined at all, so both leave the lines hidden.
function renderSectionMeta() {
  const el = $('section-meta');
  el.textContent = '';
  const ts = state.projected || !state.block ? null : state.block.timestamp;
  if (!Number.isFinite(ts)) { el.classList.add('hidden'); return; }
  const stamp = timestampInfo(ts);
  const when = document.createElement('div');
  when.textContent = stamp.mark;
  when.title = `${stamp.title} — ${tr("the containing block's header time, the miner's own clock when the chapter was sealed")}`;
  el.append(when);
  const conf = document.createElement('div');
  conf.id = 'section-confirmations';
  el.append(conf);
  refreshSectionConfirmations();
  el.classList.remove('hidden');
}

// Fill (or re-say) the confirmation line from the current tip. Callable at
// any time -- a no-op unless a mined section's meta lines are on screen and
// the tip is known -- so the live tracker can deepen an open page in place
// as new blocks land (see applyBlock), without re-rendering anything else.
function refreshSectionConfirmations() {
  const el = document.getElementById('section-confirmations');
  if (!el || !state || state.projected || tipHeight === null) return;
  const n = tipHeight - state.height + 1;
  if (n < 1) return;   // a stale tip (reorg mid-read); keep the line as it stands
  el.textContent = `${n.toLocaleString()} ${n === 1 ? tr('confirmation') : tr('confirmations')}`;
  el.title = tr('blocks from this one to the chain tip, both counted — tip {tip} − height {h} + 1',
    { tip: tipHeight.toLocaleString(), h: state.height.toLocaleString() });
}

function renderChapter(para) {
  $('chapter').classList.remove('title-leaf');
  $('chapter').classList.remove('span-leaf');
  renderChapterHead(false);

  $('section-title').classList.remove('hidden');
  $('section-hash').classList.remove('hidden');

  // This section's own txid, encoded as prose beneath the section title. Reversed
  // to internal byte order first (like the block hash) so it carries the txid's
  // actual bytes; every byte kept, since a txid has no droppable leading zeros.
  const { prose: txidProse } = encodeSeedPhrase(reverseHex(para.txid), bookLang(), BEST_OF);
  // The ⌘ identity mark leads, as on the chapter hash -- a txid is the same
  // double-SHA256, with no proof-of-work zeros to state: all 256 bits encoded,
  // and the superscript (bits, ⌘'s unit) says so. The section title carries
  // the txid's copy/bookmark menu.
  const txidMarkTitle = 'transaction id — the double-SHA256 of this transaction&#39;s bytes, its identity; all 256 bits carried in the prose';
  $('section-hash').innerHTML =
    `<span class="cfx-gold" title="${txidMarkTitle}">⌘</span><span class="op op-push">${toSuperscript(256)}</span> ${txidProse}`;
  renderSectionMeta();

  const body = $('ch-paragraphs');
  body.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'tx-wrap' + (para.verified ? '' : ' unverified');

  // The transaction's position within its block titles the section ("§ 3"). A
  // transaction that's a curated entry earns its name beneath the § number, the
  // way a notable block earns its event name as the chapter title.
  const titleAttr = `txid ${para.txid}${para.verified ? '' : ' — could not be independently verified'}`;
  // A curated entry names its section whether it cites a txid or a
  // height+index -- the latter is how the twice-confirmed BIP30 coinbases are
  // cited, since their shared txid alone can't tell the two printings apart.
  // A projected section's event line is otherwise its price of admission: the
  // effective fee rate the ordering ran on. Where that rate departs from the
  // transaction's own fee ÷ vsize, the difference is family money -- a
  // child-pays-for-parent package moving together -- and the line says so.
  // An entry citing a finer coordinate names that coordinate, not the
  // section: an output's title centers above its rows (tx-out-title), a
  // witness's above its footnote (footnote-title) -- so both are excluded
  // from the section's own name line.
  const sectionPlace = places().find((p) => !p.page && !p.address && p.out == null && p.wit == null
    && (p.id === para.txid || (p.id === String(state.height) && p.index === state.index)));
  let sectionEvent = sectionPlace && placeTitle(sectionPlace);
  if (!sectionEvent && para.ghost) sectionEvent = '† replaced by fee';
  if (!sectionEvent && state.projected && state.manifest) {
    const m = state.manifest[state.index];
    if (m && Number.isFinite(m.rate)) sectionEvent = projectedRateLine(m);
  }
  const sectionTitle = $('section-title');
  sectionTitle.textContent = '';
  const secNum = document.createElement('span');
  secNum.className = 'section-num';
  secNum.textContent = `§ ${para.num}`;
  sectionTitle.append(secNum);
  // A superseded draft wears the replaceability dagger on its § itself: it
  // no longer holds the seat -- its successor above does.
  if (para.ghost) {
    const dag = document.createElement('span');
    dag.className = 'tx-seq-rbf section-ghost-mark';
    dag.textContent = ' †';
    dag.title = 'replaced by fee — this draft was superseded; the section above holds the seat';
    secNum.append(dag);
  }
  // The section's name line, always in the DOM: the reader's bookmark title
  // when this section is kept (defaulted from -- and overriding -- the
  // curated name), else the curated/ghost/projected line, else empty (and
  // hidden). Carrying the fallback in data lets syncBookmarkTitles rename
  // it live as bookmarks are added, retitled, or removed.
  {
    const secEv = document.createElement('span');
    secEv.className = 'section-event';
    secEv.dataset.bmSubtitle = para.txid;
    secEv.dataset.fallback = sectionEvent || '';
    sectionTitle.append(secEv);
  }
  // The rungs between a seat and its superseded drafts: from a ghost, up to
  // the successor that replaced it (which spends the very same coins); from
  // a seated transaction with a remembered predecessor, down to the ghost.
  if (para.ghost) {
    const up = document.createElement('a');
    up.className = 'section-event ghost-up';
    up.href = '#';
    up.textContent = 'its successor ↑';
    up.title = 'the transaction that replaced this one — the current holder of this §';
    up.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); state.ghost = null; showCurrentTx(); });
    sectionTitle.append(up);
  }
  // Rungs down are appended asynchronously once the succession lookup
  // answers -- see the loadRbfHistory kick below, which serves mined and
  // projected sections alike.
  sectionTitle.title = titleAttr;
  // The section title is the clickable handle for the txid's copy/bookmark
  // menu (attached after the rebuild above, which re-adds the bookmark ribbon).
  attachHashCopy(sectionTitle, para.txid, 'transaction id', `⌘${toSuperscript(256)} ${txidProse}`);

  // The transaction is laid out in horizontal bands (see .tx-flow CSS). The
  // inputs are a [citation | scriptSig] subgrid: each input's provenance -- the
  // volume·book·chapter·section of the output it spends, plus that output's index
  // -- sits in the left margin, level with its scriptSig. The outputs are a
  // [scriptPubKey | amount] subgrid; the locktime closes on the right.
  const gen = ++renderGen;
  lazyEncode.reset();   // drop chunks still pending from the previous section (body + footnotes)

  // Successions are looked up for EVERY section, mined or projected: the
  // reader's own ledger answers at once; the backend's RBF archive
  // backfills what this reader never witnessed. Each predecessor found
  // gains a rung down beneath the § title.
  if (!para.ghost) {
    loadRbfHistory(para.txid).then((h) => {
      if (gen !== renderGen || !h || !h.predecessors.length) return;
      const sectionTitleEl = $('section-title');
      h.predecessors.forEach((p, i) => {
        const down = document.createElement('a');
        down.className = 'section-event ghost-down';
        down.href = '#';
        down.textContent = h.predecessors.length > 1 ? `† replaces draft ${i + 1} ↓` : '† replaces an earlier draft ↓';
        down.title = `this transaction took its seat by fee — it replaced ${p}`;
        down.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); openGhost(p); });
        sectionTitleEl.append(down);
      });
    }).catch(() => {});
  }

  // The folio at the right end of the running head: empty until this block's
  // anchor resolves, so a stale page number never rides into a new section.
  const folio = $('page-folio');
  folio.textContent = '';
  folio.title = '';
  folio.classList.remove('hidden');
  fillFolio(folio, gen);
  const flow = document.createElement('div');
  flow.className = 'tx-flow';
  const inputsEl = document.createElement('div');
  inputsEl.className = 'tx-inputs';
  // Citations for inputs with nothing in the body to annotate -- a witness spend
  // has an empty scriptSig -- plus the version note. They can't align to a body
  // line, so they sit in the left column of the outputs band instead of holding
  // an input row open; that lets the outputs slide up beside them (see CSS).
  const marginEl = document.createElement('div');
  marginEl.className = 'tx-margin-cites';
  const outputsEl = document.createElement('div');
  outputsEl.className = 'tx-outputs';
  let leadUsed = false;
  const pendingCites = [];
  const fwdCells = [];
  const citedCells = [];

  // A body line; the first one across the whole transaction claims the drop
  // cap -- unless it opens with a bare push count (⁶⁹ …), whose superscript's
  // first digit would be blown up into a giant numeral, tearing the mark
  // apart. In that case the cap is forfeited for the transaction, not
  // deferred to a later line (an illuminated initial belongs at the top).
  //
  // A coinbase's BIP34 height (■960281) is the opposite case and keeps the
  // cap: what ::first-letter takes is the ■ itself, a symbol, so the height
  // is left whole and at one size. The mark isn't torn -- it's illuminated,
  // the block's own sigil opening the block's own first page.
  const addLine = (container, html) => {
    if (!html) return null;
    const p = document.createElement('p');
    const lead = !leadUsed && !html.startsWith('<span class="op op-push"');
    leadUsed = true;
    p.className = 'tx-line' + (lead ? ' tx-body-lead' : '');
    p.innerHTML = html;
    container.append(p);
    return p;
  };
  // Detected ASCII (a coinbase tag, an OP_RETURN message) is set as a quote
  // block instead of an inline-quoted line -- and never claims the drop cap.
  const addQuote = (container, html) => {
    if (!html) return;
    const q = document.createElement('blockquote');
    q.className = 'tx-ascii';
    q.innerHTML = html;
    container.append(q);
  };
  // The input's sequence mark, leading the amount line beneath its reference:
  // ● final · ○ respects locktime · † replaceable · † ■n / † Τn replaceable with
  // a relative block / time delay. The † is kept a shade warmer than the delay
  // it precedes, so it reads as its own mark.
  const seqSpan = (inp) => {
    const s = document.createElement('span');
    s.className = `tx-seq tx-seq-${inp.sequenceKind}`;
    s.title = inp.sequenceTitle;
    if (inp.sequenceRbf && inp.sequence) {
      const dagger = document.createElement('span');
      dagger.className = 'tx-seq-rbf';
      dagger.textContent = '†';
      s.append(dagger, ` ${inp.sequence}`);
    } else {
      s.textContent = inp.sequenceRbf ? '†' : inp.sequence;
    }
    return s;
  };
  // A superscript mark tying a witness-bearing input to its footnote --
  // lettered (a, b, c …), not numbered, so it never reads as arithmetic beside
  // the numerals the prose is full of. Clicking it encodes the footnotes
  // (once) and scrolls to this one.
  const witnessRef = (n) => {
    const mark = footnoteMark(n);
    const a = document.createElement('a');
    a.className = 'tx-witness-ref';
    a.href = `#fn-${mark}`;
    a.textContent = mark;
    a.title = `witness — see footnote ${mark}`;
    a.addEventListener('click', (e) => { e.preventDefault(); loadFootnotes(n); });
    return a;
  };

  const f = para.fields;
  const footnotes = [];
  // Citations with no scriptSig body to sit beside. A witness-spend input's
  // citation follows its witness to the footnotes (renderFootnotes sets it in
  // the footnote's left cell), keeping the shared numbering as the tie back
  // to input order. What accumulates here is only the version note and the
  // rare input with neither scriptSig nor witness; it flushes into the next
  // scriptSig row's left column (stacked above that input's own citation),
  // or into the margin band beside the outputs when none follows.
  const pendingMargin = [];
  if (f.version !== '1') {
    const cite = document.createElement('div');
    cite.className = 'tx-in-cite tx-version';
    cite.textContent = `v${f.version}`;
    pendingMargin.push(cite);
  }
  let inputIndex = 0;
  for (const inp of f.inputs) {
    const cite = document.createElement('div');
    cite.className = 'tx-in-cite';
    cite.id = `in-${inputIndex++}`;   // an output's forward citation scrolls here so the spending input leads the page
    const citeBody = document.createElement('span');
    citeBody.className = 'cite-body';
    if (inp.isNullPrevout) {
      citeBody.textContent = '∅';   // coinbase: no previous output
    } else {
      citeBody.textContent = '⋯';   // placeholder until the reference resolves
      cite.classList.add('resolving');
    }
    // The reference leads the citation, then -- for a witness-bearing input --
    // its footnote superscript (numbered in input order).
    cite.append(citeBody);
    // The witness record carries its section coordinates (txid, § number, and
    // the input that bears it -- inputIndex already advanced past this input
    // when the citation took its in-N id) so the footnote can offer its own
    // copy/bookmark menu when it renders.
    if (inp.witnessHex) { footnotes.push({ n: footnotes.length + 1, vin: inputIndex - 1, txid: para.txid, num: para.num, items: inp.witnessItems, zero: inp.witnessZero }); cite.append(witnessRef(footnotes.length)); }
    // A second line sits beneath the reference: the sequence mark leads it, then
    // the amount of the output this input spends (filled on resolve, into its own
    // span so the mark survives). A coinbase has no prevout, so its line carries
    // the sequence mark alone.
    const amtLine = document.createElement('div');
    amtLine.className = 'cite-amount';
    amtLine.append(seqSpan(inp));
    if (!inp.isNullPrevout) {
      const amtVal = document.createElement('span');   // the spent output's amount, filled on resolve
      amtLine.append(' ', amtVal);
      pendingCites.push({ citeBody, cite, amtVal, txid: inp.prevTxid, vout: inp.prevVout });
    }
    cite.append(amtLine);
    // An input that renders a scriptSig gets an aligned row: its left cell
    // carries any pending citations that preceded it (in order) stacked above
    // its own, and its scriptSig fills the body. A witness spend has an empty
    // scriptSig -- nothing in the body for the citation to sit beside -- so
    // its citation travels with its witness and renders at the footnote
    // instead (renderFootnotes), where the input then reads whole: provenance
    // and amount beside the apparatus that spent it.
    if (inp.scriptAscii || inp.script) {
      const citeCell = document.createElement('div');
      citeCell.className = 'tx-in-cite-group';
      for (const p of pendingMargin) citeCell.append(p);
      pendingMargin.length = 0;
      citeCell.append(cite);
      const scriptCell = document.createElement('div');
      scriptCell.className = 'tx-in-script';
      if (inp.scriptAscii) addQuote(scriptCell, inp.scriptAscii);
      else addLine(scriptCell, inp.script);
      inputsEl.append(citeCell, scriptCell);
    } else if (inp.witnessHex) {
      footnotes[footnotes.length - 1].cite = cite;
    } else {
      pendingMargin.push(cite);
    }
  }
  // Whatever is still pending (the version note; an input with neither
  // scriptSig nor witness) sits beside the outputs.
  for (const p of pendingMargin) marginEl.append(p);
  currentFootnotes = footnotes;
  f.outputs.forEach((out, i) => {
    // The output's name line, centered above its rows: the reader's bookmark
    // title when this output is kept (defaulted from -- and overriding --
    // the curated name), else the contents' own name for it, else empty and
    // hidden. syncBookmarkTitles keeps it live with the bookmark set.
    const outTitle = document.createElement('div');
    outTitle.className = 'tx-out-title';
    outTitle.dataset.bmOut = `${para.txid}:${i}`;
    const outPlace = places().find((p) => !p.page && !p.address && (p.out ?? null) === i
      && (p.id === para.txid || (p.id === String(state.height) && p.index === state.index)));
    outTitle.dataset.fallback = outPlace ? placeTitle(outPlace) : '';
    outputsEl.append(outTitle);
    // The locking script's own keep, centered above its paragraph: a hollow
    // ribbon offers to shelve this script's address among the reader's
    // ledgers (Appendix III, the same registry the Ledger page's keep button
    // writes); kept, the line reads the ledger's name with the filled ribbon
    // beside it linking to that ledger. The address derives asynchronously
    // from the script, and only a script with a standard address form is
    // offered -- an OP_RETURN has no ledger to keep. syncScriptKeeps paints
    // both states and keeps them live.
    const outKeep = document.createElement('div');
    outKeep.className = 'tx-out-keep';
    // The menu behind the name needs the script verbatim (Copy hex) and this
    // output's own citation, which names the entry this section wrote in the
    // address's ledger. A draft has no settled citation to name.
    outKeep.dataset.spk = out.spkHex;
    if (!state.projected) outKeep.dataset.ref = latinRefOf(state.height, para.num, i);
    outputsEl.append(outKeep);
    scriptToAddress(out.spkHex).then((r) => {
      if (gen !== renderGen || !r || !r.address) return;
      outKeep.dataset.address = r.address;
      syncScriptKeeps();
    }).catch(() => {});
    const scriptCell = document.createElement('div');
    scriptCell.className = 'tx-out-script';
    scriptCell.id = `out-${i}`;   // a referencing input scrolls here so this output leads the page
    if (out.scriptAscii) addQuote(scriptCell, out.scriptAscii); else addLine(scriptCell, out.script);
    const valueCell = document.createElement('div');
    valueCell.className = 'tx-note tx-out-value';
    valueCell.textContent = out.value;
    valueCell.title = out.valueTitle;
    // The amount is this output's handle: click it to copy or bookmark the
    // output itself -- §section.vout, the finest place the book cites.
    attachHashCopy(valueCell, para.txid, 'output',
      `${reference(state.height)} §${para.num}.${i} — ${out.value}`, i);
    // Forward citation placeholder: filled with the section that later spent
    // this output, once the outspends resolve. An unspent output keeps it
    // empty -- still-live value has no forward reference.
    const fwd = document.createElement('div');
    fwd.className = 'fwd-cite';
    valueCell.append(fwd);
    fwdCells.push(fwd);
    // …and under it, whatever this output was used to date: the Citations
    // register is the book's one set of outward references, and the output
    // that carries a commitment is where they attach.
    const cited = document.createElement('div');
    cited.className = 'appx-cite';
    valueCell.append(cited);
    citedCells.push({ el: cited, out: i });
    outputsEl.append(scriptCell, valueCell);
  });
  // The balance line -- Σ inputs at the left, − fee between, Σ outputs at
  // the right (see the .tx-totals CSS comment). Derived, not on the wire,
  // so it renders in the foot region below the section's rule rather than
  // in the flow (appended there with the footnotes reset, further down).
  // The outputs' sum is the transaction's own; the inputs' and the fee fill
  // in once every margin citation has resolved a value, and stay ⋯ if any
  // could not be priced. A coinbase closes without one.
  let totals = null, fillTotals = null;
  if (f.inputs.length && !f.inputs.some((i) => i.isNullPrevout)) {
    const sumOut = f.outputs.reduce((a, o) => a + o.sats, 0);
    totals = document.createElement('div');
    totals.className = 'tx-totals';
    const tIn = document.createElement('span');
    tIn.textContent = '⋯';
    tIn.title = 'the sum of the inputs — waiting on the margin citations';
    const tFee = document.createElement('span');
    tFee.className = 't-fee';
    tFee.textContent = '⋯';
    const tOut = document.createElement('span');
    tOut.className = 't-out';
    tOut.textContent = formatBtc(sumOut);
    tOut.title = `the outputs carry ${groupDigits(String(sumOut))} satoshis`;
    totals.append(tIn, tFee, tOut);
    fillTotals = (values) => {
      if (!values || values.length !== f.inputs.length || values.some((v) => v == null)) return;
      const sumIn = values.reduce((a, v) => a + v, 0);
      tIn.textContent = formatBtc(sumIn);
      tIn.title = `the inputs bring ${groupDigits(String(sumIn))} satoshis`;
      const fee = sumIn - sumOut;
      tFee.textContent = `− ${formatBtc(fee)}`;
      tFee.title = `the fee: ${groupDigits(String(fee))} satoshis — the difference, claimed by the chapter's miner`;
    };
  }
  const lock = document.createElement('div');
  lock.className = 'tx-note tx-locktime';
  lock.textContent = f.locktime;
  lock.title = f.locktimeTitle;

  flow.append(inputsEl, marginEl, outputsEl, lock);
  wrap.append(flow);
  body.append(wrap);
  syncBookmarkTitles();   // paint the section's and outputs' name lines from the bookmark set
  lazyEncode.observe(body);   // encode any deferred OP_RETURN payload as it scrolls into view
  resolveCitations(pendingCites, gen).then((values) => {
    if (gen === renderGen && fillTotals) fillTotals(values);
  });
  resolveForwardCitations(para.txid, fwdCells, gen);
  resolveCitedWorks(para.num, citedCells, gen);

  // The foot region resets, then the balance line takes its head -- shown
  // whenever there is a line to show, so a legacy section with no witness
  // still gets its rule and its sums. The footnotes expand automatically
  // once the transaction is on screen (renderFootnotes runs async so the
  // prose paints first, and unhides the section itself for witness-bearing
  // coinbases, whose foot carries footnotes but no balance line).
  $('ch-footnotes').innerHTML = '';
  $('ch-totals').innerHTML = '';
  $('ch-footnotes-section').classList.add('hidden');
  footnotesLoaded = false;
  if (totals) {
    $('ch-totals').append(totals);
    $('ch-footnotes-section').classList.remove('hidden');
  }
  renderFootnotes(gen);

  labelNav();
}

// Label the chapter/section nav buttons, and hide any that lead nowhere (Genesis
// has no earlier chapter/section; the chain tip's last section none later).
function labelNav() {
  const cur = volumeBookChapter(state.height);
  const idx = state.index;
  // The contents runs a leaf per volume, so the masthead's Contents link opens
  // the one for the volume being read -- a reader asking for the contents wants
  // theirs, not the head of the run. Noted in the session too, for the pages
  // whose own Contents link carries no place (the search page, a bookmark).
  $('toc-link').href = `./bitcoin-contents.html?volume=${cur.volume}`;
  try { sessionStorage.setItem('glossia-toc-at', String(cur.volume)); } catch {}
  const atTip = !state.projected && tipHeight !== null && state.height >= tipHeight;
  const gen = renderGen;   // a slow previous-count fetch must not overwrite a later section's label
  // Standing at the tip, the next page is a question for the mempool: load
  // the projection (once) and relabel, so Next appears exactly when a
  // projected chapter exists to step into.
  const reach = projectedReach();
  if (atTip && !projectedCache) {
    loadProjection().then(() => { if (gen === renderGen) labelNav(); }).catch(() => {});
  }
  // Whether the current line of pages ends here: a mined chapter at the tip
  // with no projection, or the last projected chapter.
  const lineEnds = state.projected ? state.projIndex >= reach - 1 : (atTip && reach === 0);

  const setBtn = (id, text, label) => {
    const b = $(id);
    b.textContent = text;
    b.title = label;
    b.setAttribute('aria-label', label);
  };
  const showBtn = (id, show) => {
    const b = $(id);
    b.classList.toggle('hidden', !show);
    if (show) b.disabled = false;   // clear any transient load-time disable
  };

  // A missing neighbour hides its button rather than greying it out. The leaf
  // stack (volume -3 → book -2 → chapter -1) precedes §1, so Genesis's volume
  // leaf is the book's very first page; every leaf has a next within its block.
  // The header steppers belong to leaves alone -- and step at the leaf's own
  // level: volumes on a volume leaf, books on a book leaf, chapters on a
  // chapter page. Section headers carry the eyebrow crumbs instead.
  // Labels carry only the target's own level -- §4, ■5, β2, II -- never the
  // higher-order parts of the reference: the page around the button (eyebrow
  // crumbs, titles) already says where the reader is, and the full reference
  // rides in each button's hover/aria label.
  const floor = state.projected ? -1 : minIndexOf(state.height);   // projected chapters carry no leaves
  let stepPrev = null, stepNext = null;   // { text, label } or null (hidden)
  if (idx === -3) {
    if (cur.volume > 1) {
      stepPrev = { text: toRoman(cur.volume - 1), label: `Previous volume (${toRoman(cur.volume - 1)})` };
    } else {
      // Before Volume I lies the front matter, whose last leaf is the sigla.
      stepPrev = { text: 'Sigla', label: 'Back to the front matter (the sigla)' };
    }
    if (tipHeight === null || heightOf(cur.volume + 1, 1, 1) <= tipHeight) {
      stepNext = { text: toRoman(cur.volume + 1), label: `Next volume (${toRoman(cur.volume + 1)})` };
    } else {
      // Past the last volume the appendices carry on at the volumes' own
      // level -- the mempool first, since its chapters are the ones the
      // chain is about to write.
      stepNext = { text: 'Appendix', label: 'On to the appendices (I — the mempool)' };
    }
  } else if (idx === -2) {
    if (state.height > 0) {
      const p = volumeBookChapter(bookStartOf(state.height - 1));
      stepPrev = { text: `β${p.book}`, label: `Previous book (${toRoman(p.volume)} β${p.book})` };
    }
    const nextStart = state.height + cur.chapterCount;
    if (tipHeight === null || nextStart <= tipHeight) {
      const n = volumeBookChapter(nextStart);
      stepNext = { text: `β${n.book}`, label: `Next book (${toRoman(n.volume)} β${n.book})` };
    }
  } else if (idx === -1) {
    if (state.height > 0) {
      stepPrev = { text: `${chapterMark(state.height - 1)}${volumeBookChapter(state.height - 1).chapter}`, label: `Previous chapter (${referenceOf(state.height - 1)})` };
    }
    // Forward: a mined chapter below the tip steps normally; at the tip (or
    // among projected chapters) the next chapter exists only as far as the
    // projection reaches -- and wears the expected-chapter mark □, since its
    // number holds only while the queue does.
    if (!atTip && !state.projected) {
      stepNext = { text: `■${volumeBookChapter(state.height + 1).chapter}`, label: `Next chapter (${reference(state.height + 1)})` };
    } else if (!lineEnds) {
      stepNext = { text: `□${volumeBookChapter(state.height + 1).chapter}`, label: `Next chapter — projected (${referenceOf(state.height + 1)})` };
    }
  }
  showBtn('chapter-prev', !!stepPrev);
  showBtn('chapter-next', !!stepNext);
  if (stepPrev) setBtn('chapter-prev', stepPrev.text, stepPrev.label);
  if (stepNext) setBtn('chapter-next', stepNext.text, stepNext.label);

  const hasPrevSection = !(state.height === 0 && idx <= floor);
  const hasNextSection = !(lineEnds && idx >= state.txCount - 1);
  showBtn('page-prev', hasPrevSection);
  showBtn('page-next', hasNextSection);

  // Page navigation -- one leaf or section at a time along the linear order:
  // … previous block's last § → volume leaf → book leaf → chapter page → §1 …
  if (hasPrevSection) {
    if (idx > 0) {
      setBtn('page-prev', `§${idx}`, `Previous section (${referenceOf(state.height)} §${idx})`);   // same chapter, target section = current 1-based index minus one
    } else if (idx === 0) {
      // §1 pages back to this chapter's own page -- the chapter-level reference.
      setBtn('page-prev', `${chapterMark(state.height)}${cur.chapter}`, `Chapter page (${referenceOf(state.height)})`);
    } else if (idx - 1 >= floor) {
      // Up the leaf stack within this block: chapter page → book leaf → volume leaf.
      if (idx === -1) setBtn('page-prev', `β${cur.book}`, `Book page (${toRoman(cur.volume)} β${cur.book})`);
      else setBtn('page-prev', toRoman(cur.volume), `Volume page (${toRoman(cur.volume)})`);
    } else {
      // Off the block's first page, back into the prior block's final section;
      // its §number is that block's tx count, unknown until it loads -- shown
      // as § once resolved.
      setBtn('page-prev', '§…', `Previous section (end of ${referenceOf(state.height - 1)})`);
      const h = state.height;
      loadBlockTxCount(h - 1)
        .then((n) => {
          if (gen === renderGen) setBtn('page-prev', `§${n}`, `Previous section (${referenceOf(h - 1)} §${n})`);
          // The moment the prior block's tx count is known, its page anchor is
          // arithmetic off this block's (when that one is already in hand) --
          // banked so stepping back across the boundary never asks the census.
          const a = peekAnchor(h);
          if (a !== null) bankAnchor(h - 1, a - n, anchorFinalAt(h - 1));
        })
        .catch(() => {});
    }
  }
  if (hasNextSection) {
    if (state.ghost && idx >= 0) {
      // A ghost's only forward step is up: the transaction that replaced it.
      setBtn('page-next', `§${idx + 1}`, `Its successor — the current holder of §${idx + 1}`);
    } else if (idx === -3) {
      setBtn('page-next', `β${cur.book}`, `Book page (${toRoman(cur.volume)} β${cur.book})`);
    } else if (idx === -2) {
      setBtn('page-next', `■${cur.chapter}`, `Chapter page (${reference(state.height)})`);
    } else if (idx === -1) {
      setBtn('page-next', '§1', `First section (${referenceOf(state.height)} §1)`);   // the chapter page opens onto §1
    } else if (idx < state.txCount - 1) {
      setBtn('page-next', `§${idx + 2}`, `Next section (${referenceOf(state.height)} §${idx + 2})`);   // same chapter, target section = current 1-based index plus one
    } else {
      // Crosses onto the next block's first page -- its volume or book leaf
      // when it opens one, else its chapter page. A projected next chapter
      // carries no leaves, whatever its height would open.
      const nh = state.height + 1;
      const projNext = tipHeight !== null && nh > tipHeight;
      const nFloor = projNext ? -1 : minIndexOf(nh);
      const t = volumeBookChapter(nh);
      if (nFloor === -3) setBtn('page-next', toRoman(t.volume), `Volume page (${toRoman(t.volume)})`);
      else if (nFloor === -2) setBtn('page-next', `β${t.book}`, `Book page (${toRoman(t.volume)} β${t.book})`);
      else setBtn('page-next', `${projNext ? '□' : '■'}${t.chapter}`, `Next chapter${projNext ? ' — projected' : ''} (${referenceOf(nh)})`);
    }
  }

  // The commentary key belongs to the page, not to the steppers, but it lives
  // in the same bar and every render path passes through here.
  syncCommentary();

  // With the buttons decided, quietly ready both swipe directions' data.
  prefetchNeighbors();
}

// The txid the reader is looking at: from the loaded list when we have it, else
// the single transaction opened by id before its block's list was ever
// fetched. Null on a leaf, and on a ghost -- a fee-replaced draft holds no
// curated seat, its successor does (see syncCommentary).
function currentTxid() {
  if (!state || state.index < 0 || state.ghost) return null;
  return state.txids ? state.txids[state.index] : (state.txid || null);
}

// Fit the commentary key to the page in front of the reader: the curated
// readings of this passage, or no key at all. Absence is information -- the
// book keeps places it has not yet said anything about, and a toggle that
// opened onto nothing would blur the difference between an unannotated passage
// and an unremarkable one.
//
// Only the index is consulted here, so the key appears with the page and
// nothing is fetched to decide it. The prose lives in commentary/*.md and
// arrives when the sheet is opened (fillCommentary) -- the reader who never
// opens it never pays for it, and the sheet's own state says which page it
// belongs to.
let commentaryItems = [];      // the readings matched to the page on screen
let commentaryFilled = false;  // whether the sheet is holding their prose

function syncCommentary() {
  const box = $('commentary');
  // A projected chapter is not yet a place -- nothing curated can be about a
  // block no miner has written. A ghost's own draft is nobody's curated entry.
  commentaryItems = (!state || state.projected || state.ghost) ? [] : commentaryFor({
    height: state.height,
    index: state.index,
    txid: currentTxid(),
  });
  commentaryFilled = false;
  $('commentary-body').innerHTML = '';
  box.classList.toggle('hidden', !commentaryItems.length);
  if (!commentaryItems.length) {
    box.open = false;                 // never reopen onto an empty sheet after a page turn
    return;
  }
  // Turned the page with the sheet already open: the reader is reading
  // commentary, so bring this page's.
  if (box.open) fillCommentary();
}

// Fetch this page's readings and set them. Called on the sheet's first opening
// (and on a page turn while it is open); each file is read once per session.
async function fillCommentary() {
  if (commentaryFilled || !commentaryItems.length) return;
  const mine = commentaryItems;                       // the page this fill belongs to
  const body = $('commentary-body');
  body.innerHTML = '<div class="commentary-measure"><p class="commentary-loading">reading…</p></div>';
  await resolveCommentary(mine);
  if (commentaryItems !== mine) return;               // page turned mid-read: that page's fill won
  commentaryFilled = true;
  // Built from authored Markdown, escaped at the source (btc-markdown.js).
  body.innerHTML = commentaryHtml(mine);
}

// Encode every witness-bearing input's witness into a numbered footnote and
// reveal the footnotes section. Done once per transaction, and skipped if the
// reader has paged to another section before the (heavy) encoding finishes.
async function renderFootnotes(gen) {
  if (footnotesLoaded || !currentFootnotes.length) return;
  if (!ready) await init().catch(() => {});
  // Yield once so the transaction paints before we lay out the footnotes.
  await new Promise((r) => setTimeout(r, 0));
  if (gen !== renderGen) return;
  const el = $('ch-footnotes');
  el.innerHTML = '';
  for (const fn of currentFootnotes) {
    // An all-zero witness (coinbase reserved value, empty stack) shows ∅ instead
    // of a run of zero-words. Every other witness item's prose is emitted as a
    // placeholder (renderWitness feeds each push through lazyEncode.placeholder)
    // and encoded when it scrolls into view -- building the DOM stays cheap even
    // for a kilobyte-scale inscription witness.
    const prose = fn.zero ? '∅' : renderWitness(fn.items, lazyEncode.placeholder);
    const p = document.createElement('p');
    p.className = 'footnote-entry';
    p.id = `fn-${footnoteMark(fn.n)}`;
    p.innerHTML = `<span class="footnote-mark">${footnoteMark(fn.n)}</span>${prose}`;
    // The footnote's mark is the witness's own handle: click for the
    // copy/bookmark menu -- a witness is a place a reader can keep, named
    // by its section and the input that carries it.
    const markEl = p.querySelector('.footnote-mark');
    if (markEl && fn.txid) {
      attachHashCopy(markEl, fn.txid, 'witness',
        `${reference(state.height)} §${fn.num}.${footnoteMark(fn.n)}`, null, fn.vin, fn.n);
    }
    // The witness's name line, centered above its footnote and spanning the
    // grid: the reader's bookmark title when this witness is kept (defaulted
    // from -- and overriding -- the curated name), else the contents' own
    // name for it (a curated §n.a place), else empty and hidden.
    // syncBookmarkTitles keeps it live with the bookmark set.
    const witTitle = document.createElement('div');
    witTitle.className = 'footnote-title';
    witTitle.dataset.bmWit = `${fn.txid}:${fn.vin}`;
    const witPlace = places().find((pl) => !pl.page && !pl.address && pl.wit === fn.n
      && pl.id === String(state.height) && (pl.index ?? null) === state.index);
    witTitle.dataset.fallback = witPlace ? placeTitle(witPlace) : '';
    el.append(witTitle);
    // A witness-only input's citation (carrying its in-N anchor, resolving
    // asynchronously wherever it sits) lands in the left cell of its own
    // footnote's row; entries for inputs that kept a body row have none.
    if (fn.cite) el.append(fn.cite);
    el.append(p);
  }
  syncBookmarkTitles();   // paint the witness name lines just laid out
  $('ch-footnotes-section').classList.remove('hidden');
  footnotesLoaded = true;
  lazyEncode.observe(el);   // stream each push's prose in as the reader scrolls to it
}

// The foot region's loading stand-in, for a navigation that targets a
// witness the engine hasn't laid out yet: the section opens at once with
// the book's loading mark in place of the data and the page scrolls there
// immediately -- renderFootnotes wipes the stub when the real entries take
// its place. A no-op once the footnotes are loaded (or there are none).
function footnoteStub() {
  if (footnotesLoaded || !currentFootnotes.length) return;
  const stub = document.createElement('p');
  stub.className = 'footnote-entry footnote-stub';
  stub.innerHTML = SPINNER_HTML + ' ' + tr('encoding the witness…');
  $('ch-footnotes').append(stub);
  $('ch-footnotes-section').classList.remove('hidden');
  stub.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// A witness reference: land on the loading mark at once if the footnotes
// aren't laid out yet, then scroll exactly to this one when they are.
async function loadFootnotes(targetN) {
  footnoteStub();
  await renderFootnotes(renderGen);
  const target = $(`fn-${footnoteMark(targetN)}`);
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function updateUrl() {
  const params = new URLSearchParams();
  params.set('block', String(state.height));
  // No extra param = the chapter's own page; a section always writes its
  // index (including 0, which is §1); a volume/book leaf writes ?page=.
  if (state.index >= 0) params.set('index', String(state.index));
  else if (state.index === -2) params.set('page', 'book');
  else if (state.index === -3) params.set('page', 'volume');
  history.replaceState(null, '', `${location.pathname}?${params.toString()}`);
}

// A section index is clamped into the block's transaction list; a negative
// index is a leaf, clamped to the leaves this block actually carries (a
// volume leaf requested on a mid-book block falls back to the chapter page);
// absent means the chapter's own page (-1).
const clampIndex = (i, meta) => {
  if (!Number.isFinite(i)) return -1;
  if (i >= 0) return Math.min(i, meta.txCount - 1);
  return Math.max(i, minIndexOf(meta.height));
};

// A 404 for a height past the chain tip is not a dead lookup but a chapter
// unwritten, so it reads as an appointment rather than an error. A height
// within the mempool's reach is closer still -- a chapter already forming:
// the queue of fee-paying transactions extends the contents ≈ vsize ÷ 1 MvB
// blocks past the tip, so a height inside that span answers with its place
// in the queue and an expected wait instead of a calendar year. (/mempool is
// vanilla Esplora, so any mirror can answer; a failure falls through to the
// calendar.) Deeper heights get the year the block is due, at 52,560
// ten-minute blocks a year. The book's final chapter -- BIP42's activation
// at 13,440,000, the block that opens Volume LXV -- keeps its storied
// return date instead of the drifting projection. Every other failure
// passes through untouched.
const BIP42_HEIGHT = 13440000;
// An unwritten chapter's answer carries the height it is about, so the page can
// set that chapter's curated reading beneath it -- a future chapter has no
// passage to annotate, and its reading is the whole of what there is to read
// (see futureCommentary).
const unwritten = (err, height) => Object.assign(err, { height });

const BLOCKS_PER_YEAR = 52560;
const MEMPOOL_REACH_MAX = 1008;   // a week of blocks -- beyond any plausible queue, skip the fetch
async function unwrittenOr(e, height, tipP) {
  if (!e.notFound) return e;
  const tip = await tipP;
  if (tip === null || height <= tip) return e;
  if (height === BIP42_HEIGHT) return unwritten(new Error('Block not found. Come back in the year 2262.'), height);
  const ahead = height - tip;
  if (ahead <= MEMPOOL_REACH_MAX) {
    try {
      const res = await esploraFetch(`${ESPLORA}/mempool`);
      if (res.ok) {
        const mp = await res.json();
        const depth = Math.ceil(mp.vsize / 1_000_000);
        if (ahead <= depth) {
          return unwritten(new Error(`Block ${height.toLocaleString()} (${referenceOf(height)}) has not been mined yet — but its chapter is forming: `
            + `the mempool holds ≈ ${depth} chapters of sections, and this one stands ${ahead === 1 ? 'next' : `${ahead} deep`} in the queue. `
            + `Come back in about ${blocksEta(ahead)}.`), height);
        }
      }
    } catch { /* the queue is unreadable -- fall through to the calendar */ }
  }
  const years = ahead / BLOCKS_PER_YEAR;
  const when = years < 1 ? 'later this year' : `in the year ${new Date().getUTCFullYear() + Math.round(years)}`;
  // Cited by reference, never by ■height: the chapter marks count chapters
  // within a book, so a raw height after one would be outside the notation --
  // and an unmined chapter's is the expected mark □, not the settled ■.
  return unwritten(new Error(`Block not found — ${height.toLocaleString()} (${referenceOf(height)}) has not been mined yet. Come back ${when}.`), height);
}

// Load whatever the reader gave us: a block height, a block hash, or a
// transaction id. A 64-hex value is either a block hash or a txid -- they're
// indistinguishable by shape -- so it's tried as a block first and, failing
// that, as a txid, which jumps straight to that transaction's section.
async function openLookup(input, index = -1) {
  input = (input || '').trim();
  $('chapter').classList.add('hidden');
  $('future-commentary').replaceChildren();   // a reading belongs to the answer that raised it
  // Learn the current chain tip on every lookup (in parallel with the block
  // load) and record it, so the Next controls are exact -- shown below the tip,
  // hidden at it -- rather than optimistic. A tip fetch that fails resolves to
  // null and leaves the previous tipHeight untouched; only a -1 lookup, which
  // needs the tip to resolve a relative height, treats that failure as an error.
  const tipP = loadTipHeight().then((t) => { tipHeight = Number(t); return tipHeight; }, () => null);
  try {
    if (/^-?\d+$/.test(input)) {
      let height = input;
      // A negative height counts back from the chain tip: -1 is the latest
      // block, -2 the one before it, and so on.
      if (input.startsWith('-')) {
        setStatus(SPINNER_HTML + tr('fetching latest block…'));
        const tip = await tipP;   // the shared tip fetch (already recorded in tipHeight on success)
        if (tip === null) throw new Error('Could not reach the chain tip to resolve a relative height.');
        height = String(tip + Number(input) + 1);
        if (Number(height) < 0) throw new Error(`Only ${tip + 1} blocks exist; ${input} reaches before Genesis.`);
      }
      setStatus(SPINNER_HTML + tr('fetching block…'));
      // A chapter-page landing (no section index) skips the heavy txid list;
      // paging into a section fetches it on demand (ensureTxids). A height
      // past the tip but within the mempool's projection opens as a
      // projected chapter instead of an unwritten one.
      const r = await loadHeightOrProjected(Number(height), index, tipP);
      if (r.done) return;   // opened projected -- already rendered
      state = { ...r.meta, index: clampIndex(index, r.meta) };
    } else if (/^[0-9a-f]{64}$/i.test(input)) {
      const hex = input.toLowerCase();
      setStatus(SPINNER_HTML + tr('fetching block…'));
      const meta = await loadBlockMeta(hex, { withTxids: index >= 0 }).catch(() => null);
      if (meta) {
        state = { ...meta, index: clampIndex(index, meta) };
      } else {
        setStatus(SPINNER_HTML + tr('locating transaction…'));
        const loc = await loadBlockByTxid(hex);
        state = { ...loc.meta, index: loc.index, txid: loc.txid };
      }
    } else {
      const ref = parseReference(input);
      if (!ref) throw new Error('Enter a block height, hash, transaction id, or reference (e.g. III 2 5).');
      setStatus(SPINNER_HTML + tr('fetching block…'));
      const r = await loadHeightOrProjected(Number(ref.height), ref.index, tipP);
      if (r.done) return;   // opened projected -- already rendered
      state = { ...r.meta, index: clampIndex(ref.index, r.meta) };
    }
    await tipP;   // record the fresh tip before labelNav decides Next visibility
    await showCurrentTx();
  } catch (e) {
    const message = e.message || 'Failed to load.';
    setStatus(message, 'err');
    futureCommentary(e.height ?? null, message);
  }
}

// A chapter consensus has numbered and no miner has written: the book answers
// with the date it is due, and -- where the appendix keeps a reading for that
// height (Appendix II, Consensus) -- with what the rule binding there
// will mean for the transactions that follow it. The reading IS the page: there
// is no passage yet to set it beside, so it opens in place rather than as a
// sheet over anything.
async function futureCommentary(height, message) {
  const box = $('future-commentary');
  box.replaceChildren();
  if (height == null) return;
  const items = commentaryFor({ height, index: -1 });
  if (!items.length) return;                      // no reading: the answer stands alone, as a toast
  // With a reading to set, the answer stops being a passing toast and becomes
  // the leaf's first line -- the page says when the chapter is due, then what
  // the rule binding there will mean for the passages that follow it.
  setStatus('');
  const answer = document.createElement('div');
  answer.className = 'commentary-measure';
  answer.innerHTML = '<p class="future-answer"></p>';
  answer.firstChild.textContent = message;
  const reading = document.createElement('div');
  reading.innerHTML = '<div class="commentary-measure"><p class="commentary-loading">reading…</p></div>';
  box.append(answer, reading);
  await resolveCommentary(items);
  if (!box.contains(reading)) return;             // the reader moved on
  // Authored Markdown, escaped at the source (btc-markdown.js).
  reading.innerHTML = commentaryHtml(items);
}

// direction: +1 (Next) or -1 (Previous). Steps through the block's pages --
// its leaves (volume/book/chapter, whichever it carries), then its sections;
// at either edge, crosses into the adjacent block (if one exists): forward
// onto its first page, backward onto its last section.
async function stepTx(direction) {
  // Bounds come from txCount and the leaf floor (both known without the txid
  // list); the list itself is only needed to address a section by position --
  // fetched on demand here if the reader landed on a leaf without it.
  state.ghost = null;   // stepping leaves a ghost behind
  const withinBlock = state.index + direction;
  if (withinBlock >= (state.projected ? -1 : minIndexOf(state.height)) && withinBlock < state.txCount) {
    if (withinBlock >= 0) {
      try { await ensureTxids(state); }
      catch (e) { setStatus(e.message || 'Failed to load the transaction list.', 'err'); return; }
    }
    state.index = withinBlock;
    try {
      await showCurrentTx();
    } catch (e) {
      setStatus(e.message || 'Failed to load transaction.', 'err');
    }
    return;
  }

  const newHeight = state.height + direction;
  if (newHeight < 0) return;   // Genesis has no earlier block

  $('page-prev').disabled = true;
  $('page-next').disabled = true;

  // The seam and beyond: a target past the tip is a projected chapter --
  // forward onto its chapter page, backward (between projected chapters)
  // onto the nearer one's last section. Past the projection's reach the
  // step dead-ends with the queue's answer.
  if (tipHeight !== null && newHeight > tipHeight) {
    setStatus(SPINNER_HTML + tr('reading the mempool…'));
    try {
      if (await stepProjected(newHeight, direction > 0 ? -1 : 'last')) return;
      setStatus(projectedReach() > 0
        ? 'The projection ends here — deeper chapters are only a backlog, with no reliable order yet.'
        : 'No next block yet — this is the current chain tip.', 'err');
    } catch (e) {
      setStatus(e.message || 'Failed to read the mempool.', 'err');
    }
    labelNav();
    return;
  }

  setStatus(SPINNER_HTML + tr(direction > 0 ? 'loading next block…' : 'loading previous block…'));
  try {
    // Forward lands on the next block's first page (its volume/book leaf when
    // it opens one, else its chapter page) -- no txid list needed until the
    // reader pages into a section. Backward addresses the previous block's
    // last transaction by position, so it needs the list now.
    const next = await loadBlockByHeight(newHeight, { withTxids: direction < 0 });
    state = { ...next, index: direction > 0 ? minIndexOf(newHeight) : next.txCount - 1 };
    await showCurrentTx();
  } catch (e) {
    if (direction > 0) tipHeight = state.height;
    setStatus(direction > 0 ? 'No next block yet — this is the current chain tip.' : (e.message || 'Failed to load previous block.'), 'err');
    labelNav();   // re-show/hide from the (unchanged) position, now that the tip may be known
  }
}

// A horizontal swipe crossing a block boundary at section level: forward onto
// the next block's §1, backward onto the previous block's last section --
// never onto the leaves between blocks. (The foot nav's buttons keep the
// linear page order instead, threading through those leaves.)
let sectionCrossing = false;
async function stepSectionAcross(direction) {
  if (sectionCrossing) return;
  const newHeight = state.height + direction;
  if (newHeight < 0) return;   // Genesis §1 has no previous section
  state.ghost = null;
  sectionCrossing = true;
  $('page-prev').disabled = true;
  $('page-next').disabled = true;
  // Section-level crossing past the tip lands on a projected chapter's
  // nearest section: forward onto its §1, backward onto its last.
  if (tipHeight !== null && newHeight > tipHeight) {
    setStatus(SPINNER_HTML + tr('reading the mempool…'));
    try {
      if (!(await stepProjected(newHeight, direction > 0 ? 0 : 'last'))) {
        setStatus(projectedReach() > 0
          ? 'The projection ends here — deeper chapters are only a backlog, with no reliable order yet.'
          : 'No next block yet — this is the current chain tip.', 'err');
        labelNav();
      }
    } catch (e) {
      setStatus(e.message || 'Failed to read the mempool.', 'err');
      labelNav();
    } finally {
      sectionCrossing = false;
    }
    return;
  }
  setStatus(SPINNER_HTML + tr(direction > 0 ? 'loading next block…' : 'loading previous block…'));
  try {
    const next = await loadBlockByHeight(newHeight, { withTxids: true });
    state = { ...next, index: direction > 0 ? 0 : next.txCount - 1 };
    await showCurrentTx();
  } catch (e) {
    if (direction > 0) tipHeight = state.height;
    setStatus(direction > 0 ? 'No next block yet — this is the current chain tip.' : (e.message || 'Failed to load previous block.'), 'err');
    labelNav();   // re-show/hide from the (unchanged) position, now that the tip may be known
  } finally {
    sectionCrossing = false;
  }
}

// Jump to a specific leaf: the volume (-3), book (-2), or chapter (-1) page
// whose span starts at `height`. Used by the header steppers and the eyebrow
// crumbs. Genesis has no earlier span and the tip none later; both are guarded
// by the button visibility and rechecked here.
let chapterLoading = false;
async function openLeafAt(height, idx, direction = 0) {
  if (!state || chapterLoading || height < 0) return;
  chapterLoading = true;
  $('chapter-prev').disabled = true;
  $('chapter-next').disabled = true;
  setStatus(SPINNER_HTML + 'loading…');
  try {
    // A chapter-level target past the tip is a projected chapter (leaves
    // never project -- an unwritten book has no leaf).
    if (tipHeight !== null && height > tipHeight && idx === -1) {
      if (!(await stepProjected(height, -1))) {
        setStatus(projectedReach() > 0
          ? 'The projection ends here — deeper chapters are only a backlog, with no reliable order yet.'
          : 'Not written yet — this is the current chain tip.', 'err');
        labelNav();
      }
      return;
    }
    const meta = await loadBlockByHeight(height, { withTxids: false });
    state = { ...meta, index: clampIndex(idx, meta) };
    await showCurrentTx();
  } catch (e) {
    if (direction > 0) tipHeight = state.height;   // asked past the tip -- remember it
    setStatus(direction > 0 ? 'Not written yet — this is the current chain tip.' : (e.message || 'Failed to load.'), 'err');
    labelNav();   // re-show/hide from the (unchanged) position, now that the tip may be known
  } finally {
    chapterLoading = false;
  }
}

// The header steppers walk at the current leaf's own level: volume to volume,
// book to book, chapter to chapter -- each landing on that span's page.
// Volume I's own leaf is the first page of the body, and the sigla are the
// last leaf of the front matter -- so turning back from it leaves the book for
// the front matter, the inverse of the turn that opened Volume I from there.
// (A swipe has already played its exit; the front matter finishes the entrance
// on arrival. A button press just navigates.)
function atFrontMatterEdge() {
  return !!state && state.index === -3 && volumeBookChapter(state.height).volume === 1;
}
function toFrontMatter() {
  try { sessionStorage.setItem('glossia-front-entrance', 'back'); } catch {}
  location.href = './bitcoin-front.html?leaf=sigla';
}
// …and at the other end of the volumes lie the appendices, which sit at the
// volumes' own level: the last volume's forward turn leaves the body for
// Appendix I, and that leaf's backward turn comes straight back here. Only
// the tip says which volume is last, so with no tip yet the edge is unknown
// and the turn stays an ordinary one.
function atAppendixEdge() {
  return !!state && state.index === -3 && tipHeight !== null
    && volumeBookChapter(state.height).volume >= volumeBookChapter(tipHeight).volume;
}
function toAppendix() {
  try { sessionStorage.setItem('glossia-appendix-entrance', 'fwd'); } catch {}
  location.href = './bitcoin-appendix.html?part=mempool';
}
// Above a draft chapter is Appendix I's own leaf: the ascent lifts this page
// away and the appendix drops in from above, as an ascent does.
function toAppendixLeaf() {
  try { sessionStorage.setItem('glossia-appendix-entrance', 'drop'); } catch {}
  location.href = './bitcoin-appendix.html?part=mempool';
}

async function goToLevel(direction) {
  if (!state) return;
  const { volume, chapterCount } = volumeBookChapter(state.height);
  if (state.index === -3) {
    const v = volume + direction;
    if (v < 1) { if (direction < 0) toFrontMatter(); return; }
    if (direction > 0 && atAppendixEdge()) { toAppendix(); return; }
    return openLeafAt(heightOf(v, 1, 1), -3, direction);
  }
  if (state.index === -2) {
    const target = direction > 0 ? state.height + chapterCount : (state.height > 0 ? bookStartOf(state.height - 1) : -1);
    return openLeafAt(target, -2, direction);
  }
  return openLeafAt(state.height + direction, -1, direction);
}

// Rapid Next/Previous clicks -- or holding the button -- would otherwise fire
// one transaction load, and its whole citation/outspend fan-out, per click,
// with every intermediate load instantly stale. Debounce so a burst collapses
// to a single load at the net destination. The net offset is accumulated and
// applied once the clicks settle (STEP_DEBOUNCE_MS of quiet): if it stays
// inside the current block it's a single load with no list re-fetch; if it runs
// off an edge the burst lands on that edge, and a further step then crosses one
// block via the existing boundary logic (never skipping blocks in one gesture).
const STEP_DEBOUNCE_MS = 180;
let stepTimer = null;
let pendingSteps = 0;
let stepping = false;

function requestStep(direction) {
  pendingSteps += direction;
  if (stepTimer !== null) clearTimeout(stepTimer);
  stepTimer = setTimeout(runPendingSteps, STEP_DEBOUNCE_MS);
}

async function runPendingSteps() {
  stepTimer = null;
  // A previous burst is still loading -- re-arm and let it finish first so two
  // loads never overlap.
  if (stepping) { stepTimer = setTimeout(runPendingSteps, STEP_DEBOUNCE_MS); return; }
  const steps = pendingSteps;
  pendingSteps = 0;
  if (!state || steps === 0) return;

  // A ghost hangs beneath its successor, off the line of sections: forward
  // climbs back up to the seat (the transaction that replaced it); any other
  // step leaves the ghost behind and walks the line as usual.
  if (state.ghost && steps > 0) {
    state.ghost = null;
    try { await showCurrentTx(); } catch (e) { setStatus(e.message || 'Failed to load transaction.', 'err'); }
    return;
  }
  state.ghost = null;

  stepping = true;
  try {
    // Bounds come from txCount; the txid list is fetched only when the burst's
    // destination addresses a section by position (a chapter-page landing, or
    // leaving the block, never needs the current block's list).
    const needList = async () => {
      try { await ensureTxids(state); return true; }
      catch (e) { setStatus(e.message || 'Failed to load the transaction list.', 'err'); return false; }
    };
    const floor = state.projected ? -1 : minIndexOf(state.height);
    const target = state.index + steps;
    if (target >= floor && target < state.txCount) {
      if (target >= 0 && !(await needList())) return;
      state.index = target;
      try {
        await showCurrentTx();
      } catch (e) {
        setStatus(e.message || 'Failed to load transaction.', 'err');
      }
    } else if (steps > 0 && state.index < state.txCount - 1) {
      if (!(await needList())) return;
      state.index = state.txCount - 1;          // overshot forward -- land on the block's last tx
      try { await showCurrentTx(); } catch (e) { setStatus(e.message || 'Failed to load transaction.', 'err'); }
    } else if (steps < 0 && state.index > floor) {
      state.index = floor;                      // overshot backward -- land on the block's first page
      try { await showCurrentTx(); } catch (e) { setStatus(e.message || 'Failed to load transaction.', 'err'); }
    } else {
      await stepTx(steps > 0 ? 1 : -1);         // already at the edge -- cross one block boundary
    }
  } finally {
    stepping = false;
    // Clicks that arrived mid-load are still pending -- run them next.
    if (pendingSteps !== 0 && stepTimer === null) stepTimer = setTimeout(runPendingSteps, STEP_DEBOUNCE_MS);
  }
}

$('page-prev').addEventListener('click', () => requestStep(-1));
$('page-next').addEventListener('click', () => requestStep(1));
$('chapter-prev').addEventListener('click', () => goToLevel(-1));
$('chapter-next').addEventListener('click', () => goToLevel(1));
// The eyebrow crumbs: each opens the page of the span it names. Same block →
// just re-render at the leaf; otherwise load the span's first block.
const openCrumb = (height, idx) => {
  if (!state) return;
  rememberTrail();   // a crumb is an ascent too -- descents retrace it
  if (state.height === height) { state.index = idx; showCurrentTx(); }
