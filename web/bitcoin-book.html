<script>
  // Arriving by the contents page's push-up-at-the-bottom gesture: finish

  // slides in from below; arriving by a backward turn out of Appendix I --

      sessionStorage.removeItem('glossia-book-entrance');
      document.documentElement.classList.add(dir === 'back' ? 'book-entrance-back' : 'book-entrance');

  } catch (_) {}

</script>

<style>
:root {
  --page:#08080a; --card:#0d0d10; --card-bd:#232228; --ink:#e8e4da; --ink-soft:#cfcabf;
  --accent:#c9a25f; --accent-2:#dcb877; --btn-ink:#17140c;
  /* Annotation tiers, tuned for legibility on the near-black page: --dim reads
     at ~7:1 and --meta at ~4.8:1 (WCAG AA for the small mono it's set in),
     while both stay clearly quieter than --ink-soft body prose. */
  --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;
  --input-bg:#151519; --input-bd:#2a2930; --error:#e07b6a; --ok:#7fb98a;
}
* { box-sizing: border-box; }
/* overflow-x on BOTH roots, preferring clip (no scroll container): on mobile,
   rightward overflow -- the carousel's incoming page parked past the right
   edge -- can otherwise widen the layout viewport, dragging every fixed
   element (the loading toast, the Update pill) off-centre. */
html, body { margin: 0; overflow-x: hidden; overflow-x: clip; overscroll-behavior-y: none; }
body {
  min-height: 100vh; background: var(--page); color: var(--ink);
  font-family: 'Public Sans', system-ui, sans-serif; line-height: 1.55;
}
/* The entering half of the contents page's push-up descend: the book slides
   up into place from below, matching the carousel's pace. */
@media (prefers-reduced-motion: no-preference) {
  .book-entrance body { animation: book-in .22s ease-out; }
  @keyframes book-in { from { transform: translateY(100vh); } }
  /* …and the entering half of a backward turn out of Appendix I: the last
     volume comes in from the left, the line of volumes resuming. */
  .book-entrance-back body { animation: book-in-back .22s ease-out; }
  @keyframes book-in-back { from { transform: translateX(-100vw); } }
}
/* Contain the carousel turn entirely: the translated #page-slide clips at the
   article's own bounds (clip creates no scroll container, so nothing else
   changes), and can never widen the page or the mobile layout viewport.
   (A short destination's ability to hold the nav-anchor scroll is guaranteed
   dynamically -- see consumeSlide -- so the notation key sits right after the
   foot nav with no manufactured gap.) */
#chapter { overflow-x: clip; }
/* The slide's stationary window: a translated #page-slide (either axis) clips
   at the frame's bounds instead of painting over the nav chrome around it.
   On a page with nothing meaningful to scroll (the leaves), carousel-first:
   touch-action reserves vertical drags that start here for the level swipe.
   A page taller than the viewport keeps native scrolling in the frame, and
   levels engage from the scroll boundaries instead (see the touch handlers).
   A pinch that starts on the reading matter is the book's own gesture -- it
   sets the type size (reflowing the text, the e-reader way) instead of
   optically magnifying the page, so touch-action here excludes pinch-zoom
   (see the pinch handler). Starting on the chrome around the frame, pinch
   still zooms natively. The nav bar's sheets -- the notation key and the
   commentary on this passage -- claim their pinch the same way, keeping both
   of their own scroll axes (the sheet's vertical, the pattern table's
   horizontal). */
#page-frame { overflow: clip; touch-action: pan-x pan-y; }
#page-frame.carousel-first { touch-action: pan-x; }
.nav-sheet-body { touch-action: pan-x pan-y; }
/* The foot nav sits in the same place on every page: the bottom of the
   screen. The wrap stretches to the viewport, the chapter fills the wrap,
   and all slack lands inside the frame -- never the slide -- so a short
   page's nav rests exactly where a tall page's sticky bar rides, and
   gesture precedence can still measure the natural content (it swaps the
   frame's height for the slide's; see updateGesturePrecedence). */
.wrap { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
#chapter { flex: 1 0 auto; display: flex; flex-direction: column; }
#page-frame { flex: 1 0 auto; }
#chapter.title-leaf #page-frame { min-height: 30rem; }
/* Volume and book leaves set like a manuscript title page: the title drops
   to the optical upper third with its mark beneath, and the span's imprint
   (ranges, dates -- the frontispiece block) anchors near the foot, the open
   field of the leaf between them. */
#chapter.span-leaf #page-frame { display: flex; }
#chapter.span-leaf #page-slide { flex: 1; display: flex; }
#chapter.span-leaf .chapter-head { flex: 1; width: 100%; display: flex; flex-direction: column; }
#chapter.span-leaf .chapter-title { margin-top: 4.5rem; }
#chapter.span-leaf .chapter-hash { margin-top: 1.6rem; }
#chapter.span-leaf .chapter-frontispiece { margin-top: auto; margin-bottom: 3.75rem; }
/* No bottom padding: the foot nav bar is the page's own floor. */
.wrap { max-width: 720px; margin: 0 auto; padding: 48px 22px 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.hidden { display: none !important; }

/* Masthead chrome comes from btc-chrome.css; only this page's reading layout
   pulls the chapter closer beneath it. */
.masthead { margin-bottom:24px; }

button {
  background: var(--accent); color: var(--btn-ink); border: none; border-radius: 4px;
  font: 600 12.5px/1 'IBM Plex Mono',monospace; letter-spacing: .04em; text-transform: uppercase;
  padding: 0 20px; cursor: pointer; transition: background .15s ease;
}
button:hover:not(:disabled) { background: var(--accent-2); }
button:disabled { opacity: .4; cursor: not-allowed; }

/* ── Settings popover (top-right): holds the data-source picker ── */
.settings-menu { position:relative; }
.settings-panel {
  position:absolute; z-index:45; top:calc(100% + 10px); right:0; text-align:left;
  width:min(340px, 86vw); padding:15px 16px 16px;
  background:var(--card); border:1px solid var(--card-bd); border-radius:8px;
  box-shadow:0 16px 40px -10px rgba(0,0,0,.75);
}
.settings-title { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-bottom:11px; }
.settings-panel .settings-title:not(:first-child) { margin-top:16px; }

/* ── text-size control: one row per region of the page, stepping the same
      per-region scales the pinch gesture writes (see btc-fontscale.js). A
      region that still follows the body shows its value dimmed. ── */
.fontscale-grid { display:grid; grid-template-columns:1fr max-content 5ch max-content; gap:8px 10px; align-items:center; }
.fs-label { font:500 11px/1 'IBM Plex Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }
.fs-value {
  text-align:center; font:500 12.5px/1 'IBM Plex Mono',monospace;
  color:var(--ink-soft); font-variant-numeric:tabular-nums;
}
.fs-value.fs-linked { color:var(--meta); }
.fontscale-foot { display:flex; justify-content:flex-end; margin-top:10px; }

/* ── language picker: which of the engine's languages the prose is set in ──
      Four short names, so unlike the settings popover the panel is sized to
      its content rather than to the endpoint form's 340px. */
#lang-panel { width:auto; min-width:12em; padding:12px 14px 13px; }
#lang-panel .settings-title { margin-bottom:8px; }
.lang-rows { display:grid; gap:1px; }
.lang-row {
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  background:transparent; border:0; border-radius:4px; padding:5px 8px; cursor:pointer;
  font:400 14px/1.2 'Newsreader',serif; color:var(--ink-soft); text-align:left;
  text-transform:none; letter-spacing:normal;   /* the global button rule shouts; language names don't */
}
.lang-row:hover, .lang-row:focus-visible { background:var(--input-bg); color:var(--ink); outline:none; }
.lang-row .lang-mark { font:600 11px/1 'IBM Plex Mono',monospace; color:var(--accent); visibility:hidden; }
.lang-row.current { color:var(--ink); }
.lang-row.current .lang-mark { visibility:visible; }

/* ── data-source picker: choose the Esplora-compatible endpoint, add custom ── */
.endpoint-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.endpoint-select {
  flex:1; min-width:170px; background:var(--input-bg); border:1px solid var(--input-bd); border-radius:4px;
  color:var(--ink-soft); font:400 12.5px/1.4 'IBM Plex Mono',monospace; padding:8px 10px; cursor:pointer;
}
.endpoint-select:focus { outline:none; border-color:var(--accent); }
.ghost-btn {
  background:transparent; color:var(--dim); border:1px solid var(--input-bd);
  font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.04em; text-transform:uppercase;
  padding:8px 12px; border-radius:4px; cursor:pointer; transition:border-color .15s ease, color .15s ease;
}
.ghost-btn:hover:not(:disabled) { color:var(--ink); border-color:var(--accent); background:transparent; }
.ghost-btn:disabled { opacity:.35; cursor:not-allowed; }
.endpoint-add-row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.endpoint-add-row input {
  flex:1; min-width:140px; background:var(--input-bg); border:1px solid var(--input-bd); border-radius:4px;
  color:var(--ink); font:400 13px/1.4 'IBM Plex Mono',monospace; padding:9px 11px;
}
.endpoint-add-row input:focus { outline:none; border-color:var(--accent); }
.endpoint-add-row #endpoint-label { flex:0 0 32%; }
.endpoint-msg { margin-top:10px; font:500 12px/1.4 'IBM Plex Mono',monospace; color:var(--meta); }
.endpoint-msg.err { color:var(--error); }

/* Status/loading indicator: a floating toast centred in the viewport --
   over the carousel area the reader is watching during a page turn -- out
   of the document flow, so appearing and vanishing never shifts or scrolls
   the page under them. */
.status-line {
  position: fixed; z-index: 55; left: 50%; top: 42%;
  transform: translate(-50%, -50%);
  max-width: min(70vw, 480px);
  background: var(--card); border: 1px solid var(--card-bd); border-radius: 6px;
  padding: 9px 14px; box-shadow: 0 12px 32px -12px rgba(0,0,0,.8);
  font: 500 13px/1.4 'IBM Plex Mono',monospace;
}
.status-line.err { color: var(--error); }
/* The loading mark is the book's own notation, not a borrowed ring: the four
   sigla of the pay-to-pubkey-hash template -- ⧉ ⌖ ≡ ∇ (OP_DUP, OP_HASH160,
   OP_EQUALVERIFY, OP_CHECKSIG), the script most of the chain's record is
   written in -- read out one at a time on a shared clock. Stacked spans in a
   fixed-width cell (the glyphs' advance widths differ, and the toast must not
   breathe), each fading in as its predecessor fades out; the markup comes from
   SPINNER_HTML, so the glyph list lives in one place. Under reduced motion the
   cycle stops on ⧉ and the mark stands still. */
.spinner { position:relative; display:inline-block; width:1.3em; height:1.2em; vertical-align:-3px; margin-right:5px; color:var(--accent); }
.spinner span { position:absolute; inset:0; text-align:center; line-height:1.2; opacity:0; animation: sigla-read 2s linear infinite; }
.spinner span:nth-child(2) { animation-delay:.5s; }
.spinner span:nth-child(3) { animation-delay:1s; }
.spinner span:nth-child(4) { animation-delay:1.5s; }
@keyframes sigla-read { 0% { opacity:0; } 8%, 25% { opacity:1; } 33%, 100% { opacity:0; } }
@media (prefers-reduced-motion: reduce) {
  .spinner span { animation:none; }
  .spinner span:first-child { opacity:1; }
}

/* ── the chapter itself: a manuscript page, not a utility card ──
   No top margin: the eyebrow bar opens the chapter right under the masthead
   (its own padding sets the rhythm), with no dead band between them. */
#chapter { margin-top: 0; }
.chapter-head { text-align: center; padding-bottom: 34px; margin-bottom: 34px; border-bottom: 1px solid var(--rule); }
/* On the chapter's own page the body is empty, so the head's closing rule
   would stack against the page nav's opening rule -- drop it and let the nav's
   rule close the leaf alone. */
#chapter.title-leaf .chapter-head { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
/* Chapter (block) navigation: prev / next flanking the Volume · Book locator.
   A [1fr | auto | 1fr] grid keeps the locator crumb dead-centred on the page
   even when only one stepper is showing (Genesis has no Previous, the tip no
   Next) -- a hidden stepper leaves its track empty instead of letting the
   crumb drift toward the survivor. The steppers pin to the row's edges,
   spanning the full width like the foot nav below. Explicit tracks: a hidden
   stepper (display:none) leaves the grid, and auto-placement would reflow
   the crumb into its column. */
/* Anchored to the top of the screen, mirroring the foot nav's seat at the
   bottom: sticky, so on a page taller than the viewport the eyebrow rides
   the top edge -- prose scrolls behind its page-colour backing, the rule its
   bottom edge -- and the two bars frame the screen. Top padding clears a
   notch when running standalone. */
.chapter-nav {
  position: sticky; top: 0; z-index: 40;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px;
  margin-bottom: 14px; padding: max(14px, env(safe-area-inset-top)) 0 14px;
  border-bottom: 1px solid var(--rule); background: var(--page);
}
#chapter-prev { grid-column: 1; justify-self: start; }
.chapter-num { grid-column: 2; }
#chapter-next { grid-column: 3; justify-self: end; }
/* The section's folio -- its page number in the chain's running count of
   transactions (one page per transaction since genesis; see btc-pages.js) --
   rides the right end of the eyebrow bar, on the chapter label's line, the
   way a printed folio sits in a running head. It shares the right grid cell
   with the chapter-next stepper: the stepper belongs to leaves alone and the
   folio to section pages alone, so the two never show together. A bare,
   unpunctuated number, dim against the eyebrow's gold -- an annotation, not
   a crumb; the hover title carries the readable form. Census-resolved, so
   it fills in a beat after the section renders; absent when no census
   answers. */
#page-folio { grid-column: 3; justify-self: end; font:500 11px/1 'IBM Plex Mono',monospace; letter-spacing:.14em; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
.chapter-num { font:600 11.5px/1 'IBM Plex Mono',monospace; letter-spacing:.3em; text-transform:uppercase; color: var(--accent); min-width: 0; text-align: center; }
/* The eyebrow's Volume / Book / Chapter crumbs inherit its voice exactly;
   hover marks them navigable. (Overrides the global gold button styling.) */
.chapter-num .crumb {
  background: transparent; border: none; border-radius: 0; padding: 0; cursor: pointer;
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
}
.chapter-num .crumb:hover:not(:disabled), .chapter-num .crumb:focus-visible {
  background: transparent; color: var(--accent-2); text-decoration: underline; outline: none;
}
/* Chapter/section navigation reads as chevron-flanked references, not boxed
   buttons: a left chevron leads a Previous reference, a right chevron trails a
   Next one. Plain accent text (labels are already cased -- text-transform:none
   keeps the book's lowercase β from becoming a Latin-looking capital Β); nowrap
   so a two-part label like "β59 ■2016" stays on one line. */
.chapter-step, .section-nav button {
  background: transparent; border: none; border-radius: 0; padding: 2px 2px;
  color: var(--accent); font: 600 14px/1.2 'IBM Plex Mono',monospace;
  letter-spacing: .04em; text-transform: none; white-space: nowrap; cursor: pointer;
}
.chapter-step:hover:not(:disabled), .section-nav button:hover:not(:disabled) {
  background: transparent; color: var(--accent-2); text-decoration: underline;
}
#chapter-prev::before, #page-prev::before { content: '‹\00a0'; }
#chapter-next::after, #page-next::after { content: '\00a0›'; }
.chapter-title { font: 500 37px/1.2 'Newsreader', serif; color: var(--ink); margin: 0 0 22px; letter-spacing: -.01em; }
/* A notable chapter's event name, set small under the unchanging "Chapter n"
   heading. The negative top margin tucks it into the title's own 22px gap,
   leaving 6px between the two and the usual 22px before what follows. */
.chapter-subtitle { font: italic 500 21px/1.3 'Newsreader', serif; color: var(--dim); margin: -16px 0 22px; }
.chapter-hash { font: italic 400 calc(15px * var(--scale-body, 1))/1.5 'Newsreader',serif; color: var(--dim); margin: 0 auto 16px; max-width: 46ch; }
/* The block header's own fields -- version, previous-block hash, merkle
   root, timestamp, difficulty target, nonce -- in wire order, under the
   chapter hash. A small mono line, like the manuscript's other margin notes;
   each field carries its decoded form in `title` (a tooltip). */
/* The block header stands upright throughout -- fields and hash proses
   alike; only the chapter's own hash prose above it keeps the italic voice.
   Same contrast tier as the section pages' apparatus (dim). */
.chapter-frontispiece { margin: 0 auto 4px; max-width: 46ch; font: 400 calc(14.5px * var(--scale-body, 1))/1.55 'Newsreader',serif; color: var(--dim); }
/* Each header field on its own line, a breath of space between fields --
   the two hash proses run long, so inline middots buried the seams. */
.chapter-frontispiece .cfx { display: block; }
.chapter-frontispiece .cfx + .cfx { margin-top: .45em; }
/* The difficulty target (β): a proof-of-work mark -- gold, bold, upright.
   (.chapter-hash carries the same mark on the book leaf, where the book's
   target sits right beneath its title.) */
.chapter-frontispiece .cfx-gold, .chapter-hash .cfx-gold, .section-hash .cfx-gold { color: var(--accent); font-weight: 700; font-style: normal; }
/* The book leaf's two targets, the opening ceiling and the closing one, a row
   each, and beneath them what the retarget between did to the difficulty.
   Nothing joins the rows: they are one field stated twice, and the line break
   is the retarget. Each row holds together so a narrow screen never breaks
   inside an expression; the rows sit closer to each other than the move sits
   to them, which is what makes them read as a pair with a reading under it,
   in the same dim voice -- not as three fields. */
.chapter-hash .book-target { white-space: nowrap; }
.chapter-hash .book-target + .book-target { margin-top: .15em; }
.chapter-hash .book-move { margin-top: .4em; }
/* The notation key, cut to the page: a row the page does not use leaves the
   flow entirely. The pattern tables are grids whose cells are direct children,
   so anything short of display:none would leave a hole in their columns. */
.key-cut { display: none !important; }
/* The merkle root's ⋔ mark: the clickable handle for its hash menu (copy hex /
   prose), bold and accented (like the h data mark) so it reads as the actionable
   element while the root's prose beside it stays plain. Upright, like every
   mark, against the frontispiece's italic. */
.merkle-mark { color: var(--accent); font-weight: 700; font-style: normal; }
/* Upright bold-gold field marks in the frontispiece: the version's v and the
   nonce's η lead their values the way the data marks lead prose; the value
   after each stays in the frontispiece's own plain voice. */
.fx-mark { color: var(--accent); font-weight: 700; font-style: normal; }

/* A Glossia-encoded hash (a block hash, a txid, a merkle root): the prose is
   the visible text; clicking anywhere on it opens a menu to copy the exact hex
   it encodes or bookmark it. The raw hex itself is never shown -- copying it is
   more reliable than selecting a string this long by hand on a touch device. */
.hash-copy { position: relative; cursor: pointer; }
/* Anything carrying a bookmark ribbon: the ribbon hangs off the corner, so the
   corner has to be the element's own. Every .hash-copy is already positioned;
   a leaf's title, which carries a ribbon and no hash menu, gets it here. */
.bm-host { position: relative; }

/* Context menu raised by clicking a hash / txid: copy the hex, or bookmark it. */
.hash-menu {
  position: fixed; z-index: 40; min-width: 172px; padding: 6px;
  background: var(--card); border: 1px solid var(--card-bd); border-radius: 7px;
  box-shadow: 0 18px 44px -18px rgba(0,0,0,.8);
}
.hash-menu-head {
  padding: 6px 8px 8px; color: var(--dim); font: 600 10.5px/1 'IBM Plex Mono',monospace;
  letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--rule); margin-bottom: 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px;
}
.hash-menu .hash-menu-item {
  display: block; width: 100%; text-align: left; background: transparent; color: var(--ink-soft);
  border: none; border-radius: 4px; padding: 8px 9px; cursor: pointer;
  font: 500 12.5px/1.2 'IBM Plex Mono',monospace; letter-spacing: .02em; text-transform: none;
}
.hash-menu .hash-menu-item:hover, .hash-menu .hash-menu-item:focus-visible { background: var(--input-bg); color: var(--ink); outline: none; }

/* The bookmark ribbon, pinned to the top-right corner of a place that can be
   kept: a chapter's title, a §section's, an output's amount, a volume's or a
   book's leaf. It is the affordance and the flag at once -- it stands there
   hollow while the place is unkept and fills when it is kept, so a reader can
   SEE where a bookmark would go before making one, and sees it in the very
   position the kept mark will occupy.

   Hollow is the same gold, faded: the offer is the mark it would become, and
   nothing else. Faded, because a section carries a ribbon per output as well
   as its own, and an offer should not press itself on the page as hard as a
   mark the reader has actually made. It brightens under the pointer, and to
   full gold once set.

   The button is larger than the glyph it holds (a corner is a poor target for
   a finger otherwise), and hangs INSIDE its place's right edge rather than
   over it: #chapter clips its own overflow-x, so a ribbon that overhung the
   column was cut in half wherever the column reached the screen edge -- which
   is every narrow screen. Flush right, and the glyph is always whole. */
.hash-bookmark {
  position: absolute; top: -6px; right: 0; width: 18px; height: 18px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; color: var(--accent); line-height: 0; cursor: pointer;
  opacity: .42;   /* the mark it would become, faded to an offer */
}
.hash-bookmark svg { display: block; width: 10px; height: 14px; }
.hash-bookmark .rib-fill { display: none; }
.hash-bookmark:hover, .hash-bookmark:focus-visible { opacity: .8; outline: none; }
/* Kept: the same ribbon the contents and the Ledger fly, in the same gold. */
.hash-bookmark.set { opacity: 1; }
.hash-bookmark.set:hover, .hash-bookmark.set:focus-visible { color: var(--accent-2); }
.hash-bookmark.set .rib-fill { display: block; }
.hash-bookmark.set .rib-hollow { display: none; }
/* On an amount the ribbon sits ON its line rather than above it: the outputs
   stack close together, and a mark hanging above a row reads as belonging to
   the row before it. (A title has room above it, and keeps the corner.) */
.tx-out-value > .hash-bookmark { top: 0; }

/* The title-entry form the menu swaps to when bookmarking: the title becomes a
   table-of-contents entry. */
.hash-menu-title { padding: 4px; }
.hash-menu-title input {
  width: 100%; background: var(--input-bg); border: 1px solid var(--input-bd); border-radius: 4px;
  color: var(--ink); font: 400 12.5px/1.4 'IBM Plex Mono',monospace; padding: 8px 9px; margin-bottom: 7px;
}
.hash-menu-title input:focus { outline: none; border-color: var(--accent); }
.hash-title-row { display: flex; gap: 6px; }
.hash-menu-title .hash-title-row button {
  flex: 1; padding: 8px 10px; font: 600 11.5px/1 'IBM Plex Mono',monospace; letter-spacing: .04em; text-transform: uppercase;
}
.hash-menu-title .hash-title-row .ghost { background: transparent; color: var(--dim); border: 1px solid var(--input-bd); }
.hash-menu-title .hash-title-row .ghost:hover { background: transparent; color: var(--ink); border-color: var(--accent); }

/* Per-section paging: Previous / Next pushed to opposite edges, each labelled
   with the section (or adjacent leaf) it steps to. Anchored to the bottom of
   the screen: sticky, so on a page taller than the viewport the bar rides the
   bottom edge -- prose scrolls behind its page-colour backing, the rule its
   top edge -- and settles into its natural place at the section's foot (after
   the witness footnotes) once the reader reaches it. */
.section-nav {
  position: sticky; bottom: 0; z-index: 40;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; margin-top: 44px;
  padding: 14px 0 max(14px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--rule); background: var(--page);
}
/* Previous at the left edge, Next at the right, the page's keys centred
   between them. Explicit tracks: a hidden stepper (display:none) leaves the
   grid, and auto-placement would reflow the survivors off-centre.
   Two keys ride that centre: Notation, which every page carries, and
   Commentary, which appears only where the passage in front of the reader has
   a curated reading (btc-commentary.js) -- so its absence is information too.
   Both raise their sheet into the one slot above the bar, and opening either
   closes the other. */
#page-prev { grid-column: 1; justify-self: start; }
.section-nav .nav-keys { grid-column: 2; display: flex; align-items: center; justify-content: center; gap: 20px; }
#page-next { grid-column: 3; justify-self: end; }
.commentary-body { padding-bottom: 16px; }
/* The sheet's own typography — the measure, the readings, the byline, the terms
   — is commentary.css, shared with the Ledger's leaf-borne readings, so a
   reading looks the same wherever the book offers one. */
/* A future chapter's reading, set beneath the answer that its block is unmined:
   the page a consensus height has until a miner writes one. Centred like the
   status line above it, in the commentary's own measure (commentary.css). */
#future-commentary { margin: 40px auto 0; max-width: 560px; padding: 0 22px 60px; }
#future-commentary:empty { display: none; }
/* The book's answer for a chapter nobody has written yet — when it is due —
   standing as the leaf's first line rather than as the toast it would be if
   there were nothing to read beneath it. */
.future-answer {
  margin: 0 0 22px; padding-bottom: 16px; border-bottom: 1px solid var(--rule);
  font: 500 calc(12.5px * var(--scale-commentary, 1))/1.5 'IBM Plex Mono',monospace;
  color: var(--dim);
}
/* Nothing to step to on either side (nothing precedes Genesis's opening leaf;
   nothing follows the tip's last section while both edges are hidden): drop
   the bar entirely rather than pin an empty rule to the screen bottom. */
.section-nav:not(:has(button:not(.hidden))) { display: none; }
/* The section heading -- the transaction's position within its block, "§ N" --
   centred beneath the chapter frontispiece. */
.section-title { text-align:center; margin: 22px 0 0; font:600 13px/1 'IBM Plex Mono',monospace; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); }
.section-num { display:block; }
/* A curated transaction's name, beneath its § number -- the section's answer to
   a chapter's event title (serif, mixed case, quieter than the accent numeral). */
.section-event { display:block; margin-top:.5em; font:500 15px/1.3 'Newsreader',serif; letter-spacing:0; text-transform:none; color:var(--ink-soft); }
/* The transaction's own txid, rendered as Glossia prose beneath the section title
   (as the block hash is beneath the chapter title). */
/* Dim like the chapter-hash above it -- both are the identifying hash prose of
   the thing being read, one tier under the body, not two. */
.section-hash { margin: 13px auto 0; max-width: 46ch; font: italic 400 calc(14.5px * var(--scale-body, 1))/1.55 'Newsreader',serif; color: var(--dim); }
/* The section's date and depth, under the txid prose: derived readings, not
   bytes, so they stand upright like the frontispiece's fields -- one line
   each, a shade smaller than the hash prose they follow. */
.section-meta { margin: 8px auto 0; max-width: 46ch; font: 400 calc(13.5px * var(--scale-body, 1))/1.55 'Newsreader',serif; color: var(--dim); }
.section-meta div { display: block; }
/* The volume/book leaves borrow the chapter-hash slot for their range and
   target lines -- not hash prose, so they stand upright. */
.chapter-hash.plain, .chapter-hash .cfx-gold { font-style: normal; }

/* The reading matter follows the reader's chosen type sizes, one per region:
   --scale-body / --scale-margins / --scale-notation (set
   on <html> by btc-fontscale.js -- the settings rows and the pinch gesture
   both write them; 1 when unset). The module writes effective values, so
   every region follows the body until the reader splits it off. The prose
   column's em-based inline marks and drop cap ride the body; the sizes set
   in px below opt into their region one by one. The witness footnotes are
   no region: their ratio to the body is the weight discount (see
   .footnote-entry), so they ride --scale-body and cannot be split off. The
   page's chrome -- titles, nav, eyebrow, folio, settings -- deliberately
   holds still. */
.chapter-body { font-family: 'Newsreader', serif; font-size: calc(19px * var(--scale-body, 1)); line-height: 1.75; color: var(--ink-soft); font-variant-numeric: oldstyle-nums; }

/* Each transaction is a manuscript page: a left margin for provenance (what
   this text refers back to), a body for the canonical prose, and a right
   margin for consequences (what this text produces / how it ends). */
.tx-wrap { position: relative; margin: 0 0 2em; }

/* A three-column manuscript grid -- [left margin | body | right margin] --
   laid out in horizontal bands, each part aligned with the body it annotates:
     .tx-inputs   a subgrid (row 1, left + body): every input is a [citation |
                  scriptSig] pair, so an input's provenance sits on its own line.
                  The citation is the referenced output's volume·book·chapter·section
                  plus its output index (a coinbase shows ∅).
     .tx-outputs  a subgrid (row 2, body + right): every output is a [scriptPubKey
                  | amount] pair, so an amount sits on the line of its output.
     .tx-locktime the closing locktime, centred across the full row, last
                  band -- the end, set like a terminal colophon. */
/* The margin columns hug their content: fit-content, capped at 6.5em/7em of
   the 19px base prose -- the caps sized from the margins' own scale, so
   diverging the margin text re-proportions its columns with it instead of
   leaving small type adrift in body-wide gutters. A column narrower than its
   cap (short citations, an unspent output's bare amount) gives the slack to
   the prose instead of holding it as dead space against the page edge. */
.tx-flow { display: grid; grid-template-columns: [left] fit-content(calc(6.5 * 19px * var(--scale-margins, 1))) [body] minmax(0,1fr) [right] fit-content(calc(7 * 19px * var(--scale-margins, 1))); column-gap: 1.3em; align-items: start; }
.tx-inputs { grid-column: left / right; grid-row: 1; display: grid; grid-template-columns: subgrid; column-gap: 1.3em; align-items: start; }
/* padding-top nudges the small-cap reference down onto the top of the taller
   prose line beside it (the two line boxes top-align, but the glyphs don't). */
.tx-in-cite { grid-column: 1; text-align: right; padding-top: .34em; font: 500 calc(12px * var(--scale-margins, 1))/1.5 'IBM Plex Mono',monospace; color: var(--dim); word-break: break-word; }
/* An aligned input row's left cell: this input's citation, preceded by any
   witness-input citations that came before it in the sequence and had no
   scriptSig of their own -- stacked, in order, above it. */
.tx-in-cite-group { grid-column: 1; }
.tx-in-cite-group > .tx-in-cite + .tx-in-cite { margin-top: .5em; }
.tx-in-cite.resolving { color: var(--meta); }
.tx-in-cite.cite-unresolved { color: var(--meta); font-style: italic; }
.tx-in-cite.tx-version { color: var(--meta); letter-spacing: .03em; }
/* Margin references are live citations -- gold, like every other reference
   in the book (nav labels, contents rows, crumbs). */
.cite-section-link { color: var(--accent); text-decoration: none; }
.cite-section-link:hover { color: var(--accent-2); text-decoration: underline; }
/* The amount of the output this input spends, under its reference. Right-aligned
   to the body gutter, like the reference above it and the output amounts opposite. */
.cite-amount { margin-top: .1em; text-align: right; font: italic 400 calc(12px * var(--scale-margins, 1))/1.3 'Newsreader',serif; color: var(--meta); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* An output that dated something outside the book: the ‡ citation mark, under
   the amount and under any forward citation, its subscript the work's number
   in the Citations register (a reader's own addendum wears the bare ‡). The
   book's own references point inward, at chapters it contains; this is the one
   mark that points out of the text entirely, at a document the chain dated and
   the book does not hold -- gold, like the other marks that point somewhere. */
.appx-cite {
  margin-top: .15em; text-align: right; white-space: nowrap;
  font: 600 calc(13px * var(--scale-margins, 1))/1.4 'IBM Plex Mono',monospace;
}
.appx-cite a { color: var(--accent); text-decoration: none; }
.appx-cite a:hover { color: var(--accent-2); }
/* An output's forward citation -- the section that later spent it -- under its
   amount in the right margin, mirroring the left margin's provenance cites.
   Empty for an unspent output. */
/* white-space back to normal: the forward citation rides INSIDE the value
   cell and must not inherit its nowrap -- a long reference wraps at the
   column's cap instead of overflowing the page. */
.fwd-cite { margin-top: .1em; font: 500 calc(12px * var(--scale-margins, 1))/1.3 'IBM Plex Mono',monospace; color: var(--dim); white-space: normal; }
.tx-in-script { grid-column: 2; min-width: 0; }
/* The version note, and the rare citation with nowhere else to go (an input
   with neither scriptSig nor witness). Witness-only inputs no longer stack
   here -- their citations follow their witnesses to the footnotes -- so this
   band is normally just the version note beside the first output. */
.tx-margin-cites { grid-column: left; grid-row: 2; align-self: start; }
.tx-outputs {
  grid-column: body / -1; grid-row: 2;
  display: grid; grid-template-columns: minmax(0,1fr) fit-content(calc(7 * 19px * var(--scale-margins, 1))); grid-template-columns: subgrid;
  column-gap: 1.3em; align-items: start;
}
.tx-out-script { grid-column: 1; min-width: 0; }
/* Amounts right-align to the page edge, like a ledger column; they read in
   bitcoin (₿) with a fixed eight decimals and tabular figures, so the column
   aligns on the point (see formatBtc in btc-prose.js). */
/* Sized like the .tx-note it also is (13.5px), but from the margins' scale --
   the amounts are the right margin's text. nowrap: under fit-content sizing
   an amount must count as one piece, never wrap its ₿ onto a line of its own
   to satisfy a narrower column. */
/* padding-right is the ribbon's own room: an output is a keepable place, so
   its amount carries a bookmark at the corner where the amount ends, and a
   ribbon must never sit over the ₿ it is offered beside. The ribbon's glyph
   reaches 14px in from the cell's edge, so the amounts stop clear of it --
   all of them, so the column still aligns on the point. */
.tx-out-value  { grid-column: 2; text-align: right; padding-right: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* The balance line: what the inputs bring at the left, what the outputs
   carry at the right -- each sum under the column it totals, the outputs'
   on the amounts' own edge -- and between them, signed negative, the
   difference the miner keeps: the fee. No labels; the geometry is the
   equation, inputs − fee = outputs. The sums are DERIVED -- arithmetic over
   the record, not bytes on the wire -- so they do not sit in the
   transaction's own flow: they lead the foot region, below the section's
   one rule (#ch-footnotes-section), apart from the record they total and
   above the witness footnotes when there are any. The inputs' sum waits on
   the margin citations resolving, and an input the book cannot price
   leaves the sum and the fee unsaid (⋯). A coinbase has no such line: its
   input brings no prior output, and the block's fees arrive in its
   outputs, with the subsidy. */
.tx-totals { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; margin: 0 0 1.6em; font: italic 400 calc(13.5px * var(--scale-margins, 1))/1.4 'Newsreader',serif; color: var(--dim); font-variant-numeric: tabular-nums; }
.tx-totals .t-fee { color: var(--meta); }
.tx-totals .t-out { padding-right: 20px; }   /* the amounts column's ribbon room, so the sum sits on their point */
.tx-locktime { grid-column: left / -1; grid-row: 3; text-align: center; font-style: normal; }
/* An output the reader has kept under a name (or the contents already
   names): the title stands centered above the output's own rows, spanning
   script and amount. Empty -- unkept and unnamed -- it takes no room.
   Filled by syncBookmarkTitles, live with the bookmark set. */
.tx-out-title { grid-column: 1 / -1; text-align: center; font: italic 500 calc(13.5px * var(--scale-body, 1))/1.4 'Newsreader',serif; color: var(--accent); margin: .4em 0 .15em; }
.tx-out-title:empty { display: none; }
/* The locking script's keep line, centered above its paragraph: unkept and
   uncurated, the hollow ribbon alone -- the offer, faded like every unmade
   mark; named (the reader's keep, or the curated shelf's default it reverts
   to), the name with the ribbon beside it. The ribbon toggles the reader's
   keep; the name opens the copy menu (see syncScriptKeeps). Empty (no
   standard address) it takes no room. */
.tx-out-keep { grid-column: 1 / -1; text-align: center; margin: .1em 0 .15em; font: italic 500 calc(13.5px * var(--scale-body, 1))/1.4 'Newsreader',serif; color: var(--ink-soft); }
.tx-out-keep:empty { display: none; }
.tx-out-keep .out-keep-name { cursor: pointer; }
.tx-out-keep .out-keep-name:hover, .tx-out-keep .out-keep-name:focus-visible { color: var(--accent-2); outline: none; }
.tx-out-keep .keep-rib { display: inline-block; line-height: 0; color: var(--accent); vertical-align: -2px; background: none; border: 0; padding: 2px 5px; cursor: pointer; opacity: .42; }
.tx-out-keep .keep-rib svg { display: inline-block; width: 10px; height: 14px; }
.tx-out-keep .keep-rib:hover, .tx-out-keep .keep-rib:focus-visible { opacity: .8; outline: none; }
.tx-out-keep .out-keep-name + .keep-rib { margin-left: .25em; }
/* The one ribbon glyph, dressed by state: hollow as an offer, filled once
   kept (full gold, like every made mark) -- same switch the corner ribbons
   use, scoped to this line. */
.tx-out-keep .keep-rib .rib-fill { display: none; }
.tx-out-keep .keep-rib.kept { opacity: 1; }
.tx-out-keep .keep-rib.kept:hover, .tx-out-keep .keep-rib.kept:focus-visible { color: var(--accent-2); }
.tx-out-keep .keep-rib.kept .rib-fill { display: block; }
.tx-out-keep .keep-rib.kept .rib-hollow { display: none; }
.section-event:empty { display: none; }
.tx-note { font: italic 400 calc(13.5px * var(--scale-body, 1))/1.4 'Newsreader',serif; color: var(--dim); }
/* The amount's size, on both its classes. An amount is a .tx-note as well as
   a .tx-out-value, and .tx-note sets the font shorthand -- font-size included
   -- so at equal specificity the rule declared later would win and size the
   right margin from the body's scale. Naming both classes settles it by
   specificity instead of by source order. Only the size: the rest of the
   voice (italic Newsreader, its line-height) is the note's, as it should be,
   and layout stays on .tx-out-value alone so the narrow-screen override below
   still reaches it. */
.tx-note.tx-out-value { font-size: calc(13.5px * var(--scale-margins, 1)); }
/* The input's sequence mark, leading the amount line beneath the reference:
   ●/○ final/respects-locktime, † replaceable (a shade warmer), ■n / Τn a
   relative block / time delay. */
.tx-seq { font-style: normal; color: var(--meta); }
.tx-seq-rbf { color: var(--accent-2); }
.tx-seq-block, .tx-seq-time { color: var(--dim); font-variant-numeric: normal; }
.tx-line { margin: 0 0 .55em; }
/* Opcodes rendered inline in a script: a defined opcode shows as its Glossia
   glyph (accent, so the grammar punctuates the prose data pushes); an opcode
   we haven't given a glyph falls back to Bitcoin Core's OP_* name in small mono. */
.op { color: var(--accent); font-style: normal; }
.op-name { font: 600 .62em/1 'IBM Plex Mono',monospace; letter-spacing:.04em; color: var(--dim); font-style: normal; vertical-align: .14em; white-space: nowrap; }
/* A push opcode's mark (↧ₙ and the OP_PUSHDATA variants): quieter than the
   operational opcodes -- it frames the data that follows rather than acting
   on the stack, so it shouldn't compete with the prose it introduces. */
.op-push { color: var(--meta); }
/* A data type mark (p s h r w t): names what the prose after it carries.
   Dim like the push count it rides with -- annotation, not instruction. */
/* Data marks (p s h r w t) in live prose: bold, since a confirmed
   transaction's data is on chain. In the pattern table the same letters go
   plain where a spend introduces them at validation (see .seq.exec .ph). */
.dt { color: var(--accent); font-style: normal; font-weight: 700; }
/* The sigla set inline in the reading matter -- the opcode glyphs, the push
   marks, and the small-mono fallback names for opcodes with no glyph -- can
   be sized apart from the prose they punctuate: --scale-sigla-ratio is the
   sigla scale over the body scale (btc-fontscale.js; 1 while the sigla
   follow the body), so the marks sit flush with the surrounding text until
   diverged, then grow or shrink relative to it wherever they appear --
   prose, hash lines, witness footnotes. Scoped to the page slide: the
   notation key sizes its own glyphs from --scale-notation, and must not
   compound with this.
   The data-type letters (.dt -- p s h r w t) are deliberately NOT here.
   They name what the prose after them carries, so they are the transaction's
   data speaking, not the script's operations: they stay at the prose's own
   size and read as part of the sentence. So does a bare byte count (.op-count
   -- a direct push's whole mark, and the count riding a data letter or a
   header field's mark): it measures the data, and 1em against the prose it
   annotates holds it there whatever the sigla do around it. And so does a
   coinbase's template timestamp (.op-tpltime), for the same reason twice
   over: it is a value the miner wrote rather than an operation, and it is
   the date the chapter head prints in prose, which a reader should be able
   to set beside this one without either having been resized. */
#page-slide .op { font-size: calc(1em * var(--scale-sigla-ratio, 1)); }
#page-slide .op-name { font-size: calc(.62em * var(--scale-sigla-ratio, 1)); }
#page-slide .op.op-count, #page-slide .op.op-tpltime { font-size: 1em; }
/* A witness footnote is a stack of items; a thin middot separates each, and an
   empty stack item shows as ∅. */
.wit-sep, .wit-empty { color: var(--meta); font-style: normal; }
/* A push chunk whose prose hasn't been encoded yet -- it streams in when it
   scrolls near the viewport (see lazyEncode). Shown as a dim ellipsis until
   then; each data push is its own chunk, so a large witness fills piecewise. */
.glossia-lazy { color: var(--dim); }
/* Verbatim human-readable text embedded in a script (a coinbase mining-pool
   tag, an OP_RETURN message) is a foreign voice quoted into the transaction,
   not part of its prose -- so it's set as a quote block (a marginal accent
   rule, indented, italic) rather than wrapped in inline quotation marks. */
.tx-ascii {
  margin: 0 0 .55em; padding: .12em 0 .12em 1.05em;
  border-left: 2px solid var(--accent); border-radius: 1px;
  font: italic 400 calc(17.5px * var(--scale-body, 1))/1.6 'Newsreader',serif; color: var(--ink-soft);
}
/* A quotation the book can name a hand for: a mining pool's signature, matched
   against web/btc-pools.js. It reads as the quotation it already was -- the
   pool's words, in the pool's voice, at the size of the prose around them --
   and carries a dotted rule to say a reading is attached, which the hover
   states. The name itself is not set on the page: that these bytes are here is
   the record, and who mined the block is an inference from a string anyone
   could copy, so it stays where a reader can weigh it. */
.pool-sig { border-bottom: 1px dotted var(--dim); }
/* A tab inside a quoted embedded message (see quoteText in btc-prose.js): a
   fixed-width gap, so column-aligned text keeps its spacing instead of
   collapsing to a single space. */
.tab { display: inline-block; width: 4ch; }
.tx-line.tx-body-lead::first-letter {
  font-size: 3.4em; float: left; line-height: .82; padding: .04em .07em 0 0;
  font-weight: 500; color: var(--accent);
}
@media (max-width: 560px) {
  /* Collapse every band into one column: each margin cell becomes a full-width
     block stacked with the body it annotated. Citations lead their input;
     amounts follow their output -- position alone carries the sense. */
  .tx-flow { grid-template-columns: 1fr; }
  .tx-inputs, .tx-margin-cites, .tx-outputs, .tx-locktime { grid-column: 1; grid-row: auto; display: block; }
  /* The balance line keeps its three stations even collapsed -- it fits,
     and the geometry IS the equation. (It lives in the foot region, not
     the flow, so the collapse above doesn't reach it.) */
  /* The footnotes restack too -- their portrait rules live in their own
     media block beside the footnote styles further down, where source
     order lets them override the base grid. */
  .tx-in-cite, .cite-amount { text-align: left; margin: 0 0 .2em; }
  /* Output amounts keep the ledger's right edge even collapsed: a column of
     figures justifies right so the values still read as a column, and the
     bookmark ribbon's padding-right keeps holding its corner. */
  .tx-out-value { margin: 0 0 .55em; }
  .tx-locktime { margin: 0 0 .55em; }   /* stays centred: it closes the page, not a ledger line */
  /* Stacked into one column, the drop-cap's first body line now sits directly
     below its input's citation/amount rather than beside it. The floated
     initial (line-height .82) overhangs upward, so give the lead line room to
     keep the cap clear of the amount above it. */
  .tx-line.tx-body-lead { padding-top: .8em; }
  /* At phone widths the row tightens: less gap, and the centre locator's
     tracking eases so it wraps within the space between the edge-pinned
     steppers (min-width 0 in the base rule) instead of overflowing. */
  .chapter-nav { gap: 9px; }
  .chapter-num { letter-spacing: .14em; }
  /* The folio tightens with the row, so a ten-digit page number and a long
     chapter crumb can share the bar without overflowing. */
  #page-folio { font-size: 10px; letter-spacing: .06em; }
}

/* A witness-bearing input carries a small superscript index inline; the matching
   witness prose collects at the foot of the page. */
.tx-witness-ref { font: 500 .62em/1 'IBM Plex Mono',monospace; color: var(--accent); vertical-align: super; text-decoration: none; margin-left: .12em; }
.tx-witness-ref:hover { text-decoration: underline; }
.chapter-footnotes { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--rule); }
/* A witness-only input leaves no scriptSig row in the body, so its margin
   citation follows its witness down (see renderFootnotes): the footnote list
   mirrors the flow's [left | body] columns, and such a footnote reads as the
   input entire -- provenance, amount and sequence beside the apparatus that
   spent it. Entries whose input kept a body row (legacy, wrapped segwit)
   have no citation here and leave their left cell empty. Sparse grid
   auto-placement does the pairing: a citation takes column 1, its entry the
   body column of the same row. */
#ch-footnotes { display: grid; grid-template-columns: fit-content(calc(6.5 * 19px * var(--scale-margins, 1))) minmax(0,1fr); column-gap: 1.3em; align-items: start; }
#ch-footnotes .footnote-entry { grid-column: 2; }
/* The body rows' .34em nudge aligns a citation with 19px prose; footnote
   prose is smaller than the citation, so here the two just top-align. The
   reference and its amount set right against the gutter (outranking the
   portrait collapse's left-align), flush to the witness they cite; the
   portrait block below restacks them instead. */
#ch-footnotes .tx-in-cite { padding-top: 0; text-align: right; }
#ch-footnotes .cite-amount { text-align: right; }
/* Portrait: the citation leads its witness as a full-width block, the way
   the body's citations lead their inputs in the collapse -- but the index
   keeps the margin: the entry hangs its mark in a fixed indent every
   wrapped line clears, so the letter stands alone beside the prose. The
   indent rides --scale-body with the mark and the prose it hangs beside.
   This block sits AFTER the rules above on purpose: at equal specificity
   the later rule wins, which is how it overturns them at phone widths. */
@media (max-width: 560px) {
  #ch-footnotes { display: block; }
  #ch-footnotes .tx-in-cite { text-align: left; margin: 0 0 .2em; }
  #ch-footnotes .cite-amount { text-align: left; }
  #ch-footnotes .footnote-entry { padding-left: calc(16px * var(--scale-body, 1)); text-indent: calc(-16px * var(--scale-body, 1)); }
  #ch-footnotes .footnote-mark { display: inline-block; width: calc(16px * var(--scale-body, 1)); margin-right: 0; text-indent: 0; }
}
/* Witness prose is on-chain content, not marginalia: dim, not meta. Its type
   is set to the BIP141 discount -- a witness byte weighs 1/4 of a base byte,
   and characters per unit of page area go as size x leading-in-px, so
   11px/1.3 (11 x 14.3 = 157) packs exactly 4x the density of the 19px/1.75
   body (19 x 33.25 = 632): a witness letter takes a quarter of the space a
   body letter does, the same ratio its bytes take in the block. Because the
   ratio is notation, the footnotes size from --scale-body -- not a scale of
   their own -- so the relation holds at every size the reader reads at. */
.footnote-entry { margin: 0 0 1.1em; font: italic 400 calc(11px * var(--scale-body, 1))/1.3 'Newsreader',serif; color: var(--dim); }
.footnote-entry:target { color: var(--ink-soft); }
.footnote-mark { font: 500 calc(8px * var(--scale-body, 1))/1 'IBM Plex Mono',monospace; color: var(--accent); margin-right: .5em; font-style: normal; vertical-align: .35em; }
/* A witness the reader (or the contents) has named: the title stands
   centered above its footnote, spanning citation and prose -- the same
   dress an output's name wears above its rows. Empty, it takes no room. */
.footnote-title { grid-column: 1 / -1; text-align: center; font: italic 500 calc(13.5px * var(--scale-body, 1))/1.4 'Newsreader',serif; color: var(--accent); margin: .4em 0 .3em; }
.footnote-title:empty { display: none; }
/* A footnote's ribbon flies at its entry's right edge, the way an output's
   flies on its amount. The mark is the menu's click target, but an 8px
   letter is no place for an 18px button -- so the mark stays unpositioned
   and the entry is the ribbon's positioned ancestor, with the ribbon's room
   held clear at the entry's right edge (the outputs' own 20px). */
.footnote-entry { position: relative; padding-right: 20px; }
.footnote-mark.bm-host { position: static; }
.footnote-entry .hash-bookmark { top: 0; }

</style>

<script type="module">
import { init, encodeSeedPhrase, MSG_LANGS, bookLang, setBookLang } from './glossia-msg.js';
import { t as tr, localizeText, localizeAttr } from './btc-strings.js';
import { parseTransaction, computeTxid, parseBlockHeader, computeBlockHash, bitsToDifficulty, scriptToAddress } from './btc-tx.js';
// The reader's ledger shelf (Appendix III): a locking script kept from a
// section joins it as a titled one-address ledger, the same registry the
// Ledger page's own keep button writes. INDEXED is the curated shelf, whose
// titles are the keep line's defaults.
import { keptLedgers, saveKeptLedgers, INDEXED } from './btc-index.js';
import { composeTransactionFields, composeBlockHeaderFields, bitsInfo, groupDigits, formatBtc, renderWitness, toSuperscript, timestampInfo } from './btc-prose.js';
import { volumeBookChapter, heightOf, windowStartOf, retargetInside, toRoman, reference, parseReference, footnoteMark, latinRefOf } from './btc-citation.js';
import { loadNotables, places, placeTitle, blocksEta, appendix } from './btc-contents.js';
import { queueLabel } from './btc-mempool.js';
import { toSubscript } from './btc-sigla.js';
import { NOTATION_HTML } from './btc-notation.js';
import { transactionTemplates } from './btc-templates.js';
import { collectMarks, applyKeyFilter } from './btc-key-filter.js';
import { commentaryFor, commentaryHtml, resolveCommentary } from './btc-commentary.js';

// The curated index -- which blocks and transactions are notable, what they are
// called, and which readings they carry -- is read from notables.yaml rather
// than baked into a script, so it arrives asynchronously. Started here, awaited
// once before the first lookup at the foot of this module.
loadNotables();

// The notation key's markup is shared with the front matter's sigla leaf, so
// the toggle here and the key at rest there can never explain a mark
// differently. Filled once, on load.
//
// Where the two part is scope, not content. The leaf is the key at rest and
// stays whole; here it is opened over a transaction, so it is cut to the marks
// that transaction actually prints (btc-key-filter.js) and carries the control
// that puts the rest back.
// What the sheet is showing, and where the whole of it lives. The key at rest
// is the front matter's sigla leaf -- the entire alphabet, with the opcode
// index beside it -- so the sheet points there rather than carrying a second
// copy of the same key behind a toggle.
const KEY_SCOPE_HTML = `
          <div class="key-scope">
            <span class="key-scope-note">the marks on this page</span>
            <a class="key-scope-link" href="./bitcoin-front.html?leaf=sigla">The sigla →</a>
          </div>`;
document.querySelector('.notation-body').innerHTML = KEY_SCOPE_HTML + NOTATION_HTML;

// The script patterns the page in hand carries; empty on a leaf, which has no
// transaction under it.
let pageTemplates = new Set();

// Cut the key to the page. Recomputed when the sheet opens and again whenever
// the page beneath it changes, so a reader who turns pages with the key open
// sees it follow. Nothing to do while it is shut.
function refreshNotationKey() {
  const sheet = document.querySelector('.section-nav .nav-sheet.notation');
  const body = document.querySelector('.notation-body');
  if (!sheet || !sheet.open || !body) return;
  applyKeyFilter(body, { marks: collectMarks($('page-slide')), templates: pageTemplates });
}

// The nav bar carries two keys into the same slot above it -- the notation key
// and, where the passage has one, its commentary. Opening either closes the
// other: one sheet is over the page at a time, so a reader is never reading a
// reading and a mark at once. Opening the commentary key is also what fetches
// its prose -- the index says a reading exists, the file says what it says.
for (const sheet of document.querySelectorAll('.section-nav .nav-sheet')) {
  sheet.addEventListener('toggle', () => {
    if (!sheet.open) return;
    for (const other of document.querySelectorAll('.section-nav .nav-sheet')) {
      if (other !== sheet) closeSheet(other);
    }
    if (sheet.id === 'commentary') fillCommentary();
    else refreshNotationKey();
  });
  // Opening animates by itself -- the panel is display:none until the details
  // opens, so appearing is enough. Closing has to be held back until the fall
  // finishes, or the details would drop the panel mid-animation.
  const summary = sheet.querySelector('summary');
  if (summary) summary.addEventListener('click', (e) => {
    if (!sheet.open) return;
    e.preventDefault();
    closeSheet(sheet);
  });
}

// Shut a sheet, letting it fall first. Idempotent, and it never leaves a sheet
// stuck open: if the animation does not report back -- a hidden tab, a
// browser that declines to run it -- a timer shuts it anyway.
function closeSheet(sheet) {
  if (!sheet || !sheet.open || sheet.classList.contains('closing')) return;
  const body = sheet.querySelector('.nav-sheet-body');
  const done = () => {
    sheet.classList.remove('closing', 'dragging', 'springing');
    if (body) body.style.transform = '';
    sheet.open = false;
  };
  if (!body || REDUCED_MOTION) { done(); return; }   // the page's own motion setting, declared below
  // The inline transform stays: a sheet dragged partway down falls from
  // there, not from zero. done() clears it once the details is shut.
  sheet.classList.remove('dragging', 'springing');
  sheet.classList.add('closing');
  body.addEventListener('animationend', done, { once: true });
  setTimeout(() => { if (sheet.classList.contains('closing')) done(); }, 400);
}

// A sheet is a panel over the page, so a click on the page puts it down --
// the same rule the settings panel keeps. The exemption is the nav bar the
// sheet is anchored to: its steppers page the book, and a reader paging with
// the key open is watching it follow the page (see refreshNotationKey), not
// asking to be rid of it.
document.addEventListener('click', (e) => {
  if (e.target.closest && e.target.closest('.section-nav')) return;
  for (const sheet of document.querySelectorAll('.section-nav .nav-sheet')) closeSheet(sheet);
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  for (const sheet of document.querySelectorAll('.section-nav .nav-sheet')) closeSheet(sheet);
});

// Swipe a sheet away: a drag downward that begins with the panel already
// scrolled to its top puts it down. The sheet is a panel over the page, and
// pushing it back down is the gesture its shape suggests; scrolled anywhere
// below the top the same drag is a scroll, and stays one.
(() => {
  const DISMISS_PX = 64;      // far enough not to fire on a scroll that overshoots
  const SLOPE = 1.2;          // and steep enough to be a drag down, not a drift sideways
  let sheet = null, body = null, y0 = 0, x0 = 0, dy = 0, tracking = false;

  const release = () => {
    if (!sheet) return;
    const s = sheet, b = body, dragged = tracking;
    sheet = body = null; tracking = false;
    // A tap that never became a drag moved nothing and has nothing to undo --
    // the sigla link at the top of the sheet is the common case.
    if (!dragged) return;
    s.classList.remove('dragging');
    if (dy >= DISMISS_PX) { closeSheet(s); return; }
    // Short of the threshold: let it spring back to where it was.
    s.classList.add('springing');
    b.style.transform = '';
    b.addEventListener('transitionend', () => s.classList.remove('springing'), { once: true });
    setTimeout(() => s.classList.remove('springing'), 300);
  };

  document.addEventListener('touchstart', (e) => {
    sheet = body = null; tracking = false; dy = 0;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    const b = t.target.closest && t.target.closest('.nav-sheet-body');
    // Only from the top of the scroll: below it, the drag belongs to the scroll.
    if (!b || b.scrollTop > 0) return;
    body = b; sheet = b.closest('.nav-sheet'); y0 = t.clientY; x0 = t.clientX;
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!sheet || e.touches.length !== 1) { if (sheet) release(); return; }
    const t = e.touches[0];
    dy = t.clientY - y0;
    const dx = Math.abs(t.clientX - x0);

// Every Esplora request goes through this throttle rather than the raw fetch.
// A single transaction can fan out into dozens of lookups at once (a citation
// per input, a forward citation per output, footnotes), and the public Esplora
// instance sheds those bursts with 429/503. Three defenses, in order of
// importance:
//   1. a concurrency cap -- at most CONCURRENCY requests in flight, the rest
//      queued -- which flattens the bursts that trip the limiter in the first
//      place;
//   2. exponential backoff with jitter on 429/503, honoring a Retry-After
//      header when the server sends one, for the times we're throttled anyway;
//   3. mirror failover -- once a mirror's own retry budget is spent (still
//      throttled, or a network/CORS failure), the request is replayed against
//      the next mirror, and that mirror becomes preferred so the rest of the
//      burst skips the dead one instead of each re-discovering it.
// Jitter matters: without it, a batch of parallel failures would all retry in
// lockstep and re-burst. Returns a normal Response, so callers' .ok/.json()/
// .text() handling is unchanged.
const esploraFetch = (() => {
  const CONCURRENCY = 3;
  const MAX_RETRIES = 4;
  const RETRYABLE = new Set([429, 503]);
  let active = 0;
  const queue = [];
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const pump = () => { while (active < CONCURRENCY && queue.length) queue.shift()(); };

  // Rewrite a URL built against any known mirror onto `base`. A URL that
  // doesn't match a mirror (shouldn't happen) is left untouched.
  const onMirror = (url, base) => {
    for (const m of ESPLORA_MIRRORS) {
      if (url.startsWith(m)) return base + url.slice(m.length);
    }
    return url;
  };

  return (url, opts) => new Promise((resolve, reject) => {
    queue.push(async () => {
      active++;
      try {
        // Visit each mirror once, starting from the one that last served us.
        const order = ESPLORA_MIRRORS.map((_, i) => (preferred + i) % ESPLORA_MIRRORS.length);
        let lastErr = null;
        for (let mi = 0; mi < order.length; mi++) {
          const idx = order[mi];
          const target = onMirror(url, ESPLORA_MIRRORS[idx]);
          const lastMirror = mi === order.length - 1;
          for (let attempt = 0; ; attempt++) {
            let res;

              res = await fetch(target, opts);
            } catch (e) {

              // with backoff, then fall through to the next mirror.
              lastErr = e;
              if (attempt >= MAX_RETRIES) break;
              await sleep((2 ** attempt) * 500 + Math.random() * 250);
              continue;
            }
            if (!RETRYABLE.has(res.status) || attempt >= MAX_RETRIES) {
              // A definitive answer (ok, 404, …) ends the search. A still-
              // throttled response with a mirror left in reserve falls through
              // to try it; on the last mirror we surface it as-is.
              if (RETRYABLE.has(res.status) && !lastMirror) break;
              preferred = idx; // this mirror is serving us -- stick with it
              resolve(res);

            const backoff = Number.isFinite(retryAfter) && retryAfter > 0
              ? retryAfter * 1000

          preferred = (idx + 1) % ESPLORA_MIRRORS.length;

        reject(lastErr || new Error('All Esplora mirrors failed'));

  });
})();

// Esplora's block hash, like a txid, is displayed byte-reversed relative to its
// internal (wire/hashing) byte order -- see btc-tx.js's txid handling. Reverse
// it back before encoding so the prose carries the hash's actual bytes.

// and longer for higher-difficulty blocks -- become TRAILING zero bytes once
// reversed into internal order. They carry no information, so drop them before
// encoding rather than spending payload words on them.

// difficulty -- and the identity-hash mark (⌘, OP_HASH256: the double-SHA256
// that produced this hash) carries the remaining m = 256 - n bits, which are

// with -- which is what buys the exact n: the trim underneath is byte-granular

// The current block's info + full ordered txid list, plus which transaction
// within it is on screen -- fetched once per block, so stepping between

let state = null;   // { hash, height, block, txids, index }

// with the search box and with the curated contents' own `id:` field. Its depth
// picks the page: a §section opens that section; a chapter its own page (-1); a
// book its leaf (-2); a bare volume its leaf (-3), the height always being the

// which picks an output within the section rather than another section.

// A chapter that opens a book gets a book leaf (index -2) ahead of its
// chapter page, and one that opens a volume a volume leaf (-3) ahead of that,

      const sp = spends[i];

      try {
        const { height, pos, wits } = await resolveCitation(sp.txid);
        if (gen !== renderGen || height === null) return;   // confirmed a moment ago, not yet provable: no cell rather than a wrong one

// output index (e.g. "XII 37 184 §17.2"), the whole of which links to that
// section.

  // referenceOf): the section it names holds only as long as the queue does.

// most often the CPFP parent riding in the very same projected chapter as
// the section being read. Look for it in the manifests already in hand --
// the chapter on screen first, then any other kept on the current
// projection snapshot -- and cite where it sits. Nothing is fetched here: a
// citation is an annotation on the page, not a reason to pull a megabyte of
// draft down a second websocket.
async function projectedCitation(txid) {
  if (tipHeight === null) return null;
  const tries = [];
  if (state && state.projected && state.manifest) tries.push([state.projIndex, Promise.resolve(state.manifest)]);
  for (const [k, p] of (projectedCache?.manifests ?? [])) tries.push([k, p]);
  for (const [k, p] of tries) {
    let manifest;
    try { manifest = await p; } catch { continue; }
    const pos = manifest.findIndex((t) => t.txid === txid);
    if (pos >= 0) return { height: tipHeight + 1 + k, pos };
  }
  return null;
}

// Fill each pending citation cell once its reference resolves; skip if the
// reader has since paged to another section (gen no longer current).
// Resolves to each input's spent value in pending order (satoshis; null
// where the book could not price it) -- the closing balance line sums them.
async function resolveCitations(pending, gen) {
  return Promise.all(pending.map(async ({ citeBody, cite, amtVal, txid, vout }) => {
    try {
      const { height, pos, outputs } = await resolveCitation(txid);
      if (gen !== renderGen) return null;
      // Mined: the settled section. Unmined: wherever the queue currently
      // drafts it, cited with the expected mark. Neither one prints a txid --
      // a hash is not a reference, and the page keeps every hash where the
      // rest of them live, in the hover label.
      const place = height !== null ? { height, pos } : await projectedCitation(txid);
      if (gen !== renderGen) return null;
      cite.classList.remove('resolving');
      if (place) {
        renderCitation(citeBody, place.height, place.pos, vout);
        cite.title = height !== null ? `${txid}:${vout}`
          : `${txid}:${vout} — unmined: cited where the queue drafts it now`;
      } else {
        // Unmined and outside every chapter the queue has drafted: there is
        // no reference to print, so the cell says exactly that.
        citeBody.textContent = `§… .${vout}`;
        cite.classList.add('cite-unresolved');
        cite.title = `${txid}:${vout} — unmined, and in no drafted chapter: it has no reference yet`;
      }
      // The amount of the referenced output -- what this input spends -- sits on
      // the line beneath the reference, after the sequence mark, in parentheses:
      // the mark for value flowing IN, where an output's amount (value flowing
      // out) stands bare. A draft's outputs read the same as a mined one's.
      if (amtVal && outputs && outputs[vout]) {
        amtVal.textContent = `(${formatBtc(outputs[vout].value)})`;
        amtVal.title = `the amount this input spends: ${groupDigits(String(outputs[vout].value))} satoshis`;
      }
      return outputs && outputs[vout] ? outputs[vout].value : null;
    } catch (e) {
      if (gen !== renderGen) return null;
      citeBody.textContent = `§… .${vout}`;
      cite.classList.remove('resolving');
      cite.classList.add('cite-unresolved');
      cite.title = `${txid}:${vout} — reference could not be resolved`;
      return null;
    }
  }));
}

// A block's ordered txid list, memoized by block hash. It's the heaviest part
// of a block's metadata -- every transaction hash -- so it's fetched on its own
// and only when needed: opening one transaction by id doesn't need it (its section
// comes from the merkle proof), only stepping through the block does.
const txidsCache = new Map();
function fetchTxids(hash) {
  if (!txidsCache.has(hash)) {
    txidsCache.set(hash, (async () => {
      const kept = await storeGet('txids', hash);   // a block's list is immutable by its hash
      if (kept) return kept;
      const res = await esploraFetch(`${ESPLORA}/block/${hash}/txids`);
      if (!res.ok) throw new Error(`Esplora returned ${res.status} fetching the transaction list.`);
      const txids = await res.json();
      storePut('txids', hash, txids);
      return txids;
    })().catch((e) => { txidsCache.delete(hash); throw e; }));
  }
  return txidsCache.get(hash);
}
// Populate `st.txids` on first use, so Prev/Next has the list to step through.
// A projected chapter's list is its manifest -- the websocket's template-
// ordered transactions -- and the manifest's length supersedes the REST
// figure's nTx (the queue moved between the two reads).
async function ensureTxids(st) {
  if (!st.txids) {
    if (st.projected) {
      st.manifest = await projectedManifest(st.projIndex);
      st.txids = st.manifest.map((t) => t.txid);
      st.txCount = st.txids.length;
    } else {
      st.txids = await fetchTxids(st.hash);
    }
  }
  return st.txids;
}

// The immutable core of a block's metadata -- its info and header, everything
// but the txid list. A block hash permanently determines this content, so it's
// memoized by hash: revisiting a block (e.g. stepping Next then back) re-fetches
// nothing. Keyed by hash, not height, so a tip reorg can never serve stale data
// -- a different block is a different hash. The shared objects are read-only.
const blockCoreCache = new Map();   // hash -> Promise<{ hash, height, block, txCount, header, headerVerified }>
function loadBlockCore(hash) {
  if (!blockCoreCache.has(hash)) {
    blockCoreCache.set(hash, (async () => {
      // The archive keeps the fetched ingredients (info json + header hex);
      // the parse and the hash check are recomputed on every load, so a kept
      // block re-earns its verification exactly like a fresh one.
      const build = async (block, headerHex) => {
        // Parsed from the raw 80-byte header, not trusted from the JSON --
        // same self-parsed, self-verified stance as a transaction's txid.
        const header = parseBlockHeader(headerHex);
        const headerVerified = (await computeBlockHash(headerHex)) === hash;
        return { hash, height: block.height, block, txCount: block.tx_count, header, headerVerified };
      };
      const kept = await storeGet('blocks', hash);
      if (kept) return build(kept.block, kept.headerHex);
      const [blockRes, headerRes] = await Promise.all([
        esploraFetch(`${ESPLORA}/block/${hash}`),
        esploraFetch(`${ESPLORA}/block/${hash}/header`),
      ]);
      if (!blockRes.ok) throw new Error(`Esplora returned ${blockRes.status} fetching block info.`);
      if (!headerRes.ok) throw new Error(`Esplora returned ${headerRes.status} fetching the block header.`);
      const block = await blockRes.json();
      const headerHex = (await headerRes.text()).trim();
      storePut('blocks', hash, { block, headerHex });
      return build(block, headerHex);
    })().catch((e) => { blockCoreCache.delete(hash); throw e; }));
  }
  return blockCoreCache.get(hash);
}

// `withTxids: false` leaves the (heavy) txid list unfetched -- used when opening
// a single transaction, whose section index comes from its merkle proof instead.
// The block's transaction count still comes from its info (tx_count), so section
// bounds and Next work without the list. Core (info + header) and the txid list
// are each memoized, so a re-visit re-fetches neither.
async function loadBlockMeta(hash, { withTxids = true } = {}) {
  const [core, txids] = await Promise.all([
    loadBlockCore(hash),
    withTxids ? fetchTxids(hash) : Promise.resolve(null),
  ]);
  return { ...core, txids };
}

// height -> block hash, memoized for heights safely below the tip. This is
// what makes a prefetched swipe commit with zero network: the block core is
// already cached by hash, and this removes the last repeated lookup. Heights
// within 6 blocks of the tip are never cached, so a reorg can't pin a stale
// mapping (past 6 confirmations a reorg is not a practical concern).
const hashByHeight = new Map();
async function resolveBlockHash(height) {
  const h = Number(height);
  if (hashByHeight.has(h)) return hashByHeight.get(h);
  // The archive answers under the same six-confirmation rule the memo keeps:
  // a mapping is only ever written safely below the tip, so a kept one is
  // final and serves without the network.
  const kept = await storeGet('heights', h);
  if (kept) { hashByHeight.set(h, kept); return kept; }
  const res = await esploraFetch(`${ESPLORA}/block-height/${height}`);
  if (!res.ok) throw Object.assign(
    new Error(res.status === 404 ? `No block at height ${height}.` : `Esplora returned ${res.status}.`),
    { notFound: res.status === 404 });
  const hash = (await res.text()).trim();
  if (tipHeight !== null && h <= tipHeight - 6) {
    hashByHeight.set(h, hash);
    storePut('heights', h, hash);
  }
  return hash;
}
async function loadBlockByHeight(height, opts) {
  return loadBlockMeta(await resolveBlockHash(height), opts);
}

// A block's info JSON by height (no txid list), memoized: the light metadata
// (tx_count, timestamp) that nav labels and the volume/book leaves read.
const infoByHeight = new Map();
function loadBlockInfoByHeight(height) {
  if (!infoByHeight.has(height)) {
    infoByHeight.set(height, (async () => {
      const bres = await esploraFetch(`${ESPLORA}/block/${await resolveBlockHash(height)}`);
      if (!bres.ok) throw new Error(`Esplora returned ${bres.status}.`);
      return bres.json();
    })().catch((e) => { infoByHeight.delete(height); throw e; }));
  }
  return infoByHeight.get(height);
}
// The Previous label when it steps back across a block boundary: the section
// it lands on is the prior block's last transaction, whose §number is that
// block's tx count.
const loadBlockTxCount = (height) => loadBlockInfoByHeight(height).then((b) => b.tx_count);
// A block's timestamp, for the leaves' recorded date ranges.
const loadBlockStamp = (height) => loadBlockInfoByHeight(height).then((b) => b.timestamp);

// The six-confirmation rule for banking a page anchor (btc-pages.js): only a
// safely buried height's running count is final -- the same rule the
// height→hash archive keeps.
const anchorFinalAt = (h) => tipHeight !== null && h <= tipHeight - 6;

// Fill the running head's folio -- the section's page number in the chain's
// running count of transactions -- once the block's anchor resolves (banked,
// derived, or one census call; see btc-pages.js). The folio element is
// persistent chrome, so a fill that outlives its section (gen no longer
// current) is dropped. When no census endpoint answers, the folio stays
// absent: an annotation, never a gate on reading.
async function fillFolio(el, gen) {
  const h = state.height, idx = state.index, count = state.txCount;
  let anchor;
  // A projected § can only take a provisional folio, and only by arithmetic:
  // the census cannot be asked about blocks that don't exist yet (a range
  // query past the tip answers with the sum through the tip -- silently
  // wrong for anything deeper). The tip's own fillFolio banks tip+1, so
  // reading onward into the projection numbers itself; an unknown anchor
  // leaves the corner blank.
  if (state.projected) {
    anchor = peekAnchor(h);
    if (anchor === null) return;
    bankAnchor(h + 1, anchor + count, false);
    if (gen !== renderGen) return;
    const page = anchor + idx + 1;
    el.textContent = String(page);
    el.title = `page ${formatPage(page)} — provisional: the page this transaction would take if the queue holds`;
    return;
  }
  try { anchor = await pageAnchor(h, anchorFinalAt(h)); }
  catch { return; }   // census unreachable -- try again on a later visit
  // With this block's anchor in hand, the next block's is pure arithmetic --
  // bank it so reading onward (across the chapter turn into §1) never asks
  // the census. The backward derivation rides labelNav's previous-count
  // fetch, which is the moment the prior block's tx_count is known.
  bankAnchor(h + 1, anchor + count, anchorFinalAt(h + 1));
  if (gen !== renderGen) return;
  const page = anchor + idx + 1;
  // The folio prints bare -- digits alone, unpunctuated; the hover title
  // carries the readable form and the explanation.
  el.textContent = String(page);
  el.title = `page ${formatPage(page)} — transaction ${formatPage(page)} of the chain: pages count every transaction since genesis, in block order`;
}

// The chain tip height, as plain text from Esplora. Opens the book at the most
// recent chapter when the reader arrives without a specific target.
async function loadTipHeight() {
  const res = await esploraFetch(`${ESPLORA}/blocks/tip/height`);
  if (!res.ok) throw new Error(`Esplora returned ${res.status}.`);
  return (await res.text()).trim();
}

// ── Projected chapters: the book past the tip ─────────────────────────────
// The mempool, cut into template-sized blocks the way a miner would take
// them (highest package fee rate first, CPFP-aware), pages as provisional
// chapters at heights tip+1, tip+2, … Their figures come from a
// mempool.space-backed mirror's /v1/fees/mempool-blocks; their manifests --
// each projected block's transactions in template order -- from the same
// backend's websocket, since no REST route carries them. A projected
// chapter has no hash and no header: those are exactly what mining writes.
const MVB = 1_000_000;   // one block's worth of virtual bytes

// The v1 endpoints only answer on a mempool.space-backed mirror, and
// esploraFetch treats a 404 as definitive (no failover), so this walks the
// mirrors itself. The mirror that answers is remembered: its host also
// serves the manifest websocket.
let mempoolBackendBase = null;
async function mempoolBackendFetch(path) {
  const order = ESPLORA_MIRRORS.map((_, i) => (preferred + i) % ESPLORA_MIRRORS.length);
  for (const idx of order) {
    const base = ESPLORA_MIRRORS[idx];
    try {
      const res = await fetch(`${base}${path}`);
      if (res.ok) { mempoolBackendBase = base; return await res.json(); }
    } catch { /* try the next mirror */ }
  }
