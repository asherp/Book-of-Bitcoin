      axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
    const ch = $('page-slide');
    if (axis === 'v') {
      // Level follow: inside the frame the page tracks the finger, damped --
      // pulling down leads toward the parent level, pushing up toward the
      // child. On a tall page this only engages from the scroll boundaries
      // (elsewhere the drag is scrolling); outside the frame we do nothing.
      const engaged = inFrame && (gesture.carouselFirst || (atTop && dy > 0) || (atBottom && dy < 0));
      if (!engaged) return;
      const damp = canStepVertical(dy < 0 ? 1 : -1) ? 0.5 : 0.18;
      ch.style.transition = 'none';
      ch.style.transform = `translateY(${dy * damp}px)`;
      return;
    }
    // Follow the finger; a direction with no neighbour -- or one whose data
    // hasn't finished prefetching -- only rubber-bands.
    const damp = canStep(dx < 0 ? 1 : -1) ? 1 : 0.25;
    ch.style.transition = 'none';
    ch.style.transform = `translateX(${dx * damp}px)`;
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (sx === null || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    const dt = performance.now() - st;
    sx = null;
    const dir = dx < 0 ? 1 : -1;   // swiping left turns to the next page
    const turn = dt <= 600 && Math.abs(dx) >= 60 && Math.abs(dy) <= Math.abs(dx) * 0.6;
    const vdir = dy < 0 ? 1 : -1;  // pushing up descends a level, pulling down ascends
    const vEngaged = inFrame && (gesture.carouselFirst || (vdir < 0 && atTop) || (vdir > 0 && atBottom));
    const vTurn = vEngaged && dt <= 600 && Math.abs(dy) >= 70 && Math.abs(dx) <= Math.abs(dy) * 0.6;
    if (turn && !pendingSlide && canStep(dir)) {
      if (REDUCED_MOTION) swipeStep(dir);
      else slideOutAndStep(dir);
    } else if (vTurn && !pendingSlide && canStepVertical(vdir)) {
      if (REDUCED_MOTION) swipeStepVertical(vdir);
      else slideOutAndStep(vdir, 'y');
    } else if (!pendingSlide) {
      snapBack();
    }
  }, { passive: true });
  document.addEventListener('touchcancel', () => { sx = null; if (!pendingSlide) snapBack(); }, { passive: true });
})();

// ── The same turns, from a keyboard ───────────────────────────────────────
// A desk has no finger to swipe with, so the arrow keys carry the gestures'
// four turns unchanged: left and right turn the page at the current level,
// up ascends a level and down descends -- the reader's own directions, even
// though the swipe that means "descend" is a push UP. Every rule the
// gestures keep is kept here. The horizontal pair stops where the swipe
// rubber-bands (no neighbour at this level); the vertical pair defers to the
// scroll exactly as the vertical swipe does, turning only on a page short
// enough not to scroll or from the boundary the turn moves away from -- so
// arrowing down a long chapter reads it to the foot first and turns on the
// next press.
//
// One deliberate difference: a swipe toward a neighbour whose data is still
// prefetching only rubber-bands, and the finger tries again a moment later.
// A key that did nothing would just read as broken, so it turns anyway by
// the header steppers' route -- fetching on demand, without the carousel
// slide the prefetch pays for.
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || e.repeat) return;
  const horizontal = e.key === 'ArrowLeft' || e.key === 'ArrowRight';
  const vertical = e.key === 'ArrowUp' || e.key === 'ArrowDown';
  if (!horizontal && !vertical) return;
  if (!state || pendingSlide) return;
  // Fields, scrolling regions and the popovers keep their own arrow keys --
  // the same surfaces the swipe hands back to whatever is under the finger.
  const t = e.target;
  if (t && t.closest && t.closest('input, textarea, select, [contenteditable], .pattern-scroll, .hash-menu, .settings-panel, .nav-sheet-body')) return;
  if (!settingsPanel.classList.contains('hidden')) return;
  if (!$('hash-menu').classList.contains('hidden')) return;

  if (horizontal) {
    const dir = e.key === 'ArrowRight' ? 1 : -1;   // right turns forward, as a leftward swipe does
    if (!navAvailable(dir) && !(dir < 0 && atFrontMatterEdge()) && !(dir > 0 && atAppendixEdge())) return;
    e.preventDefault();
    if (canStep(dir) && !REDUCED_MOTION) slideOutAndStep(dir);
    else swipeStep(dir);
    return;
  }

  const dir = e.key === 'ArrowDown' ? 1 : -1;      // down descends, up ascends
  if (!levelTarget(dir)) return;
  const atTop = window.scrollY <= 2;
  const atBottom = window.scrollY >= document.documentElement.scrollHeight - window.innerHeight - 2;
  if (!(gesture.carouselFirst || (dir < 0 && atTop) || (dir > 0 && atBottom))) return;
  e.preventDefault();
  if (canStepVertical(dir) && !REDUCED_MOTION) slideOutAndStep(dir, 'y');
  else swipeStepVertical(dir);
});

// ── Pinch: the type sizes ─────────────────────────────────────────────────
// Two fingers on the reading matter set the type size of the region under
// them, the e-reader way: the text reflows at the new size instead of the
// page magnifying into a pannable bitmap. The gesture writes the same
// per-region scales as the settings rows (btc-fontscale.js), quantized to
// 0.05 so the page reflows a handful of times per pinch, not per frame. The
// content under the fingers is held stationary through each reflow by
// re-scrolling against an anchor element sampled at the pinch's centre.
// Scoped to the page frame and the notation sheet -- whose touch-action
// already excludes native pinch-zoom -- so a pinch on the chrome around them
// still zooms the browser natively.
//
// Region resolution: both fingers on the notation sheet -> notation; both on
// the commentary sheet -> commentary, each sheet setting the region it is
// actually written in; both in the witness footnotes -> body (the footnotes'
// ratio to the body is the weight discount, held fixed, so a pinch there
// scales the page whole); both inside one of the manuscript
// grid's margin columns -> margins, but ONLY where that grid actually lays
// the margins out as columns -- below 560px the layout collapses them inline
// with the prose (see the .tx-flow media query), there is no strip of screen
// that IS the margin, and a pinch there could only be aimed at the text as a
// whole. The gate reads the live grid geometry rather than the viewport, so
// it tracks the layout exactly: a phone turned landscape regains its margin
// columns and their pinch with them. Everything else -> body.
(() => {
  const SURFACES = '#page-frame, .nav-sheet-body';
  const on = (t, sel) => !!(t && t.closest && t.closest(sel));
  const LABELS = { body: 'Text', margins: 'Margins', notation: 'Notation', commentary: 'Commentary' };
  let d0 = 0, s0 = 1, region = 'body', anchor = null, anchorTop = 0, hideTimer = null;
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const toast = () => {
    const el = $('fontscale-toast');
    el.textContent = `${LABELS[region]} ${Math.round(fontScale(region) * 100)}%`;
    el.classList.remove('hidden');
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(() => el.classList.add('hidden'), 700);
  };
  // The margin columns' screen bands, or null while the grid is collapsed to
  // a single column. All .tx-flow grids share the page's content width, so
  // any one of them answers for the column geometry.
  const marginBands = () => {
    const flow = document.querySelector('#ch-paragraphs .tx-flow');
    if (!flow) return null;
    // The computed value interleaves the grid's line names with the track
    // sizes ("[left] 123px [body] ..."); only the px tracks count.
    const cols = getComputedStyle(flow).gridTemplateColumns.split(' ').filter((c) => c.endsWith('px'));
    if (cols.length !== 3) return null;   // collapsed: margins ride inline with the prose
    const w1 = parseFloat(cols[0]), w3 = parseFloat(cols[2]);
    if (!(w1 > 0) || !(w3 > 0)) return null;
    const r = flow.getBoundingClientRect();
    return { left: [r.left, r.left + w1], right: [r.right - w3, r.right] };
  };
  const regionOf = (a, b) => {
    if (on(a.target, '.notation-body') && on(b.target, '.notation-body')) return 'notation';
    if (on(a.target, '.commentary-body') && on(b.target, '.commentary-body')) return 'commentary';
    if (on(a.target, '#ch-paragraphs') && on(b.target, '#ch-paragraphs')) {
      const bands = marginBands();
      const inBand = (x, band) => x >= band[0] && x <= band[1];
      if (bands && ((inBand(a.clientX, bands.left) && inBand(b.clientX, bands.left)) ||
                    (inBand(a.clientX, bands.right) && inBand(b.clientX, bands.right)))) return 'margins';
    }
    return 'body';
  };
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 2) return;
    if (!on(e.touches[0].target, SURFACES) || !on(e.touches[1].target, SURFACES)) return;
    e.preventDefault();   // Safari starts a viewport zoom from here otherwise
    // A second finger landing mid-swipe: abandon the slide follow cleanly
    // (the swipe tracker has already reset itself on this same event).
    const ch = $('page-slide');
    ch.style.transition = ''; ch.style.transform = ''; ch.style.opacity = '';
    d0 = dist(e.touches);
    region = regionOf(e.touches[0], e.touches[1]);
    s0 = fontScale(region);
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    anchor = document.elementFromPoint(cx, cy);
    anchorTop = anchor ? anchor.getBoundingClientRect().top : 0;
    toast();
  }, { passive: false });
  document.addEventListener('touchmove', (e) => {
    if (!d0 || e.touches.length !== 2) return;
    e.preventDefault();
    const want = Math.round((s0 * dist(e.touches) / d0) * 20) / 20;   // 0.05 quanta
    if (want !== fontScale(region)) {
      setFontScale(region, want);
      // Reflow done (getBoundingClientRect forces layout): put the anchor
      // back where the fingers found it.
      if (anchor && anchor.isConnected) {
        const dy = anchor.getBoundingClientRect().top - anchorTop;
        if (dy) window.scrollBy(0, dy);
      }
      reflectFontScale();
    }
    toast();
  }, { passive: false });
  const done = (e) => { if (d0 && e.touches.length < 2) { d0 = 0; anchor = null; } };
  document.addEventListener('touchend', done, { passive: true });
  document.addEventListener('touchcancel', done, { passive: true });
  // Safari's proprietary gesture events drive its viewport zoom on paths
  // touch-action doesn't govern; cancel them on the same surfaces.
  for (const type of ['gesturestart', 'gesturechange']) {
    document.addEventListener(type, (e) => { if (on(e.target, SURFACES)) e.preventDefault(); });
  }
})();

// ── Data-source picker ────────────────────────────────────────────────────
const endpointSel = $('endpoint-select');
const hostOf = (url) => { try { return new URL(url).host; } catch { return url; } };

let endpointMsgTimer = null;
function setEndpointMsg(text, isErr) {
  const el = $('endpoint-msg');
  el.textContent = text || '';
  el.classList.toggle('hidden', !text);
  el.classList.toggle('err', !!isErr);
  if (endpointMsgTimer) { clearTimeout(endpointMsgTimer); endpointMsgTimer = null; }
  if (text && !isErr) endpointMsgTimer = setTimeout(() => el.classList.add('hidden'), 2600);
}

function persistCustomMirrors() {
  try { localStorage.setItem(ENDPOINTS_KEY, JSON.stringify(customMirrors)); } catch {}
}

// Repaint the dropdown from the current mirror list and selection.
function renderEndpoints() {
  const current = ESPLORA_MIRRORS[preferred];
  endpointSel.innerHTML = '';
  for (const m of allMirrors()) {
    const opt = document.createElement('option');
    opt.value = m.url;
    opt.textContent = `${m.label} — ${hostOf(m.url)}`;
    endpointSel.append(opt);
  }
  endpointSel.value = current;
  // "Remove" only applies to a custom (non-built-in) selection.
  $('endpoint-remove').disabled = !customMirrors.some((m) => m.url === current);
}

// Make `url` the preferred source. `reload` re-runs the current lookup so the
// change takes effect immediately (e.g. retrying a load that just rate-limited).
function selectEndpoint(url, { reload = true } = {}) {
  syncMirrors();
  const i = ESPLORA_MIRRORS.indexOf(url);
  if (i < 0) return;
  preferred = i;
  try { localStorage.setItem(SELECTED_KEY, url); } catch {}
  renderEndpoints();
  setEndpointMsg(`Data source: ${hostOf(url)}`);
  // Reload the current chapter/section from state (not the input box, which Next/
  // Prev navigation doesn't update) so the new source takes effect at once.
  if (reload && state) openLookup(String(state.height), state.index);
}

function closeAddForm() {
  $('endpoint-add-row').classList.add('hidden');
  $('endpoint-label').value = '';
  $('endpoint-url').value = '';
  setEndpointMsg('');
}

function saveCustomEndpoint() {
  let url = $('endpoint-url').value.trim();
  let label = $('endpoint-label').value.trim();
  if (!url) { setEndpointMsg('Enter an endpoint URL.', true); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  try { new URL(url); } catch { setEndpointMsg('That doesn’t look like a valid URL.', true); return; }
  url = url.replace(/\/+$/, ''); // strip trailing slash so onMirror prefixes match
  if (allMirrors().some((m) => m.url === url)) { selectEndpoint(url); closeAddForm(); return; }
  customMirrors.push({ label: label || hostOf(url), url });
  persistCustomMirrors();
  syncMirrors();
  closeAddForm();
  selectEndpoint(url);
}

endpointSel.addEventListener('change', () => selectEndpoint(endpointSel.value));
$('endpoint-add').addEventListener('click', () => {
  const row = $('endpoint-add-row');
  row.classList.toggle('hidden');
  if (!row.classList.contains('hidden')) $('endpoint-url').focus();
});
$('endpoint-cancel').addEventListener('click', closeAddForm);
$('endpoint-save').addEventListener('click', saveCustomEndpoint);
$('endpoint-url').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveCustomEndpoint(); });
$('endpoint-label').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('endpoint-url').focus(); });
$('endpoint-remove').addEventListener('click', () => {
  const current = ESPLORA_MIRRORS[preferred];
  const idx = customMirrors.findIndex((m) => m.url === current);
  if (idx < 0) return;
  customMirrors.splice(idx, 1);
  persistCustomMirrors();
  syncMirrors();
  selectEndpoint(BUILTIN_MIRRORS[0].url); // fall back to the primary built-in
});

renderEndpoints();

// ── Text size ─────────────────────────────────────────────────────────────
// One settings row per region, stepping the same per-region scales the pinch
// gesture writes (btc-fontscale.js): applied live, persisted, and read
// wherever the book's reading matter is set -- including the notation key
// here and at rest on the front matter's sigla leaf, and a passage's
// commentary here and on the Ledger's leaves. A region that still
// follows the body shows its value dimmed; stepping it splits it off; Reset
// rejoins everything at 100%.
function reflectFontScale() {
  for (const r of REGIONS) {
    const el = document.querySelector(`[data-fs-v="${r}"]`);
    el.textContent = Math.round(fontScale(r) * 100) + '%';
    el.classList.toggle('fs-linked', r !== 'body' && !fontScaleDiverged(r));
  }
  for (const btn of document.querySelectorAll('[data-fs]')) {
    const s = fontScale(btn.dataset.fs);
    btn.disabled = Number(btn.dataset.fsD) < 0 ? s <= FONT_SCALE_MIN : s >= FONT_SCALE_MAX;
  }
  $('fontscale-reset').disabled = REGIONS.every((r) => fontScale(r) === 1 && !fontScaleDiverged(r));
}
for (const btn of document.querySelectorAll('[data-fs]')) {
  btn.addEventListener('click', () => {
    const r = btn.dataset.fs;
    setFontScale(r, fontScale(r) + Number(btn.dataset.fsD) * FONT_SCALE_STEP);
    reflectFontScale();
  });
}
$('fontscale-reset').addEventListener('click', () => { resetFontScales(); reflectFontScale(); });
reflectFontScale();

// ── Settings popover ──────────────────────────────────────────────────────
// The masthead "Settings" link toggles a small popover holding the data-source
// picker; it dismisses on an outside click or Escape.
const settingsLink = $('settings-link');
const settingsPanel = $('settings-panel');
function closeSettings() {
  settingsPanel.classList.add('hidden');
  settingsLink.setAttribute('aria-expanded', 'false');
  closeAddForm();   // collapse the add-endpoint form when the popover closes
}
settingsLink.addEventListener('click', (e) => {
  e.preventDefault();
  closeLang();   // one masthead popover at a time
  const nowHidden = settingsPanel.classList.toggle('hidden');
  settingsLink.setAttribute('aria-expanded', nowHidden ? 'false' : 'true');
  if (nowHidden) closeAddForm();
});
document.addEventListener('click', (e) => {
  if (settingsPanel.classList.contains('hidden')) return;
  if (settingsPanel.contains(e.target) || settingsLink.contains(e.target)) return;
  closeSettings();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !settingsPanel.classList.contains('hidden')) closeSettings(); });

// ── Language popover ──────────────────────────────────────────────────────
// The masthead "Language" link: which of the engine's languages the book's
// prose is set in (glossia-msg.js's MSG_LANGS -- the same list the message
// pipeline renders into and detects from). The choice is typography, not
// content: the payload words carry the same bytes whatever the tongue, so
// switching re-renders the page in hand and persists like the text sizes do.
const langLink = $('lang-link');
const langPanel = $('lang-panel');
function closeLang() {
  langPanel.classList.add('hidden');
  langLink.setAttribute('aria-expanded', 'false');
}
function renderLangRows() {
  const rows = $('lang-rows');
  rows.innerHTML = '';
  for (const l of MSG_LANGS) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'lang-row' + (l.id === bookLang() ? ' current' : '');
    btn.setAttribute('aria-pressed', l.id === bookLang() ? 'true' : 'false');
    const name = document.createElement('span');
    name.textContent = l.label;
    const mark = document.createElement('span');
    mark.className = 'lang-mark';
    mark.textContent = '●';
    btn.append(name, mark);
    btn.addEventListener('click', () => { applyBookLang(l.id); });
    rows.append(btn);
  }
}
async function applyBookLang(id) {
  closeLang();
  if (id === bookLang()) return;
  setBookLang(id);
  renderLangRows();
  localizeChrome();   // the chrome follows, except into Latin (see setBookLang)
  // Everything composed so far was composed in the old language: flush the
  // section cache and re-render the page in hand. The prose memo inside
  // encodeSeedPhrase is keyed by language, so it needs no clearing -- a
  // switch back finds its earlier encodes still warm.
  fieldsCache.clear();
  neighborReady = { '-1': false, '1': false };   // neighbours re-warm in the new language
  if (state) await showCurrentTx();
}
langLink.addEventListener('click', (e) => {
  e.preventDefault();
  closeSettings();   // one masthead popover at a time
  const nowHidden = langPanel.classList.toggle('hidden');
  langLink.setAttribute('aria-expanded', nowHidden ? 'false' : 'true');
});
document.addEventListener('click', (e) => {
  if (langPanel.classList.contains('hidden')) return;
  if (langPanel.contains(e.target) || langLink.contains(e.target)) return;
  closeLang();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !langPanel.classList.contains('hidden')) closeLang(); });
renderLangRows();

// ── The chrome's words ────────────────────────────────────────────────────
// Re-say the static chrome in the UI language (btc-strings.js): nav items,
// panel furniture, the hash menu, the notation key's scope line, the crumb
// words. Idempotent — each element remembers its English on first pass — so
// it runs once at load and again on every language switch. Dynamic strings
// (status lines, the section's meta lines) go through tr() where they are
// built instead. Choosing Latina changes none of this: the chrome keeps the
// last modern tongue (see setBookLang).
function localizeChrome() {
  for (const el of [
    ...document.querySelectorAll('.masthead .home a'),
    ...document.querySelectorAll('#settings-panel .settings-title, #lang-panel .settings-title'),
    ...document.querySelectorAll('.fs-label'),
    $('fontscale-reset'), $('endpoint-add'), $('endpoint-remove'), $('endpoint-save'), $('endpoint-cancel'),
    ...document.querySelectorAll('#hash-menu .hash-menu-item, #hash-menu-title .hash-title-row button'),
    ...document.querySelectorAll('.section-nav summary'),
    document.querySelector('.key-scope-note'),
    document.querySelector('.key-scope-link'),
    $('ch-appendix-link'),
  ]) localizeText(el);
  // The crumb words ride as leading text nodes before their number spans.
  for (const [id, en] of [['ch-volume-link', 'Volume'], ['ch-book-link', 'Book']]) {
    const node = $(id) && $(id).firstChild;
    if (node && node.nodeType === Node.TEXT_NODE) node.nodeValue = `${tr(en)} `;
  }
  localizeAttr($('endpoint-label'), 'placeholder');
  localizeAttr($('hash-title-input'), 'placeholder');
  localizeAttr(document.querySelector('.section-nav .commentary summary'), 'title');
}
localizeChrome();

// ── Hash menu + bookmarks ─────────────────────────────────────────────────
// Clicking any Glossia-encoded hash opens a small menu (Copy hex / Bookmark).
// Bookmarks -- navigable hashes the reader wants to return to (block hashes,
// previous-block hashes, txids) -- persist in localStorage and list in the card.
// Each carries a reader-supplied title, which a table of contents will draw on.
const BOOKMARKS_KEY = 'glossia-btc-bookmarks';
const readBookmarks = () => {
  try { const v = JSON.parse(localStorage.getItem(BOOKMARKS_KEY)); return Array.isArray(v) ? v : []; }
  catch { return []; }
};
let bookmarks = readBookmarks();
// A bookmark is keyed by what it names. A hash names itself; an output names
// a hash and one of its vouts, so the two coordinates make the key -- and a
// txid bookmark and a bookmark of that transaction's output 0 stay distinct.
// A leaf -- a volume's or a book's -- names a span, not a hash: it is keyed by
// the hash of the block its span opens, marked with which span it is, so that
// keeping Volume III and keeping the chapter that opens it stay two bookmarks
// rather than one. Legacy bookmarks carry neither vout nor page and key as
// before, so nothing saved before this reads differently now.
const bookmarkKey = (hex, sub = null, page = null) =>
  (page ? `${page}@${hex}` : sub == null ? hex : `${hex}:${sub}`);
// The sub-coordinate a bookmark or a menu entry names within its hash: an
// output's vout (a number), or an input's witness as w<vin> -- distinct key
// spaces, so keeping output 3 and keeping input 3's witness stay two keeps.
const bmSubOf = (x) => (x.vin != null ? `w${x.vin}` : (x.vout ?? null));
const keyOf = (b) => bookmarkKey(b.hex, bmSubOf(b), b.page ?? null);
const isBookmarked = (hex, vout = null, page = null) => bookmarks.some((b) => keyOf(b) === bookmarkKey(hex, vout, page));
const saveBookmarks = () => { try { localStorage.setItem(BOOKMARKS_KEY, JSON.stringify(bookmarks)); } catch {} };

// The curated entries live in notables.yaml, loaded through btc-contents.js and
// shared with the table-of-contents page; they lead the Bookmarks list here.

// The reference a bookmarkable hash points at, taken from the section on screen:
// a txid is a section within this block; the block hash is this whole chapter.
// Returns null when it can't be placed (no block loaded) -- the caller then
// declines the bookmark rather than saving one whose citation can't be resolved.
function entryPlacement(entry) {
  if (!state || !Number.isInteger(state.height)) return null;
  if (state.projected) return null;   // a projected page has no settled reference to bookmark yet
  // A leaf's height is already its span's first block (openLeafAt), so the
  // span is placed by that height and the name of the level it stands at.
  if (entry.page) return { height: state.height, pos: null, page: entry.page };
  if (entry.label === 'output') return { height: state.height, pos: state.index, vout: entry.vout };
  if (entry.label === 'witness') return { height: state.height, pos: state.index, vin: entry.vin, wn: entry.wn };
  if (entry.label === 'transaction id') return { height: state.height, pos: state.index };
  return { height: state.height, pos: null };   // a block hash -- this chapter
}

// Add (or retitle) a bookmark, then refresh the contents and every on-page flag.
// A new bookmark is stored with its resolved reference (height + section) so the
// table of contents can slot it into reading order; returns false (saving
// nothing) when the reference can't be resolved.
function addBookmark(entry, title) {
  const key = bookmarkKey(entry.hex, bmSubOf(entry), entry.page ?? null);
  const existing = bookmarks.find((b) => keyOf(b) === key);
  if (existing) {
    existing.title = title;
  } else {
    const place = entryPlacement(entry);
    if (!place) return false;
    bookmarks.unshift({
      hex: entry.hex, label: entry.label, prose: entry.prose, title,
      height: place.height, pos: place.pos,
      // An output carries the vout it names, so the contents can cite it as
      // §section.vout and open the book at that output.
      ...(place.vout == null ? {} : { vout: place.vout }),
      // A witness carries the input that bears it, so the contents can open
      // the section with that footnote brought to the top -- and its
      // footnote number, so the contents can cite its alphabet index (§17.a).
      ...(place.vin == null ? {} : { vin: place.vin }),
      ...(place.wn == null ? {} : { wn: place.wn }),
      // A leaf carries the level it stands at, so the contents can cite it as
      // a volume or a book and open that leaf rather than a chapter.
      ...(place.page ? { page: place.page } : {}),
    }); // newest first
  }
  saveBookmarks();
  syncBookmarkRibbons();
  syncBookmarkTitles();
  return true;
}
function removeBookmark(key) {
  const i = bookmarks.findIndex((b) => keyOf(b) === key);
  if (i < 0) return;
  bookmarks.splice(i, 1);
  saveBookmarks();
  syncBookmarkRibbons();
  syncBookmarkTitles();
}

// The ribbon itself: hollow while the place is unkept, filled once it is, and
// clickable in both states -- the affordance for keeping a place, standing
// where the kept mark will stand. Keeping asks for a name (the title becomes
// the row in the contents), so the hollow ribbon opens the same title form the
// menu's Bookmark item opens; a filled one gives the place back.
const RIBBON_SVG = '<svg viewBox="0 0 12 16" aria-hidden="true">'
  + '<path class="rib-hollow" d="M.9.9h10.2v14.2l-5.1-3.4-5.1 3.4z" fill="none" stroke="currentColor" stroke-width="1.7"/>'
  + '<path class="rib-fill" d="M0 0h12v16l-6-4-6 4z" fill="currentColor"/></svg>';
function ribbonOf(el) {
  let rib = el.querySelector(':scope > .hash-bookmark');
  if (rib) return rib;
  el.classList.add('bm-host');
  rib = document.createElement('button');
  rib.type = 'button';
  rib.className = 'hash-bookmark';
  rib.innerHTML = RIBBON_SVG;
  // The ribbon sits inside the place's own click handle (a title, an amount),
  // which opens the copy menu; a press on the ribbon is about the bookmark and
  // nothing else, so it stops there -- by keyboard too, where the handle takes
  // Enter and Space for the same menu.
  rib.addEventListener('mousedown', (e) => e.stopPropagation());
  rib.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') e.stopPropagation(); });
  rib.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const entry = el.__bmEntry;
    if (!entry) return;
    const key = bookmarkKey(entry.hex, bmSubOf(entry), entry.page ?? null);
    if (isBookmarked(entry.hex, bmSubOf(entry), entry.page ?? null)) { removeBookmark(key); closeHashMenu(); return; }
    startBookmark(e, entry, rib);
  });
  el.appendChild(rib);
  return rib;
}

// Dress `el`'s ribbon to match what the reader has kept. `on` is whether this
// place is bookmarked; the wording follows the Ledger's own keep button, which
// says in words what the ribbon says in gold.
function setBookmarkRibbon(el, on) {
  const rib = ribbonOf(el);
  rib.classList.toggle('set', on);
  const what = el.__bmEntry?.what || 'this place';
  rib.title = on ? 'bookmarked — remove' : `bookmark ${what}`;
  rib.setAttribute('aria-label', on ? `Remove the bookmark on ${what}` : `Bookmark ${what}`);
  rib.setAttribute('aria-pressed', on ? 'true' : 'false');
}
// A place that can't be kept (a merkle root, which leads nowhere; a draft
// chapter, which has no settled reference yet) is offered nothing.
function clearBookmarkRibbon(el) {
  el.querySelector(':scope > .hash-bookmark')?.remove();
  el.classList.remove('bm-host');
  el.__bmEntry = null;
}
// Re-dress every ribbon on the page after the bookmark set changes.
function syncBookmarkRibbons() {
  for (const rib of document.querySelectorAll('.hash-bookmark')) {
    const host = rib.parentElement;
    if (host && host.__bmKey) setBookmarkRibbon(host, bookmarks.some((b) => keyOf(b) === host.__bmKey));
  }
}

// The reader's titles, wherever the page prints them: the section's subtitle
// ([data-bm-subtitle], keyed by txid) and each output's centered name line
// ([data-bm-out], keyed txid:vout). A kept place shows its bookmark title; an
// unkept one falls back to the line stored on the element (the curated name,
// a ghost's dagger, a draft's fee rate) or stays empty and hidden. Called on
// render and whenever the bookmark set changes, so a keep, a retitle, or a
// removal renames the page live.
function syncBookmarkTitles() {
  for (const el of document.querySelectorAll('[data-bm-subtitle]')) {
    // The place's own keep only: an output's or a witness's bookmark shares
    // the txid but names a finer place, not the section -- and the chapter
    // subtitle's span is keyed by the block hash, so a section keep can't
    // reach it either.
    const b = bookmarks.find((x) => !x.page && x.vout == null && x.vin == null && x.hex === el.dataset.bmSubtitle);
    el.textContent = (b && b.title) || el.dataset.fallback || '';
    // The chapter subtitle owns its visibility here rather than at render
    // time, so a keep added to an unnamed chapter shows it and a removed
    // one hides it again -- shown only on the chapter's own page, and only
    // with something to say (the tip clock beside the span counts).
    if (el.dataset.bmChapter) {
      const host = el.parentElement;
      if (host) host.classList.toggle('hidden', el.dataset.bmChapter !== 'title' || !host.textContent.trim());
    }
  }
  for (const el of document.querySelectorAll('[data-bm-out]')) {
    const at = el.dataset.bmOut.lastIndexOf(':');
    const hex = el.dataset.bmOut.slice(0, at), vout = Number(el.dataset.bmOut.slice(at + 1));
    const b = bookmarks.find((x) => !x.page && x.hex === hex && x.vout === vout);
    el.textContent = (b && b.title) || el.dataset.fallback || '';
  }
  // The witness name lines, keyed txid:vin -- a witness keep stores the
  // input that bears it (its wn only helps the contents cite the letter).
  for (const el of document.querySelectorAll('[data-bm-wit]')) {
    const at = el.dataset.bmWit.lastIndexOf(':');
    const hex = el.dataset.bmWit.slice(0, at), vin = Number(el.dataset.bmWit.slice(at + 1));
    const b = bookmarks.find((x) => !x.page && x.hex === hex && x.vin === vin);
    el.textContent = (b && b.title) || el.dataset.fallback || '';
  }
}

// The locking-script keep lines, painted from the ledger shelves: the
// reader's keep names the line first, the curated shelf's title is the
// default it reverts to, and an address on neither offers the hollow ribbon
// alone. The ribbon is a toggle on the reader's own keep, like every other
// ribbon -- hollow while unkept (curated or not), filled once kept, removal
// reverting the name to the curated default or to the bare offer. Clicking
// the name opens the copy menu: the script's hex, its address (the script's
// own text in the book's tongue), and the road to the ledger entry this
// very section wrote. A keep living inside a multi-address ledger is
// managed on the Ledger page, so its ribbon leads there instead of
// toggling a whole shelf row away.
function syncScriptKeeps() {
  for (const el of document.querySelectorAll('.tx-out-keep')) {
    const address = el.dataset.address;
    el.textContent = '';
    if (!address) continue;
    const reader = keptLedgers().find((k) => k.addresses.includes(address));
    const curated = INDEXED.find((k) => k.addresses.includes(address));
    const ledgerHref = `./bitcoin-ledger.html?address=${encodeURIComponent(address)}`
      + (el.dataset.ref ? `&ref=${el.dataset.ref}` : '');
    const name = reader ? (reader.title || address) : (curated ? curated.title : null);
    if (name) {
      const span = document.createElement('span');
      span.className = 'out-keep-name hash-copy';
      span.tabIndex = 0;
      span.textContent = name;
      span.title = `${address} — click for menu`;
      span.setAttribute('aria-label', `locking script ${address} — click for menu`);
      const entry = { hex: el.dataset.spk, prose: address, label: 'locking script', nav: false, ledgerHref };
      span.addEventListener('mousedown', (e) => e.preventDefault());
      span.addEventListener('click', (e) => openHashMenu(e, entry, span));
      span.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openHashMenu(e, entry, span); } });
      el.append(span);
    }
    const rib = document.createElement('button');
    rib.type = 'button';
    rib.className = 'keep-rib' + (reader ? ' kept' : '');
    rib.innerHTML = RIBBON_SVG;
    if (!reader) {
      rib.title = curated
        ? `bookmark this locking script — your name for it overrides “${curated.title}” until removed`
        : 'bookmark this locking script — its address joins your ledgers';
      rib.setAttribute('aria-label', 'Bookmark this locking script: keep its address as a ledger');
      rib.addEventListener('click', (e) => {
        e.stopPropagation();
        startBookmark(e, { label: 'locking script', ledger: address, prose: address, what: KEEPS['locking script'] }, rib);
      });
    } else if (reader.addresses.length === 1) {
      rib.title = 'bookmarked — remove';
      rib.setAttribute('aria-label', 'Remove the bookmark on this locking script');
      rib.addEventListener('click', (e) => {
        e.stopPropagation();
        saveKeptLedgers(keptLedgers().filter((k) => !(k.addresses.length === 1 && k.addresses[0] === address)));
        syncScriptKeeps();
      });
    } else {
      rib.title = `kept in “${reader.title || reader.addresses[0]}” — manage that ledger on its own page`;
      rib.setAttribute('aria-label', `Open the ledger ${reader.title || reader.addresses[0]}`);
      rib.addEventListener('click', (e) => { e.stopPropagation(); location.href = ledgerHref; });
    }
    el.append(rib);
  }
}

// The curated contents' name for a bookmarkable place, when the table of
// contents already lists it: matched by hash, or by the resolved height plus
// whichever coordinates narrow it (section index, output, leaf level) -- the
// same shapes the yaml's ids resolve to (btc-notables.js).
function curatedTitleFor(entry, place) {
  // A witness keep matches a curated witness place (cited §n.a) by the
  // footnote number its mark resolves to; witness places match nothing else.
  if (entry.vin != null) {
    const p = places().find((p) => !p.page && !p.address && p.wit != null && p.wit === entry.wn
      && p.id === String(place.height) && (p.index ?? null) === (place.pos ?? null));
    return p ? placeTitle(p) : null;
  }
  const p = places().find((p) => {
    if (p.address || p.wit != null) return false;
    if (place.page || p.page) return (p.page ?? null) === (place.page ?? null) && p.id === String(place.height);
    if ((p.out ?? null) !== (entry.vout ?? null)) return false;
    return p.id === entry.hex || (p.id === String(place.height) && (p.index ?? null) === (place.pos ?? null));
  });
  return p ? placeTitle(p) : null;
}

// A first-guess title for the entry, drawn from the current section (every
// bookmarkable hash on the page belongs to the chapter on screen). The reader
// can accept or edit it.
function suggestTitle(entry) {
  // A locking-script keep names a ledger. The curated shelf's title is the
  // default when the address is already there -- keep it and the name
  // stands, change it and yours overrides until the keep is removed --
  // otherwise the name is the reader's to give.
  if (entry.ledger) {
    const cur = INDEXED.find((k) => k.addresses.includes(entry.ledger));
    return cur ? cur.title : '';
  }
  const b = bookmarks.find((x) => keyOf(x) === bookmarkKey(entry.hex, bmSubOf(entry)));
  if (b && b.title) return b.title;               // keep an existing title when retitling
  const place = entryPlacement(entry);
  if (!place) return '';
  // A place the contents already names suggests that name: keeping it keeps
  // the row as it stands; changing it renames the row -- the reader's title
  // overrides the curated label, here and in the table of contents.
  const curated = curatedTitleFor(entry, place);
  if (curated) return curated;
  const { volume, book, chapter } = volumeBookChapter(place.height);
  const genesis = volume === 1 && book === 1 && chapter === 1;
  // A leaf suggests the name it wears at its own head, which is what a reader
  // scanning the contents for it will be looking for.
  if (place.page === 'volume') return `Volume ${toRoman(volume)}`;
  if (place.page === 'book') return `Book ${book.toLocaleString()}`;
  // A witness suggests its citation: the section with the footnote's
  // alphabet index after the point (§17.a, beside an output's §17.0) --
  // falling back to naming its input when the footnote number isn't in hand.
  if (place.vin != null) {
    const base = `${toRoman(volume)} β${book} ■${chapter} §${place.pos + 1}`;
    return place.wn != null ? `${base}.${footnoteMark(place.wn)}` : `${base} — input ${place.vin + 1}'s witness`;
  }
  if (place.pos != null) return `${toRoman(volume)} β${book} ■${chapter} §${place.pos + 1}`;
  return genesis ? 'The Genesis Block' : `Chapter ${chapterName(chapter)}`;
}

const hashMenu = $('hash-menu');
const menuCopyBtn = hashMenu.querySelector('[data-act="copy"]');
const menuCopyTextBtn = hashMenu.querySelector('[data-act="copy-text"]');
const menuBmBtn = hashMenu.querySelector('[data-act="bookmark"]');
const menuLedgerBtn = hashMenu.querySelector('[data-act="ledger"]');
const titleInput = $('hash-title-input');
let menuEntry = null;
let menuPoint = { x: 0, y: 0 };

// Clamp the menu to the viewport at its remembered anchor point -- re-run after
// a mode switch changes its height.
function positionMenu() {
  const pad = 8;
  const r = hashMenu.getBoundingClientRect();
  hashMenu.style.left = `${Math.min(Math.max(pad, menuPoint.x), window.innerWidth - r.width - pad)}px`;
  hashMenu.style.top = `${Math.min(Math.max(pad, menuPoint.y), window.innerHeight - r.height - pad)}px`;
}

// Toggle between the action list and the title-entry form.
let menuMode = 'actions';
// A scroll or resize fired as a side-effect of opening (the browser bringing the
// just-clicked hash or the menu into view) must not dismiss the menu. Ignore
// viewport changes until this moment, set a beat after each open.
let menuSettleUntil = 0;
function setMenuMode(mode) {
  menuMode = mode;
  $('hash-menu-actions').classList.toggle('hidden', mode === 'title');
  $('hash-menu-title').classList.toggle('hidden', mode !== 'title');
  positionMenu();
}

function openHashMenu(ev, entry, anchorEl) {
  ev.preventDefault();
  ev.stopPropagation();
  menuEntry = entry;
  fromRibbon = false;
  $('hash-menu-head').textContent = entry.label;
  menuCopyBtn.textContent = 'Copy hex';
  menuCopyTextBtn.textContent = 'Copy text';
  // A locking script's menu carries the road to its ledger: the entry this
  // very section wrote in that address's record (?address + ?ref).
  menuLedgerBtn.classList.toggle('hidden', !entry.ledgerHref);
  menuBmBtn.classList.toggle('hidden', !entry.nav);
  // Keyed by the whole place, output and all: a transaction's own bookmark and
  // one of its outputs' are two different keeps, and the item must say which
  // of them it is about.
  if (entry.nav) menuBmBtn.textContent = isBookmarked(entry.hex, bmSubOf(entry)) ? 'Remove bookmark' : 'Bookmark';
  hashMenu.classList.remove('hidden');
  setMenuMode('actions');
  // Anchor at the click; for a keyboard open, sit under the element.
  if (ev.type === 'keydown' && anchorEl) { const a = anchorEl.getBoundingClientRect(); menuPoint = { x: a.left, y: a.bottom + 4 }; }
  else menuPoint = { x: ev.clientX, y: ev.clientY };
  positionMenu();
  // Pull focus into the menu only for a keyboard open. On a mouse open, moving
  // focus to a menu button can scroll it into view (preventScroll isn't honored
  // everywhere), and that scroll would trip the dismiss below and close the menu
  // the instant it appeared.
  if (ev.type === 'keydown') menuCopyBtn.focus({ preventScroll: true });
  menuSettleUntil = performance.now() + 400;
}

// Whether the form on screen was raised by a ribbon rather than by the menu.
// A ribbon opens straight into the title form, so cancelling it has no actions
// list to fall back to -- and must not invent one: a leaf's title offers a
// bookmark and nothing else, having no hash of its own to copy.
let fromRibbon = false;
const cancelTitle = () => { if (fromRibbon) closeHashMenu(); else setMenuMode('actions'); };

function closeHashMenu() { hashMenu.classList.add('hidden'); menuEntry = null; fromRibbon = false; }

menuCopyBtn.addEventListener('click', () => {
  if (!menuEntry) return;
  navigator.clipboard.writeText(menuEntry.hex).then(() => {
    menuCopyBtn.textContent = 'Copied ✓';
    setTimeout(closeHashMenu, 650);
  }).catch(closeHashMenu);
});
// Copy the Glossia prose itself (the readable encoding), not the raw hex.
menuCopyTextBtn.addEventListener('click', () => {
  if (!menuEntry) return;
  navigator.clipboard.writeText(menuEntry.prose).then(() => {
    menuCopyTextBtn.textContent = 'Copied ✓';
    setTimeout(closeHashMenu, 650);
  }).catch(closeHashMenu);
});
// The road out of the passage and into the record: the address's ledger,
// opened at the entry this very section wrote in it.
menuLedgerBtn.addEventListener('click', () => {
  if (!menuEntry || !menuEntry.ledgerHref) return;
  location.href = menuEntry.ledgerHref;
});
// Keeping a place asks for a name first: the title is the row it will take in
// the table of contents, and a row is read by its title. Reached from the
// menu's Bookmark item and from a hollow ribbon alike.
function promptForTitle() {
  titleInput.value = suggestTitle(menuEntry);
  setMenuMode('title');
  titleInput.focus({ preventScroll: true });
  titleInput.select();
}
menuBmBtn.addEventListener('click', () => {
  if (!menuEntry) return;
  const key = bookmarkKey(menuEntry.hex, bmSubOf(menuEntry), menuEntry.page ?? null);
  if (isBookmarked(menuEntry.hex, bmSubOf(menuEntry), menuEntry.page ?? null)) { removeBookmark(key); closeHashMenu(); return; }
  promptForTitle();   // not yet saved: name it
});

// The hollow ribbon's own path to the same form: no menu was open, so this
// raises one straight into its title mode, anchored under the ribbon pressed.
function startBookmark(ev, entry, anchorEl) {
  ev.preventDefault();
  menuEntry = entry;
  fromRibbon = true;
  $('hash-menu-head').textContent = entry.label;
  menuBmBtn.classList.remove('hidden');
  hashMenu.classList.remove('hidden');
  const a = anchorEl.getBoundingClientRect();
  menuPoint = { x: a.left, y: a.bottom + 4 };
  promptForTitle();   // positions the menu as it switches mode
  menuSettleUntil = performance.now() + 400;
}

function saveTitle() {
  if (!menuEntry) return;
  // A locking-script keep goes to the ledger shelf, not the bookmark store:
  // the address becomes a titled one-address ledger (untitled, it reads by
  // its address there), exactly what the Ledger page's keep button writes.
  if (menuEntry.ledger) {
    if (!keptLedgers().some((k) => k.addresses.includes(menuEntry.ledger))) {
      saveKeptLedgers([...keptLedgers(), { title: titleInput.value.trim(), addresses: [menuEntry.ledger] }]);
    }
    syncScriptKeeps();
    closeHashMenu();
    return;
  }
  if (addBookmark(menuEntry, titleInput.value.trim())) { closeHashMenu(); return; }
  // The reference couldn't be resolved, so nothing was saved -- say so instead
  // of silently closing on a bookmark that wouldn't appear in the contents.
  closeHashMenu();
  setStatus('Could not resolve this reference — bookmark not saved.', 'err');
}
hashMenu.querySelector('[data-act="title-save"]').addEventListener('click', saveTitle);
hashMenu.querySelector('[data-act="title-cancel"]').addEventListener('click', cancelTitle);
titleInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); saveTitle(); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); cancelTitle(); }
});

// Dismiss on an outside press, Escape, scroll, or resize. mousedown (not click)
// so opening the menu on one hash doesn't immediately close it.
document.addEventListener('mousedown', (e) => {
  if (!hashMenu.classList.contains('hidden') && !hashMenu.contains(e.target)) closeHashMenu();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeHashMenu(); });
// Dismiss on a genuine user scroll or resize -- but never while the title form
// is up, so a mobile keyboard's viewport resize (or a focus scroll) can't
// discard a half-typed bookmark title.
const dismissOnViewportChange = () => {
  if (menuMode === 'title') return;                  // never nuke a title being typed
  if (performance.now() < menuSettleUntil) return;   // ignore the open's own scroll
  closeHashMenu();
};
window.addEventListener('resize', dismissOnViewportChange);
window.addEventListener('scroll', dismissOnViewportChange, true);

// Entry points, in priority order: ?ref= opens a citation carried whole in
// Latin (v1b50c1807s85o4 -- volume, book, chapter, then optional §section
// and .output) -- the reference IS the address, no txid anywhere: the
// height is citation arithmetic and the section is the block's own index;
// ?txid= jumps straight to a transaction's
// section (an added &out=N then brings that output to the top -- the same
// landing the marginalia's in-page cites make, reachable from a full
// §section.output citation elsewhere, e.g. a ledger row); ?block= (with
// optional ?index=) opens a block -- a negative height counts back from the
// chain tip, so ?block=-1 is the latest block; otherwise the book opens at
// the chain tip (-1), the latest chapter rather than Genesis.
const params = new URLSearchParams(location.search);
const pParam = parseReference(params.get('ref') || '');
const txidParam = params.get('txid');
const blockParam = params.get('block');
// An absent ?index= opens the chapter's own page (-1); index=0 is §1;
// ?page=volume / ?page=book open the block's volume or book leaf.
const idxRaw = parseInt(params.get('index'), 10);
const pageParam = params.get('page');
const indexParam = Number.isFinite(idxRaw) ? idxRaw
  : pageParam === 'volume' ? -3 : pageParam === 'book' ? -2 : -1;
// The curated index before the first lookup: a chapter must not paint once
// without its curated name and again with it. A local file (precached by the
// service worker), so this costs a read rather than a round trip -- and a read
// that fails resolves empty, leaving the book to render the chain uncurated
// rather than not at all.
await loadNotables();

// The &wit= landing, read both ways a witness travels: digits are an input
// index (a bookmark's stored coordinate), letters a footnote mark (the
// citation's own .a). Either way the lazy footnotes are forced in (a no-op
// once loaded) and the entry brought to the top -- by its mark, which is its
// element id, with the input's citation anchor as the digit form's fallback.
async function landOnWitness(raw) {
  if (raw == null || raw === '') return;
  // Land first, render after: the foot region opens at once with the
  // loading mark standing in (footnoteStub), and a second, exact scroll
  // lands on the named entry once the real footnotes take its place.
  footnoteStub();
  await renderFootnotes(renderGen);
  let el = null;
  if (/^\d+$/.test(raw)) {
    const fn = currentFootnotes.find((f) => f.vin === Number(raw));
    el = (fn && $(`fn-${footnoteMark(fn.n)}`)) || $(`in-${raw}`);
  } else if (/^[a-z]+$/i.test(raw)) {
    el = $(`fn-${raw.toLowerCase()}`);
  }
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

if (pParam) {
  const pOut = pParam.out;
  const pWit = pParam.wit;   // a footnote number, parsed off the reference's .a
  Promise.resolve(openLookup(String(pParam.height), pParam.index)).then(async () => {
    if (pParam.index >= 0) {
      if (pOut != null) $(`out-${pOut}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (pWit != null) await landOnWitness(footnoteMark(pWit));
    }
  }).catch(() => { /* the lookup's own error handling has the page */ });
} else if (txidParam) {
  const outRaw = parseInt(params.get('out'), 10);
  Promise.resolve(openLookup(txidParam)).then(async () => {
    if (Number.isFinite(outRaw)) $(`out-${outRaw}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    await landOnWitness(params.get('wit'));
  }).catch(() => { /* the lookup's own error handling has the page */ });
} else if (blockParam) {
  // ?block= takes every form the search box does, references included -- a
  // reference carries its own depth, which openLookup reads off it. An added
  // &out / &wit brings that coordinate to the top once the section is open
  // (the landing a curated row's link makes).
  const outRaw = parseInt(params.get('out'), 10);
  Promise.resolve(openLookup(blockParam, indexParam)).then(async () => {
    if (indexParam >= 0) {
      if (Number.isFinite(outRaw)) $(`out-${outRaw}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      await landOnWitness(params.get('wit'));
    }
  }).catch(() => { /* the lookup's own error handling has the page */ });
} else {
  openLookup('-1', indexParam);
}
</script>
