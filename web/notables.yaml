# ── The Coldcard attack ───────────────────────────────────────────────────
# The July 2026 theft from Coldcard-generated wallets (the 'Coldcard hack'
# ledger keeps the attacker's vault addresses; these entries keep its places
# in the chain). Three waves, and for each the transactions listed are the
# ones that carried the stolen coins into the vaults — the attack's terminal
# settlement, which is where the chain tells the story in a citable number
# of places. Wave 1's sweeps proper (some 1,195 one-input-one-output
# drainings, blocks 960,183-960,191) converged on collectors first; listing
# every sweep would be a concordance, not a contents. Amounts in each `as`
# are what reached the vault in that transaction, net of fees, so the wave
# totals here read slightly under the published sweep totals. Wave 1: two
# blocks, three mass consolidations (491, 204 and 341 inputs) and 49 direct
# single-input sweeps into a fourth vault. Wave 2: 27 transactions across
# blocks 960,352-960,455, the largest pulling 1,212 inputs. Wave 3: 214
# transactions in blocks 960,519-960,522, one per fresh P2WSH vault, the
# shared-destination fingerprint deliberately absent. Txids fetched from the
# chain itself (vault funding histories, blockstream.info and mempool.space
# agreeing), windowed to each wave's blocks so later dust sent to the famous
# vaults by onlookers is not mistaken for the attack. No published reading
# yet -- the entries are kept, per the note above, before anyone has
# finished saying why.
