<!-- PWA: installable, offline-capable app shell. Shares the Bitcoin book's
     gold-β manifest so every page installs as one "Bitcoin Book" app. -->
<link rel="manifest" href="./bitcoin-book.webmanifest">
<meta name="theme-color" content="#08080a">
<link rel="apple-touch-icon" href="./icons/beta-icon-180.png">

<meta name="apple-mobile-web-app-title" content="βook of βitcoin">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed:', e));
    });
  }

  // The page is assembled from ES modules that both the HTTP cache (GitHub
  // Pages serves max-age=600) and the service worker refresh file by file, so
  // a redeploy can briefly leave them mixed: this page from one build, a
  // module from another. A module whose imports no longer line up fails to
  // instantiate, and an aborted module graph renders nothing -- the anthology
  // goes blank. Detect the blankness itself, not the error (module failures
  // surface too many ways to catch reliably): a healthy module populates
  // #anthology synchronously, so an empty #anthology well after load means
  // the graph died. Recover by re-fetching this page's files with
  // cache:'reload' -- which refreshes the HTTP cache directly and, routed
  // through the service worker, makes its background revalidation hit the
  // true network -- then reloading once onto the matched set. A second blank
  // load shows a note instead of looping.
  (function () {
    const FILES = ['./bitcoin-anthology.html', './btc-index.js', './btc-citation.js'];
    const FLAG = 'glossia-anthology-reloaded';
    window.addEventListener('load', () => {
      setTimeout(() => {
        const el = document.getElementById('anthology');
        if (!el || el.children.length) return;   // the module rendered; nothing to recover
        let retried = false;
        try { retried = !!sessionStorage.getItem(FLAG); } catch (_) {}
        if (retried) {
          const s = document.createElement('span');
          s.className = 'idx-note';
          s.textContent = 'The anthology failed to load — reload to retry.';
          el.replaceChildren(s);
          return;
        }
        try { sessionStorage.setItem(FLAG, '1'); } catch (_) {}
        Promise.allSettled(FILES.map((u) => fetch(u, { cache: 'reload' })))
          .then(() => setTimeout(() => location.reload(), 800));
      }, 2000);
    });
  })();
</script>

<style>
:root {
  --page:#08080a; --card:#0d0d10; --card-bd:#232228; --ink:#e8e4da; --ink-soft:#cfcabf;
  --accent:#c9a25f; --accent-2:#dcb877; --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;
  --input-bg:#151519; --input-bd:#2a2930;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; line-height: 1.55; }
.wrap { max-width: 720px; margin: 0 auto; padding: 48px 22px 100px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.masthead { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:40px; }
.masthead .title { font:600 13px/1 'IBM Plex Mono',monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--ink); }
.masthead .title .beta { color:var(--accent); text-transform:none; font-family:'Newsreader','Source Serif 4',Georgia,serif; font-weight:600; font-size:1.12em; }
.masthead .home { margin-left:auto; font:500 12px/1 'IBM Plex Mono',monospace; letter-spacing:.04em; }

/* The anthology's own title leaf: the eyebrow names the form, the serif names
   the anthology, the mono line beneath is the address itself -- the name whose
   every appearance the following contents collect. */
.page-head { text-align:center; padding-bottom:30px; margin-bottom:10px; border-bottom:1px solid var(--rule); }
.page-eyebrow { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); }
.anth-title { margin:14px 0 0; font:500 26px/1.25 'Newsreader',serif; color:var(--ink); }
.anth-addr { margin-top:8px; font:400 12px/1.5 'IBM Plex Mono',monospace; letter-spacing:.02em; color:var(--meta); word-break:break-all; }
.anth-count { margin-top:6px; font:500 11px/1 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }

/* The nested contents, in the index family's shared idx-* classes (built by
   btc-index.js's renderLine): Volume part headers, Book sub-headers, and
   citation rows with the reference leading and the chapter's net amount
   closing, full eight decimals so the column aligns on the point. */
.idx-vol { margin:22px 0 2px; padding-top:14px; border-top:1px solid var(--hair);
  font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); }
.idx-vol:first-child { margin-top:10px; padding-top:0; border-top:none; }
.idx-book { margin:12px 0 1px; padding-left:14px;
  font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--meta); }
.idx-row { display:flex; align-items:baseline; gap:16px; padding:8px 2px 8px 14px; border-bottom:1px solid var(--hair); text-decoration:none; }
.idx-row.under-book { padding-left:28px; }
.idx-row:last-child { border-bottom:none; }
.idx-ref { flex:none; font:600 13px/1.4 'IBM Plex Mono',monospace; letter-spacing:.06em; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; }
.idx-amt { flex:1; min-width:0; text-align:right; font:500 13px/1.4 'IBM Plex Mono',monospace; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
.idx-row:hover .idx-ref { text-decoration:underline; color:var(--accent-2); }
.idx-row:hover .idx-amt { color:var(--ink); }
.idx-note { display:block; margin-top:12px; padding-left:14px; font:400 12px/1.5 'IBM Plex Mono',monospace; color:var(--meta); }

/* The anthology's own contents -- the spine at a glance -- then its ledger,
   separated by small section eyebrows. A contents row: the anthology book
   (with its canonical designation) on the left, its chapter count and net on
   the right; the row is an anchor into the ledger below. */
.sp-eyebrow { margin:26px 0 0; font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); text-align:center; }
.sp-toc { margin-bottom:8px; }
.sp-row { display:flex; align-items:baseline; gap:16px; padding:7px 2px 7px 14px; border-bottom:1px solid var(--hair); text-decoration:none; }
.sp-row:last-child { border-bottom:none; }
.sp-label { flex:none; font:600 13px/1.4 'IBM Plex Mono',monospace; letter-spacing:.06em; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; }
.sp-count { flex:1; min-width:0; text-align:right; font:400 12px/1.4 'IBM Plex Mono',monospace; color:var(--meta); white-space:nowrap; font-variant-numeric:tabular-nums; }
.sp-amt { flex:none; }
.sp-row:hover .sp-label { text-decoration:underline; color:var(--accent-2); }
.sp-row:hover .idx-amt { color:var(--ink); }
/* An anchored ledger book lands with breathing room under the fixed viewport top. */
.idx-book[id] { scroll-margin-top: 18px; }
/* The β sigil is a mark, not a letter: exempt from the headers' small caps. */
.no-tt { text-transform: none; }
</style>
<body>
<div class="wrap">
  <div class="masthead">
    <span class="title">The <span class="beta">β</span>ook of <span class="beta">β</span>itcoin</span>
    <span class="home"><a href="./bitcoin-book.html">Read</a> · <a href="./bitcoin-contents.html">Contents</a> · <a href="./bitcoin-index.html">Index</a> · <a href="./bitcoin-search.html">Search</a> · <a href="https://glossia.io/">Glossia</a></span>
  </div>

  <header class="page-head">
    <div class="page-eyebrow">Anthology</div>
    <h1 class="anth-title" id="anth-title"></h1>
    <div class="anth-addr" id="anth-addr"></div>
    <div class="anth-count" id="anth-count"></div>
  </header>

  <div id="anthology"></div>
</div>

<script type="module">
import { INDEXED, isAddress, cachedLine, resolveLine, renderAnthology, spine, lineNote } from './btc-index.js';

// An anthology is one address's own subset of the book, with the book's own
// apparatus at its scale: a contents (its spine -- non-empty books
// renumbered consecutively, annotated with their canonical designations)
// and a ledger (every chapter, with its net gift). Every chapter row opens
// bitcoin-book.html at its transaction, so an anthology is navigated the
// same way as the book it excerpts. The map behind it aims for completeness
// (blockbook's parallel pages; the esplora walk as capped fallback) -- and
// only a complete map draws the spine, since anthology numbering is only
// permanent when the whole history is in hand.

const q = (new URLSearchParams(location.search).get('address') || '').trim();
const addr = isAddress(q) ? q : (isAddress(q.toLowerCase()) ? q.toLowerCase() : null);

const el = document.getElementById('anthology');
el.replaceChildren();   // populated-or-recovered is the head script's signal

if (!addr) {
  // No (or an unreadable) address: explain the form instead of a blank page.
  document.getElementById('anth-title').textContent = 'One address, its every chapter';
  lineNote(el, 'An anthology collects one address’s appearances into its own contents. Open one from the Index, or put ?address=<an address> in this page’s URL.');
} else {
  // A curated address reads under its curated name; any other under its own.
  const entry = INDEXED.find((e) => e.address === addr);
  const title = entry ? entry.title : 'An uncollected address';
  document.title = `The βook of βitcoin — Anthology · ${entry ? entry.title : addr}`;
  document.getElementById('anth-title').textContent = title;
  document.getElementById('anth-addr').textContent = addr;

  const count = document.getElementById('anth-count');
  const showCount = (data) => {
    if (!data || !data.chapters.length) { count.textContent = ''; return; }
    const parts = [
      `${data.txCount.toLocaleString('en-US')} appearances`,
      `${data.chapters.length.toLocaleString('en-US')} chapters`,
    ];
    const vols = spine(data);
    if (vols) {
      const books = vols.reduce((n, v) => n + v.books.length, 0);
      parts.push(`${books.toLocaleString('en-US')} books`, `${vols.length.toLocaleString('en-US')} volumes`);
    }
    count.textContent = parts.join(' · ');
  };

  // The stored map first -- instantly, offline included -- then the resolver
  // confirms it against the chain, tops it up, or maps afresh.
  (async () => {
    const cached = await cachedLine(addr);
    if (cached) { renderAnthology(el, cached); showCount(cached); }
    else lineNote(el, '…');
    const data = await resolveLine(addr);
    if (data !== cached) { renderAnthology(el, data); showCount(data); }
  })();
}
</script>
</body>
</html>
