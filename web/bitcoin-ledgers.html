<title>The βook of βitcoin — Ledgers</title>
<meta name="description" content="The ledgers of the Glossia Bitcoin Book: notable donation addresses — and any the reader keeps — each a view of the manuscript focused on amounts, reconciled against the chain.">

<!-- PWA: installable, offline-capable app shell. Shares the Bitcoin book's
     gold-β manifest so every page installs as one "Bitcoin Book" app. -->
<link rel="manifest" href="./bitcoin-book.webmanifest">
<meta name="theme-color" content="#08080a">
<link rel="apple-touch-icon" href="./icons/beta-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="βook of βitcoin">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed:', e));
    });
  }

  // The page is assembled from ES modules that both the HTTP cache (GitHub
  // Pages serves max-age=600) and the service worker refresh file by file, so
  // a redeploy can briefly leave them mixed: this page from one build, a
  // module from another. A module whose imports no longer line up fails to
  // instantiate, and an aborted module graph renders nothing -- the shelf
  // goes blank. Detect the blankness itself, not the error (module failures
  // surface too many ways to catch reliably): a healthy module populates
  // #index synchronously, so an empty #index well after load means the graph
  // died. Recover by re-fetching this page's files with cache:'reload' --
  // which refreshes the HTTP cache directly and, routed through the service
  // worker, makes its background revalidation hit the true network -- then
  // reloading once onto the matched set. A second blank load shows a note
  // instead of looping.
  (function () {
    const FILES = ['./bitcoin-ledgers.html', './btc-index.js', './btc-citation.js'];
    const FLAG = 'glossia-index-reloaded';
    window.addEventListener('load', () => {
      setTimeout(() => {
        const idx = document.getElementById('index');
        if (!idx || idx.children.length) return;   // the module rendered; nothing to recover
        let retried = false;
        try { retried = !!sessionStorage.getItem(FLAG); } catch (_) {}
        if (retried) {
          const s = document.createElement('span');
          s.className = 'idx-note';
          s.textContent = 'The ledgers failed to load — reload to retry.';
          idx.replaceChildren(s);
          return;
        }
        try { sessionStorage.setItem(FLAG, '1'); } catch (_) {}
        Promise.allSettled(FILES.map((u) => fetch(u, { cache: 'reload' })))
          .then(() => setTimeout(() => location.reload(), 800));
      }, 2000);
    });
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --page:#08080a; --card:#0d0d10; --card-bd:#232228; --ink:#e8e4da; --ink-soft:#cfcabf;
  --accent:#c9a25f; --accent-2:#dcb877; --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;
  --input-bg:#151519; --input-bd:#2a2930;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; line-height: 1.55; }
.wrap { max-width: 720px; margin: 0 auto; padding: 48px 22px 100px; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.masthead { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:40px; }
.masthead .title { font:600 13px/1 'IBM Plex Mono',monospace; letter-spacing:.22em; text-transform:uppercase; color:var(--ink); }
.masthead .title .beta { color:var(--accent); text-transform:none; font-family:'Newsreader','Source Serif 4',Georgia,serif; font-weight:600; font-size:1.12em; }
.masthead .home { margin-left:auto; font:500 12px/1 'IBM Plex Mono',monospace; letter-spacing:.04em; }

.page-head { text-align:center; padding-bottom:30px; margin-bottom:36px; border-bottom:1px solid var(--rule); }
.page-eyebrow { font:600 11px/1 'IBM Plex Mono',monospace; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); }

/* The shelf: one row per anthology -- its title in the book's serif on the
   left, its ledger's running total on the right -- the whole row opening the
   anthology's own title page. Styled like the contents page's rows: the
   shelf is a table of contents whose entries are whole books. */
.shelf-row { display:flex; align-items:baseline; gap:16px; padding:13px 2px; border-bottom:1px solid var(--hair); text-decoration:none; }
.shelf-title { flex:1; min-width:0; font:500 18px/1.4 'Newsreader',serif; color:var(--ink-soft); overflow-wrap:break-word; }
.shelf-amt { flex:none; text-align:right; font:500 13px/1.4 'IBM Plex Mono',monospace; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums; }
.shelf-amt.pending { color:var(--meta); font-weight:400; }
.shelf-row:hover { text-decoration:none; }
.shelf-row:hover .shelf-title { color:var(--ink); }
.shelf-row:hover .shelf-amt { color:var(--accent-2); text-decoration:underline; }
/* A gated row -- its ledger still syncing -- carries its state quietly, but
   its name still leads in to whatever that level knows. */
.shelf-row.gated:hover .shelf-amt { color:var(--meta); text-decoration:none; }

/* Still resolving, or failed to resolve. */
.idx-note { display:block; margin-top:8px; padding-left:2px; font:400 12px/1.5 'IBM Plex Mono',monospace; color:var(--meta); }

/* The build stamp: when the served page was last modified, so "is my page
   stale" is answerable at a glance rather than guessed at. */
.page-stamp { margin-top:34px; text-align:center; font:400 10px/1 'IBM Plex Mono',monospace; letter-spacing:.08em; color:var(--meta); }

/* Settings: where the ledgers ask (Blockbook instances, the chosen one
   first) and how much history each ask carries -- in the book page's own
   settings-panel manner. */
.settings-menu { position:relative; }
.settings-panel { position:absolute; right:0; top:24px; z-index:10; width:min(420px, 92vw);
  background:var(--card); border:1px solid var(--card-bd); border-radius:6px; padding:16px 18px 18px;
  box-shadow:0 24px 60px -32px rgba(0,0,0,.8); text-align:left; }
.settings-panel.hidden { display:none; }
.settings-title { font:600 10px/1 'IBM Plex Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin:14px 0 8px; }
.settings-title:first-child { margin-top:0; }
.endpoint-row { display:flex; gap:8px; }
.bb-select { flex:1; min-width:0; background:var(--input-bg); border:1px solid var(--input-bd); border-radius:4px;
  color:var(--ink); font:400 12px/1.4 'IBM Plex Mono',monospace; padding:8px 8px; }
.bb-select:focus { outline:none; border-color:var(--accent); }
.ghost-btn, .save-btn { background:transparent; border:1px solid var(--input-bd); color:var(--dim); border-radius:4px;
  padding:0 10px; cursor:pointer; font:600 10.5px/1 'IBM Plex Mono',monospace; letter-spacing:.06em; text-transform:uppercase; }
.ghost-btn:hover:not(:disabled), .save-btn:hover { border-color:var(--accent); color:var(--accent); }
.ghost-btn:disabled { opacity:.4; cursor:default; }
.endpoint-add-row { display:flex; gap:8px; margin-top:8px; }
.endpoint-add-row.hidden { display:none; }
.endpoint-add-row input { flex:1; min-width:0; background:var(--input-bg); border:1px solid var(--input-bd); border-radius:4px;
  color:var(--ink); font:400 12px/1.4 'IBM Plex Mono',monospace; padding:8px 8px; }
.endpoint-add-row input:focus { outline:none; border-color:var(--accent); }
.settings-note { margin-top:12px; font:400 10.5px/1.6 'IBM Plex Mono',monospace; color:var(--meta); }
</style>
<body>
<div class="wrap">
  <div class="masthead">
    <span class="title">The <span class="beta">β</span>ook of <span class="beta">β</span>itcoin</span>
    <span class="home"><a href="./bitcoin-book.html">Read</a> · <a href="./bitcoin-contents.html">Contents</a> · <a href="./bitcoin-search.html">Search</a> · <span class="settings-menu"><a href="#" id="settings-link" role="button" aria-haspopup="dialog" aria-expanded="false">Settings</a><div id="settings-panel" class="settings-panel hidden" role="dialog" aria-label="Ledger settings">
      <div class="settings-title">Blockbook source</div>
      <div class="endpoint-row">
        <select id="bb-select" class="bb-select" aria-label="Blockbook endpoint"></select>
        <button type="button" id="bb-add" class="ghost-btn">+ Add</button>
        <button type="button" id="bb-remove" class="ghost-btn" disabled>Remove</button>
      </div>
      <div id="bb-add-row" class="endpoint-add-row hidden">
        <input type="text" id="bb-url" placeholder="https://your-blockbook/api/v2" autocomplete="off" spellcheck="false">
        <button type="button" id="bb-save" class="save-btn">Save</button>
      </div>
      <div class="settings-title">Transactions per ask</div>
      <select id="bb-size" class="bb-select" aria-label="Transactions per request">
        <option value="1000">1,000 — fewest requests</option>
        <option value="500">500</option>
        <option value="250">250 — gentler, checkpoints oftener</option>
        <option value="100">100</option>
      </select>
      <div class="settings-note">Where the ledgers ask (the chosen source is tried first) and how much history each height-range ask carries. Applies from the next fetch; banked history is never refetched.</div>
    </div></span> · <a href="https://glossia.io/">Glossia</a></span>
  </div>

  <header class="page-head">
    <div class="page-eyebrow">Ledgers</div>
  </header>

  <div id="index"></div>
  <div class="page-stamp" id="page-stamp"></div>
</div>

<script type="module">
import { INDEXED, isAddress, cachedLine, addressState, formatBalanceBtc,
         DEFAULT_BLOCKBOOK, blockbookCustom, blockbookSelected, blockbookPageSize, setBlockbookSettings } from './btc-index.js';

// --- Settings: where the ledgers ask, and how much each ask carries.
// Reads and writes btc-index.js's stored settings; the machinery reads them
// at call time, so a change applies from the very next fetch on any page.
{
  const link = document.getElementById('settings-link');
  const panel = document.getElementById('settings-panel');
  const select = document.getElementById('bb-select');
  const removeBtn = document.getElementById('bb-remove');
  const addRow = document.getElementById('bb-add-row');
  const urlInput = document.getElementById('bb-url');
  const sizeSel = document.getElementById('bb-size');
  const shortName = (u) => u.replace(/^https?:\/\//, '').replace(/\/api\/v2\/?$/, '');
  const rebuild = () => {
    select.replaceChildren();
    for (const u of [...DEFAULT_BLOCKBOOK, ...blockbookCustom()]) {
      const o = document.createElement('option');
      o.value = u;
      o.textContent = shortName(u) + (DEFAULT_BLOCKBOOK.includes(u) ? '' : ' · yours');
      select.append(o);
    }
    select.value = blockbookSelected();
    removeBtn.disabled = DEFAULT_BLOCKBOOK.includes(select.value);
    sizeSel.value = String(blockbookPageSize());
  };
  link.addEventListener('click', (ev) => {
    ev.preventDefault();
    const open = panel.classList.toggle('hidden');
    link.setAttribute('aria-expanded', String(!open));
    if (!open) rebuild();
  });
  select.addEventListener('change', () => {
    setBlockbookSettings({ selected: DEFAULT_BLOCKBOOK[0] === select.value ? null : select.value });
    rebuild();
  });
  sizeSel.addEventListener('change', () => {
    setBlockbookSettings({ pageSize: sizeSel.value === '1000' ? null : Number(sizeSel.value) });
  });
  removeBtn.addEventListener('click', () => {
    const u = select.value;
    setBlockbookSettings({ custom: blockbookCustom().filter((c) => c !== u), selected: null });
    rebuild();
  });
  document.getElementById('bb-add').addEventListener('click', () => {
    addRow.classList.toggle('hidden');
    urlInput.focus();
  });
  document.getElementById('bb-save').addEventListener('click', () => {
    // Normalized to the /api/v2 base the module appends paths to.
    let u = urlInput.value.trim().replace(/\/+$/, '');
    if (!/^https?:\/\//.test(u)) return;
    if (!/\/api\/v2$/.test(u)) u += '/api/v2';
    if (![...DEFAULT_BLOCKBOOK, ...blockbookCustom()].includes(u)) {
      setBlockbookSettings({ custom: [...blockbookCustom(), u], selected: u });
    } else {
      setBlockbookSettings({ selected: u });
    }
    urlInput.value = '';
    addRow.classList.add('hidden');
    rebuild();
  });
  rebuild();
}

// The shelf lists the ledgers: title and current balance, nothing else --
// and it asks for nothing else: one basic-details request per address (the
// balance is an address property, exact without any mapping), so browsing
// the shelf starts nobody's sync. The mapping begins only when a reader
// steps into a ledger, whose page shows whatever that level knows and its
// sync state. The curated donation ledgers come first; any ledger the
// reader has kept (from its own page) follows.

// A reader's own query joins the shelf: ?address=<addr> prepends a temporary
// row (titled by the address itself). A query that duplicates a curated
// address is dropped -- the curated title wins.
const q = (new URLSearchParams(location.search).get('address') || '').trim();
const adhoc = isAddress(q) && !INDEXED.some((e) => e.address === q)
  ? [{ title: q, address: q }] : [];
// The reader's kept ledgers (written by the ledger page's Keep button),
// titled by their addresses, shelved after the curated ones.
const kept = (() => {
  try { const v = JSON.parse(localStorage.getItem('glossia-btc-ledgers')); return Array.isArray(v) ? v : []; }
  catch { return []; }
})().filter((k) => isAddress(k.address) && !INDEXED.some((e) => e.address === k.address) && !adhoc.some((e) => e.address === k.address))
  .map((k) => ({ title: k.title || k.address, address: k.address }));
const entries = [...adhoc, ...INDEXED, ...kept];


// Build every row at once -- titles are known offline -- and let each total
// fill in from the store and refresh as its map resolves. Built onto a
// cleared #index: a late module evaluation may land after the head's
// blank-page recovery has already written its failure note.
const index = document.getElementById('index');
index.replaceChildren();
for (const e of entries) {
  const row = document.createElement('a');
  row.className = 'shelf-row gated';
  row.href = `bitcoin-ledger.html?address=${e.address}`;   // the name always leads in
  const t = document.createElement('span'); t.className = 'shelf-title';
  t.textContent = e.title;
  const amt = document.createElement('span'); amt.className = 'shelf-amt pending';
  amt.textContent = '…';
  row.append(t, amt);
  index.append(row);
  // The balance, three ways: last-known from the store instantly (in the
  // quiet pending style, an honest "as of last sync"), then the live one
  // from the chain stats in full ink -- or, with neither to be had,
  // "unreachable" retrying in place when tapped (the tap is caught before
  // the row navigates), so a throttled moment doesn't strand the shelf.
  let settled;         // undefined while in flight; the state (or null) after
  const resolve = async () => {
    settled = undefined;
    amt.textContent = '…';
    amt.classList.add('pending');
    const cached = await cachedLine(e.address);
    if (cached?.balance != null) amt.textContent = formatBalanceBtc(cached.balance);
    const state = await addressState(e.address);
    if (state) {
      settled = state;
      amt.textContent = formatBalanceBtc(state.balance);
      amt.classList.remove('pending');
      row.classList.remove('gated');
    } else if (cached?.balance != null) {
      settled = { balance: cached.balance };   // last known; the ledger page will refresh it
    } else {
      settled = null;
      amt.textContent = 'unreachable — retry';
    }
  };
  amt.addEventListener('click', (ev) => {
    if (settled !== null) return;           // any real state: the row navigates
    ev.preventDefault();
    ev.stopPropagation();
    resolve();
  });
  resolve();
}

// The build stamp: the served file's own last-modified time -- stale-cache
// questions answered by reading, not guessing.
document.getElementById('page-stamp').textContent = `page as served · ${document.lastModified}`;

// The module graph loaded whole: clear the mixed-build recovery flag (set in
// the head) so a future redeploy gets its own one-shot reload again.
try { sessionStorage.removeItem('glossia-index-reloaded'); } catch (_) {}
</script>
</body>
</html>
