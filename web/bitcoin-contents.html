<script>
  // The entering half of whatever turn brought the reader here, played on
  // first paint -- so it has to be decided before the module below loads.
  // The flag's value carries the turn's direction: 'up' is the cover being
  // lifted away beneath us (the front page's swipe-up), so the contents
  // enter from below; 'fwd' / 'back' are the sideways turns off the front
  // matter's own leaves; anything else is the classic ascent out of the
  // book, entering from the top.
  try {
    const entrance = sessionStorage.getItem('glossia-toc-entrance');
    if (entrance) {
      sessionStorage.removeItem('glossia-toc-entrance');
      document.documentElement.classList.add(
        entrance === 'up' ? 'toc-entrance-up'
        : entrance === 'fwd' ? 'toc-entrance-fwd'
        : entrance === 'back' ? 'toc-entrance-back'
        : 'toc-entrance');
    }
  } catch (_) {}
</script>

<!-- The faces every leaf sets text in, fetched alongside the stylesheet
     that declares them rather than after it. crossorigin is required even

<style>
:root {
  --page:#08080a; --card:#0d0d10; --card-bd:#232228; --ink:#e8e4da; --ink-soft:#cfcabf;
  --accent:#c9a25f; --accent-2:#dcb877; --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;
  --input-bg:#151519; --input-bd:#2a2930;
}
* { box-sizing: border-box; }
/* overscroll-behavior keeps the browser's pull-to-refresh from swallowing
   the pull-down-at-top turn back to the cover (the book page does the same
   for its own vertical turns). */
html, body { margin: 0; overscroll-behavior-y: none; }
body { min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Public Sans','Book Sigla', system-ui, sans-serif; line-height: 1.55; }
/* The entering half of the book page's ascend-above-the-volume turn: the
   contents slide down into place, matching the carousel's pace. */
@media (prefers-reduced-motion: no-preference) {
  .toc-entrance body { animation: toc-in .22s ease-out; }
  @keyframes toc-in { from { transform: translateY(-100vh); } }
  /* …and the entering half of the cover's lift-away: the contents rise into
     place from below as the cover slides up and off. */
  .toc-entrance-up body { animation: toc-in-up .22s ease-out; }
  @keyframes toc-in-up { from { transform: translateY(100vh); } }
  /* …and of a sideways turn off one of the front matter's own leaves: the
     contents arrive from the side the reader turned toward. */
  .toc-entrance-fwd body { animation: toc-in-fwd .22s ease-out; }
  @keyframes toc-in-fwd { from { transform: translateX(100vw); } }
  .toc-entrance-back body { animation: toc-in-back .22s ease-out; }
  @keyframes toc-in-back { from { transform: translateX(-100vw); } }
}
/* The volume turns at the foot ride the bottom of the screen (sticky, below):
   the wrap stretches to the viewport and the list takes all slack, so a short
   leaf's turns rest exactly where a tall leaf's sticky bar rides -- the same
   arrangement the reader's own foot nav keeps. No bottom padding: the bar is
   the page's own floor. */
.wrap { max-width: 720px; margin: 0 auto; padding: 48px var(--gutter-r) 0 var(--gutter-l);
  display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
#toc { flex: 1 0 auto; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.page-eyebrow { text-align:center; padding-bottom:26px; font:600 11px/1 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); }

/* A leaf's own head: which part of the book this is the contents of, and a
   line saying what that part spans. Set like the appendix leaves' heads,
   since a contents leaf and an appendix leaf are the same kind of page --
   one that names a span and stands above it. */
.leaf-head { text-align:center; padding-bottom:26px; margin-bottom:8px; border-bottom:1px solid var(--rule); }
.leaf-title { margin:0; font:400 34px/1.15 'Newsreader','Book Sigla',serif; letter-spacing:.01em; color:var(--ink); }
.leaf-sub { margin-top:10px; font:400 13px/1.5 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.06em; color:var(--meta); }

/* The door down: from a volume's contents into the volume itself, from an
   appendix's contents into the appendix's own leaf. The same mark, and the
   same seat, the appendix leaves give their descent. */
.toc-down { display:block; margin:34px auto 0; width:2em; text-align:center; font-size:20px; line-height:1; color:var(--dim); }
.toc-down:hover { color:var(--accent); text-decoration:none; }
.toc-down.hidden { display:none; }

/* The turns to either side, named at the foot -- the swipe and the arrow
   keys go the same places, and this says so for hands that use neither.
   Sticky at the bottom of the screen, like the reader's foot nav: a long
   leaf's turns are always in reach, and the page's own background keeps the
   rows scrolling beneath from showing through. */
.toc-turns { position:sticky; bottom:0; z-index:40; background:var(--page);
  display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:44px;
  padding:18px 0 max(18px, env(safe-area-inset-bottom)); border-top:1px solid var(--rule);
  font:600 10px/1.5 'IBM Plex Mono','Book Sigla',monospace; letter-spacing:.14em; text-transform:uppercase; }
.toc-turns a { color:var(--meta); }
.toc-turns a:hover { color:var(--accent); }

/* Said about a leaf rather than in it: a volume nothing has been kept from
   yet, or a queue that could not be read. */
.toc-empty { padding:26px 2px; text-align:center; font:400 14px/1.7 'Newsreader','Book Sigla',serif; color:var(--meta); }
</style>

<div class="wrap">

  </div>

  <div id="toc-slide">

    </header>

    <a class="toc-down" id="toc-down" href="#" aria-label="Down into this part of the book">▾</a>
    <!-- The contents' one credit, a footnote rather than a line per row:
         who wrote the readings behind the rows above. With a single author
         so far, a per-row credit tagged nearly every row and distinguished
         nothing; the foot says it once, and grows into a list as authors
         join. Filled by the colophon block in the script below. -->
    <div class="toc-colophon hidden" id="toc-colophon"></div>

  </div>
</div>

<script type="module">
import { localizeHome, mountLangMenu, t as tr } from './btc-strings.js';
localizeHome();   // the masthead in the reader's UI language
mountLangMenu();  // …with the Language item, which any page can now set
import { loadNotables, notables, places, placeTitle, appendix, isBlockId, isRelativeBlockId, entryHref } from './btc-contents.js';
import { partLabel } from './btc-notables.js';
import { toSubscript } from './btc-sigla.js';
import { allProofs, citeOf, leafOf, estimatedDate, minedDate } from './btc-proofs.js';
import { readingsOf } from './btc-commentary.js';
import { readQueue, buildQueue } from './btc-mempool.js';
import { INDEXED, keptLedgers, sameAddresses, shelfLedgers } from './btc-index.js';
// A slash in a name the reader typed is a path: their own keeps file into a
// hierarchy, and only theirs do (btc-path.js says why).
import { pathForest } from './btc-path.js';
import { volumeBookChapter, toRoman, fromRoman, heightOf, expectedReference, footnoteMark } from './btc-citation.js';
import { storeGet, storePut } from './btc-store.js';
import { seedArchive } from './btc-seed.js';

// The curated index and its appendix are read from notables.yaml and
// appendix.yaml, so they arrive asynchronously -- and everything below builds
// on them, the appendices' own names included, so the page waits here once. A
// failed read leaves a contents of the reader's own bookmarks plus a line
// saying what could not be read.
await loadNotables();

// A first visit provisions the archive with the curated passages' chain data
// (idle-time, once ever; see btc-seed.js), so this page's entries -- and the
// book pages behind them -- open like revisits.
seedArchive();

const $ = (id) => document.getElementById(id);

// The contents' one credit, at its foot: whose readings stand behind the rows.
// Gathered from every reading-bearer the index and appendix keep -- entries,
// parts, forks and their chapters -- in file order, each name once. Empty (and
// hidden) if nothing is credited; a footnote rather than a line per row, so a
// name stays news when a second author joins rather than wallpaper when one
// wrote everything.
(() => {
  const bearers = [
    ...notables(),
    ...appendix(),
    ...appendix().filter((p) => p.bips).flatMap((p) => p.bips),
    ...appendix().filter((p) => p.bips).flatMap((p) => p.bips).flatMap((b) => b.entries),
  ];
  const named = [...new Set(bearers.flatMap((e) => readingsOf(e).filter((r) => r.by).map((r) => r.by)))];
  if (!named.length) return;
  const el = $('toc-colophon');
  el.textContent = tr('commentary by {names}', { names: named.join(' · ') });
  el.title = `${named.length > 1 ? 'readings' : 'the readings'} by ${named.join(', ')} — editorial, offered beside the passages and no more authoritative than their argument; opened from the Commentary key on each page`;
  el.classList.remove('hidden');
})();
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const BOOKMARKS_KEY = 'glossia-btc-bookmarks';
const readBookmarks = () => {
  try { const v = JSON.parse(localStorage.getItem(BOOKMARKS_KEY)); return Array.isArray(v) ? v : []; }
  catch { return []; }
};
const shortHex = (hex) => `${hex.slice(0, 10)}…${hex.slice(-6)}`;

// The genesis coinbase places offline -- block 0, first transaction -- so the
// book opens at I 1 1 §1 without waiting on the network.
const GENESIS_COINBASE = '4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b';

// Every entry is cited by its reference, never its raw id. A block's placement
// is known offline from its height; a transaction's is resolved the same way the
// reader resolves a citation -- a /tx/<txid>/merkle-proof gives the confirming
// block height and the transaction's index (its §section). Tried across the same
// public mirrors the book uses.
const ESPLORA_MIRRORS = ['https://blockstream.info/api', 'https://mempool.space/api'];
// A book-page entry (page: 'book') places at its book with no chapter -- the
// leaf precedes every chapter of its book in reading order.
const placeOf = (height, pos, page, vout = null, wn = null) => {
  const p = volumeBookChapter(height);
  if (page === 'volume') return { volume: p.volume, book: null, chapter: null, section: null };
  if (page === 'book') return { volume: p.volume, book: p.book, chapter: null, section: null };
  // An output rides its section's citation with its vout appended -- §1.0,
  // as the book prints it (renderCitation in bitcoin-book.html) -- and a
  // witness rides it the same way, the footnote's alphabet index after the
  // point (§1.a): letters name footnotes, digits name outputs.
  return { ...p, section: pos == null ? null : pos + 1, vout: pos == null ? null : vout, wit: pos == null ? null : wn };
};

// The chain tip height, fetched once and reused across relative entries.
let tipHeightPromise = null;
function tipHeight() {
  if (!tipHeightPromise) tipHeightPromise = (async () => {
    for (const base of ESPLORA_MIRRORS) {
      try {
        const res = await fetch(`${base}/blocks/tip/height`);
        if (res.ok) return Number((await res.text()).trim());
      } catch { /* try the next mirror */ }
    }
    return null;
  })();
  return tipHeightPromise;
}

// An entry's placement. A block entry places from its height (with an optional
// transaction index as its §section); a negative id counts back from the chain
// tip; a transaction id resolves the same way a reader resolves a citation --
// once: a confirmed placement is immutable, so the archive (btc-store.js)
// answers every later visit offline and for free.
async function resolvePlacement({ id, index, page, out = null }) {
  if (isBlockId(id)) return placeOf(Number(id), index ?? null, page, out);
  if (isRelativeBlockId(id)) {
    const tip = await tipHeight();
    if (tip == null) return null;
    const height = tip + Number(id) + 1;
    return height >= 0 ? placeOf(height, index ?? null) : null;
  }
  if (id === GENESIS_COINBASE) return placeOf(0, 0);
  const kept = await storeGet('placements', id);
  if (kept) return placeOf(kept.height, kept.pos);
  for (const base of ESPLORA_MIRRORS) {
    try {
      const res = await fetch(`${base}/tx/${id}/merkle-proof`);
      if (!res.ok) continue;
      const mp = await res.json();
      storePut('placements', id, { height: mp.block_height, pos: mp.pos });
      return placeOf(mp.block_height, mp.pos);
    } catch { /* try the next mirror */ }
  }
  return null;
}

// A bookmark's placement. Newer bookmarks carry their resolved reference
// (height + section), so they place offline. Older ones store only the hex,
// which may be a block hash or a txid -- try a block lookup first (its height is
// the chapter), then a txid's merkle proof (height + section), like the book.
async function resolveBookmark(b) {
  // A leaf's bookmark places at the level it names: its height is already its
  // span's first block, so the volume or book alone is what it cites.
  if (b.page) return Number.isInteger(b.height) ? placeOf(b.height, null, b.page) : null;
  if (Number.isInteger(b.height)) return placeOf(b.height, b.pos ?? null);
  // A legacy bookmark's hex resolves once; the archive keeps the answer
  // (whether it proved a block hash or a txid) like any other placement.
  const kept = await storeGet('placements', b.hex);
  if (kept) return placeOf(kept.height, kept.pos);
  for (const base of ESPLORA_MIRRORS) {
    try {
      const res = await fetch(`${base}/block/${b.hex}`);
      if (res.ok) {
        const height = (await res.json()).height;
        storePut('placements', b.hex, { height, pos: null });
        return placeOf(height, null);
      }
    } catch { /* try the next mirror */ }
  }
  for (const base of ESPLORA_MIRRORS) {
    try {
      const res = await fetch(`${base}/tx/${b.hex}/merkle-proof`);
      if (res.ok) {
        const mp = await res.json();
        storePut('placements', b.hex, { height: mp.block_height, pos: mp.pos });
        return placeOf(mp.block_height, mp.pos);
      }
    } catch { /* try the next mirror */ }
  }
  return null;
}

// The tail of an entry's citation -- the part its heading hasn't already named.
// The leaf's own head has named the volume, so under a Book heading only the
// ■chapter (and a transaction's §section) remains, and directly on the leaf the
// β-marked book leads it. Spaced like the book's own citations ("β29 ■596",
// "■1 §1"). A row nested under its parent entry (a section listed under the
// chapter row that names its block) cites only what differs from the parent:
// the parent row has already printed the ■chapter, so the child carries the
// §section alone.
function tailRef({ book, chapter, section, vout, wit }, underBook, parent) {
  // An output cites as §section.vout; a witness as §section.a -- the
  // footnote's alphabet index after the point, letters where an output
  // would carry digits.
  const sec = section == null ? ''
    : `§${section}${vout == null ? '' : `.${vout}`}${wit == null ? '' : `.${footnoteMark(wit)}`}`;
  if (parent && parent.book === book && parent.chapter === chapter) return sec;
  // A volume's own leaf: the leaf's head above the row has already named it.
  if (book == null) return '';
  // A book's own leaf: under its Book heading nothing remains to cite; on the
  // bare leaf, the β mark alone names it.
  if (chapter == null) return underBook ? '' : `β${book}`;
  let s = (underBook ? [`■${chapter}`] : [`β${book}`, `■${chapter}`]).join(' ');
  if (sec) s += ` ${sec}`;
  return s;
}

// One contents row: the title on the left, its remaining reference on the right;
// the whole row is a link that navigates into the book. An entry whose citation
// never resolved carries a dash in place of a reference. `parent` marks a row
// nested under its parent entry's row rather than directly under a heading:
// one more step of indent, and a reference compressed against the parent's.
// `filing` carries the reader's own hierarchy where they have one: `title`
// is the leaf to print in place of the whole path (the heading above has
// said the rest), and `depth` how far in the group stands.
function entryEl(entry, underBook, parent, filing = null) {
  const row = document.createElement('a');
  const depth = filing?.depth ?? 0;
  row.className = 'toc-entry' + (underBook ? ' under-book' : '') + (parent ? ' under-parent' : '')
    + (depth ? ' filed' : '') + (entry.bookmark ? ' is-bookmark' : '');
  if (depth) row.style.setProperty('--file-depth', String(depth - 1));
  row.dataset.entryId = entry.id;   // the projected section anchors after the tip's row
  // The witness coordinate travels two ways: a curated place carries its
  // footnote number (linked as the letter mark, the citation's own .a), a
  // bookmark its input index -- the book's &wit= landing reads both.
  row.href = entryHref(entry.id, entry.index, entry.page, entry.vout ?? entry.out ?? null,
    entry.wit != null ? footnoteMark(entry.wit) : entry.vin ?? null);
  const t = document.createElement('span'); t.className = 'toc-title';
  // A reader's own bookmark flies the same ribbon it wears in the book, so it's
  // distinguishable from a curated entry even though it sits in reading order.
  if (entry.bookmark) {
    const bm = document.createElement('span'); bm.className = 'toc-bm'; bm.setAttribute('aria-label', 'your bookmark');
    bm.innerHTML = '<svg viewBox="0 0 12 16"><path fill="currentColor" d="M0 0h12v16l-6-4-6 4z"/></svg>';
    t.append(bm);
  }
  t.append(document.createTextNode(filing?.title || entry.title));
  const r = document.createElement('span'); r.className = 'toc-ref';
  if (entry.place) r.textContent = tailRef(entry.place, underBook, parent);
  else { r.textContent = '—'; r.classList.add('none'); }
  row.append(t, r);
  return row;
}
function head(cls, label) { const d = document.createElement('div'); d.className = cls; d.textContent = label; return d; }
// A filing's heading: the name two or more entries were filed under, be
// they the reader's keeps or the book's own curated rows. It carries no
// ribbon -- a heading over a mixed run could not honestly fly one, and each
// row beneath still says for itself whose it is.
function fileHead(label, depth) {
  const d = head('toc-file', label);
  d.style.setProperty('--file-depth', String(depth));
  return d;
}
function saying(text) { const d = document.createElement('div'); d.className = 'toc-empty'; d.textContent = text; return d; }

const toc = $('toc');
// The projected section (Appendix I, the mempool), rebuilt by loadProjected
// and appended whenever that leaf is the one on screen.
let projectedSection = null;
// The Citations leaf's rows, built once the proofs have been read: each is
// fetched (the bundled ones) or unpacked from storage (the reader's) and
// replayed, all of it offline but none of it synchronous, so the section
// arrives after the first paint the way the queue's does.
let proofSection = null;
let proofsCount = null;

// ── The contents' own line ────────────────────────────────────────────────
// The book below runs Volume I … Volume V, Appendix I, II, III, every one of
// them at a single level. The contents now runs that same line one storey
// up, a leaf to each: this page is a carousel of contents leaves, not one
// list of everything.
//
// Two things follow, and they are the point of the arrangement. An ascent
// from Volume III's leaf lands on Volume III's contents and nowhere else --
// the vertical axis is a correspondence now, not a funnel. And the descent
// needs no memory of where the reader came up from: the leaf says which
// volume it is the contents of, so it descends there.
//
// Every leaf here is the contents of one part, and nothing stands above them
// summarising the run. The book's own parts are what a reader turns through;
// the front matter keeps its own leaves, which is where it is named.
const ERA = heightOf(2, 1, 1);          // 210,000 -- one halving era, one volume
let lastVolume = 1;                     // grows with the curated entries, then with the tip
const leaves = () => [
  ...Array.from({ length: lastVolume }, (_, i) => ({ kind: 'volume', volume: i + 1 })),
  ...appendix().map((part) => ({ kind: 'appendix', part })),
];
const leafTitle = (leaf) => leaf.kind === 'volume'
  ? `Volume ${toRoman(leaf.volume)}`
  : partLabel(appendix(), leaf.part);
// One line under the leaf's name, saying what it spans and how much of it
// there is. Not what the part IS and why it sits outside reading order --
// that paragraph is written on the appendix's own leaf, one turn down. The
// contents lists; the leaf explains.
const count = (n, one, many) => `${n === 0 ? 'nothing' : n} ${n === 1 ? one : many}`;
function leafSub(leaf) {
  if (leaf.kind === 'volume') {
    const from = heightOf(leaf.volume, 1, 1);
    const n = placedIn(leaf.volume).length;
    return `Blocks ${from.toLocaleString()}–${(from + ERA - 1).toLocaleString()} · `
      + (n === 0 ? 'nothing kept yet' : count(n, 'entry', 'entries'));
  }
  const part = leaf.part;
  if (part.kind === 'mempool') return 'Ahead of the chain tip · the queue, as far as it reaches';
  if (part.kind === 'consensus') return `The rules the chapters are written under · ${count(part.bips.length, 'fork', 'forks')}`;
  if (part.kind === 'inscriptions') return `Files in witnesses · ${count(part.entries.length, 'inscription', 'inscriptions')}`;
  if (part.kind === 'proofs') return `Works the chain attests · ${count(proofsCount ?? part.entries.length, 'work cited', 'works cited')}`;
  // The shelf as it is listed, parents included: a filed parent is a ledger
  // of its own, so it is one of the ledgers the subtitle counts.
  const kept = shelfLedgers().filter((k) => !INDEXED.some((e) => sameAddresses(e.addresses, k.addresses)));
  return `Keepers, not chapters · ${count(INDEXED.length + kept.length, 'ledger', 'ledgers')}`;
}

// Where a leaf's ▾ goes: a volume's contents descends onto the volume's own
// leaf in the book; an appendix's onto the appendix's leaf -- which for the
// ledgers is the Ledger compendium, since a shelf of ledgers is what that
// page already is. Each destination wakes its own entrance, so the leaf
// rises from below as this one slides up and away.
function descent(leaf) {
  if (leaf.kind === 'volume') {
    return { href: `./bitcoin-book.html?block=${heightOf(leaf.volume, 1, 1)}&page=volume`, flag: 'glossia-book-entrance', value: '1' };
  }
  if (leaf.part.kind === 'ledgers') return { href: './bitcoin-ledger.html', flag: 'glossia-ledger-entrance', value: 'down' };
  return {
    href: `./bitcoin-appendix.html?part=${leaf.part.kind}`,
    flag: 'glossia-appendix-entrance', value: 'down',
  };
}

// ── Which leaf a visit opens ──────────────────────────────────────────────
// ?volume=<n|roman> names a volume's contents, ?part=<mempool|future|ledgers>
// an appendix's -- the same words those pages take for themselves, so the
// ascent from any leaf of the book can name its own contents leaf. ?at=top
// names whatever leaf opens the run and ?at=last whatever leaf closes it,
// without having to know how far the volumes reach or what the appendix file
// holds. Nothing in the site produces those two now -- they were how the front
// matter addressed the ends of the run while the contents was still spliced
// into it -- but they are still answered, for links that were saved with them.
//
// A bare visit -- the masthead's Contents link from a page that carries no
// place, a bookmark, a cold load -- opens the volume the reader was last
// reading (the book notes it as it renders), and Volume I's leaf when there
// is nothing to go on, that being where the book starts.
const PART_ALIAS = { mempool: 'mempool', future: 'consensus', entries: 'consensus', consensus: 'consensus', inscriptions: 'inscriptions', ledgers: 'ledgers', proofs: 'proofs' };
const params = new URLSearchParams(location.search);
function openingIndex(list) {
  if (params.get('at') === 'last') return list.length - 1;
  if (params.get('at') === 'top') return 0;
  const part = params.get('part');
  if (part && PART_ALIAS[part]) {
    const i = list.findIndex((l) => l.kind === 'appendix' && l.part.kind === PART_ALIAS[part]);
    if (i >= 0) return i;
  }
  let want = params.get('volume');
  if (!want) { try { want = sessionStorage.getItem('glossia-toc-at'); } catch (_) { want = null; } }
  if (!want) return 0;
  const v = /^[0-9]+$/.test(want) ? Number(want) : fromRoman(want.toUpperCase());
  if (!v || v < 1) return 0;
  // By position in the run, not by arithmetic on the volume number: what
  // stands ahead of Volume I is the run's business, not a caller's.
  const i = list.findIndex((l) => l.kind === 'volume' && l.volume === Math.min(v, lastVolume));
  return i >= 0 ? i : 0;
}
let at = 0;
// The URL keeps its say until the reader turns for themselves: the run of
// volumes only reaches its full length once the tip answers, so ?volume=V
// asked of a page that still believes the book ends at IV must land on V
// when it arrives, not on the leaf it was clamped to meanwhile.
let settled = false;

// The query that names a leaf: what the URL is rewritten to as the reader
// turns, so a link copied off this page opens the leaf it was copied from.
function leafQuery(leaf) {
  if (leaf.kind === 'volume') return `volume=${leaf.volume}`;
  return `part=${leaf.part.kind}`;
}

// A volume's leaf: its entries, in reading order, with a Book sub-heading
// wherever two or more consecutive rows share one -- so each row need only
// cite the portion of its reference the leaf's head and that sub-heading
// have not already named.
function renderVolume(volume) {
  const entries = placedIn(volume);
  if (!entries.length) {
    toc.append(saying('Nothing is kept from this volume yet. The volume itself is one turn down, and reads chapter by chapter from its own leaf.'));
    return;
  }
  // Two axes, and filing is the outer one. A slash in a title is a path
  // (btc-path.js), so entries named alike read together under a heading of
  // that name -- the reader's own keeps and the curated entries alike, the
  // latter having been filing by hand with a comma until now. A name
  // standing alone in its first segment is never filed and prints exactly as
  // written, which is what keeps `The Times 03/Jan/2009 …` a masthead date
  // rather than three levels of anything.
  const filed = pathForest(entries);

  // Citation nesting is the inner axis, and it works inside a filing exactly
  // as it works outside one: an entry citing a section (or deeper) of a
  // chapter that the preceding row names outright is that row's child --
  // listed beneath it, one more indent in, its reference compressed against
  // the parent's. Titles never bleed up a level, but a listing may nest down
  // one: the five burns of one chapter read beneath the chapter's own row,
  // each cited by its § alone. Applied per run of rows rather than over the
  // whole leaf, so a row is only ever the child of one it was filed beside.
  const isChildOf = (p, c) => p.place.chapter != null && p.place.section == null && !p.page
    && c.place.book === p.place.book && c.place.chapter === p.place.chapter && c.place.section != null;

  // A run of rows keeps the leaf's own manners exactly: the Book sub-heading
  // earns its place only over two or more consecutive rows that share one --
  // a lone parent with its children is already its own group, and its row
  // carries the full β-marked reference the heading would.
  const rowsRun = (rows, depth) => {
    const nodes = [];
    for (const r of rows) {
      const last = nodes[nodes.length - 1];
      if (last && isChildOf(last.row.entry, r.entry)) last.children.push(r);
      else nodes.push({ row: r, children: [] });
    }
    for (let k = 0; k < nodes.length;) {
      const bk = nodes[k].row.entry.place.book;
      let jb = k + 1;
      while (jb < nodes.length && nodes[jb].row.entry.place.book === bk) jb++;
      // Inside a filing the Book heading stands down: a group gathers rows
      // from wherever they were named, so each cites its own book.
      const underBook = depth === 0 && jb - k >= 2;
      if (underBook) toc.append(head('toc-book', `Book ${bk}`));   // spelled out, no β; the β sigil rides only the compact tail references
      for (let m = k; m < jb; m++) {
        const n = nodes[m];
        toc.append(entryEl(n.row.entry, underBook, null, { title: n.row.title, depth }));
        for (const c of n.children) toc.append(entryEl(c.entry, underBook, n.row.entry.place, { title: c.title, depth }));
      }
      k = jb;
    }
  };

  const renderFiled = (list, depth) => {
    for (let k = 0; k < list.length;) {
      if (list[k].kind === 'group') {
        toc.append(fileHead(list[k].label, depth));
        renderFiled(list[k].nodes, depth + 1);
        k++;
        continue;
      }
      let j = k; while (j < list.length && list[j].kind === 'row') j++;
      rowsRun(list.slice(k, j), depth);
      k = j;
    }
  };
  renderFiled(filed, 0);
}

// Appendix I: the mempool, built live from the queue (below). Appendix II:
// chapters cited in full but marked □, the expected-chapter mark, since no
// block has earned them an ■. Appendix III: the shelf of ledgers. Each part's
// heading is the leaf's own head now, so nothing here prints one.
function renderAppendix(part) {
  if (part.kind === 'mempool') {
    if (projectedSection) toc.append(projectedSection);
    else toc.append(saying('The queue could not be read just now — no mirror answered. The contents simply end at the chain tip until one does.'));
    return;
  }
  if (part.kind === 'consensus') {
    for (const bip of part.bips) {
      toc.append(bipHead(bip));
      for (const e of bip.entries) toc.append(consensusRow(e));
    }
    return;
  }
  if (part.kind === 'inscriptions') {
    for (const e of part.entries) toc.append(inscriptionRow(e));
    return;
  }
  if (part.kind === 'proofs') {
    if (proofSection) toc.append(proofSection);
    else toc.append(saying('The proofs are still being read — or could not be. The register itself is one turn down, and a proof of your own can be dropped there either way.'));
    return;
  }
  // The reader's shelf as they filed it: a slash in a name they typed nests
  // the rows, and a parent is a ledger in its own right -- an openable row
  // holding every member beneath it -- rather than a heading over them
  // (btc-index.js's shelfLedgers says why the Coldcard hack settles that).
  const kept = shelfLedgers().filter((k) => !INDEXED.some((e) => sameAddresses(e.addresses, k.addresses)));
  for (const l of INDEXED) toc.append(ledgerEl(l, false));
  for (const l of kept) toc.append(ledgerEl(l, true));
}

// A ledger row. These take the dash the unresolved rows take, and for a
// plainer reason than a failed lookup: a ledger has no reference because the
// chain never writes an address. It writes the script an address stands for,
// and the ledger's chapters are discovered from that as it is read -- so
// there is nothing to cite here, only somewhere to go. The rows open the
// Ledger compendium at that ledger, the way a contents row opens the book at
// its chapter.
const shortAddr = (a) => `${a.slice(0, 6)}…${a.slice(-4)}`;
function ledgerEl(ledger, isKept) {
  const row = document.createElement('a');
  // A filed ledger steps in under the one it was filed under, the way a
  // section listed beneath its chapter does. Its parent is a row of its own
  // above it -- openable, holding every member beneath it -- so the indent
  // is all the nesting needs to say.
  row.className = 'toc-entry under-book' + (ledger.depth ? ' filed' : '');
  if (ledger.depth) row.style.setProperty('--file-depth', String(ledger.depth));
  // A row here names a ledger, so it opens the ledger -- its title leaf,
  // where the compendium's descent into the passages begins. (An address
  // searched for is a passage, and the search page opens it as one, with
  // the same query and no &page.) A curated ledger is named by its first
  // member alone -- one member opens the whole shelved ledger, and a list
  // the size of the Coldcard hack's joined whole outgrows what a server
  // will take for a URI. A kept ledger resolves only from this reader's
  // own shelf, so its list rides whole and the link still carries the set.
  // A ledger the reader filed under a name of their own is named by that
  // name: `?ledger=Coldcard hack/wave 3` says what it is, survives the set
  // changing, and keeps a parent's 221 members out of a URI. Only this
  // reader's shelf resolves it, which is exactly what a kept ledger is.
  row.href = `./bitcoin-ledger.html?${isKept && ledger.title
    ? `ledger=${encodeURIComponent(ledger.title)}`
    : `address=${isKept ? ledger.addresses.join(',') : ledger.addresses[0]}&page=ledger`}`;
  const t = document.createElement('span');
  t.className = 'toc-title';
  if (isKept) {
    const bm = document.createElement('span'); bm.className = 'toc-bm'; bm.setAttribute('aria-label', 'your ledger');
    bm.innerHTML = '<svg viewBox="0 0 12 16"><path fill="currentColor" d="M0 0h12v16l-6-4-6 4z"/></svg>';
    t.append(bm);
  }
  // A kept ledger is named by its reader before it is shelved, so a title is
  // what a row prints. Ledgers kept before that was asked of them fall back
  // to their first address, the same stand-in name the Ledger page gives
  // them -- a name in the title column, never a citation in the reference's.
  t.append(document.createTextNode(ledger.leaf || ledger.name || ledger.title || shortAddr(ledger.addresses[0])));
  const r = document.createElement('span');
  r.className = 'toc-ref none';
  r.textContent = '—';
  row.append(t, r);
  return row;
}

// The Consensus leaf's rows: one sub-head per fork -- the door to that
// fork's own title leaf, its ballot and its statistics -- then the chapters
// and sections the fork names, in the fork's own order. A mined place cites
// in full (volume and all, since the leaf's head names an appendix, not a
// volume); an unmined one is cited in full too but marked □, the
// expected-chapter mark, its lookup answering with the date it is due.
function bipHead(bip) {
  const a = document.createElement('a');
  a.className = 'toc-book toc-bip';
  a.href = `./bitcoin-appendix.html?part=consensus&bip=${bip.key}`;
  a.textContent = `${bip.label} — ${bip.name}`;
  a.title = `${bip.title} — ${bip.status}. Its title leaf carries the activation statistics.`;
  return a;
}
// A place's citation written whole, for the rows no volume head stands over:
// the appendix cites from the volume down.
function wholeRef({ volume, book, chapter, section, vout }) {
  let s = toRoman(volume);
  if (book != null) s += ` β${book}`;
  if (chapter != null) s += ` ■${chapter}`;
  if (section != null) s += ` §${section}${vout == null ? '' : `.${vout}`}`;
  return s;
}
function consensusRow(entry) {
  const row = document.createElement('a');
  row.className = 'toc-entry under-book' + (entry.expected ? ' projected' : '');
  row.href = entryHref(entry.id, entry.index, entry.page, entry.out ?? null);
  const t = document.createElement('span');
  t.className = 'toc-title';
  t.textContent = entry.title;
  if (entry.note) t.title = entry.note;
  const r = document.createElement('span');
  r.className = 'toc-ref';
  if (entry.expected) {
    const height = Number(entry.id);
    r.textContent = expectedReference(height);
    r.title = `expected — block ${height.toLocaleString()} has not been mined, so its chapter carries □ rather than ■`;
  } else {
    const place = placements.get(placeKey(entry));
    if (place) r.textContent = wholeRef(place);
    else { r.textContent = '—'; r.classList.add('none'); }
  }
  row.append(t, r);
  return row;
}

// The Inscriptions leaf's rows: what this register has to show is the
// witness read whole, so a row opens the inscription's own appendix leaf --
// the renderer -- rather than the book; the leaf carries the one door into
// the book, at the footnote the envelope reads at. The citation is offline
// arithmetic: the height, the section, and the footnote's letter after the
// point, as the volumes cite the same place.
function inscriptionRow(entry) {
  const row = document.createElement('a');
  row.className = 'toc-entry under-book';
  row.href = `./bitcoin-appendix.html?part=inscriptions&ins=${entry.reveal}`;
  const t = document.createElement('span');
  t.className = 'toc-title';
  t.textContent = entry.title;
  if (entry.note) t.title = entry.note;
  const r = document.createElement('span');
  r.className = 'toc-ref';
  const place = placements.get(placeKey(entry));
  if (place) r.textContent = `${wholeRef(place)}${place.wit == null ? '' : `.${footnoteMark(place.wit)}`}`;
  else { r.textContent = '—'; r.classList.add('none'); }
  row.append(t, r);
  return row;
}

// The Citations leaf's rows: a work the chain attests. A row's title is a
// file's name -- the one thing here that is not the chain's -- and its
// reference is the chapter and §section the file's proof lands in, read out
// of the proof itself with nothing asked of the chain. The bundled works come
// first by reading order; a reader's own fly the ribbon a bookmark flies. A
// wrapper element rather than a fragment, like the queue's section: built
// once, appended on every render, and a fragment empties on first append.
function proofsEl(proofs) {
  const wrap = document.createElement('div');
  for (const p of proofs) wrap.append(proofEl(p));
  return wrap;
}
function proofEl(proof) {
  const row = document.createElement('a');
  row.className = 'toc-entry under-book' + (proof.kept ? ' is-bookmark' : '');
  // The row opens the file's own leaf rather than the chapter: what this
  // register has to show is the proof, and the chapter is one step past it.
  row.href = leafOf(proof);
  const t = document.createElement('span');
  t.className = 'toc-title';
  if (proof.kept) {
    const bm = document.createElement('span'); bm.className = 'toc-bm'; bm.setAttribute('aria-label', 'your proof');
    bm.innerHTML = '<svg viewBox="0 0 12 16"><path fill="currentColor" d="M0 0h12v16l-6-4-6 4z"/></svg>';
    t.append(bm);
  }
  // The work's citation mark: ‡ with the edition's number for a bundled work,
  // the bare ‡ for a reader's addendum -- their copy's addition, outside the
  // edition's numbering the way an addendum is.
  const mark = document.createElement('span');
  mark.className = 'toc-cite-mark';
  mark.textContent = proof.n ? `‡${toSubscript(proof.n)} ` : '‡ ';
  mark.title = proof.n ? `cited work ${proof.n}` : "your addendum — kept in this browser, outside the edition's numbering";
  t.append(mark, document.createTextNode(proof.title));
  // The date, which is what a citation here IS: the chain attests existence
  // by a block, and the block has a clock. The height's own estimate prints
  // at once, hedged; the block's clock replaces it when the archive or a
  // mirror answers for the chapter.
  const when = document.createElement('span');
  when.className = 'toc-span';
  when.textContent = estimatedDate(proof.place.height);
  when.title = 'about when the chapter its proof lands in was mined — estimated from the height alone, offline';
  minedDate(proof.place.height).then((exact) => {
    if (!exact) return;
    when.textContent = exact;
    when.title = "the clock of the block its proof lands in — the chain's own date for this file";
  });
  t.append(when);
  // What the row is really claiming, said in full on hover: this file's digest,
  // and the chapter its proof reduces to.
  row.title = `${proof.file} — ${proof.hash} ${proof.digest}, stamped into ${citeOf(proof.place)}`;
  const r = document.createElement('span');
  r.className = 'toc-ref';
  r.textContent = citeOf(proof.place);
  row.append(t, r);
  return row;
}

// ── Rendering the leaf on screen ──────────────────────────────────────────
function render() {
  const list = leaves();
  at = Math.min(Math.max(at, 0), list.length - 1);
  const leaf = list[at];
  $('toc-title').textContent = leafTitle(leaf);
  $('toc-sub').textContent = leafSub(leaf);
  document.title = `The βook of βitcoin — ${leafTitle(leaf)}`;
  // The URL follows the reader (replaceState -- turning leaves is not
  // history), so a reload, or a link shared from here, names the leaf being
  // read. The opening query was copied at load, so rewriting it can't
  // disturb which leaf a still-growing run is aiming for.
  try {
    history.replaceState(null, '', `${location.pathname}?${leafQuery(leaf)}`);
  } catch (_) { /* unavailable */ }
  toc.replaceChildren();
  // The curation is a file this page reads (notables.yaml); if it could not be
  // read, the page says so rather than presenting an empty contents as though
  // the book kept nothing. The reader's own bookmarks still list below.
  if (loadNotables.error) {
    const warn = document.createElement('div');
    warn.className = 'toc-proj-note';
    warn.textContent = 'The curated contents could not be read (web/notables.yaml). '
      + 'Any bookmarks of your own are listed below; reload to try again.';
    toc.append(warn);
  }
  if (leaf.kind === 'volume') renderVolume(leaf.volume);
  else renderAppendix(leaf.part);
  // Entries whose citation could not be resolved have no volume to be listed
  // under, so they fall past even the appendices, onto the last leaf of the
  // run -- still linked, so the book can resolve and open them on the next
  // attempt.
  if (at === list.length - 1) {
    const stranded = unresolved();
    if (stranded.length) {
      toc.append(head('toc-vol', 'Unresolved'));
      for (const e of stranded) toc.append(entryEl(e, false));
    }
  }
  renderTurns(list);
}

// The foot's named turns, and the ▾ that is the leaf's door down. Either end
// of the run turns onto the front matter, which the contents sits inside on
// this axis in the standard order: title, terms, CONTENTS, preface, sigla.
function renderTurns(list) {
  const turns = $('toc-turns');
  turns.replaceChildren();
  const link = (text, go, alignRight) => {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = text;
    if (alignRight) a.style.marginLeft = 'auto';
    a.addEventListener('click', (ev) => {
      if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button !== 0) return;
      ev.preventDefault();
      go();
    });
    turns.append(a);
    return a;
  };
  link(at > 0 ? `‹ ${leafTitle(list[at - 1])}` : '‹ Terms', () => turn(-1), false);
  link(at < list.length - 1 ? `${leafTitle(list[at + 1])} ›` : 'Preface ›', () => turn(1), true);
  $('toc-down').setAttribute('aria-label', `Down into ${leafTitle(list[at])}`);
}
$('toc-down').addEventListener('click', (ev) => { ev.preventDefault(); descend(); });

// ── The turns ─────────────────────────────────────────────────────────────
// A committed turn snapshots the outgoing leaf as a fixed ghost that keeps
// sliding off in the travel direction WHILE the real slide -- hidden --
// renders the destination and glides in from the opposite edge. The two
// halves overlap, so the turn reads as one continuous strip, exactly as it
// does in the book and on the Ledger's own leaves. `axis` picks the
// direction of travel: 'x' along the run, 'y' for the turns that change
// level (and those leave the page, so they are played on the body instead).
const slide = $('toc-slide');
let turning = false;
function turnTo(step, dir, axis = 'x') {
  if (turning) return;
  if (REDUCED_MOTION) {
    slide.style.transform = '';
    step();
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
    return;
  }
  turning = true;
  const rect = slide.getBoundingClientRect();   // includes any drag offset
  const win = document.createElement('div');
  win.setAttribute('aria-hidden', 'true');
  Object.assign(win.style, {
    position: 'fixed', top: '0', left: '0', width: '100%', height: '100%',
    overflow: 'clip', pointerEvents: 'none', zIndex: '30',
  });
  const ghost = slide.cloneNode(true);
  ghost.removeAttribute('id');
  Object.assign(ghost.style, {
    position: 'absolute', top: rect.top + 'px', left: rect.left + 'px',
    width: rect.width + 'px', margin: '0', transition: 'none', transform: 'none',
  });
  win.appendChild(ghost);
  document.body.appendChild(win);
  slide.style.transition = 'none';
  slide.style.transform = '';
  slide.style.visibility = 'hidden';
  void ghost.offsetWidth;
  const span = axis === 'x' ? window.innerWidth : window.innerHeight;
  const move = (v) => (axis === 'x' ? `translateX(${v}px)` : `translateY(${v}px)`);
  // Linear, so the exit reads as the drag's momentum carrying on.
  ghost.style.transition = 'transform .2s linear';
  ghost.style.transform = move(dir > 0 ? -span : span);
  setTimeout(() => win.remove(), 320);
  // Two frames for the compositor to start the ghost's slide BEFORE the
  // destination's render work blocks the main thread.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    step();
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });   // a new leaf opens at its head, unseen while hidden
    slide.style.transform = move(dir > 0 ? span : -span);
    slide.style.visibility = '';
    void slide.offsetWidth;
    slide.style.transition = 'transform .22s ease-out';
    slide.style.transform = '';
    setTimeout(() => { slide.style.transition = ''; turning = false; }, 260);
  }));
}

// A turn that leaves the page carries its whole body with it, and the
// destination finishes the entrance on arrival.
function leavePage(href, transform, flag, value = '1') {
  try { sessionStorage.setItem(flag, value); } catch (_) {}
  const go = () => { location.href = href; };
  if (REDUCED_MOTION) { go(); return; }
  document.body.style.transition = 'transform .2s linear';
  document.body.style.transform = transform;
  setTimeout(go, 180);
}

// Sideways along the run, and only along it. The contents is a storey rather
// than a leaf of the front matter: it lies above the volumes, a leaf of it to
// each, and a reader arrives by ascending out of a volume (or by the
// masthead), not by turning through the front matter. So the run simply ends
// at both ends -- there is no leaf to either side of it to turn onto, and the
// way off is the vertical pair: up to the cover, down into the part this leaf
// is the contents of.
function turn(dir) {
  if (turning) return;
  settled = true;              // the reader has chosen; the URL stops choosing
  const list = leaves();
  const next = at + dir;
  if (next < 0 || next >= list.length) return;
  turnTo(() => { at = next; }, dir, 'x');
}
// Up is the cover, which the contents lie under; down is whatever this leaf
// is the contents of.
function ascend() {
  leavePage('./bitcoin-front.html', 'translateY(100vh)', 'glossia-front-entrance', 'drop');
}
function descend() {
  const d = descent(leaves()[at]);
  leavePage(d.href, 'translateY(-100vh)', d.flag, d.value);
}

// ── The gestures ──────────────────────────────────────────────────────────
// The book's idiom, kept: a quick, mostly-horizontal drag turns the leaf
// sideways and follows the finger while it lasts; a pull DOWN from the top
// rises to the cover and a push UP from the foot descends. A contents leaf
// can be a long list, so the vertical pair engages only from the scroll
// boundary it moves away from (or on a leaf too short to scroll at all) --
// below that, a vertical drag is the scroll it looks like.
(() => {
  let sx = null, sy = 0, st = 0, axis = null, topStart = false, botStart = false, shortStart = false;
  const snapBack = () => {
    if (!slide.style.transform) return;
    slide.style.transition = 'transform .15s ease';
    slide.style.transform = '';
  };
  const vArmed = (dy) => shortStart || (topStart && dy > 0) || (botStart && dy < 0);
  document.addEventListener('touchstart', (e) => {
    sx = null; axis = null;
    if (e.touches.length !== 1 || turning) return;
    const t = e.target;
    if (t.closest && t.closest('input, textarea, select')) return;
    topStart = window.scrollY <= 2;
    botStart = window.scrollY >= document.documentElement.scrollHeight - window.innerHeight - 2;
    shortStart = document.documentElement.scrollHeight <= window.innerHeight + 24;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = performance.now();
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (sx === null || REDUCED_MOTION || turning) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (!axis) {
      if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
    if (axis === 'h') {
      slide.style.transition = 'none';
      slide.style.transform = `translateX(${dx}px)`;
    } else if (vArmed(dy)) {
      slide.style.transition = 'none';
      slide.style.transform = `translateY(${dy * 0.5}px)`;
    }
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (sx === null || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    const dt = performance.now() - st;
    sx = null;
    if (turning) return;
    if (axis === 'h' && dt <= 600 && Math.abs(dx) >= 60 && Math.abs(dy) <= Math.abs(dx) * 0.6) {
      turn(dx < 0 ? 1 : -1);                     // swiping left turns forward
      return;
    }
    if (axis === 'v' && vArmed(dy) && dt <= 600 && Math.abs(dy) >= 70 && Math.abs(dx) <= Math.abs(dy) * 0.6) {
      if (dy > 0) ascend(); else descend();
      return;
    }
    snapBack();
  }, { passive: true });
  document.addEventListener('touchcancel', () => { sx = null; if (!turning) snapBack(); }, { passive: true });
})();

// ── The same turns, from a keyboard ───────────────────────────────────────
// Left and right along the run, up to the cover and down into whatever this
// leaf is the contents of -- the reader's own directions, though the swipe
// that means "descend" is a push UP. The vertical pair waits for the scroll
// boundary, as the swipes do and for a sharper reason: on a keyboard the
// arrows ARE the scroll, so a leaf taller than the window would otherwise
// keep its foot unreachable.
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || e.repeat || turning) return;
  const t = e.target;
  if (t && t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    turn(e.key === 'ArrowRight' ? 1 : -1);
    return;
  }
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  const top = window.scrollY <= 2;
  const bottom = window.scrollY >= document.documentElement.scrollHeight - window.innerHeight - 2;
  const short = document.documentElement.scrollHeight <= window.innerHeight + 24;
  if (e.key === 'ArrowUp') { if (short || top) { e.preventDefault(); ascend(); } return; }
  if (short || bottom) { e.preventDefault(); descend(); }
});

// ── The entries, and where each one falls ─────────────────────────────────
// Block placements are offline, so render them at once; transaction citations
// stream in as each resolves, slotting into their volume and book in order. An
// entry whose lookup fails (placement null) drops to an "Unresolved" tail
// rather than printing its raw id.
// A curated entry may be found in several places (the twice-confirmed coinbases
// are one thing in four), and the contents lists PLACES: one row each, in
// reading order, all carrying their entry's title and their own `as`. Keyed by
// id+index, because two places of one entry can share a height.
const placeKey = (p) => `${p.id}#${p.index ?? ''}`;
const placements = new Map();          // place key -> citation | null (once attempted)
const bmPlacements = new Map();        // bookmark hex -> place | null (once attempted)

// A reader's bookmarks join the curated set in one list. A bookmark that
// names a place the curation already lists gets no second row -- it renames
// the curated row instead: the reader's title (which the book's bookmark
// form defaults to the curated name) overrides the label, and the row flies
// the ribbon. Matched by hash, or by the stored reference against the
// coordinates the yaml's ids resolve to (height + section index + output +
// leaf level); a legacy bookmark without a stored reference still matches by
// its hash.
const bmKey = (b) => (b.page ? `${b.page}@${b.hex}` : b.vin != null ? `${b.hex}:w${b.vin}` : b.vout == null ? b.hex : `${b.hex}:${b.vout}`);
const allBookmarks = readBookmarks();
const bmForPlace = (p) => allBookmarks.find((b) => {
  if (p.address || p.script) return false;
  if (p.page || b.page) return (p.page ?? null) === (b.page ?? null) && p.id === String(b.height);
  // A witness place matches only a witness keep of the same footnote (by
  // its stored number; an old keep without one stays its own row) -- and a
  // witness keep matches nothing else.
  if (p.wit != null || b.vin != null) {
    return p.wit != null && b.wn != null && b.wn === p.wit
      && p.id === String(b.height) && (p.index ?? null) === (b.pos ?? null);
  }
  if ((p.out ?? null) !== (b.vout ?? null)) return false;
  return p.id === b.hex || (p.id === String(b.height) && (p.index ?? null) === (b.pos ?? null));
});
const overridingKeys = new Set(places().filter((p) => !p.address && !p.script).map((p) => bmForPlace(p)).filter(Boolean).map(bmKey));
const bookmarks = allBookmarks.filter((b) => !overridingKeys.has(bmKey(b)));

// Every entry -- curated or bookmarked -- carrying whatever placement has
// resolved so far. A bookmark reuses its stored title and flies the book's ribbon.
// A leaf's bookmark is opened by its height and the level it stands at, not by
// its hash: `?block=<h>&page=volume` is the leaf, where the bare hash would be
// the chapter that opens it -- a different page, and a different keep.
const entries = () => [
  ...places().filter((p) => !p.address && !p.script).map((p) => {
    const bm = bmForPlace(p);
    return { ...p, title: (bm && bm.title) || placeTitle(p), bookmark: bm ? true : undefined,
      commentary: p.entry.commentary,
      place: placements.get(placeKey(p)), tried: placements.has(placeKey(p)) };
  }),
  ...bookmarks.map((b) => ({
    id: b.page ? String(b.height) : b.hex, index: b.pos ?? undefined, vout: b.vout ?? undefined, vin: b.vin ?? undefined, page: b.page,
    title: b.title || b.prose || shortHex(b.hex),
    bookmark: true, place: bmPlacements.get(bmKey(b)), tried: bmPlacements.has(bmKey(b)),
  })),
];

// Placed entries, sorted into reading order by resolved citation (not array
// position): a transaction's or bookmark's height is unknown offline, so it can
// only take its place once it resolves. This keeps each volume's (and book's)
// entries contiguous, which the nested render relies on.
const placed = () => entries()
  .filter((e) => e.place)
  .sort((a, b) => a.place.volume - b.place.volume || a.place.book - b.place.book
    || a.place.chapter - b.place.chapter || (a.place.section ?? 0) - (b.place.section ?? 0));
const placedIn = (volume) => placed().filter((e) => e.place.volume === volume);
const unresolved = () => entries().filter((e) => e.tried && !e.place);

// How far the run of volumes reaches. Every curated entry places at or below
// the tip, so what has resolved so far is a floor; the tip itself, once it
// answers, is the truth -- a volume the chain has entered has a leaf here
// whether or not anything has been kept from it yet.
function growVolumes(to) {
  if (!(to > lastVolume)) return;
  lastVolume = to;
  if (!settled) at = openingIndex(leaves());
}
const volumesFromEntries = () => placed().reduce((m, e) => Math.max(m, e.place.volume), 1);

// ── The Citations register, read and placed by its own proofs ─────────────
// Bundled and kept alike; a failure costs the leaf its list and nothing
// else -- the register's own page still takes a proof.
async function loadProofs() {
  const part = appendix().find((p) => p.kind === 'proofs');
  if (!part) return;
  let listed = [];
  try { listed = await allProofs(part); } catch { /* nothing readable: the leaf says so */ }
  proofsCount = listed.length;
  proofSection = proofsEl(listed);
  render();
}

// ── Appendix I: the mempool, read as far as it extends ────────────────────
// The queue itself is read and set by btc-mempool.js, shared with the
// appendix's own page. Its heading is this leaf's own head, so it is built
// with no lead of its own.
async function loadProjected() {
  const tip = await tipHeight();
  if (tip != null) growVolumes(volumeBookChapter(tip).volume);
  const queue = await readQueue(tip, ESPLORA_MIRRORS);
  if (queue) projectedSection = buildQueue(queue);   // else the leaf says it could not be read
  render();
}

// The Consensus part's places resolve through the same map the volumes' rows
// read, keyed the same way -- so a fork's chapter shares its placement with
// the curated entry citing the same page, and each lookup runs once for both.
// Expected (unmined) heights are cited by arithmetic in their rows and need
// no placement at all.
const consensusPlaces = () => appendix()
  .filter((p) => p.kind === 'consensus')
  .flatMap((p) => p.bips)
  .flatMap((b) => b.entries)
  .filter((e) => !e.expected);
// The Inscriptions part's places resolve the same way -- height ids, so in
// practice they place offline, footnote letter and all.
const inscriptionPlaces = () => appendix()
  .filter((p) => p.kind === 'inscriptions')
  .flatMap((p) => p.entries);

// Block placements (curated, and bookmarks that stored their reference) are
// offline, so place them at once; everything else streams in as its lookup
// resolves.
for (const p of [...places(), ...consensusPlaces(), ...inscriptionPlaces()]) if (!p.address && !p.script && isBlockId(p.id)) placements.set(placeKey(p), placeOf(Number(p.id), p.index ?? null, p.page, p.out ?? null, p.wit ?? null));
for (const b of bookmarks) {
  if (Number.isInteger(b.height)) bmPlacements.set(bmKey(b), placeOf(b.height, b.pos ?? null, b.page, b.vout ?? null, b.wn ?? null));
}
lastVolume = volumesFromEntries();
at = openingIndex(leaves());
render();
// The projected section loads alongside the citation lookups, and the queue
// keeps moving -- blocks land, replacements arrive -- so it refreshes itself
// each minute while the page is on screen.
loadProofs();
loadProjected();
setInterval(() => { if (!document.hidden) loadProjected(); }, 60_000);
// One lookup per key, however many registers cite the place.
const unplaced = new Map();
for (const p of [...places(), ...consensusPlaces(), ...inscriptionPlaces()]) {
  if (!p.address && !p.script && !placements.has(placeKey(p)) && !unplaced.has(placeKey(p))) unplaced.set(placeKey(p), p);
}
await Promise.all([
  ...[...unplaced.values()].map(async (p) => {
    placements.set(placeKey(p), await resolvePlacement(p));
    growVolumes(volumesFromEntries());
    render();
  }),
  ...bookmarks.filter((b) => !bmPlacements.has(bmKey(b))).map(async (b) => {
    // An output bookmark resolves through its transaction, then takes its
    // vout; a witness keep takes its footnote number the same way.
    const place = await resolveBookmark(b);
    bmPlacements.set(bmKey(b), place && (b.vout != null || b.wn != null)
      ? { ...place, ...(b.vout != null ? { vout: b.vout } : {}), ...(b.wn != null ? { wit: b.wn } : {}) }
      : place);
    growVolumes(volumesFromEntries());
    render();
  }),
]);
</script>
</body>
</html>
