  // The entering half of whatever turn brought the reader here, played on
  // first paint -- so it has to be decided before the module below loads.
  // The flag's value carries the turn's direction: 'up' is the cover being
  // lifted away beneath us (the front page's swipe-up), so the contents
  // enter from below; 'fwd' / 'back' are the sideways turns off the front
  // matter's own leaves; anything else is the classic ascent out of the
  // book, entering from the top.
  try {
    const entrance = sessionStorage.getItem('glossia-toc-entrance');
    if (entrance) {
      sessionStorage.removeItem('glossia-toc-entrance');
      document.documentElement.classList.add(
        entrance === 'up' ? 'toc-entrance-up'
        : entrance === 'fwd' ? 'toc-entrance-fwd'
        : entrance === 'back' ? 'toc-entrance-back'
        : 'toc-entrance');
    }
  } catch (_) {}
</script>

<style>
:root {
  --page:#08080a; --card:#0d0d10; --card-bd:#232228; --ink:#e8e4da; --ink-soft:#cfcabf;
  --accent:#c9a25f; --accent-2:#dcb877; --dim:#9c99a6; --meta:#7e7b88; --rule:#24232a; --hair:#2a2930;

}
* { box-sizing: border-box; }
/* overscroll-behavior keeps the browser's pull-to-refresh from swallowing

   for its own vertical turns). */

body { min-height: 100vh; background: var(--page); color: var(--ink); font-family: 'Public Sans', system-ui, sans-serif; line-height: 1.55; }
/* The entering half of the book page's ascend-above-the-volume turn: the
   contents slide down into place, matching the carousel's pace. */
@media (prefers-reduced-motion: no-preference) {
  .toc-entrance body { animation: toc-in .22s ease-out; }
  @keyframes toc-in { from { transform: translateY(-100vh); } }
  /* …and the entering half of the cover's lift-away: the contents rise into
     place from below as the cover slides up and off. */

  @keyframes toc-in-up { from { transform: translateY(100vh); } }
  /* …and of a sideways turn off one of the front matter's own leaves: the
     contents arrive from the side the reader turned toward. */
  .toc-entrance-fwd body { animation: toc-in-fwd .22s ease-out; }
  @keyframes toc-in-fwd { from { transform: translateX(100vw); } }
  .toc-entrance-back body { animation: toc-in-back .22s ease-out; }
  @keyframes toc-in-back { from { transform: translateX(-100vw); } }
}

/* A leaf's own head: which part of the book this is the contents of, and a

   since a contents leaf and an appendix leaf are the same kind of page --

/* The door down: from a volume's contents into the volume itself, from an

.toc-down:hover { color:var(--accent); text-decoration:none; }
.toc-down.hidden { display:none; }

/* The turns to either side, named at the foot -- the swipe and the arrow

.toc-turns { display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:44px; padding-top:18px; border-top:1px solid var(--rule);
  font:600 10px/1.5 'IBM Plex Mono',monospace; letter-spacing:.14em; text-transform:uppercase; }

<div class="wrap">

  </div>

<script type="module">
import { loadNotables, places, placeTitle, appendix, isBlockId, isRelativeBlockId, entryHref } from './btc-contents.js';
import { creditLine, commentaryForAddresses } from './btc-commentary.js';
import { readQueue, buildQueue } from './btc-mempool.js';
import { INDEXED, keptLedgers, sameAddresses } from './btc-index.js';
import { volumeBookChapter, toRoman, fromRoman, heightOf, expectedReference } from './btc-citation.js';
import { storeGet, storePut } from './btc-store.js';
import { seedArchive } from './btc-seed.js';

// The curated index and its appendix are read from notables.yaml and
// appendix.yaml, so they arrive asynchronously -- and everything below builds
// on them, the appendices' own names included, so the page waits here once. A
// failed read leaves a contents of the reader's own bookmarks plus a line
// saying what could not be read.
await loadNotables();

// A first visit provisions the archive with the curated passages' chain data
// (idle-time, once ever; see btc-seed.js), so this page's entries -- and the
// book pages behind them -- open like revisits.
seedArchive();

const $ = (id) => document.getElementById(id);
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const BOOKMARKS_KEY = 'glossia-btc-bookmarks';
const readBookmarks = () => {
  try { const v = JSON.parse(localStorage.getItem(BOOKMARKS_KEY)); return Array.isArray(v) ? v : []; }
  catch { return []; }
};
const shortHex = (hex) => `${hex.slice(0, 10)}…${hex.slice(-6)}`;

// The genesis coinbase places offline -- block 0, first transaction -- so the
// book opens at I 1 1 §1 without waiting on the network.
const GENESIS_COINBASE = '4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b';

// Every entry is cited by its reference, never its raw id. A block's placement
// is known offline from its height; a transaction's is resolved the same way the
// reader resolves a citation -- a /tx/<txid>/merkle-proof gives the confirming
// block height and the transaction's index (its §section). Tried across the same
// public mirrors the book uses.
const ESPLORA_MIRRORS = ['https://blockstream.info/api', 'https://mempool.space/api'];
// A book-page entry (page: 'book') places at its book with no chapter -- the
// leaf precedes every chapter of its book in reading order.
const placeOf = (height, pos, page, vout = null) => {
  const p = volumeBookChapter(height);
  if (page === 'volume') return { volume: p.volume, book: null, chapter: null, section: null };
  if (page === 'book') return { volume: p.volume, book: p.book, chapter: null, section: null };
  // An output rides its section's citation with its vout appended -- §1.0,
  // as the book prints it (renderCitation in bitcoin-book.html).
  return { ...p, section: pos == null ? null : pos + 1, vout: pos == null ? null : vout };
};

// The chain tip height, fetched once and reused across relative entries.
let tipHeightPromise = null;
function tipHeight() {
  if (!tipHeightPromise) tipHeightPromise = (async () => {
    for (const base of ESPLORA_MIRRORS) {
      try {
        const res = await fetch(`${base}/blocks/tip/height`);
        if (res.ok) return Number((await res.text()).trim());
      } catch { /* try the next mirror */ }
    }
    return null;
  })();
  return tipHeightPromise;
}

// An entry's placement. A block entry places from its height (with an optional
// transaction index as its §section); a negative id counts back from the chain
// tip; a transaction id resolves the same way a reader resolves a citation --
// once: a confirmed placement is immutable, so the archive (btc-store.js)
// answers every later visit offline and for free.
async function resolvePlacement({ id, index, page, out = null }) {
  if (isBlockId(id)) return placeOf(Number(id), index ?? null, page, out);
  if (isRelativeBlockId(id)) {
    const tip = await tipHeight();
    if (tip == null) return null;
    const height = tip + Number(id) + 1;
    return height >= 0 ? placeOf(height, index ?? null) : null;
  }
  if (id === GENESIS_COINBASE) return placeOf(0, 0);
  const kept = await storeGet('placements', id);
  if (kept) return placeOf(kept.height, kept.pos);
  for (const base of ESPLORA_MIRRORS) {
    try {
      const res = await fetch(`${base}/tx/${id}/merkle-proof`);
      if (!res.ok) continue;
      const mp = await res.json();
      storePut('placements', id, { height: mp.block_height, pos: mp.pos });
      return placeOf(mp.block_height, mp.pos);
    } catch { /* try the next mirror */ }
  }
  return null;
}

// A bookmark's placement. Newer bookmarks carry their resolved reference
// (height + section), so they place offline. Older ones store only the hex,
// which may be a block hash or a txid -- try a block lookup first (its height is
// the chapter), then a txid's merkle proof (height + section), like the book.
async function resolveBookmark(b) {
  // A leaf's bookmark places at the level it names: its height is already its
  // span's first block, so the volume or book alone is what it cites.
  if (b.page) return Number.isInteger(b.height) ? placeOf(b.height, null, b.page) : null;
  if (Number.isInteger(b.height)) return placeOf(b.height, b.pos ?? null);
  // A legacy bookmark's hex resolves once; the archive keeps the answer
  // (whether it proved a block hash or a txid) like any other placement.
  const kept = await storeGet('placements', b.hex);
  if (kept) return placeOf(kept.height, kept.pos);
  for (const base of ESPLORA_MIRRORS) {
    try {
      const res = await fetch(`${base}/block/${b.hex}`);
      if (res.ok) {
        const height = (await res.json()).height;
        storePut('placements', b.hex, { height, pos: null });
        return placeOf(height, null);
      }
    } catch { /* try the next mirror */ }
  }
  for (const base of ESPLORA_MIRRORS) {
    try {
      const res = await fetch(`${base}/tx/${b.hex}/merkle-proof`);
      if (res.ok) {
        const mp = await res.json();
        storePut('placements', b.hex, { height: mp.block_height, pos: mp.pos });
        return placeOf(mp.block_height, mp.pos);
      }
    } catch { /* try the next mirror */ }
  }
  return null;
}

// The tail of an entry's citation -- the part its heading hasn't already named.
// The leaf's own head has named the volume, so under a Book heading only the
// ■chapter (and a transaction's §section) remains, and directly on the leaf the
// β-marked book leads it. Spaced like the book's own citations ("β29 ■596",
// "■1 §1").
function tailRef({ book, chapter, section, vout }, underBook) {
  // A volume's own leaf: the leaf's head above the row has already named it.
  if (book == null) return '';
  // A book's own leaf: under its Book heading nothing remains to cite; on the
  // bare leaf, the β mark alone names it.
  if (chapter == null) return underBook ? '' : `β${book}`;
  let s = (underBook ? [`■${chapter}`] : [`β${book}`, `■${chapter}`]).join(' ');
  if (section != null) s += ` §${section}${vout == null ? '' : `.${vout}`}`;
  return s;
}

// One contents row: the title on the left, its remaining reference on the right;
// the whole row is a link that navigates into the book. An entry whose citation
// never resolved carries a dash in place of a reference.
function entryEl(entry, underBook) {
  const row = document.createElement('a');
  row.className = 'toc-entry' + (underBook ? ' under-book' : '') + (entry.bookmark ? ' is-bookmark' : '');
  row.dataset.entryId = entry.id;   // the projected section anchors after the tip's row
  row.href = entryHref(entry.id, entry.index, entry.page, entry.vout ?? entry.out ?? null);
  const t = document.createElement('span'); t.className = 'toc-title';
  // A reader's own bookmark flies the same ribbon it wears in the book, so it's
  // distinguishable from a curated entry even though it sits in reading order.
  if (entry.bookmark) {
    const bm = document.createElement('span'); bm.className = 'toc-bm'; bm.setAttribute('aria-label', 'your bookmark');
    bm.innerHTML = '<svg viewBox="0 0 12 16"><path fill="currentColor" d="M0 0h12v16l-6-4-6 4z"/></svg>';
    t.append(bm);
  }
  t.append(document.createTextNode(entry.title));
  // An entry that carries a credited reading says so, and says whose: the
  // contents is where a reader decides what to open, and "commentary by
  // so-and-so" is the kind of thing that decides it.
  addCredit(t, creditLine(entry));
  const r = document.createElement('span'); r.className = 'toc-ref';
  if (entry.place) r.textContent = tailRef(entry.place, underBook);
  else { r.textContent = '—'; r.classList.add('none'); }
  row.append(t, r);
  return row;
}
function head(cls, label) { const d = document.createElement('div'); d.className = cls; d.textContent = label; return d; }
function saying(text) { const d = document.createElement('div'); d.className = 'toc-empty'; d.textContent = text; return d; }

// The credit a row wears when its subject carries a reading somebody signed
// (btc-commentary.js decides; the book's own readings take no line, or nearly
// every row would wear one and none would stand out). Set in the annotation
// register, beneath the title, so a row's name and a reading of it stay
// distinguishable at a glance.
function addCredit(titleEl, credit) {
  if (!credit) return;
  const c = document.createElement('span');
  c.className = 'toc-commentary';
  c.textContent = credit.label;
  c.title = credit.title;
  titleEl.append(c);
}

const toc = $('toc');
// The projected section (Appendix I, the mempool), rebuilt by loadProjected
// and appended whenever that leaf is the one on screen.
let projectedSection = null;

// ── The contents' own line ────────────────────────────────────────────────
// The book below runs Volume I … Volume V, Appendix I, II, III, every one of
// them at a single level. The contents now runs that same line one storey
// up, a leaf to each: this page is a carousel of contents leaves, not one
// list of everything.
//
// Two things follow, and they are the point of the arrangement. An ascent
// from Volume III's leaf lands on Volume III's contents and nowhere else --
// the vertical axis is a correspondence now, not a funnel. And the descent
// needs no memory of where the reader came up from: the leaf says which
// volume it is the contents of, so it descends there.
//
// One leaf opens the run and is about the run: the top-level contents,
// which lists the parts rather than the passages -- every volume, every
// appendix, and the front matter to either side. A carousel says what is
// beside you and nothing about how far the line runs, so a reader arriving
// cold had no way to see the shape of the book before turning through it;
// this leaf is that one page, and each of its rows is the turn to the leaf
// it names.
//
// It is the only leaf that lists the front matter. A volume's contents has
// no business naming the preface -- the preface is no part of that volume --
// but a contents OF THE WHOLE BOOK does, in the standard order, since the
// front matter is the one part of the book that reading order cannot reach:
// it lies before Volume I, not inside it. Those rows leave this page (the
// front matter keeps its own), which is why they carry no reference: they
// name leaves, not places in the chain.
const ERA = heightOf(2, 1, 1);          // 210,000 -- one halving era, one volume
let lastVolume = 1;                     // grows with the curated entries, then with the tip
const leaves = () => [
  { kind: 'overview' },
  ...Array.from({ length: lastVolume }, (_, i) => ({ kind: 'volume', volume: i + 1 })),
  ...appendix().map((part) => ({ kind: 'appendix', part })),
];
const leafTitle = (leaf) => leaf.kind === 'overview'
  ? 'The Whole Book'
  : leaf.kind === 'volume'
    ? `Volume ${toRoman(leaf.volume)}`
    : `Appendix ${toRoman(appendix().indexOf(leaf.part) + 1)} · ${leaf.part.title}`;
// One line under the leaf's name, saying what it spans and how much of it
// there is. Not what the part IS and why it sits outside reading order --
// that paragraph is written on the appendix's own leaf, one turn down. The
// contents lists; the leaf explains.
const count = (n, one, many) => `${n === 0 ? 'nothing' : n} ${n === 1 ? one : many}`;
function leafSub(leaf) {
  if (leaf.kind === 'overview') {
    const vols = lastVolume === 1 ? 'Volume I' : `Volumes I–${toRoman(lastVolume)}`;
    return `${vols} · ${count(appendix().length, 'appendix', 'appendices')} · the front matter to either side`;
  }
  if (leaf.kind === 'volume') {
    const from = heightOf(leaf.volume, 1, 1);
    const n = placedIn(leaf.volume).length;
    return `Blocks ${from.toLocaleString()}–${(from + ERA - 1).toLocaleString()} · `
      + (n === 0 ? 'nothing kept yet' : count(n, 'entry', 'entries'));
  }
  const part = leaf.part;
  if (part.kind === 'mempool') return 'Ahead of the chain tip · the queue, as far as it reaches';
  if (part.kind === 'entries') return `Heights consensus has fixed · ${count(part.entries.length, 'chapter', 'chapters')}`;
  const kept = keptLedgers().filter((k) => !INDEXED.some((e) => sameAddresses(e.addresses, k.addresses)));
  return `Keepers, not chapters · ${count(INDEXED.length + kept.length, 'ledger', 'ledgers')}`;
}

// Where a leaf's ▾ goes: a volume's contents descends onto the volume's own
// leaf in the book; an appendix's onto the appendix's leaf -- which for the
// ledgers is the Ledger compendium, since a shelf of ledgers is what that
// page already is. Each destination wakes its own entrance, so the leaf
// rises from below as this one slides up and away.
//
// The top-level leaf is the contents of the whole book, so it descends into
// the whole book -- at its beginning, Volume I's own leaf, which is where
// the front matter's last forward turn opens it too.
function descent(leaf) {
  if (leaf.kind === 'overview') {
    return { href: './bitcoin-book.html?block=0&page=volume', flag: 'glossia-book-entrance', value: '1' };
  }
  if (leaf.kind === 'volume') {
    return { href: `./bitcoin-book.html?block=${heightOf(leaf.volume, 1, 1)}&page=volume`, flag: 'glossia-book-entrance', value: '1' };
  }
  if (leaf.part.kind === 'ledgers') return { href: './bitcoin-ledger.html', flag: 'glossia-ledger-entrance', value: 'down' };
  return {
    href: `./bitcoin-appendix.html?part=${leaf.part.kind === 'mempool' ? 'mempool' : 'future'}`,
    flag: 'glossia-appendix-entrance', value: 'down',
  };
}

// ── Which leaf a visit opens ──────────────────────────────────────────────
// ?volume=<n|roman> names a volume's contents, ?part=<mempool|future|ledgers>
// an appendix's -- the same words those pages take for themselves, so the
// ascent from any leaf of the book can name its own contents leaf. ?at=top
// names the top-level leaf and ?at=last whatever leaf closes the run: the
// front matter's two turns into the contents, neither of which needs to know
// how far the volumes reach or what the appendix file holds.
//
// A bare visit -- the masthead's Contents link from a page that carries no
// place, a bookmark, a cold load -- opens the volume the reader was last
// reading (the book notes it as it renders), and the top-level leaf when
// there is nothing to go on, that being the leaf which says what the book
// is made of.
const PART_ALIAS = { mempool: 'mempool', future: 'entries', entries: 'entries', ledgers: 'ledgers' };
const params = new URLSearchParams(location.search);
function openingIndex(list) {
  if (params.get('at') === 'last') return list.length - 1;
  if (params.get('at') === 'top') return 0;
  const part = params.get('part');
  if (part && PART_ALIAS[part]) {
    const i = list.findIndex((l) => l.kind === 'appendix' && l.part.kind === PART_ALIAS[part]);
    if (i >= 0) return i;
  }
  let want = params.get('volume');
  if (!want) { try { want = sessionStorage.getItem('glossia-toc-at'); } catch (_) { want = null; } }
  if (!want) return 0;
  const v = /^[0-9]+$/.test(want) ? Number(want) : fromRoman(want.toUpperCase());
  if (!v || v < 1) return 0;
  // By position in the run, not by arithmetic on the volume number: the
  // top-level leaf sits ahead of Volume I, so the two no longer coincide.
  const i = list.findIndex((l) => l.kind === 'volume' && l.volume === Math.min(v, lastVolume));
  return i >= 0 ? i : 0;
}
let at = 0;
// The URL keeps its say until the reader turns for themselves: the run of
// volumes only reaches its full length once the tip answers, so ?volume=V
// asked of a page that still believes the book ends at IV must land on V
// when it arrives, not on the leaf it was clamped to meanwhile.
let settled = false;

// The query that names a leaf: what the URL is rewritten to as the reader
// turns, and what a row on the top-level leaf links to. One spelling for
// both, so a link copied off a row opens the leaf that row turns to.
function leafQuery(leaf) {
  if (leaf.kind === 'overview') return 'at=top';
  if (leaf.kind === 'volume') return `volume=${leaf.volume}`;
  return `part=${leaf.part.kind === 'entries' ? 'future' : leaf.part.kind}`;
}

// ── The leaves themselves ─────────────────────────────────────────────────
// The top-level leaf: the parts of the book, each as one row -- the front
// matter, then the volumes, then the appendices, which is the order they
// are bound in. A row carries the name of the leaf it stands for and, under
// it, that leaf's own sub-line: what it spans, and how much of it there is.
// The reference column holds a volume's numeral, that being the whole of a
// volume's citation; the rest carry the dash the contents already uses for
// what the chain gives no reference to.
//
// A row for a volume or an appendix is a turn along this run, not a
// departure: clicking it slides to that leaf exactly as a swipe would. It
// is still a real link underneath, so it copies, opens in a new tab, and
// survives a middle click like any other row here.
//
// The title leaf is not listed. It is the cover, which the contents lies
// under rather than inside; a pull down from the top is already the way to
// it, and every leaf here offers that.
const FRONT = [
  { leaf: 'terms', name: 'Terms', says: 'The copyright page, saying the reverse of one' },
  { leaf: 'preface', name: 'Preface', says: 'What the book is, and why it is arranged this way' },
  { leaf: 'sigla', name: 'Sigla', says: 'The key to the marks, and the form every citation takes' },
];

// The shared shape of a row on this leaf: a name, a line about it, and a
// reference column that is a citation or the dash standing for none.
function partRow(href, name, says, ref) {
  const row = document.createElement('a');
  row.className = 'toc-entry toc-part';
  row.href = href;
  const t = document.createElement('span');
  t.className = 'toc-title';
  t.textContent = name;
  const s = document.createElement('span');
  s.className = 'toc-span';
  s.textContent = says;
  t.append(s);
  const r = document.createElement('span');
  r.className = 'toc-ref' + (ref ? '' : ' none');
  r.textContent = ref || '—';
  row.append(t, r);
  return row;
}

function leafRowEl(leaf, index) {
  const row = partRow(`${location.pathname}?${leafQuery(leaf)}`, leafTitle(leaf), leafSub(leaf),
    leaf.kind === 'volume' ? toRoman(leaf.volume) : '');
  row.addEventListener('click', (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button !== 0) return;
    ev.preventDefault();
    jumpTo(index);
  });
  return row;
}

function renderOverview() {
  const list = leaves();
  toc.append(head('toc-vol', 'Front Matter'));
  for (const f of FRONT) {
    toc.append(partRow(`./bitcoin-front.html?leaf=${f.leaf}`, f.name, f.says, ''));
  }
  toc.append(head('toc-vol', 'The Volumes'));
  list.forEach((l, i) => { if (l.kind === 'volume') toc.append(leafRowEl(l, i)); });
  if (list.some((l) => l.kind === 'appendix')) {
    toc.append(head('toc-vol', 'The Appendices'));
    list.forEach((l, i) => { if (l.kind === 'appendix') toc.append(leafRowEl(l, i)); });
  }
}

// A volume's leaf: its entries, in reading order, with a Book sub-heading
// wherever two or more consecutive rows share one -- so each row need only
// cite the portion of its reference the leaf's head and that sub-heading
// have not already named.
function renderVolume(volume) {
  const entries = placedIn(volume);
  if (!entries.length) {
    toc.append(saying('Nothing is kept from this volume yet. The volume itself is one turn down, and reads chapter by chapter from its own leaf.'));
    return;
  }
  for (let k = 0; k < entries.length;) {
    const bk = entries[k].place.book;
    let jb = k + 1; while (jb < entries.length && entries[jb].place.book === bk) jb++;
    if (jb - k >= 2) {
      toc.append(head('toc-book', `Book ${bk}`));   // spelled out, no β; the β sigil rides only the compact tail references
      for (let m = k; m < jb; m++) toc.append(entryEl(entries[m], true));
    } else {
      toc.append(entryEl(entries[k], false));
    }
    k = jb;
  }
}

// Appendix I: the mempool, built live from the queue (below). Appendix II:
// chapters cited in full but marked □, the expected-chapter mark, since no
// block has earned them an ■. Appendix III: the shelf of ledgers. Each part's
// heading is the leaf's own head now, so nothing here prints one.
function renderAppendix(part) {
  if (part.kind === 'mempool') {
    if (projectedSection) toc.append(projectedSection);
    else toc.append(saying('The queue could not be read just now — no mirror answered. The contents simply end at the chain tip until one does.'));
    return;
  }
  if (part.kind === 'entries') {
    for (const e of part.entries) toc.append(provisionalEl(e));
    return;
  }
  const kept = keptLedgers().filter((k) => !INDEXED.some((e) => sameAddresses(e.addresses, k.addresses)));
  for (const l of INDEXED) toc.append(ledgerEl(l, false));
  for (const l of kept) toc.append(ledgerEl(l, true));
}

// A ledger row. These take the dash the unresolved rows take, and for a
// plainer reason than a failed lookup: a ledger has no reference because the
// chain never writes an address. It writes the script an address stands for,
// and the ledger's chapters are discovered from that as it is read -- so
// there is nothing to cite here, only somewhere to go. The rows open the
// Ledger compendium at that ledger, the way a contents row opens the book at
// its chapter.
const shortAddr = (a) => `${a.slice(0, 6)}…${a.slice(-4)}`;
function ledgerEl(ledger, isKept) {
  const row = document.createElement('a');
  row.className = 'toc-entry under-book';
  // A row here names a ledger, so it opens the ledger -- its title leaf,
  // where the compendium's descent into the passages begins. (An address
  // searched for is a passage, and the search page opens it as one, with
  // the same query and no &page.)
  row.href = `./bitcoin-ledger.html?address=${ledger.addresses.join(',')}&page=ledger`;
  const t = document.createElement('span');
  t.className = 'toc-title';
  if (isKept) {
    const bm = document.createElement('span'); bm.className = 'toc-bm'; bm.setAttribute('aria-label', 'your ledger');
    bm.innerHTML = '<svg viewBox="0 0 12 16"><path fill="currentColor" d="M0 0h12v16l-6-4-6 4z"/></svg>';
    t.append(bm);
  }
  // A kept ledger is named by its reader before it is shelved, so a title is
  // what a row prints. Ledgers kept before that was asked of them fall back
  // to their first address, the same stand-in name the Ledger page gives
  // them -- a name in the title column, never a citation in the reference's.
  t.append(document.createTextNode(ledger.title || shortAddr(ledger.addresses[0])));
  // A ledger whose addresses carry a credited reading says so here, as a
  // chapter's row does: the readings themselves open on the Ledger's leaves.
  const named = [...new Set(commentaryForAddresses(ledger.addresses)
    .flatMap((it) => it.readings.filter((rd) => rd.by).map((rd) => rd.by)))];
  if (named.length) {
    addCredit(t, {
      label: `commentary by ${named.join(' · ')}`,
      title: `${named.length > 1 ? 'readings' : 'a reading'} by ${named.join(', ')} — editorial, opened on this ledger's own leaves`,
    });
  }
  const r = document.createElement('span');
  r.className = 'toc-ref none';
  r.textContent = '—';
  row.append(t, r);
  return row;
}

// One provisional row, dressed like a projected chapter: the title, then the
// whole expected reference -- volume and all, since the leaf's head names an
// appendix rather than a volume and has nothing to have named already.
function provisionalEl(entry) {
  const height = Number(entry.id);
  const row = document.createElement('a');
  row.className = 'toc-entry under-book projected';
  row.href = entryHref(entry.id);
  const t = document.createElement('span');
  t.className = 'toc-title';
  t.textContent = entry.title;
  if (entry.note) t.title = entry.note;
  const r = document.createElement('span');
  r.className = 'toc-ref';
  r.textContent = expectedReference(height);
  r.title = `expected — block ${height.toLocaleString()} has not been mined, so its chapter carries □ rather than ■`;
  row.append(t, r);
  return row;
}

// ── Rendering the leaf on screen ──────────────────────────────────────────
function render() {
  const list = leaves();
  at = Math.min(Math.max(at, 0), list.length - 1);
  const leaf = list[at];
  $('toc-title').textContent = leafTitle(leaf);
  $('toc-sub').textContent = leafSub(leaf);
  document.title = `The βook of βitcoin — ${leafTitle(leaf)}`;
  // The URL follows the reader (replaceState -- turning leaves is not
  // history), so a reload, or a link shared from here, names the leaf being
  // read. The opening query was copied at load, so rewriting it can't
  // disturb which leaf a still-growing run is aiming for.
  try {
    history.replaceState(null, '', `${location.pathname}?${leafQuery(leaf)}`);
  } catch (_) { /* unavailable */ }
  toc.replaceChildren();
  // The curation is a file this page reads (notables.yaml); if it could not be
  // read, the page says so rather than presenting an empty contents as though
  // the book kept nothing. The reader's own bookmarks still list below.
  if (loadNotables.error) {
    const warn = document.createElement('div');
    warn.className = 'toc-proj-note';
    warn.textContent = 'The curated contents could not be read (web/notables.yaml). '
      + 'Any bookmarks of your own are listed below; reload to try again.';
    toc.append(warn);
  }
  if (leaf.kind === 'overview') renderOverview();
  else if (leaf.kind === 'volume') renderVolume(leaf.volume);
  else renderAppendix(leaf.part);
  // Entries whose citation could not be resolved have no volume to be listed
  // under, so they fall past even the appendices, onto the last leaf of the
  // run -- still linked, so the book can resolve and open them on the next
  // attempt.
  if (at === list.length - 1) {
    const stranded = unresolved();
    if (stranded.length) {
      toc.append(head('toc-vol', 'Unresolved'));
      for (const e of stranded) toc.append(entryEl(e, false));
    }
  }
  renderTurns(list);
}

// The foot's named turns, and the ▾ that is the leaf's door down. Either end
// of the run turns onto the front matter, which the contents sits inside on
// this axis in the standard order: title, terms, CONTENTS, preface, sigla.
function renderTurns(list) {
  const turns = $('toc-turns');
  turns.replaceChildren();
  const link = (text, go, alignRight) => {
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = text;
    if (alignRight) a.style.marginLeft = 'auto';
    a.addEventListener('click', (ev) => {
      if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button !== 0) return;
      ev.preventDefault();
      go();
    });
    turns.append(a);
    return a;
  };
  link(at > 0 ? `‹ ${leafTitle(list[at - 1])}` : '‹ Terms', () => turn(-1), false);
  link(at < list.length - 1 ? `${leafTitle(list[at + 1])} ›` : 'Preface ›', () => turn(1), true);
  $('toc-down').setAttribute('aria-label', `Down into ${leafTitle(list[at])}`);
}
$('toc-down').addEventListener('click', (ev) => { ev.preventDefault(); descend(); });

// ── The turns ─────────────────────────────────────────────────────────────
// A committed turn snapshots the outgoing leaf as a fixed ghost that keeps
// sliding off in the travel direction WHILE the real slide -- hidden --
// renders the destination and glides in from the opposite edge. The two
// halves overlap, so the turn reads as one continuous strip, exactly as it
// does in the book and on the Ledger's own leaves. `axis` picks the
// direction of travel: 'x' along the run, 'y' for the turns that change
// level (and those leave the page, so they are played on the body instead).
const slide = $('toc-slide');
let turning = false;
function turnTo(step, dir, axis = 'x') {
  if (turning) return;
  if (REDUCED_MOTION) {
    slide.style.transform = '';
    step();
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
    return;
  }
  turning = true;
  const rect = slide.getBoundingClientRect();   // includes any drag offset
  const win = document.createElement('div');
  win.setAttribute('aria-hidden', 'true');
  Object.assign(win.style, {
    position: 'fixed', top: '0', left: '0', width: '100%', height: '100%',
    overflow: 'clip', pointerEvents: 'none', zIndex: '30',
  });
  const ghost = slide.cloneNode(true);
  ghost.removeAttribute('id');
  Object.assign(ghost.style, {
    position: 'absolute', top: rect.top + 'px', left: rect.left + 'px',
    width: rect.width + 'px', margin: '0', transition: 'none', transform: 'none',
  });
  win.appendChild(ghost);
  document.body.appendChild(win);
  slide.style.transition = 'none';
  slide.style.transform = '';
  slide.style.visibility = 'hidden';
  void ghost.offsetWidth;
  const span = axis === 'x' ? window.innerWidth : window.innerHeight;
  const move = (v) => (axis === 'x' ? `translateX(${v}px)` : `translateY(${v}px)`);
  // Linear, so the exit reads as the drag's momentum carrying on.
  ghost.style.transition = 'transform .2s linear';
  ghost.style.transform = move(dir > 0 ? -span : span);
  setTimeout(() => win.remove(), 320);
  // Two frames for the compositor to start the ghost's slide BEFORE the
  // destination's render work blocks the main thread.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    step();
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });   // a new leaf opens at its head, unseen while hidden
    slide.style.transform = move(dir > 0 ? span : -span);
    slide.style.visibility = '';
    void slide.offsetWidth;
    slide.style.transition = 'transform .22s ease-out';
    slide.style.transform = '';
    setTimeout(() => { slide.style.transition = ''; turning = false; }, 260);
  }));
}

// A turn that leaves the page carries its whole body with it, and the
// destination finishes the entrance on arrival.
function leavePage(href, transform, flag, value = '1') {
  try { sessionStorage.setItem(flag, value); } catch (_) {}
  const go = () => { location.href = href; };
  if (REDUCED_MOTION) { go(); return; }
  document.body.style.transition = 'transform .2s linear';
  document.body.style.transform = transform;
  setTimeout(go, 180);
}

// Sideways along the run; off either end, onto the front-matter leaf the
// standard order puts there.
function turn(dir) {
  if (turning) return;
  settled = true;              // the reader has chosen; the URL stops choosing
  const list = leaves();
  const next = at + dir;
  if (next < 0) return leavePage('./bitcoin-front.html?leaf=terms', 'translateX(100vw)', 'glossia-front-entrance', 'back');
  if (next >= list.length) return leavePage('./bitcoin-front.html?leaf=preface', 'translateX(-100vw)', 'glossia-front-entrance', 'fwd');
  turnTo(() => { at = next; }, dir, 'x');
}
// Straight to a named leaf, which is what a row on the top-level leaf does:
// the same slide as a turn, in the direction the leaf lies, however many
// leaves away it is.
function jumpTo(i) {
  if (turning || i === at) return;
  settled = true;
  turnTo(() => { at = i; }, i > at ? 1 : -1, 'x');
}
// Up is the cover, which the contents lie under; down is whatever this leaf
// is the contents of.
function ascend() {
  leavePage('./bitcoin-front.html', 'translateY(100vh)', 'glossia-front-entrance', 'drop');
}
function descend() {
  const d = descent(leaves()[at]);
  leavePage(d.href, 'translateY(-100vh)', d.flag, d.value);
}

// ── The gestures ──────────────────────────────────────────────────────────
// The book's idiom, kept: a quick, mostly-horizontal drag turns the leaf
// sideways and follows the finger while it lasts; a pull DOWN from the top
// rises to the cover and a push UP from the foot descends. A contents leaf
// can be a long list, so the vertical pair engages only from the scroll
// boundary it moves away from (or on a leaf too short to scroll at all) --
// below that, a vertical drag is the scroll it looks like.
(() => {
  let sx = null, sy = 0, st = 0, axis = null, topStart = false, botStart = false, shortStart = false;
  const snapBack = () => {
    if (!slide.style.transform) return;
    slide.style.transition = 'transform .15s ease';
    slide.style.transform = '';
  };
  const vArmed = (dy) => shortStart || (topStart && dy > 0) || (botStart && dy < 0);
  document.addEventListener('touchstart', (e) => {
    sx = null; axis = null;
    if (e.touches.length !== 1 || turning) return;
    const t = e.target;
    if (t.closest && t.closest('input, textarea, select')) return;
    topStart = window.scrollY <= 2;
    botStart = window.scrollY >= document.documentElement.scrollHeight - window.innerHeight - 2;
    shortStart = document.documentElement.scrollHeight <= window.innerHeight + 24;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = performance.now();
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (sx === null || REDUCED_MOTION || turning) return;
    const dx = e.touches[0].clientX - sx;
    const dy = e.touches[0].clientY - sy;
    if (!axis) {
      if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    }
    if (axis === 'h') {
      slide.style.transition = 'none';
      slide.style.transform = `translateX(${dx}px)`;
    } else if (vArmed(dy)) {
      slide.style.transition = 'none';
      slide.style.transform = `translateY(${dy * 0.5}px)`;
    }
  }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (sx === null || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    const dt = performance.now() - st;
    sx = null;
    if (turning) return;
    if (axis === 'h' && dt <= 600 && Math.abs(dx) >= 60 && Math.abs(dy) <= Math.abs(dx) * 0.6) {
      turn(dx < 0 ? 1 : -1);                     // swiping left turns forward
      return;
    }
    if (axis === 'v' && vArmed(dy) && dt <= 600 && Math.abs(dy) >= 70 && Math.abs(dx) <= Math.abs(dy) * 0.6) {
      if (dy > 0) ascend(); else descend();
      return;
    }
    snapBack();
  }, { passive: true });
  document.addEventListener('touchcancel', () => { sx = null; if (!turning) snapBack(); }, { passive: true });
})();

// ── The same turns, from a keyboard ───────────────────────────────────────
// Left and right along the run, up to the cover and down into whatever this
// leaf is the contents of -- the reader's own directions, though the swipe
// that means "descend" is a push UP. The vertical pair waits for the scroll
// boundary, as the swipes do and for a sharper reason: on a keyboard the
// arrows ARE the scroll, so a leaf taller than the window would otherwise
// keep its foot unreachable.
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || e.repeat || turning) return;
  const t = e.target;
  if (t && t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    turn(e.key === 'ArrowRight' ? 1 : -1);
    return;
  }
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  const top = window.scrollY <= 2;
  const bottom = window.scrollY >= document.documentElement.scrollHeight - window.innerHeight - 2;
  const short = document.documentElement.scrollHeight <= window.innerHeight + 24;
  if (e.key === 'ArrowUp') { if (short || top) { e.preventDefault(); ascend(); } return; }
  if (short || bottom) { e.preventDefault(); descend(); }
});

// ── The entries, and where each one falls ─────────────────────────────────
// Block placements are offline, so render them at once; transaction citations
// stream in as each resolves, slotting into their volume and book in order. An
// entry whose lookup fails (placement null) drops to an "Unresolved" tail
// rather than printing its raw id.
// A curated entry may be found in several places (the twice-confirmed coinbases
// are one thing in four), and the contents lists PLACES: one row each, in
// reading order, all carrying their entry's title and their own `as`. Keyed by
// id+index, because two places of one entry can share a height.
const placeKey = (p) => `${p.id}#${p.index ?? ''}`;
const placements = new Map();          // place key -> citation | null (once attempted)
const bmPlacements = new Map();        // bookmark hex -> place | null (once attempted)

// A reader's bookmarks join the curated set in one list. A bookmark that is
// already a curated entry is dropped (the curated title wins) so it isn't listed
// twice.
const NOTABLE_IDS = new Set(places().map((p) => p.id));
// A bookmark is keyed by what it names: a hash by itself, an output by its
// hash and vout, a leaf by the hash of the block its span opens and which span
// it is (the same keys bitcoin-book.html writes). Only a plain hash bookmark
// can duplicate a curated entry, so only those are dropped.
const bmKey = (b) => (b.page ? `${b.page}@${b.hex}` : b.vout == null ? b.hex : `${b.hex}:${b.vout}`);
const bookmarks = readBookmarks().filter((b) => b.vout != null || b.page || !NOTABLE_IDS.has(b.hex));

// Every entry -- curated or bookmarked -- carrying whatever placement has
// resolved so far. A bookmark reuses its stored title and flies the book's ribbon.
// A leaf's bookmark is opened by its height and the level it stands at, not by
// its hash: `?block=<h>&page=volume` is the leaf, where the bare hash would be
// the chapter that opens it -- a different page, and a different keep.
const entries = () => [
  ...places().filter((p) => !p.address).map((p) => ({ ...p, title: placeTitle(p), commentary: p.entry.commentary,
    place: placements.get(placeKey(p)), tried: placements.has(placeKey(p)) })),
  ...bookmarks.map((b) => ({
    id: b.page ? String(b.height) : b.hex, index: b.pos ?? undefined, vout: b.vout ?? undefined, page: b.page,
    title: b.title || b.prose || shortHex(b.hex),
    bookmark: true, place: bmPlacements.get(bmKey(b)), tried: bmPlacements.has(bmKey(b)),
  })),
];

// Placed entries, sorted into reading order by resolved citation (not array
// position): a transaction's or bookmark's height is unknown offline, so it can
// only take its place once it resolves. This keeps each volume's (and book's)
// entries contiguous, which the nested render relies on.
const placed = () => entries()
  .filter((e) => e.place)
  .sort((a, b) => a.place.volume - b.place.volume || a.place.book - b.place.book
    || a.place.chapter - b.place.chapter || (a.place.section ?? 0) - (b.place.section ?? 0));
const placedIn = (volume) => placed().filter((e) => e.place.volume === volume);
const unresolved = () => entries().filter((e) => e.tried && !e.place);

// How far the run of volumes reaches. Every curated entry places at or below
// the tip, so what has resolved so far is a floor; the tip itself, once it
// answers, is the truth -- a volume the chain has entered has a leaf here
// whether or not anything has been kept from it yet.
function growVolumes(to) {
  if (!(to > lastVolume)) return;
  lastVolume = to;
  if (!settled) at = openingIndex(leaves());
}
const volumesFromEntries = () => placed().reduce((m, e) => Math.max(m, e.place.volume), 1);

// ── Appendix I: the mempool, read as far as it extends ────────────────────
// The queue itself is read and set by btc-mempool.js, shared with the
// appendix's own page. Its heading is this leaf's own head, so it is built
// with no lead of its own.
async function loadProjected() {
  const tip = await tipHeight();
  if (tip != null) growVolumes(volumeBookChapter(tip).volume);
  const queue = await readQueue(tip, ESPLORA_MIRRORS);
  if (queue) projectedSection = buildQueue(queue);   // else the leaf says it could not be read
  render();
}

// Block placements (curated, and bookmarks that stored their reference) are
// offline, so place them at once; everything else streams in as its lookup
// resolves.
for (const p of places()) if (!p.address && isBlockId(p.id)) placements.set(placeKey(p), placeOf(Number(p.id), p.index ?? null, p.page, p.out ?? null));
for (const b of bookmarks) {
  if (Number.isInteger(b.height)) bmPlacements.set(bmKey(b), placeOf(b.height, b.pos ?? null, b.page, b.vout ?? null));
}
lastVolume = volumesFromEntries();
at = openingIndex(leaves());
render();
// The projected section loads alongside the citation lookups, and the queue
// keeps moving -- blocks land, replacements arrive -- so it refreshes itself
// each minute while the page is on screen.
loadProjected();
setInterval(() => { if (!document.hidden) loadProjected(); }, 60_000);
await Promise.all([
  ...places().filter((p) => !p.address && !placements.has(placeKey(p))).map(async (p) => {
    placements.set(placeKey(p), await resolvePlacement(p));
    growVolumes(volumesFromEntries());
    render();
  }),
  ...bookmarks.filter((b) => !bmPlacements.has(bmKey(b))).map(async (b) => {
    // An output bookmark resolves through its transaction, then takes its vout.
    const place = await resolveBookmark(b);
    bmPlacements.set(bmKey(b), place && b.vout != null ? { ...place, vout: b.vout } : place);
    growVolumes(volumesFromEntries());
    render();
  }),
]);
</script>
